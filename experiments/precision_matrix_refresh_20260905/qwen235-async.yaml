defaults: ../../examples/configs/recipes/llm/performance/grpo-qwen3-235b-32n4g-async-1off.yaml

loss_fn:
  use_importance_sampling_correction: true

policy:
  generation:
    refit_transport: nccl_reshard
    colocated:
      enabled: false
      resources:
        num_nodes: 16
        gpus_per_node: 4
    vllm_cfg:
      async_engine: true
      tensor_parallel_size: 8
      precision: bfloat16
      refit_prequantize: false
      refit_cache_loader_routes: true
      quantization_ignore_patterns:
        - "*layers.*.self_attn.*"
        - "*layers.*.mlp.gate"
        - "*layers.*.mlp.shared_experts.*"
        - "*mtp.*"
        - lm_head
    vllm_kwargs:
      moe_backend: flashinfer_trtllm
      expert_placement_strategy: linear

cluster:
  gpus_per_node: 4
  num_nodes: 32
  segment_size: 16
