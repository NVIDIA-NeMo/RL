defaults: ./lightning-sync.yaml

grpo:
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1
    in_flight_weight_updates: true

policy:
  megatron_cfg:
    expert_model_parallel_size: 16
  generation:
    refit_transport: nccl_reshard
    colocated:
      enabled: false
      resources:
        num_nodes: 4
        gpus_per_node: 4
    vllm_cfg:
      async_engine: true
      gpu_memory_utilization: 0.8

cluster:
  num_nodes: 8
  segment_size: 4
