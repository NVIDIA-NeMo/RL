defaults: ../../examples/configs/recipes/llm/performance/grpo-qwen3-30ba3b-4n4g.yaml

loss_fn:
  use_importance_sampling_correction: true

policy:
  generation:
    vllm_cfg:
      tensor_parallel_size: 1
      precision: bfloat16
      refit_prequantize: false
      refit_cache_loader_routes: true
      quantization_ignore_patterns:
        - "*layers.*.self_attn.*"
        - "*layers.*.mlp.gate"
        - "*layers.*.mlp.shared_experts.*"
        - "*mtp.*"
        - lm_head
    vllm_kwargs:
      moe_backend: flashinfer_trtllm
      expert_placement_strategy: linear

cluster:
  gpus_per_node: 4
