defaults: ../../examples/configs/recipes/llm/grpo-qwen3.5-35ba3b-2n8g-megatron-ep16tp2cp2.yaml

grpo:
  num_prompts_per_step: 2
  num_generations_per_prompt: 8
  seq_logprob_error_threshold: 2

loss_fn:
  reference_policy_kl_penalty: 0.0
  kl_input_clamp_value: null
  kl_output_clamp_value: null
  ratio_clip_max: 0.28
  use_on_policy_kl_approximation: true
  use_importance_sampling_correction: true
  force_on_policy_ratio: true

policy:
  model_name: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  tokenizer:
    name: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  train_global_batch_size: 16
  megatron_cfg:
    apply_rope_fusion: true
    bias_activation_fusion: false
    expert_model_parallel_size: 32
    expert_tensor_parallel_size: 1
    moe_token_dispatcher_type: alltoall
    moe_router_dtype: fp32
    use_fused_weighted_squared_relu: true
    optimizer:
      lr: 4.0e-6
      min_lr: 4.0e-6
      weight_decay: 0.0
  generation:
    refit_transport: null
    colocated:
      enabled: true
      resources:
        num_nodes: null
        gpus_per_node: null
    vllm_cfg:
      async_engine: false
      tensor_parallel_size: 4
      expert_parallel_size: 4
      gpu_memory_utilization: 0.5
      precision: bfloat16
      enforce_eager: false
      refit_prequantize: false
      refit_cache_loader_routes: true
      quantization_ignore_patterns:
        - "*layers.*.mixer.qkv_proj"
        - "*layers.*.mixer.o_proj"
        - "*layers.*.mixer.in_proj"
        - "*layers.*.mixer.out_proj"
        - "*layers.*.mixer.up_proj"
        - "*layers.*.mixer.down_proj"
        - "*layers.*.mixer.gate"
        - "*layers.*.mixer.shared_experts.*"
        - "*layers.*.mixer.fc1_latent_proj"
        - "*layers.*.mixer.fc2_latent_proj"
        - "*mtp.*"
        - lm_head
    vllm_kwargs:
      moe_backend: flashinfer_trtllm
      expert_placement_strategy: linear

cluster:
  gpus_per_node: 4
  num_nodes: 8
  segment_size: 8
