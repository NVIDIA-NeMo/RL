defaults: ../../examples/configs/recipes/llm/performance/grpo-nemotron3-super-120BA12B-32n4g-async-1off-mxfp8-rollout.yaml

grpo:
  max_num_steps: 20
  val_period: 0
  val_at_start: false
  val_at_end: false
  skip_reference_policy_logprobs_calculation: false

checkpointing:
  enabled: false

policy:
  megatron_cfg:
    fp8_cfg:
      enabled: true
      fp8: e4m3
      fp8_recipe: mxfp8
      fp8_param: true
    te_precision_config_file: experiments/lightning_pr4353_20261007/te-routed-mxfp8.yaml
    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 2
    num_layers_at_end_in_bf16: 6
    moe_grouped_gemm: true
    use_fused_weighted_squared_relu: true
    model_overrides:
      moe_use_grouped_tensor: true
      use_transformer_engine_op_fuser: true
    env_vars:
      NVTE_CUTEDSL_FUSED_GROUPED_MLP: "1"
      CUDNN_FE_GROUPED_GEMM_DYNAMIC_MNKL: "1"
  generation:
    refit_transport: nccl_reshard
    vllm_cfg:
      expert_parallel_size: 4
      num_first_layers_in_bf16: 2
      num_last_layers_in_bf16: 6

logger:
  tensorboard_enabled: false
  wandb:
    project: nemo-rl-mxfp8-training
