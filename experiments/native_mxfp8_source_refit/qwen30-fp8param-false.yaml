defaults: ../../examples/configs/grpo_math_1B.yaml

grpo:
  num_prompts_per_step: 64
  num_generations_per_prompt: 32
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1
    in_flight_weight_updates: true
loss_fn:
  use_importance_sampling_correction: true
checkpointing:
  enabled: false
  checkpoint_dir: results/native_mxfp8_source_refit/qwen30-fp8param-false
policy:
  model_name: Qwen/Qwen3-30B-A3B
  train_global_batch_size: 2048
  train_micro_batch_size: 1
  logprob_batch_size: 2
  max_total_sequence_length: 4096
  optimizer: null
  scheduler: null
  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}
  sequence_packing:
    fuse_loss: true
  dtensor_cfg:
    enabled: false
  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 1
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    sequence_parallel: false
    moe_grouped_gemm: true
    moe_router_dtype: fp32
    te_precision_config_file: experiments/native_mxfp8_source_refit/te_nano_routed.yaml
    optimizer:
      lr: 3.0e-07
      min_lr: 3.0e-08
    scheduler:
      lr_warmup_iters: 50
      lr_warmup_init: 3.0e-08
    distributed_data_parallel_config:
      overlap_param_gather: true
      overlap_grad_reduce: true
    fp8_cfg:
      enabled: true
      fp8: e4m3
      fp8_recipe: mxfp8
      fp8_param: false
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
  generation:
    backend: vllm
    refit_transport: nccl_reshard
    colocated:
      enabled: false
      resources:
        num_nodes: 2
        gpus_per_node: 4
    vllm_cfg:
      async_engine: true
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      gpu_memory_utilization: 0.8
      precision: fp8
      is_mx: true
      quantization_ignore_patterns:
      - model.layers.*.self_attn.*
      - model.layers.*.mlp.gate
      - lm_head
    vllm_kwargs:
      moe_backend: flashinfer_trtllm
logger:
  log_dir: logs/native_mxfp8_source_refit/qwen30-fp8param-false
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl-mxfp8-training
    name: native-mxfp8-qwen30-fp8param-false
cluster:
  gpus_per_node: 4
  num_nodes: 4
  segment_size: 2
