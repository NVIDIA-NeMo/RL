# L1 smoke: one training GPU and one rollout GPU.
defaults: grpo_logra_7b.yaml
grpo:
  num_prompts_per_step: 2
  num_generations_per_prompt: 4
  max_num_steps: 2
  val_period: -1
  val_at_start: false
  val_at_end: false
policy:
  model_name: Qwen/Qwen2.5-1.5B
  train_global_batch_size: 8
  train_micro_batch_size: 1
  max_total_sequence_length: 512
  generation:
    max_new_tokens: 512
    colocated:
      resources:
        gpus_per_node: 1
data:
  train:
    dataset_name: gsm8k
logger:
  log_dir: logs/logra-smoke
checkpointing:
  enabled: false
cluster:
  num_nodes: 1
  gpus_per_node: 2
