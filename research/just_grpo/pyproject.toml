[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "just-grpo"
version = "0.1.0"
description = "Block JustGRPO denoising schedules on NeMo RL"
readme = "README.md"
requires-python = ">=3.13.14,<3.14"
dependencies = ["nemo-rl"]

[dependency-groups]
test = ["pytest>=7.0.0"]

[tool.uv.sources]
nemo-rl = { workspace = true }

[tool.hatch.build]
exclude = ["**/*.swp", "**/*.swo"]

[tool.hatch.build.targets.wheel]
packages = ["just_grpo"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
