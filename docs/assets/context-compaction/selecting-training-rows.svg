<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="665" viewBox="0 0 1040 665" role="img" aria-labelledby="title desc"><title id="title">3. Select accepted calls, then build the training rows</title><desc id="desc">Capture contains c1 to c2 and a new root c3 branching to rejected c4 and accepted c5. Returned history selects c1, c2, c3 and c5. Backward walks from selected endpoints c2 and c5 reconstruct two training rows with one rollout reward.</desc>
