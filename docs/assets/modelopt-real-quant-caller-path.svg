<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
  <title id="title">Real-quant export and refit caller path</title>
  <desc id="desc">The exact function-level path from the NeMo RL refit controller through Megatron-Bridge and ModelOpt weight export to the native vLLM layerwise reload lifecycle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <style>
      .title { font: 700 24px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #101828; }
      .section { font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #344054; }
      .owner { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
      .call { font: 600 14px ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #101828; }
      .copy { font: 400 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475467; }
      .note { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475467; }
      .box { fill: #ffffff; stroke: #98a2b3; stroke-width: 1.5; rx: 6; }
      .arrow { fill: none; stroke: #344054; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="1030" fill="#ffffff"/>
  <text class="title" x="40" y="42">Caller path for one online refit</text>

  <g transform="translate(130 70)">
    <rect class="box" width="940" height="66"/>
    <rect width="190" height="66" rx="6" fill="#e0ecff"/>
    <rect x="184" width="6" height="66" fill="#e0ecff"/>
    <text class="owner" x="18" y="27" fill="#1d4ed8">NEMO RL CONTROLLER</text>
    <text class="call" x="216" y="27">grpo.refit_policy_generation()</text>
    <text class="copy" x="216" y="49">Starts the policy sender and vLLM receiver.</text>
  </g>

  <path class="arrow" d="M 600 144 V 160"/>

  <g transform="translate(130 168)">
    <rect class="box" width="940" height="66"/>
    <rect width="190" height="66" rx="6" fill="#e0ecff"/>
    <rect x="184" width="6" height="66" fill="#e0ecff"/>
    <text class="owner" x="18" y="27" fill="#1d4ed8">NEMO RL POLICY</text>
    <text class="call" x="216" y="27">MegatronQuantPolicyWorker._iter_real_quant_refit_groups()</text>
    <text class="copy" x="216" y="49">Requests collective-complete export groups from the cached plan.</text>
  </g>

  <path class="arrow" d="M 600 242 V 258"/>

  <g transform="translate(130 266)">
    <rect class="box" width="940" height="78"/>
    <rect width="190" height="78" rx="6" fill="#ece7f8"/>
    <rect x="184" width="6" height="78" fill="#ece7f8"/>
    <text class="owner" x="18" y="33" fill="#6b21a8">MEGATRON-BRIDGE</text>
    <text class="call" x="216" y="27">AutoBridge.export_hf_weight_groups_modelopt()</text>
    <text class="copy" x="216" y="50">prepare_modelopt_export_tasks(plan) attaches a fresh export hook</text>
    <text class="copy" x="216" y="68">to every quantized WeightConversionTask.</text>
  </g>

  <path class="arrow" d="M 600 352 V 368"/>

  <g transform="translate(130 376)">
    <rect class="box" width="940" height="78"/>
    <rect width="190" height="78" rx="6" fill="#ece7f8"/>
    <rect x="184" width="6" height="78" fill="#ece7f8"/>
    <text class="owner" x="18" y="33" fill="#6b21a8">MEGATRON-BRIDGE</text>
    <text class="call" x="216" y="27">MegatronModelBridge._stream_weight_groups_megatron_to_hf()</text>
    <text class="copy" x="216" y="50">task.mapping.megatron_to_hf() gathers TP / PP / EP and splits</text>
    <text class="copy" x="216" y="68">fused parameters into one logical Hugging Face weight.</text>
  </g>

  <path class="arrow" d="M 600 462 V 478"/>

  <rect x="80" y="486" width="1040" height="360" rx="6" fill="#f8fafc" stroke="#d0d5dd"/>
  <rect x="80" y="486" width="9" height="360" fill="#0e7490"/>
  <text class="section" x="106" y="514">FOR EACH LOGICAL HUGGING FACE WEIGHT</text>

  <g transform="translate(130 532)">
    <rect class="box" width="940" height="54"/>
    <rect width="190" height="54" rx="6" fill="#ece7f8"/>
    <rect x="184" width="6" height="54" fill="#ece7f8"/>
    <text class="owner" x="18" y="32" fill="#6b21a8">MEGATRON-BRIDGE</text>
    <text class="call" x="216" y="24">_make_export_hook(task).export_weight(hf_name, tensor)</text>
    <text class="copy" x="216" y="44">Combines the logical weight with its current quantizer state.</text>
  </g>

  <path class="arrow" d="M 600 594 V 606"/>

  <g transform="translate(130 614)">
    <rect class="box" width="940" height="54"/>
    <rect width="190" height="54" rx="6" fill="#dff3ea"/>
    <rect x="184" width="6" height="54" fill="#dff3ea"/>
    <text class="owner" x="18" y="32" fill="#166534">MODELOPT</text>
    <text class="call" x="216" y="24">capture_quantized_weight_export_state(module, weight_name, cpu=False)</text>
    <text class="copy" x="216" y="44">Captures live scales, amax values, and format metadata.</text>
  </g>

  <path class="arrow" d="M 600 676 V 688"/>

  <g transform="translate(130 696)">
    <rect class="box" width="940" height="54"/>
    <rect width="190" height="54" rx="6" fill="#ece7f8"/>
    <rect x="184" width="6" height="54" fill="#ece7f8"/>
    <text class="owner" x="18" y="32" fill="#6b21a8">MEGATRON-BRIDGE</text>
    <text class="call" x="216" y="24">_transform_source_state(task, state)</text>
    <text class="copy" x="216" y="44">Uses ModelOpt select / merge APIs when topology or fused weights require them.</text>
  </g>

  <path class="arrow" d="M 600 758 V 770"/>

  <g transform="translate(130 778)">
    <rect class="box" width="940" height="54"/>
    <rect width="190" height="54" rx="6" fill="#dff3ea"/>
    <rect x="184" width="6" height="54" fill="#dff3ea"/>
    <text class="owner" x="18" y="32" fill="#166534">MODELOPT</text>
    <text class="call" x="216" y="24">export_quantized_weight_tensors(weight, state, dtype)</text>
    <text class="copy" x="216" y="44">Returns the packed weight and format-owned sidecar tensors.</text>
  </g>

  <path class="arrow" d="M 600 840 V 856"/>

  <g transform="translate(130 864)">
    <rect class="box" width="940" height="62"/>
    <rect width="190" height="62" rx="6" fill="#e0ecff"/>
    <rect x="184" width="6" height="62" fill="#e0ecff"/>
    <text class="owner" x="18" y="30" fill="#1d4ed8">NEMO RL TRANSPORT</text>
    <text class="call" x="216" y="25">stream_weights_via_ipc_zmq_impl()</text>
    <text class="copy" x="216" y="47">Streams each canonical tensor group without writing a checkpoint.</text>
  </g>

  <path class="arrow" d="M 600 934 V 950"/>

  <g transform="translate(130 958)">
    <rect class="box" width="940" height="54"/>
    <rect width="190" height="54" rx="6" fill="#fff0d5"/>
    <rect x="184" width="6" height="54" fill="#fff0d5"/>
    <text class="owner" x="18" y="32" fill="#9a3412">VLLM</text>
    <text class="call" x="216" y="24">initialize_layerwise_reload() -> model.load_weights() -> finalize_layerwise_reload()</text>
    <text class="copy" x="216" y="44">Restores checkpoint form, loads all groups, then rebuilds runtime layouts.</text>
  </g>
</svg>
