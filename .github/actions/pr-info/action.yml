name: Get PR info from a vetted mirror
description: Read PR metadata for manual dispatch on pull-request mirrors.
outputs:
  pr-info:
    description: Compact JSON containing the live pull-request metadata.
    value: ${{ steps.fetch.outputs.pr-info }}
runs:
  using: composite
  steps:
    - name: Fetch pull request
      id: fetch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ ! "$GITHUB_REF" =~ ^refs/heads/pull-request/([1-9][0-9]*)$ ]]; then
          echo "Expected a vetted pull-request/<number> branch, got $GITHUB_REF" >&2
          exit 1
        fi
        PR_NUMBER=${BASH_REMATCH[1]}
        PR_INFO=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
        PR_INFO=$(jq -ce --argjson number "$PR_NUMBER" '
          if type == "object" and .number == $number then .
          else error("Pull request number mismatch") end
        ' <<< "$PR_INFO")
        printf 'pr-info=%s\n' "$PR_INFO" >> "$GITHUB_OUTPUT"
