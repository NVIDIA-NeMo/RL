name: "Test Template"
description: "Template for running NeMo tests in a containerized environment"

inputs:
  runner:
    description: "Runner to use for test"
    required: true
  script:
    description: "Test script to execute"
    required: true
  is_optional:
    description: "Failure will cancel all other tests if set to true"
    required: false
    default: "false"
  is_doc_test:
    description: "Upload coverage as doc test"
    required: false
    default: "false"
  is_unit_test:
    description: "Upload coverage as unit test"
    required: false
    default: "false"
  image:
    description: "Image to use for test"
    required: false
    default: "nemo_rl_container"
  cpu-only:
    description: "Run tests on CPU only"
    required: false
    default: "false"
  is_fork_pr:
    description: "Whether this is a pull request from a fork"
    required: false
    default: "false"
  registry:
    description: "Registry to use for test"
    required: false
  test_data_path:
    description: "Test data path"
    required: false
    default: "/mnt/datadrive/TestData"
  image-tag:
    description: "Override container image tag. If set, infers FAST=1 and prefetches venvs + regenerates fingerprint at startup."
    required: false
    default: ""
  test-commit-sha:
    description: "Commit SHA to use for test"
    required: false
    default: ""
  megatron-lm-commit:
    description: "Full Megatron-LM commit SHA to check out in the Megatron-Bridge submodule"
    required: false
    default: ""
  megatron-lock-artifact:
    description: "Run-scoped artifact containing the lockfile for the requested Megatron-LM commit"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install uuidgen
      shell: bash -x -e -u -o pipefail {0}
      if: ${{ contains(inputs.runner, 'aws') || contains(inputs.runner, 'gcp') }}
      run: |
        for i in 1 2 3; do
          apt-get update && apt-get install -y uuid-runtime && break
          echo "Attempt $i failed, retrying in 10s..."
          sleep 10
        done

    - name: Docker pull image
      shell: bash
      run: |
        docker pull ${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.image-tag || github.run_id }}

    - name: Create UUID
      id: uuid
      shell: bash
      run: |
        echo "id=$(uuidgen)" >> "$GITHUB_OUTPUT"

    - name: Checkout NeMo
      uses: actions/checkout@v6
      env:
        DIR: ${{ github.run_id }}
      with:
        submodules: "recursive"
        path: ${{ github.run_id }}/${{steps.uuid.outputs.id }}/nemo-rl
        ref: ${{ inputs.test-commit-sha }}

    - name: Override Megatron-LM commit
      if: inputs.megatron-lm-commit != ''
      shell: bash -e -u -o pipefail {0}
      working-directory: ${{ github.workspace }}/${{ github.run_id }}/${{ steps.uuid.outputs.id }}/nemo-rl
      env:
        MEGATRON_LM_COMMIT: ${{ inputs.megatron-lm-commit }}
      run: |
        megatron_lm_dir="3rdparty/Megatron-Bridge-workspace/Megatron-Bridge/3rdparty/Megatron-LM"
        bash .github/scripts/checkout-megatron-lm-commit.sh "$megatron_lm_dir" "$MEGATRON_LM_COMMIT"

    - name: Download Megatron lockfile
      if: inputs.megatron-lock-artifact != ''
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: ${{ inputs.megatron-lock-artifact }}
        path: ${{ runner.temp }}/megatron-lock-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.uuid.outputs.id }}

    - name: Install Megatron lockfile
      if: inputs.megatron-lock-artifact != ''
      shell: bash -e -u -o pipefail {0}
      working-directory: ${{ github.workspace }}/${{ github.run_id }}/${{ steps.uuid.outputs.id }}/nemo-rl
      env:
        MEGATRON_LM_COMMIT: ${{ inputs.megatron-lm-commit }}
        TEST_COMMIT_SHA: ${{ inputs.test-commit-sha }}
      run: |
        bash .github/scripts/install-megatron-lock-artifact.sh \
          "$RUNNER_TEMP/megatron-lock-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ steps.uuid.outputs.id }}" \
          "." "$TEST_COMMIT_SHA" "$MEGATRON_LM_COMMIT"

    - name: Run tests
      id: test
      shell: bash
      run: |
        COVERAGE_PREFIX=$([[ "${{ inputs.is_doc_test }}" == "true" ]] && echo "doc-test" || ([[ "${{ inputs.is_unit_test }}" == "true" ]] && echo "unit-test" || echo "e2e"))
        echo "coverage-prefix=$COVERAGE_PREFIX" | tee -a "$GITHUB_OUTPUT"

        echo -e "\033[1;34m┌─ launching test ─────────────────────────────────────────────────────────┐\033[0m"
        echo -e "\033[1;34m│  script    : ${{ inputs.script }}\033[0m"
        echo -e "\033[1;34m│  runner    : ${{ inputs.runner }}\033[0m"
        echo -e "\033[1;34m│  container : ${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.image-tag || github.run_id }}\033[0m"
        # Expose the host's RDMA devices so mooncake_cpu tests exercise the real
        # transport instead of finding no verbs device and skipping. A container
        # sees the host's /sys/class/infiniband but does NOT inherit
        # /dev/infiniband/uverbs*, which is what libibverbs actually opens;
        # ibv_reg_mr additionally needs IPC_LOCK and an unlimited memlock rlimit
        # to pin its registrations.
        #
        # Requires an mlx5 device on the host, either fabric — rdma_devices()
        # prefers InfiniBand and falls back to RoCE. When the host has one,
        # NEMO_RL_REQUIRE_MOONCAKE promotes the tests' skip into a failure, so
        # losing this passthrough surfaces as a red job rather than silently
        # dropping mooncake coverage.
        #
        # --device against a missing path makes docker run itself fail, which
        # would break every test rather than only the RDMA ones — hence the
        # host-side check (see detect_rdma.sh for what it gates on).
        source "${{ github.workspace }}/${{ github.run_id }}/${{ steps.uuid.outputs.id }}/nemo-rl/tests/scripts/detect_rdma.sh"
        RDMA_FLAGS=()
        # MC_ENABLE_DEST_DEVICE_AFFINITY is normally decided by
        # configure_engine_env in nemo_rl/data_plane/adapters/transfer_queue_env.py,
        # which sets it only on a RoCE-only fabric. Passing it here overrides that
        # gate (an already-set value is left alone) and also covers processes that
        # never run the data-plane factory, e.g. a bare pytest invocation.
        if [[ "${{ inputs.is_doc_test }}" != "true" ]] && rdma_device_available; then
          RDMA_FLAGS=(--device=/dev/infiniband --cap-add=IPC_LOCK --ulimit memlock=-1
                      --env NEMO_RL_REQUIRE_MOONCAKE=1
                      --env MC_ENABLE_DEST_DEVICE_AFFINITY=1)
        fi
        echo -e "\033[1;34m│  rdma      : ${RDMA_FLAGS[*]:-none}\033[0m"
        echo -e "\033[1;34m└──────────────────────────────────────────────────────────────────────────┘\033[0m"

        echo "::group::Logs"
        docker run --rm -u root --runtime=nvidia --gpus all \
          --shm-size=64g \
          "${RDMA_FLAGS[@]}" \
          --env TRANSFORMERS_OFFLINE=0 \
          --env GHA_RUNNER=${{ inputs.runner }} \
          --env HYDRA_FULL_ERROR=1 \
          --env HF_HOME=/home/TestData/nemo-rl/hf_home \
          --env HF_DATASETS_CACHE=/home/TestData/nemo-rl/hf_datasets_cache \
          --env NEMO_RL_REPO_DIR=/opt/nemo-rl \
          --env HF_TOKEN \
          ${{ inputs.is_fork_pr == 'true' && '--env HF_HUB_OFFLINE=1' || '' }} \
          ${{ inputs.image-tag != '' && '--env FAST=1' || '' }} \
          --volume $(pwd)/${{ github.run_id }}/${{steps.uuid.outputs.id }}/nemo-rl:/opt/nemo-rl \
          --volume $GITHUB_ACTION_DIR:$GITHUB_ACTION_DIR \
          --volume ${{ inputs.test_data_path }}/nemo-rl/datasets:/opt/nemo-rl/datasets:ro \
          --volume ${{ inputs.test_data_path }}/nemo-rl/checkpoints:/home/TestData/nemo-rl/checkpoints:ro \
          --volume ${{ inputs.test_data_path }}/nemo-rl/hf_home/hub:/home/TestData/nemo-rl/hf_home/hub \
          --volume ${{ inputs.test_data_path }}/nemo-rl/hf_datasets_cache:/home/TestData/nemo-rl/hf_datasets_cache \
          ${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.image-tag || github.run_id }} bash -eux -o pipefail -c '\
            git config --global --add safe.directory /opt/nemo-rl
            git config --global --add safe.directory /opt/nemo-rl/3rdparty/Gym-workspace/Gym
            # This is needed since we create virtualenvs in the workspace, so this allows it to be cleaned up if necessary
            umask 000
            # When reusing a pre-built container (FAST=1), prefetch venvs and regenerate the
            # fingerprint once upfront instead of using NRL_FORCE_REBUILD_VENVS=true which
            # rebuilds on every Ray remote call.
            if [[ "${FAST:-0}" == "1" ]]; then
              UV_LINK_MODE=symlink uv run nemo_rl/utils/prefetch_venvs.py
              python tools/generate_fingerprint.py > /opt/nemo_rl_container_fingerprint
            fi
            bash tests/${{ inputs.is_doc_test == 'true' && 'docs' || (inputs.is_unit_test == 'true' && 'unit' || 'functional') }}/${{ inputs.script }}.sh && \
            echo "Finished successfully." || echo "Did not finish."' 2>&1 | tee err.log
        echo "::endgroup::"

    - name: Check result
      id: check
      shell: bash -e -u -o pipefail {0}
      if: always()
      run: |
        coverage_report=coverage-${{ steps.test.outputs.coverage-prefix }}-${{ github.run_id }}-$(uuidgen)
        echo "coverage_report=$coverage_report" | tee -a "$GITHUB_OUTPUT"

        IS_SUCCESS=$(tail -n 1 err.log | grep -q "Finished successfully." && echo "true" || echo "false")

        if [[ "$IS_SUCCESS" == "false" && "${{ inputs.is_optional }}" == "true" ]]; then
          echo "::warning::Test failed but is marked optional — treating as success."
          IS_SUCCESS=true
        fi

        if [[ "$IS_SUCCESS" == "true" ]]; then
          echo -e "\033[1;32m╔══════════════════════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;32m║                                                                          ║\033[0m"
          echo -e "\033[1;32m║   ✅  PASSED                                                             ║\033[0m"
          echo -e "\033[1;32m║   ${{ inputs.script }}\033[0m"
          echo -e "\033[1;32m║                                                                          ║\033[0m"
          echo -e "\033[1;32m╚══════════════════════════════════════════════════════════════════════════╝\033[0m"
          echo "::notice title=Result::✅ ${{ inputs.script }} — PASSED"
          exit 0
        else
          echo -e "\033[1;31m╔══════════════════════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;31m║                                                                          ║\033[0m"
          echo -e "\033[1;31m║   ❌  FAILED                                                             ║\033[0m"
          echo -e "\033[1;31m║   ${{ inputs.script }}\033[0m"
          echo -e "\033[1;31m║                                                                          ║\033[0m"
          echo -e "\033[1;31m╚══════════════════════════════════════════════════════════════════════════╝\033[0m"
          echo "::error title=Result::❌ ${{ inputs.script }} — FAILED"
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      if: ${{ steps.check.outputs.coverage_report != 'none' }}
      with:
        name: ${{ steps.check.outputs.coverage_report }}
        path: |
          ${{ github.workspace }}/${{ github.run_id }}/${{steps.uuid.outputs.id }}/nemo-rl/tests/.coverage
        include-hidden-files: true

    - name: Upload nemo_gym actual test data
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: actual_test_nemo_gym_sanity-${{ github.run_id }}
        path: |
          ${{ github.workspace }}/${{ github.run_id }}/${{steps.uuid.outputs.id }}/nemo-rl/tests/unit/environments/nemo_gym_test_data/actual_test_nemo_gym_sanity.json
        if-no-files-found: ignore

    - name: Container shutdown
      if: always()
      shell: bash
      run: |
        rm -rf $(pwd)/${{ github.run_id }}/${{steps.uuid.outputs.id }} || true
