# Sets the CI:* label from the changed files; only maintainers can override it.
# pull_request_target runs the default branch's copy of this file, and the checkout below
# takes the script from that same commit, so a PR cannot change its own rules. It never
# checks out or runs the PR's code.
name: Set CI label

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  ci-label:
    runs-on: ubuntu-latest
    # Only label events for CI:* or Skip CICD matter; other labels are left alone.
    if: >-
      ${{
        !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) ||
        startsWith(github.event.label.name, 'CI:') ||
        github.event.label.name == 'Skip CICD'
      }}
    steps:
      - name: Checkout the script (same commit as this workflow, never the PR's code)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: .github/scripts

      - name: Set CI label
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/ci_label.py
