# Posts the `Self-review` commit status: has the PR author published a self-review made by
# skills/review-pr-team, and is every thread from it answered and resolved?
# Warning-only for now: not a required status check.
# The script and the policy are always read from the default branch, never from the PR.
# GitHub has no trigger for "review thread resolved", so the status refreshes on the next
# push, edit, review or review comment. For PRs from forks, review events get a read-only
# token and can't post a status; the next push or edit refreshes it (an Autobot hook on the
# review-thread webhook can fix both later).
name: Check self-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  # One group per PR and trigger type: a run cancels only older runs of its own type, so the check list keeps no
  # cancelled run. Fork review runs (read-only token) also can't cancel a push run that can post.
  group: self-review-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  self-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the check script and policy from the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
            skills/review-pr-team

      - name: Check self-review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/check_self_review.py
