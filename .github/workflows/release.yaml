name: "Build, validate, and release NeMo-RL"

on:
  push:
    branches:
      - main
      - "r**"
      - "pull-request/**"
      - "deploy-release/*"
  workflow_dispatch:
    inputs:
      release-ref:
        description: Full 40-character commit SHA to release
        required: true
        type: string
      dry-run:
        description: Validate the release without publishing a GitHub release or docs.
        required: true
        default: true
        type: boolean
      create-gh-release:
        description: Create a GitHub release
        required: true
        default: true
        type: boolean
      publish-docs:
        description: Publish docs
        required: false
        default: true
        type: boolean
      version-bump-branch:
        description: Protected main or rX.Y.Z release branch for the version bump
        required: true
        type: string
      gh-release-from-tag:
        description: Tag of previous release for changelog builder
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify the release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release-ref || github.sha }}
          TARGET_BRANCH: ${{ inputs.version-bump-branch }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release-ref must be a full commit SHA."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            exit 0
          fi
          if [[ "$GITHUB_REF" != refs/heads/main || "$GITHUB_REPOSITORY" != NVIDIA-NeMo/RL ]]; then
            echo "::error::Dispatch the release from NVIDIA-NeMo/RL main."
            exit 1
          fi
          if [[ "$TARGET_BRANCH" != main && ! "$TARGET_BRANCH" =~ ^r[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Select main or a protected rX.Y.Z release branch."
            exit 1
          fi
          target_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$TARGET_BRANCH" --jq 'select(.protected) | .commit.sha')
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The release target must be a protected branch."
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...$target_sha?per_page=1" --jq '.status')
          if [[ "$status" != identical && "$status" != ahead ]]; then
            echo "::error::The release commit must belong to the target branch."
            exit 1
          fi

  previous-tag:
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Checkout release ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.release-ref }}
          sparse-checkout: nemo_rl/package_info.py
          persist-credentials: false

      - name: Find previous release tag
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TAGS=$(gh api --paginate "repos/${{ github.repository }}/tags" --jq '.[].name' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V)

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PKG=nemo_rl/package_info.py
            MAJOR=$(awk -F'= ' '/^MAJOR = /{print $2}' "$PKG")
            MINOR=$(awk -F'= ' '/^MINOR = /{print $2}' "$PKG")
            PATCH=$(awk -F'= ' '/^PATCH = /{print $2}' "$PKG")
            TARGET="v${MAJOR}.${MINOR}.${PATCH}"
            TAG=$(printf '%s\n%s\n' "$TAGS" "$TARGET" | sed '/^$/d' | sort -V -u \
              | awk -v t="$TARGET" '$0 == t {print p; exit} {p = $0}')
            echo "Release target: $TARGET"
          else
            TAG=$(printf '%s\n' "$TAGS" | tail -n1)
          fi

          echo "Previous release tag: $TAG"
          echo "tag=$TAG" | tee -a "$GITHUB_OUTPUT"

  bump:
    needs: previous-tag
    permissions:
      contents: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_bump.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      release-environment: rl-release
      release-ref: ${{ inputs.release-ref || github.sha }}
      version-bump-branch: ${{ inputs.version-bump-branch || github.ref_name }}
      validate-only: ${{ github.event_name != 'workflow_dispatch' }}
      dry-run: ${{ inputs.dry-run || false }}
      python-package: nemo_rl
      library-name: NeMo-RL
      packaging: uv
      restrict-to-admins: true

  finalize:
    needs: [previous-tag, bump]
    permissions:
      contents: read
      pull-requests: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_finalize.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      release-environment: rl-release
      release-ref: ${{ inputs.release-ref || github.sha }}
      release-version: ${{ needs.bump.outputs.release-version }}
      library-name: NeMo-RL
      validate-only: ${{ github.event_name != 'workflow_dispatch' }}
      dry-run: ${{ inputs.dry-run || false }}
      create-gh-release: ${{ github.event_name != 'workflow_dispatch' || inputs.create-gh-release }}
      gh-release-use-changelog-builder: true
      gh-release-from-tag: ${{ inputs.gh-release-from-tag || needs.previous-tag.outputs.tag }}
      publish-docs: false
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  docs:
    needs: [bump, finalize]
    if: github.event_name != 'workflow_dispatch' || inputs.publish-docs
    permissions:
      contents: read
    uses: ./.github/workflows/release-docs.yml
    with:
      github-ref: ${{ inputs.release-ref || github.sha }}
      docs-version-override: ${{ needs.bump.outputs.release-version }}
      dry-run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run }}
      publish-as-latest: true
    secrets:
      AWS_ASSUME_ROLE_ARN: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && secrets.AWS_ASSUME_ROLE_ARN || '' }}
      AWS_ACCESS_KEY_ID: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && secrets.AWS_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && secrets.AWS_SECRET_ACCESS_KEY || '' }}
      AKAMAI_HOST: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && secrets.AKAMAI_HOST || '' }}
      AKAMAI_CLIENT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && secrets.AKAMAI_CLIENT_TOKEN || '' }}
      AKAMAI_CLIENT_SECRET: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && secrets.AKAMAI_CLIENT_SECRET || '' }}
      AKAMAI_ACCESS_TOKEN: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && secrets.AKAMAI_ACCESS_TOKEN || '' }}
      S3_BUCKET_NAME: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run && secrets.S3_BUCKET_NAME || '' }}

  release-summary:
    needs: [validate-inputs, previous-tag, bump, finalize, docs]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check release results
        env:
          RESULTS: ${{ toJSON(needs) }}
          DOCS_EXPECTED: ${{ github.event_name != 'workflow_dispatch' || inputs.publish-docs }}
        run: |
          jq -e --arg docs "$DOCS_EXPECTED" '
            all(to_entries[]; .value.result == "success" or
              (.key == "docs" and $docs == "false" and .value.result == "skipped"))
          ' <<< "$RESULTS"
