name: "CICD NeMo RL"

on:
  push:
    branches:
      - main
      - "r[0-9]+.[0-9]+.[0-9]+"
      - "pull-request/[0-9]+"
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      test_to_run:
        required: false
        default: L2
        type: choice
        options:
          - docs
          - Lfast
          - L0
          - L1
          - L2
        description: Test level to run. docs = lint and Sphinx docs build only (no container or GPU), Lfast = fast subset (reuses main container, or the release branch's container for PRs to a release branch), L0 = unit/docs/lint, L1 = L0 + functional, L2 = same as L1 today (plan to add convergence tests)
      test_script_pattern:
        description: "Case-insensitive substring used to select unit and functional test script names (for example, Megatron_1 or Vllm)."
        required: false
        default: ""
        type: string
      test_platform:
        description: "Select which test job matrices run. Unit and Lfast tests are H100-only."
        required: false
        default: all
        type: choice
        options:
          - all
          - h100
          - gb200
      megatron_lm_commit:
        description: "Full Megatron-LM commit SHA to check out in the Megatron-Bridge submodule."
        required: false
        default: ""
        type: string
      image_tag:
        description: "Override container image tag (e.g. 'main'). Skips container build."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || 'main' }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GB200_CONTAINER_REGISTRY: ${{ vars.GB200_CONTAINER_REGISTRY }}

jobs:
  pre-flight:
    runs-on: ubuntu-latest
    outputs:
      test_level: ${{ steps.evaluate.outputs.test_level }}
      image_tag: ${{ steps.evaluate.outputs.image_tag }}
      test_script_pattern: ${{ steps.evaluate.outputs.test_script_pattern }}
      test_platform: ${{ steps.evaluate.outputs.test_platform }}
      unit_test_scripts: ${{ steps.evaluate.outputs.unit_test_scripts }}
      unit_test_count: ${{ steps.evaluate.outputs.unit_test_count }}
      h100_functional_test_scripts: ${{ steps.evaluate.outputs.h100_functional_test_scripts }}
      h100_functional_test_count: ${{ steps.evaluate.outputs.h100_functional_test_count }}
      gb200_functional_test_scripts: ${{ steps.evaluate.outputs.gb200_functional_test_scripts }}
      gb200_functional_test_count: ${{ steps.evaluate.outputs.gb200_functional_test_count }}
      megatron_lm_commit: ${{ steps.evaluate.outputs.megatron_lm_commit }}
      base_ref: ${{ steps.base-head-ref.outputs.base_ref }}
      cache_scope: ${{ steps.base-head-ref.outputs.cache_scope }}
      base_sha: ${{ steps.base-head-ref.outputs.base_sha }}
      head_ref: ${{ steps.base-head-ref.outputs.head_ref }}
      head_sha: ${{ steps.base-head-ref.outputs.head_sha }}
      pr_number: ${{ steps.base-head-ref.outputs.pr_number }}
      head_label: ${{ steps.base-head-ref.outputs.head_label }}
      test_sha: ${{ steps.base-head-ref.outputs.test_sha }}
    steps:
      - name: Get PR info
        id: get-pr-info
        if: startsWith(github.ref, 'refs/heads/pull-request/')
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Determine base and head references
        id: base-head-ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR_INFO_JSON: ${{ steps.get-pr-info.outputs.pr-info }}
        run: |
          set -euo pipefail
          cache_scope=""
          pr_number=""
          if [[ "$GITHUB_REF" == refs/heads/pull-request/* ]]; then
            pr_number=$(jq -er '.number' <<< "$PR_INFO_JSON")
            if [[ ! "$pr_number" =~ ^[0-9]+$ || "$GITHUB_REF_NAME" != "pull-request/$pr_number" ]]; then
              echo '::error::PR metadata does not match the mirror branch.'
              exit 1
            fi
            base_ref=$(echo "$PR_INFO_JSON" | jq -r '.base.ref')
            base_sha=$(echo "$PR_INFO_JSON" | jq -r '.base.sha')
            head_ref=$(echo "$PR_INFO_JSON" | jq -r '.head.ref')
            head_sha=$(echo "$PR_INFO_JSON" | jq -r '.head.sha')
            test_sha=$(jq -r '.merge_commit_sha // empty' <<< "$PR_INFO_JSON")
            if [[ "$head_sha" != "$GITHUB_SHA" || ! "$base_sha" =~ ^[0-9a-f]{40}$ || ! "$test_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::The PR mirror is stale or its merge revision is unavailable.'
              exit 1
            fi
            parents=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$test_sha" --jq '[.parents[].sha] | join(" ")')
            if [[ "$parents" != "$base_sha $GITHUB_SHA" ]]; then
              echo '::error::The PR merge parents do not match the reported base and mirror head.'
              exit 1
            fi
            head_label=$(echo "$PR_INFO_JSON" | jq -r '.head.label // empty')
            ci_label=$(echo "$PR_INFO_JSON" | jq -r '[.labels[]? | (if type == "string" then . else .name end) | select(startswith("CI:"))] | first // empty')
            # PRs targeting a release branch (e.g. r0.8.0) pin different submodule/TRT-LLM refs than main,
            # so they must not share main's TRT-LLM caches or its prebuilt container.
            if [[ "$base_ref" =~ ^r[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              cache_scope="$base_ref"
            fi
          else
            # Runs on the release branch itself (push after a merge) own that branch's caches and image tag.
            if [[ "$GITHUB_REF_NAME" =~ ^r[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              cache_scope="$GITHUB_REF_NAME"
            fi
            base_ref="HEAD~1"
            base_sha=$(git rev-parse HEAD~1)
            head_ref="HEAD"
            head_sha="$GITHUB_SHA"
            test_sha="$GITHUB_SHA"
            head_label="$GITHUB_REF_NAME"
            ci_label=""
          fi
          {
            echo "pr_number=$pr_number"
            echo "base_ref=$base_ref"
            echo "cache_scope=$cache_scope"
            echo "base_sha=$base_sha"
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
            echo "test_sha=$test_sha"
            echo "head_label=$head_label"
            echo "ci_label=$ci_label"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Classify changed paths with the verified base policy
        id: ci-tier
        if: startsWith(github.ref, 'refs/heads/pull-request/')
        env:
          BASE_SHA: ${{ steps.base-head-ref.outputs.base_sha }}
          HEAD_SHA: ${{ steps.base-head-ref.outputs.head_sha }}
        run: |
          set -euo pipefail
          policy_path=.github/scripts/ci_label.py
          entry=$(git ls-tree "$BASE_SHA" -- "$policy_path")
          if [[ -z "$entry" ]]; then
            echo 'The base predates the CI classifier. Running the full L1 suite.'
            echo 'minimum_level=L1' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          policy=$(mktemp)
          trap 'rm -f "$policy"' EXIT
          git show "$BASE_SHA:$policy_path" > "$policy"
          python3 -I - "$policy" <<'PY' | tee -a "$GITHUB_OUTPUT"
          import os
          import runpy
          import subprocess
          import sys

          revisions = os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]
          paths = subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", "--ignore-submodules=none", "-z", revisions, "--",
          ]).split(b"\0")
          pick_label = runpy.run_path(sys.argv[1])["pick_label"]
          label, _ = pick_label([os.fsdecode(path) for path in paths if path])
          minimum = {"CI:docs": "docs", "CI:Lfast": "Lfast", "CI:L1": "L1"}[label]
          print(f"minimum_level={minimum}")
          PY

      - name: Evaluate conditions
        id: evaluate
        env:
          MINIMUM_LEVEL: ${{ steps.ci-tier.outputs.minimum_level }}
          IS_PULLREQUEST: ${{ startsWith(github.ref, 'refs/heads/pull-request/') }}
          LABEL: ${{ steps.base-head-ref.outputs.ci_label }}
          CACHE_SCOPE: ${{ steps.base-head-ref.outputs.cache_scope }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TEST_LEVEL: ${{ inputs.test_to_run }}
          DISPATCH_IMAGE_TAG: ${{ inputs.image_tag }}
          TEST_SCRIPT_PATTERN: ${{ inputs.test_script_pattern }}
          TEST_PLATFORM: ${{ inputs.test_platform || 'all' }}
          MEGATRON_LM_COMMIT: ${{ inputs.megatron_lm_commit }}
        run: |
          TEST_LEVEL=L1
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            TEST_LEVEL="$DISPATCH_TEST_LEVEL"
          elif [[ "$IS_PULLREQUEST" == true ]]; then
            case "$MINIMUM_LEVEL" in
              docs | Lfast | L1) TEST_LEVEL="$MINIMUM_LEVEL" ;;
              *) echo "::error::Missing or invalid base CI classification."; exit 1 ;;
            esac
            case "$LABEL" in
              CI:L1 | CI:L2) TEST_LEVEL="${LABEL#CI:}" ;;
              CI:Lfast)
                if [[ "$MINIMUM_LEVEL" == docs ]]; then TEST_LEVEL=Lfast; fi ;;
              CI:L0)
                # L0 omits Lfast functional tests. L1 covers both suites.
                if [[ "$MINIMUM_LEVEL" == docs ]]; then TEST_LEVEL=L0; else TEST_LEVEL=L1; fi ;;
              CI:megatron) TEST_LEVEL=L1; TEST_SCRIPT_PATTERN=megatron ;;
            esac
          fi
          echo "CI level: $TEST_LEVEL (base minimum: $MINIMUM_LEVEL, label: $LABEL, event: $EVENT_NAME)"

          if [[ -n "$MEGATRON_LM_COMMIT" && ! "$MEGATRON_LM_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "megatron_lm_commit must be a full 40-character hexadecimal commit SHA." >&2
            exit 1
          fi
          if [[ -n "$TEST_SCRIPT_PATTERN" && ! "$TEST_SCRIPT_PATTERN" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "test_script_pattern may contain only letters, numbers, dots, underscores, and hyphens." >&2
            exit 1
          fi
          case "$TEST_PLATFORM" in
            all | h100 | gb200) ;;
            *)
              echo "test_platform must be one of: all, h100, gb200." >&2
              exit 1
              ;;
          esac

          test_plan=$(bash .github/scripts/plan-tests.sh "$TEST_SCRIPT_PATTERN")
          echo "Test plan: $test_plan"

          unit_test_scripts=$(jq -c '.unit' <<< "$test_plan")
          h100_functional_test_scripts=$(jq -c \
            '[.functional[] | select((ascii_downcase | contains("gb200")) | not)]' \
            <<< "$test_plan")
          # The GB200 image is built without BUILD_DYNAMO, so it has no etcd or
          # nats-server for the managed Dynamo runtime.
          gb200_functional_test_scripts=$(jq -c \
            '[.functional[] | select(. != "L1_Functional_Tests_Dynamo")]' \
            <<< "$test_plan")

          unit_test_count=$(jq 'length' <<< "$unit_test_scripts")
          h100_functional_test_count=$(jq 'length' <<< "$h100_functional_test_scripts")
          gb200_functional_test_count=$(jq 'length' <<< "$gb200_functional_test_scripts")

          effective_test_count=0
          case "$TEST_LEVEL" in
            Lfast)
              if [[ "$TEST_PLATFORM" != "gb200" ]]; then
                effective_test_count=$((unit_test_count + h100_functional_test_count))
              fi
              ;;
            L0)
              if [[ "$TEST_PLATFORM" != "gb200" ]]; then
                effective_test_count=$unit_test_count
              fi
              ;;
            L1 | L2)
              if [[ "$TEST_PLATFORM" != "gb200" ]]; then
                effective_test_count=$((effective_test_count + unit_test_count + h100_functional_test_count))
              fi
              if [[ "$TEST_PLATFORM" != "h100" ]]; then
                effective_test_count=$((effective_test_count + gb200_functional_test_count))
              fi
              ;;
          esac

          if [[ "$TEST_LEVEL" != "docs" && "$TEST_LEVEL" != "none" && "$effective_test_count" -eq 0 ]]; then
            echo "No test scripts are runnable for test level '$TEST_LEVEL', platform '$TEST_PLATFORM', and pattern '$TEST_SCRIPT_PATTERN'." >&2
            exit 1
          fi

          {
            echo "test_level=$TEST_LEVEL"
            echo "test_script_pattern=$TEST_SCRIPT_PATTERN"
            echo "test_platform=$TEST_PLATFORM"
            echo "unit_test_scripts=$unit_test_scripts"
            echo "unit_test_count=$unit_test_count"
            echo "h100_functional_test_scripts=$h100_functional_test_scripts"
            echo "h100_functional_test_count=$h100_functional_test_count"
            echo "gb200_functional_test_scripts=$gb200_functional_test_scripts"
            echo "gb200_functional_test_count=$gb200_functional_test_count"
            echo "megatron_lm_commit=${MEGATRON_LM_COMMIT,,}"
          } | tee -a "$GITHUB_OUTPUT"

          # Determine image tag: Lfast reuses a prebuilt container, workflow_dispatch can override.
          # docs runs no container, but a nonempty tag still skips the container build.
          # Lfast on a release-branch PR reuses that branch's container (published only by builds of
          # the release branch itself after merges) because the main container carries main's TRT-LLM wheel,
          # not the release branch's. PR builds never overwrite it.
          IMAGE_TAG=""
          if [[ ( "$TEST_LEVEL" == "Lfast" || "$TEST_LEVEL" == "docs" ) && "$IS_PULLREQUEST" == "true" && -n "$CACHE_SCOPE" ]]; then
            IMAGE_TAG="$CACHE_SCOPE"
          elif [[ "$TEST_LEVEL" == "Lfast" || "$TEST_LEVEL" == "docs" ]]; then
            IMAGE_TAG="main"
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_IMAGE_TAG" ]]; then
            IMAGE_TAG="$DISPATCH_IMAGE_TAG"
          fi
          echo "image_tag=$IMAGE_TAG" | tee -a "$GITHUB_OUTPUT"

  ephemeral-runner-routing:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_ephemeral_runner_routing.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      lane: ${{ vars.NEMO_CI_EPHEMERAL_LANE }}
      legacy_label: ${{ vars.NON_NVIDIA_H100_RUNNER }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}

  org-member-pre-flight:
    needs: [ephemeral-runner-routing]
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cicd_preflight.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      default_runner_prefix: ${{ vars.DEFAULT_H100_RUNNER }}
      non_nvidia_runner_prefix: ${{ needs.ephemeral-runner-routing.outputs.runner_label_base }}
      default_test_data_path: ${{ vars.DEFAULT_H100_TEST_DATA_PATH }}
      non_nvidia_test_data_path: ${{ vars.NON_NVIDIA_H100_TEST_DATA_PATH }}
      default_registry: ${{ vars.DEFAULT_H100_CONTAINER_REGISTRY }}
      non_nvidia_registry: ${{ vars.NON_NVIDIA_H100_CONTAINER_REGISTRY }}
      sso_users_filename: ${{ vars.SSO_USERS_FILENAME }}
    secrets:
      NVIDIA_MANAGEMENT_ORG_PAT: ${{ secrets.NVIDIA_MANAGEMENT_ORG_PAT }}

  gb200-config:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.config.outputs.registry }}
    steps:
      - name: Configure GB200 registry
        id: config
        env:
          GB200_REGISTRY: ${{ env.GB200_CONTAINER_REGISTRY }}
        run: echo "registry=$GB200_REGISTRY" | tee -a "$GITHUB_OUTPUT"

  pr-branch-up-to-date-check:
    name: Check if PR branch is up to date
    needs: [pre-flight]
    if: ${{ startsWith(github.ref, 'refs/heads/pull-request/') }}
    runs-on: ubuntu-latest
    env:
      MAX_COMMITS_BEHIND: 10
    steps:
      - name: Check how many commits behind target branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ needs.pre-flight.outputs.base_sha }}
          HEAD_SHA: ${{ needs.pre-flight.outputs.head_sha }}
          BASE_REF: ${{ needs.pre-flight.outputs.base_ref }}
          HEAD_LABEL: ${{ needs.pre-flight.outputs.head_label }}
        run: |
          echo "Repository: $REPO"
          echo "Base branch: $BASE_REF (SHA: $BASE_SHA)"
          echo "PR head: $HEAD_LABEL (SHA: $HEAD_SHA)"
          echo "Maximum commits behind allowed: $MAX_COMMITS_BEHIND"

          API_RESPONSE=$(gh api "repos/$REPO/compare/$HEAD_SHA...$BASE_REF" --jq '{behind_by: .behind_by, ahead_by: .ahead_by, status: .status}')

          COMMITS_BEHIND=$(echo "$API_RESPONSE" | jq -r '.ahead_by')
          COMMITS_AHEAD=$(echo "$API_RESPONSE" | jq -r '.behind_by')
          STATUS=$(echo "$API_RESPONSE" | jq -r '.status')

          echo "Comparison status: $STATUS"
          echo "PR is $COMMITS_BEHIND commits behind and $COMMITS_AHEAD commits ahead of $BASE_REF"

          # Check if we're behind by more than the allowed number
          if [ "$COMMITS_BEHIND" -gt "$MAX_COMMITS_BEHIND" ]; then
            echo "❌ ERROR: This PR is $COMMITS_BEHIND commits behind $BASE_REF, which exceeds the maximum allowed ($MAX_COMMITS_BEHIND commits)."
            echo "Please rebase or merge the latest changes from $BASE_REF into your PR branch."
            exit 1
          else
            echo "✅ PR is acceptably fresh ($COMMITS_BEHIND commits behind, limit is $MAX_COMMITS_BEHIND)"
          fi

  lint-check:
    name: Lint check
    needs: [pre-flight]
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          # Remove unnecessary packages and files on Ubuntu
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/az || true
          # Clear pip and npm caches
          pip cache purge || true
          sudo npm cache clean --force || true
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: "recursive"
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.28"
          enable-cache: true
          prune-cache: false
      # Faster than uv python install since it caches python alongside runner
      - name: "Set up Python"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"
      - name: Check lint
        run: |
          uv venv
          uv run --group dev pre-commit install
          uv run --group dev pre-commit run --all-files --show-diff-on-failure --color=always
      - name: Minimize uv cache
        run: uv cache prune --ci

  cicd-wait-in-queue:
    name: Wait in test approval queue
    needs: [pre-flight, lint-check]
    runs-on: ubuntu-latest
    environment:
      name: test
      deployment: false
    if: >-
      ${{
        always() &&
        startsWith(github.ref, 'refs/heads/pull-request/') &&
        contains('Lfast L0 L1 L2', needs.pre-flight.outputs.test_level) &&
        needs.pre-flight.result == 'success' &&
        needs.lint-check.result == 'success' &&
        !cancelled()
      }}
    steps:
      - name: Approved
        run: echo "Approved to run CI tests."

  prepare-megatron-lock:
    name: Prepare Megatron lockfile
    needs: [pre-flight, cicd-wait-in-queue]
    if: >-
      ${{
        always() &&
        needs.pre-flight.result == 'success' &&
        needs.pre-flight.outputs.megatron_lm_commit != '' &&
        (
          needs.cicd-wait-in-queue.result == 'success' ||
          !startsWith(github.ref, 'refs/heads/pull-request/')
        ) &&
        !cancelled()
      }}
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.pre-flight.outputs.test_sha }}
          submodules: recursive

      - name: Override Megatron-LM commit
        env:
          MEGATRON_LM_COMMIT: ${{ needs.pre-flight.outputs.megatron_lm_commit }}
        run: |
          megatron_lm_dir="3rdparty/Megatron-Bridge-workspace/Megatron-Bridge/3rdparty/Megatron-LM"
          bash .github/scripts/checkout-megatron-lm-commit.sh "$megatron_lm_dir" "$MEGATRON_LM_COMMIT"

      - name: Read uv version from Dockerfile
        id: uv-version
        run: |
          uv_version="$(sed -nE 's/^ARG[[:space:]]+UV_VERSION=([^[:space:]#]+).*$/\1/p' docker/Dockerfile)"
          if [[ ! "$uv_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid UV_VERSION from docker/Dockerfile: $uv_version" >&2
            exit 1
          fi
          echo "version=$uv_version" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true

      - name: Generate lockfile
        run: uv lock

      - name: Package lockfile
        id: package
        env:
          MEGATRON_LM_COMMIT: ${{ needs.pre-flight.outputs.megatron_lm_commit }}
          NEMO_RL_COMMIT: ${{ needs.pre-flight.outputs.test_sha }}
        run: |
          artifact_dir="$RUNNER_TEMP/megatron-lock"
          megatron_lm_dir="3rdparty/Megatron-Bridge-workspace/Megatron-Bridge/3rdparty/Megatron-LM"
          actual_nemo_rl_commit="$(git rev-parse HEAD)"
          actual_megatron_lm_commit="$(git -C "$megatron_lm_dir" rev-parse HEAD)"
          test "$actual_nemo_rl_commit" = "${NEMO_RL_COMMIT,,}"
          test "$actual_megatron_lm_commit" = "${MEGATRON_LM_COMMIT,,}"
          mkdir -p "$artifact_dir"
          cp uv.lock "$artifact_dir/uv.lock"
          {
            echo "nemo-rl-commit=$actual_nemo_rl_commit"
            echo "megatron-lm-commit=$actual_megatron_lm_commit"
          } > "$artifact_dir/manifest.txt"
          (
            cd "$artifact_dir"
            sha256sum uv.lock > uv.lock.sha256
          )
          echo "artifact_name=megatron-lock-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload lockfile
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/megatron-lock
          retention-days: 1
          if-no-files-found: error

  sphinx-build:
    needs: [pre-flight, cicd-wait-in-queue]
    if: >-
      ${{
        always() &&
        needs.pre-flight.result == 'success' &&
        contains('docs Lfast L0 L1 L2', needs.pre-flight.outputs.test_level) &&
        needs.pre-flight.outputs.test_script_pattern == '' &&
        (
          needs.cicd-wait-in-queue.result == 'success' ||
          needs.pre-flight.outputs.test_level == 'docs' ||
          !startsWith(github.ref, 'refs/heads/pull-request/')
        ) &&
        !cancelled()
      }}
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_build_docs.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a

  build-container:
    name: Build H100 container
    if: >-
      ${{
        always() &&
        needs.pre-flight.result == 'success' &&
        needs.org-member-pre-flight.result == 'success' &&
        needs.pre-flight.outputs.test_level != 'none' &&
        needs.pre-flight.outputs.image_tag == '' &&
        (needs.prepare-megatron-lock.result == 'success' || needs.prepare-megatron-lock.result == 'skipped') &&
        (
          needs.cicd-wait-in-queue.result == 'success' ||
          !startsWith(github.ref, 'refs/heads/pull-request/')
        ) &&
        !cancelled()
      }}
    needs: [pre-flight, prepare-megatron-lock, org-member-pre-flight, cicd-wait-in-queue]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_build_container.yml
    with:
      build-ref: ${{ needs.pre-flight.outputs.test_sha }}
      image-name: ${{ vars.CI_CONTAINER_NAME }}
      dockerfile: docker/Dockerfile
      platform: linux/amd64
      registry: ${{ needs.org-member-pre-flight.outputs.registry }}
      runner: ${{ startsWith(needs.org-member-pre-flight.outputs.runner_prefix, 'ephe-v2-') && format('{0}-a{1}', needs.org-member-pre-flight.outputs.runner_prefix, github.run_attempt) || needs.org-member-pre-flight.outputs.runner_prefix }}
      target: release
      build-contexts: |
        nemo-rl=.
      trtllm-ccache-tag: ${{ vars.TRTLLM_BUILD_CACHE == 'enabled' && 'trtllm-ccache' || '' }}
      trtllm-wheel-cache-tag: ${{ vars.TRTLLM_BUILD_CACHE == 'enabled' && 'trtllm-wheel-cache' || '' }}
      uv-cache-tag: ${{ vars.UV_BUILD_CACHE == 'enabled' && 'uv-cache' || '' }}
      trtllm-cache-scope: ${{ needs.pre-flight.outputs.cache_scope }}
      megatron-lm-commit: ${{ needs.pre-flight.outputs.megatron_lm_commit }}
      megatron-lock-artifact: ${{ needs.prepare-megatron-lock.outputs.artifact_name }}
      build-args: |
        MAX_JOBS=4
        BUILD_DYNAMO=1
        TRTLLM_BUILD_JOBS=24
        NEMO_RL_COMMIT=${{ needs.pre-flight.outputs.test_sha }}

  build-container-gb200:
    name: Build GB200/GCP container
    if: >-
      ${{
        always() &&
        needs.pre-flight.result == 'success' &&
        needs.org-member-pre-flight.result == 'success' &&
        needs.gb200-config.result == 'success' &&
        needs.pre-flight.outputs.test_level != 'none' &&
        needs.pre-flight.outputs.image_tag == '' &&
        needs.org-member-pre-flight.outputs.is_member == 'true' &&
        vars.DISABLE_GB200_TESTS != 'true' &&
        needs.pre-flight.outputs.test_platform != 'h100' &&
        contains('L1 L2', needs.pre-flight.outputs.test_level) &&
        needs.pre-flight.outputs.gb200_functional_test_count != '0' &&
        (needs.prepare-megatron-lock.result == 'success' || needs.prepare-megatron-lock.result == 'skipped') &&
        (
          needs.cicd-wait-in-queue.result == 'success' ||
          !startsWith(github.ref, 'refs/heads/pull-request/')
        ) &&
        !cancelled()
      }}
    needs: [pre-flight, prepare-megatron-lock, org-member-pre-flight, gb200-config, cicd-wait-in-queue]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_build_container.yml
    with:
      build-ref: ${{ needs.pre-flight.outputs.test_sha }}
      image-name: ${{ vars.CI_CONTAINER_NAME }}
      dockerfile: docker/Dockerfile
      platform: linux/arm64
      registry: ${{ needs.gb200-config.outputs.registry }}
      runner: ${{ vars.GB200_RUNNER }}
      target: release
      build-contexts: |
        nemo-rl=.
      trtllm-ccache-tag: ${{ vars.TRTLLM_BUILD_CACHE == 'enabled' && 'trtllm-ccache' || '' }}
      trtllm-wheel-cache-tag: ${{ vars.TRTLLM_BUILD_CACHE == 'enabled' && 'trtllm-wheel-cache' || '' }}
      uv-cache-tag: ${{ vars.UV_BUILD_CACHE == 'enabled' && 'uv-cache' || '' }}
      trtllm-cache-scope: ${{ needs.pre-flight.outputs.cache_scope }}
      megatron-lm-commit: ${{ needs.pre-flight.outputs.megatron_lm_commit }}
      megatron-lock-artifact: ${{ needs.prepare-megatron-lock.outputs.artifact_name }}
      build-args: |
        MAX_JOBS=4
        TRTLLM_BUILD_JOBS=8
        NEMO_RL_COMMIT=${{ needs.pre-flight.outputs.test_sha }}

  # CPU-only config and test-suite checks (recipe configs resolve, nightly GPU-hour
  # budget, schema validation). They are the most frequent cause of red unit runs and
  # need no GPU, so they run on a GitHub-hosted runner in parallel with the container
  # build. No GPU job waits for them; on a PR run, a failure cancels the rest of the run.
  cpu-config-tests:
    name: CPU config checks
    needs: [pre-flight, cicd-wait-in-queue]
    permissions:
      contents: read
      actions: write # cancel the run on failure
    timeout-minutes: 45
    if: >-
      ${{
        always() &&
        contains('Lfast L0 L1 L2', needs.pre-flight.outputs.test_level) &&
        needs.pre-flight.result == 'success' &&
        (
          needs.cicd-wait-in-queue.result == 'success' ||
          !startsWith(github.ref, 'refs/heads/pull-request/')
        ) &&
        !cancelled()
      }}
    env:
      # pytest runs as a direct child of `uv run` here (in the GPU containers a bash
      # script launches it), which makes Ray try to ship the uv project to its workers
      # and fail because pyproject.toml is not in the test working directory.
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
      # Recipe configs interpolate ${oc.env:HF_HOME}; the GPU containers get it from
      # test-template, but a GitHub-hosted runner does not set it.
      HF_HOME: /home/runner/.cache/huggingface
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet /opt/az || true
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.pre-flight.outputs.test_sha }}
          submodules: recursive
          persist-credentials: false
      - name: Read uv version from Dockerfile
        id: uv-version
        run: |
          uv_version="$(sed -nE 's/^ARG[[:space:]]+UV_VERSION=([^[:space:]#]+).*$/\1/p' docker/Dockerfile)"
          if [[ ! "$uv_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid UV_VERSION from docker/Dockerfile: $uv_version" >&2
            exit 1
          fi
          echo "version=$uv_version" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: false
      - name: "Set up Python"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"
      - name: Install dependencies
        run: uv sync --locked --group test
      - name: Run CPU config checks
        working-directory: tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run --no-sync pytest \
            unit/test_recipes_and_test_suites.py \
            unit/test_config_validation.py
      - name: Cancel the rest of the run
        if: ${{ failure() && startsWith(github.ref, 'refs/heads/pull-request/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  cicd-unit-tests:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        script: ${{ fromJSON(needs.pre-flight.outputs.unit_test_scripts) }}
    needs: [pre-flight, prepare-megatron-lock, build-container, org-member-pre-flight, cicd-wait-in-queue]
    if: >-
      ${{
        (
          always() &&
          contains('L0 L1 L2 Lfast', needs.pre-flight.outputs.test_level) &&
          needs.pre-flight.outputs.test_platform != 'gb200' &&
          needs.pre-flight.outputs.unit_test_count != '0' &&
          needs.pre-flight.result == 'success' &&
          needs.org-member-pre-flight.result == 'success' &&
          (needs.prepare-megatron-lock.result == 'success' || needs.prepare-megatron-lock.result == 'skipped') &&
          (
            needs.cicd-wait-in-queue.result == 'success' ||
            !startsWith(github.ref, 'refs/heads/pull-request/')
          ) &&
          (needs.build-container.result == 'success' || needs.build-container.result == 'skipped')
        ) && !cancelled()
      }}


    runs-on: ${{ startsWith(needs.org-member-pre-flight.outputs.runner_prefix, 'ephe-v2-') && format('{0}-a{1}', needs.org-member-pre-flight.outputs.runner_prefix, github.run_attempt) || needs.org-member-pre-flight.outputs.runner_prefix }}
    name: ${{ matrix.script }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: main
        uses: ./.github/actions/test-template
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          runner: ${{ startsWith(needs.org-member-pre-flight.outputs.runner_prefix, 'ephe-v2-') && format('{0}-a{1}', needs.org-member-pre-flight.outputs.runner_prefix, github.run_attempt) || needs.org-member-pre-flight.outputs.runner_prefix }}
          script: ${{ matrix.script }}
          registry: ${{ needs.org-member-pre-flight.outputs.registry }}
          test_data_path: ${{ needs.org-member-pre-flight.outputs.test_data_path }}
          image: ${{ vars.CI_CONTAINER_NAME }}
          image-tag: ${{ needs.pre-flight.outputs.image_tag }}
          is_unit_test: "true"
          cpu-only: "false"
          test-commit-sha: ${{ needs.pre-flight.outputs.test_sha }}
          megatron-lm-commit: ${{ needs.pre-flight.outputs.megatron_lm_commit }}
          megatron-lock-artifact: ${{ needs.prepare-megatron-lock.outputs.artifact_name }}

  unit-test-script-check:
    name: Check unit test script coverage
    needs: [pre-flight, cicd-wait-in-queue]
    if: >-
      ${{
        always() &&
        contains('L0 L1 L2 Lfast', needs.pre-flight.outputs.test_level) &&
        needs.pre-flight.result == 'success' &&
        (
          needs.cicd-wait-in-queue.result == 'success' ||
          !startsWith(github.ref, 'refs/heads/pull-request/')
        ) &&
        !cancelled()
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.pre-flight.outputs.test_sha }}

      - name: Verify unit test planner coverage
        run: |
          set -euo pipefail

          expected=$(mktemp)
          planned=$(mktemp)

          find tests/unit -maxdepth 1 -type f -name 'L0_Unit*.sh' \
            -exec basename {} .sh \; | sort -u > "$expected"

          bash .github/scripts/plan-tests.sh "" |
            jq -r '.unit[]' | sort -u > "$planned"

          missing=$(comm -23 "$expected" "$planned")
          if [[ -n "$missing" ]]; then
            echo "The following unit scripts are missing from the generated test plan:"
            printf '%s\n' "$missing"
            exit 1
          fi

          echo "All L0 unit scripts are included in the generated test plan."

  functional-test-script-check:
    name: Check functional test script coverage
    needs: [pre-flight, cicd-wait-in-queue]
    if: >-
      ${{
        always() &&
        contains('L1 L2 Lfast', needs.pre-flight.outputs.test_level) &&
        needs.pre-flight.result == 'success' &&
        (
          needs.cicd-wait-in-queue.result == 'success' ||
          !startsWith(github.ref, 'refs/heads/pull-request/')
        ) &&
        !cancelled()
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.pre-flight.outputs.test_sha }}

      - name: Verify functional test planner coverage
        run: |
          set -euo pipefail

          expected=$(mktemp)
          planned=$(mktemp)

          find tests/functional -maxdepth 1 -type f -name 'L1_Functional*.sh' \
            -exec basename {} .sh \; | sort -u > "$expected"

          bash .github/scripts/plan-tests.sh "" |
            jq -r '.functional[]' | sort -u > "$planned"

          missing=$(comm -23 "$expected" "$planned")
          if [[ -n "$missing" ]]; then
            echo "The following functional scripts are missing from the generated test plan:"
            printf '%s\n' "$missing"
            exit 1
          fi

          echo "All L1 functional scripts are included in the generated test plan."

  cicd-functional-tests:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        script: ${{ fromJSON(needs.pre-flight.outputs.h100_functional_test_scripts) }}
    needs: [pre-flight, prepare-megatron-lock, build-container, cicd-unit-tests, functional-test-script-check, org-member-pre-flight, cicd-wait-in-queue]
    runs-on: ${{ startsWith(needs.org-member-pre-flight.outputs.runner_prefix, 'ephe-v2-') && format('{0}-a{1}', needs.org-member-pre-flight.outputs.runner_prefix, github.run_attempt) || needs.org-member-pre-flight.outputs.runner_prefix }}
    if: >-
      ${{
        always() &&
        contains('L1 L2', needs.pre-flight.outputs.test_level) &&
        needs.pre-flight.outputs.test_platform != 'gb200' &&
        needs.pre-flight.outputs.h100_functional_test_count != '0' &&
        needs.pre-flight.result == 'success' &&
        needs.org-member-pre-flight.result == 'success' &&
        (needs.prepare-megatron-lock.result == 'success' || needs.prepare-megatron-lock.result == 'skipped') &&
        (
          needs.cicd-wait-in-queue.result == 'success' ||
          !startsWith(github.ref, 'refs/heads/pull-request/')
        ) &&
        (needs.build-container.result == 'success' || needs.build-container.result == 'skipped') &&
        (
          needs.cicd-unit-tests.result == 'success' ||
          (
            (needs.pre-flight.outputs.test_platform == 'gb200' || needs.pre-flight.outputs.unit_test_count == '0') &&
            needs.cicd-unit-tests.result == 'skipped'
          )
        ) &&
        needs.functional-test-script-check.result == 'success' &&
        !cancelled()
      }}
    name: ${{ matrix.script }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: main
        uses: ./.github/actions/test-template
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          runner: ${{ startsWith(needs.org-member-pre-flight.outputs.runner_prefix, 'ephe-v2-') && format('{0}-a{1}', needs.org-member-pre-flight.outputs.runner_prefix, github.run_attempt) || needs.org-member-pre-flight.outputs.runner_prefix }}
          registry: ${{ needs.org-member-pre-flight.outputs.registry }}
          image: ${{ vars.CI_CONTAINER_NAME }}
          test_data_path: ${{ needs.org-member-pre-flight.outputs.test_data_path }}
          script: ${{ matrix.script }}
          test-commit-sha: ${{ needs.pre-flight.outputs.test_sha }}
          megatron-lm-commit: ${{ needs.pre-flight.outputs.megatron_lm_commit }}
          megatron-lock-artifact: ${{ needs.prepare-megatron-lock.outputs.artifact_name }}

  cicd-functional-tests-gb200:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        script: ${{ fromJSON(needs.pre-flight.outputs.gb200_functional_test_scripts) }}
    needs: [pre-flight, prepare-megatron-lock, build-container-gb200, cicd-unit-tests, functional-test-script-check, org-member-pre-flight, gb200-config, cicd-wait-in-queue]
    runs-on: ${{ vars.GB200_RUNNER }}
    if: >-
      ${{
        always() &&
        contains('L1 L2', needs.pre-flight.outputs.test_level) &&
        needs.pre-flight.outputs.test_platform != 'h100' &&
        needs.pre-flight.outputs.gb200_functional_test_count != '0' &&
        needs.org-member-pre-flight.outputs.is_member == 'true' &&
        vars.DISABLE_GB200_TESTS != 'true' &&
        needs.pre-flight.result == 'success' &&
        needs.org-member-pre-flight.result == 'success' &&
        (needs.prepare-megatron-lock.result == 'success' || needs.prepare-megatron-lock.result == 'skipped') &&
        (
          needs.cicd-wait-in-queue.result == 'success' ||
          !startsWith(github.ref, 'refs/heads/pull-request/')
        ) &&
        (needs.build-container-gb200.result == 'success' || needs.build-container-gb200.result == 'skipped') &&
        (
          needs.cicd-unit-tests.result == 'success' ||
          (
            (needs.pre-flight.outputs.test_platform == 'gb200' || needs.pre-flight.outputs.unit_test_count == '0') &&
            needs.cicd-unit-tests.result == 'skipped'
          )
        ) &&
        needs.functional-test-script-check.result == 'success' &&
        !cancelled()
      }}
    name: gb200_${{ matrix.script }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: main
        uses: ./.github/actions/test-template
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          runner: ${{ vars.GB200_RUNNER }}
          registry: ${{ needs.gb200-config.outputs.registry }}
          image: ${{ vars.CI_CONTAINER_NAME }}
          test_data_path: ${{ needs.org-member-pre-flight.outputs.test_data_path }}
          image-tag: ${{ needs.pre-flight.outputs.image_tag }}
          script: ${{ matrix.script }}
          test-commit-sha: ${{ needs.pre-flight.outputs.test_sha }}
          megatron-lm-commit: ${{ needs.pre-flight.outputs.megatron_lm_commit }}
          megatron-lock-artifact: ${{ needs.prepare-megatron-lock.outputs.artifact_name }}

  cicd-fast-functional-tests:
    strategy:
      fail-fast: false
      matrix:
        script: ${{ fromJSON(needs.pre-flight.outputs.h100_functional_test_scripts) }}
    needs: [pre-flight, prepare-megatron-lock, functional-test-script-check, org-member-pre-flight, cicd-wait-in-queue]
    if: >-
      ${{
        always() &&
        contains('Lfast', needs.pre-flight.outputs.test_level) &&
        needs.pre-flight.outputs.test_platform != 'gb200' &&
        needs.pre-flight.outputs.h100_functional_test_count != '0' &&
        needs.pre-flight.result == 'success' &&
        needs.org-member-pre-flight.result == 'success' &&
        (needs.prepare-megatron-lock.result == 'success' || needs.prepare-megatron-lock.result == 'skipped') &&
        (
          needs.cicd-wait-in-queue.result == 'success' ||
          !startsWith(github.ref, 'refs/heads/pull-request/')
        ) &&
        needs.functional-test-script-check.result == 'success' &&
        !cancelled()
      }}
    runs-on: ${{ startsWith(needs.org-member-pre-flight.outputs.runner_prefix, 'ephe-v2-') && format('{0}-a{1}', needs.org-member-pre-flight.outputs.runner_prefix, github.run_attempt) || needs.org-member-pre-flight.outputs.runner_prefix }}
    name: fast_${{ matrix.script }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: main
        uses: ./.github/actions/test-template
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          runner: ${{ startsWith(needs.org-member-pre-flight.outputs.runner_prefix, 'ephe-v2-') && format('{0}-a{1}', needs.org-member-pre-flight.outputs.runner_prefix, github.run_attempt) || needs.org-member-pre-flight.outputs.runner_prefix }}
          script: ${{ matrix.script }}
          image-tag: ${{ needs.pre-flight.outputs.image_tag }}
          registry: ${{ needs.org-member-pre-flight.outputs.registry }}
          image: ${{ vars.CI_CONTAINER_NAME }}
          test_data_path: ${{ needs.org-member-pre-flight.outputs.test_data_path }}
          test-commit-sha: ${{ needs.pre-flight.outputs.test_sha }}
          megatron-lm-commit: ${{ needs.pre-flight.outputs.megatron_lm_commit }}
          megatron-lock-artifact: ${{ needs.prepare-megatron-lock.outputs.artifact_name }}

  CI_QA_Gate:
    name: >-
      ${{ (github.event_name == 'merge_group' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pull-request/'))) &&
          needs.pre-flight.outputs.test_script_pattern == '' && 'CI quality check' || 'CI diagnostics' }}
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    needs:
      - pre-flight
      - org-member-pre-flight
      - pr-branch-up-to-date-check
      - lint-check
      - cicd-wait-in-queue
      - prepare-megatron-lock
      - sphinx-build
      - build-container
      - build-container-gb200
      - cpu-config-tests
      - cicd-unit-tests
      - unit-test-script-check
      - functional-test-script-check
      - cicd-functional-tests
      - cicd-functional-tests-gb200
      - cicd-fast-functional-tests
    steps:
      - name: Evaluate CI results
        id: results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          ALL_SUCCESS: >-
            ${{
              needs.pre-flight.result == 'success' &&
              needs.org-member-pre-flight.result == 'success' &&
              needs.lint-check.result == 'success' &&
              (needs.cicd-wait-in-queue.result == 'success' || needs.cicd-wait-in-queue.result == 'skipped') &&
              (needs.prepare-megatron-lock.result == 'success' || needs.prepare-megatron-lock.result == 'skipped') &&
              (needs.pr-branch-up-to-date-check.result == 'success' || needs.pr-branch-up-to-date-check.result == 'skipped') &&
              (
                contains(fromJSON('["docs","Lfast","L0","L1","L2"]'), needs.pre-flight.outputs.test_level) &&
                (
                  needs.sphinx-build.result == 'success' ||
                  (needs.pre-flight.outputs.test_script_pattern != '' && needs.sphinx-build.result == 'skipped')
                ) &&
                (needs.build-container.result == 'success' || needs.build-container.result == 'skipped') &&
                (needs.build-container-gb200.result == 'success' || needs.build-container-gb200.result == 'skipped') &&
                (
                  (
                    (
                      !contains('L0 L1 L2 Lfast', needs.pre-flight.outputs.test_level) ||
                      needs.pre-flight.outputs.test_platform == 'gb200' ||
                      needs.pre-flight.outputs.unit_test_count == '0' ||
                      needs.cicd-unit-tests.result == 'success'
                    ) &&
                    (
                      !contains('L0 L1 L2 Lfast', needs.pre-flight.outputs.test_level) ||
                      needs.unit-test-script-check.result == 'success'
                    ) &&
                    (
                      !contains('L0 L1 L2 Lfast', needs.pre-flight.outputs.test_level) ||
                      needs.cpu-config-tests.result == 'success'
                    ) &&
                    (
                      !contains('L1 L2 Lfast', needs.pre-flight.outputs.test_level) ||
                      needs.functional-test-script-check.result == 'success'
                    ) &&
                    (
                      !contains('L1 L2', needs.pre-flight.outputs.test_level) ||
                      needs.pre-flight.outputs.test_platform == 'gb200' ||
                      needs.pre-flight.outputs.h100_functional_test_count == '0' ||
                      needs.cicd-functional-tests.result == 'success'
                    ) &&
                    (
                      (
                        needs.pre-flight.outputs.test_platform != 'gb200' &&
                        (
                          needs.org-member-pre-flight.outputs.is_member != 'true' ||
                          vars.DISABLE_GB200_TESTS == 'true'
                        )
                      ) ||
                      needs.pre-flight.outputs.test_platform == 'h100' ||
                      !contains('L1 L2', needs.pre-flight.outputs.test_level) ||
                      needs.pre-flight.outputs.gb200_functional_test_count == '0' ||
                      needs.cicd-functional-tests-gb200.result == 'success'
                    ) &&
                    (
                      !contains('Lfast', needs.pre-flight.outputs.test_level) ||
                      needs.pre-flight.outputs.test_platform == 'gb200' ||
                      needs.pre-flight.outputs.h100_functional_test_count == '0' ||
                      needs.cicd-fast-functional-tests.result == 'success'
                    )
                  )
                )
              )
            }}
          TEST_LEVEL: ${{ needs.pre-flight.outputs.test_level }}
        run: |
          {
            printf 'CI results for %s\n\n' "$TEST_LEVEL"
            jq -r 'to_entries[] | "- " + .key + ": " + .value.result' <<< "$JOB_RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "passed=$ALL_SUCCESS" | tee -a "$GITHUB_OUTPUT"

      - name: Verify maintainer skip on this PR head
        id: verify-skip
        if: >-
          ${{ steps.results.outputs.passed == 'false' && needs.pre-flight.result == 'success' &&
              github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pull-request/') &&
              contains(fromJSON('["docs","Lfast","L0","L1","L2"]'), needs.pre-flight.outputs.test_level) &&
              needs.pre-flight.outputs.test_script_pattern == '' && needs.pre-flight.outputs.head_sha == github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.pre-flight.outputs.pr_number }}
        run: |
          set -euo pipefail
          pull="repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          pr=$(gh api "$pull")
          if ! jq -e --arg sha "$GITHUB_SHA" '
            .state == "open" and .head.sha == $sha and any(.labels[]; .name == "Skip CICD")
          ' <<< "$pr" > /dev/null; then
            exit 0
          fi

          reviewers=$(gh api --paginate "$pull/reviews?per_page=100" | jq -r --arg sha "$GITHUB_SHA" '
            .[] | select(.commit_id == $sha and (.state == "APPROVED" or .state == "COMMENTED"))
            | select((.body // "" | gsub("^\\s+|\\s+$"; "")) == "Skip CICD") | .user.login // empty | @uri
          ')
          while IFS= read -r reviewer; do
            [[ -n "$reviewer" ]] || continue
            if ! role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$reviewer/permission" --jq '.role_name'); then
              continue
            fi
            if [[ "$role" == maintain || "$role" == admin ]]; then
              printf 'Accepted Skip CICD review by %s on %s.\n' "$reviewer" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              echo 'verified=true' | tee -a "$GITHUB_OUTPUT"
              break
            fi
          done <<< "$reviewers"

      - name: Require CI or a verified skip
        env:
          CI_PASSED: ${{ steps.results.outputs.passed }}
          SKIP_VERIFIED: ${{ steps.verify-skip.outputs.verified }}
        run: |
          if [[ "$CI_PASSED" != true && "$SKIP_VERIFIED" != true ]]; then
            echo "::error::CI did not pass. A maintainer override requires the Skip CICD label and a PR review saying exactly 'Skip CICD' on this commit."
            exit 1
          fi

  notify-nightly-failure:
    name: Notify nightly test failure
    runs-on: ubuntu-latest
    needs:
      - pre-flight
      - ephemeral-runner-routing
      - org-member-pre-flight
      - gb200-config
      - pr-branch-up-to-date-check
      - lint-check
      - cicd-wait-in-queue
      - prepare-megatron-lock
      - sphinx-build
      - build-container
      - build-container-gb200
      - cpu-config-tests
      - cicd-unit-tests
      - unit-test-script-check
      - functional-test-script-check
      - cicd-functional-tests
      - cicd-functional-tests-gb200
      - cicd-fast-functional-tests
      - CI_QA_Gate
      - Coverage
      - DCO_merge_group
    environment:
      name: main
      deployment: false
    permissions: {}
    # Include setup/build failures even when downstream jobs are skipped.
    if: >-
      ${{ always() && !cancelled() && failure() &&
          github.repository == 'NVIDIA-NeMo/RL' &&
          github.event_name == 'schedule' &&
          github.ref_name == github.event.repository.default_branch }}
    steps:
      - name: Send Slack notification
        uses: NVIDIA-NeMo/FW-CI-templates/.github/actions/notify-ci-failure@1ebb754bdbe6680cce2b3d81da4e63be7200380a
        with:
          needs-json: ${{ toJSON(needs) }}
          webhook: ${{ secrets.SLACK_GITHUB_CI_WEBHOOK }}

  Coverage:
    runs-on: ubuntu-latest
    needs:
      - pre-flight
      - CI_QA_Gate
      - cicd-unit-tests
      - cicd-functional-tests
    if: always() && needs.pre-flight.result == 'success'
    strategy:
      matrix:
        flag: [unit-test, e2e]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download coverage reports of current branch
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-${{ matrix.flag }}-*
          path: coverage-downloads

      - name: Check if artifacts were downloaded
        id: check-artifacts
        run: |
          # Check if any .coverage files were downloaded
          if find coverage-downloads -name ".coverage" -type f 2>/dev/null | grep -q .; then
            echo "artifacts-found=true" >> $GITHUB_OUTPUT
            echo "Found coverage artifacts for ${{ matrix.flag }}"
          else
            echo "artifacts-found=false" >> $GITHUB_OUTPUT
            echo "No coverage artifacts found for ${{ matrix.flag }}"
          fi

      - name: Get total coverage of current branch
        shell: bash -x -e -u -o pipefail {0}
        if: ${{ steps.check-artifacts.outputs.artifacts-found == 'true' }}
        run: |
          pip install coverage

          find coverage-downloads -name ".coverage" -type f
          coverage combine --keep $(find coverage-downloads -name ".coverage" -type f)
          coverage report -i --show-missing
          rm -rf coverage-downloads

      - name: Skip coverage processing
        if: ${{ steps.check-artifacts.outputs.artifacts-found == 'false' }}
        run: |
          echo "No coverage artifacts found for ${{ matrix.flag }}, skipping coverage processing"

      - name: Upload coverage reports to Codecov
        if: ${{ steps.check-artifacts.outputs.artifacts-found == 'true' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: ${{ matrix.flag }}
          # Copied PR branches run on push, so upload-coverage needs explicit PR metadata.
          override_pr: ${{ needs.pre-flight.outputs.pr_number }}
          commit_parent: ${{ needs.pre-flight.outputs.pr_number && needs.pre-flight.outputs.base_sha || '' }}

      - name: Upload artifacts
        if: ${{ steps.check-artifacts.outputs.artifacts-found == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.flag }}-aggregated
          path: |
            .coverage
          include-hidden-files: true

  DCO_merge_group:
    name: DCO
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - run: echo "The real DCO check happens on PRs only. This is a placeholder for the merge queue to keep the DCO check as a required status check."
