name: "CICD Auto Re-run"

# Re-runs the failed jobs of a failed first CICD attempt once, so transient infra and
# flaky-test failures do not need a manual re-run. A second failure stays red.
on:
  workflow_run:
    workflows: ["CICD NeMo RL"]
    types: [completed]

concurrency:
  group: cicd-auto-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions: {}

jobs:
  rerun-failed-jobs:
    if: >-
      ${{
        github.repository == 'NVIDIA-NeMo/RL' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.event != 'workflow_dispatch'
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
      MAX_RETRYABLE_JOBS: 10
    steps:
      - name: Re-run failed jobs
        shell: bash -e -u -o pipefail {0}
        run: |
          mapfile -t failed_jobs < <(
            gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure") | .name'
          )

          retryable_jobs=()
          deterministic_jobs=()
          for job in "${failed_jobs[@]}"; do
            case "$job" in
              # The gate only aggregates the other jobs' results.
              "CI quality check"*) ;;
              # Fail the same way on a re-run. Keep in sync with notify-nightly-failure in cicd-main.yml.
              "pre-flight" | "Lint check" | "Check if PR branch is up to date" | "CPU config checks" | \
                "Check unit test script coverage" | "Check functional test script coverage")
                deterministic_jobs+=("$job") ;;
              *) retryable_jobs+=("$job") ;;
            esac
          done

          {
            echo "### Auto re-run for [CICD run $RUN_ID]($RUN_URL)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if ((${#deterministic_jobs[@]} > 0)); then
            echo "Skipped: deterministic check failed: ${deterministic_jobs[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ((${#retryable_jobs[@]} == 0)); then
            echo "Skipped: no retryable job failed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Many failures at once are usually a real regression, so save the GPU time. Nightly runs
          # are exempt because their failure alert waits for the re-run.
          if [[ "$RUN_EVENT" != "schedule" ]] && ((${#retryable_jobs[@]} > MAX_RETRYABLE_JOBS)); then
            echo "Skipped: ${#retryable_jobs[@]} jobs failed (more than $MAX_RETRYABLE_JOBS)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # cicd-main.yml cancels in-progress runs of the same branch and event, so re-running a
          # superseded run would cancel the newer one.
          latest_run_id=$(gh api "repos/$GH_REPO/actions/workflows/$WORKFLOW_ID/runs?branch=$HEAD_BRANCH&event=$RUN_EVENT&per_page=1" \
            --jq '.workflow_runs[0].id')
          if [[ "$latest_run_id" != "$RUN_ID" ]]; then
            echo "Skipped: superseded by run $latest_run_id." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh run rerun "$RUN_ID" --failed

          {
            echo "Re-ran the failed jobs. Possible flakes:"
            echo
            printf -- '- %s\n' "${retryable_jobs[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
