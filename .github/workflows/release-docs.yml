name: Release docs
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Whether to run the workflow in dry-run mode
        required: true
        type: boolean
        default: true
      publish-as-latest:
        description: Publish as Latest stable version.
        required: false
        type: boolean
        default: true
      docs-version-override:
        description: Docs version override. If not provided, defaults to the version of the commit's tag.
        required: false
        type: string
        default: ""
      notify-emails:
        description: Email addresses to send the notification to. Format as "me@me.com,you@you.com".
        required: false
        type: string
        default: ""
      update-version-picker:
        description: Update version picker.
        required: false
        type: boolean
        default: true
      github-ref:
        description: Source ref to build. Publishing requires a commit on main or a protected rX.Y.Z branch.
        required: false
        type: string
        default: ""
  workflow_call:
    secrets:
      AWS_ASSUME_ROLE_ARN:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AKAMAI_HOST:
        required: false
      AKAMAI_CLIENT_TOKEN:
        required: false
      AKAMAI_CLIENT_SECRET:
        required: false
      AKAMAI_ACCESS_TOKEN:
        required: false
      S3_BUCKET_NAME:
        required: false
    inputs:
      dry-run:
        description: Whether to run the workflow in dry-run mode
        required: false
        type: boolean
        default: true
      publish-as-latest:
        description: Publish as Latest stable version.
        required: false
        type: boolean
        default: true
      docs-version-override:
        description: Docs version if commit is not tagged
        required: false
        type: string
        default: ""
      notify-emails:
        description: Email addresses to send the notification to. Format as "me@me.com,you@you.com".
        required: false
        type: string
        default: ""
      update-version-picker:
        description: Update version picker.
        required: false
        type: boolean
        default: true
      github-ref:
        description: Source ref to build. Publishing requires a commit on main or a protected rX.Y.Z branch.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Resolve the documentation source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_REF: ${{ inputs.github-ref || github.sha }}
          DOCS_VERSION: ${{ inputs.docs-version-override }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          ref=$DOCS_REF
          if [[ "$ref" =~ ^(refs/tags/)?(v([0-9]+\.[0-9]+\.[0-9]+))$ ]]; then
            ref="refs/tags/${BASH_REMATCH[2]}"
            DOCS_VERSION=${DOCS_VERSION:-${BASH_REMATCH[3]}}
          fi
          if [[ -n "$DOCS_VERSION" && ! "$DOCS_VERSION" =~ ^[[:alnum:]][[:alnum:]_.-]*$ ]]; then
            echo "::error::The documentation version must be one directory name."
            exit 1
          fi
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$ref
          else
            ref_path=$(jq -nr --arg ref "$ref" '$ref | @uri')
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref_path" --jq '.sha')
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The documentation source must resolve to a full commit SHA."
            exit 1
          fi
          if [[ "$DRY_RUN" != true ]]; then
            if [[ "$GITHUB_REPOSITORY" != NVIDIA-NeMo/RL || "$GITHUB_REF" != refs/heads/main ||
                  ( "$GITHUB_EVENT_NAME" != workflow_dispatch && "$GITHUB_EVENT_NAME" != schedule ) ]]; then
              echo "::error::Publish documentation from a main branch dispatch or nightly schedule."
              exit 1
            fi
            api="repos/$GITHUB_REPOSITORY"
            heads=$(gh api --paginate "$api/branches?protected=true&per_page=100" \
              --jq '.[] | select(.name == "main" or (.name | test("^r[0-9]+[.][0-9]+[.][0-9]+$"))) | .commit.sha')
            matched=false
            for head in $heads; do
              if [[ "$sha" == "$head" ]]; then
                matched=true
                break
              fi
              status=$(gh api "$api/compare/$sha...$head?per_page=1" --jq '.status')
              if [[ "$status" == identical || "$status" == ahead ]]; then
                matched=true
                break
              fi
            done
            if [[ "$matched" != true ]]; then
              echo "::error::The documentation source must belong to main or a protected rX.Y.Z release branch."
              exit 1
            fi
          fi
          printf 'sha=%s\nversion=%s\n' "$sha" "$DOCS_VERSION" | tee -a "$GITHUB_OUTPUT"

  build-docs:
    needs: source
    permissions:
      contents: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_build_docs.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      ref: ${{ needs.source.outputs.sha }}

  publish-docs:
    if: ${{ !inputs.dry-run }}
    needs: [source, build-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: rl-release
      deployment: false
    steps:
      - uses: NVIDIA-NeMo/FW-CI-templates/.github/actions/publish-docs@1ebb754bdbe6680cce2b3d81da4e63be7200380a
        with:
          dry-run: false
          artifacts-name: docs-html
          artifacts-path: _build/html
          emails-csv: ${{ inputs.notify-emails && format('{0},{1}', vars.docs_release_emails, inputs.notify-emails) || vars.docs_release_emails }}
          overwrite-latest-on-tag: ${{ inputs.publish-as-latest }}
          docs-version-override: ${{ needs.source.outputs.version }}
          update-version-picker: ${{ inputs.update-version-picker }}
          run-on-version-tag-only: false
          request-name: rl-publish-docs-${{ github.run_id }}
          aws-region: ${{ vars.DOCS_AWS_REGION }}
          aws-role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          akamai-host: ${{ secrets.AKAMAI_HOST }}
          akamai-client-token: ${{ secrets.AKAMAI_CLIENT_TOKEN }}
          akamai-client-secret: ${{ secrets.AKAMAI_CLIENT_SECRET }}
          akamai-access-token: ${{ secrets.AKAMAI_ACCESS_TOKEN }}
          s3-target-root: ${{ secrets.S3_BUCKET_NAME }}
          s3-target-path: nemo/rl
