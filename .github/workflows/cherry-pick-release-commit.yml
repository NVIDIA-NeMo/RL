name: Create PR to main with cherry-pick from release

on:
  push:
    branches:
      - "r*"

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    environment:
      name: main
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Cherry pick
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          SLACK_WEBHOOK_ADMIN: "<!subteam^${{ secrets.SLACK_WEBHOOK_ADMIN }}>"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_RL_ALERTS: ${{ secrets.SLACK_WEBHOOK_RL_ALERTS }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          CHERRY_PICK_LABEL: cherry-pick-to-main
        run: |
          set -x
          set +e

          git config --global user.email "nemo-bot@nvidia.com"
          git config --global user.name "NeMo Bot"

          SHA=$(git rev-list --no-merges -n 1 HEAD)
          MESSAGE=$(git log -n 1 --pretty=format:%s $SHA)
          PR_ID=$(echo $MESSAGE | awk -F'#' '{print $2}' | awk -F')' '{print $1}')
          AUTHOR_EMAIL=$(git log -n 1 --pretty=format:%ae $SHA)
          USERNAME=$(echo "$AUTHOR_EMAIL" | awk -F'@' '{print $1}')

          PR=$(curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$REPOSITORY/pulls/$PR_ID)
          PR_TITLE=$(echo -E $PR | jq '.title' | tr -d '"')

          LABELS=$(echo -E $PR | jq '.labels | [.[].name] | join(",")' | tr -d '"')
          AUTHOR=$(echo -E $PR | jq '.user.login' | tr -d '"')

          # Opt-in: only cherry-pick PRs explicitly labeled for it. This
          # mirrors the old per-release-branch label, but since the target
          # is always `main` now there is only one label to check for.
          HAS_CHERRY_PICK_LABEL=$(echo ",$LABELS," | grep -qF ",$CHERRY_PICK_LABEL," && echo true || echo false)

          if [[ "$HAS_CHERRY_PICK_LABEL" != "true" ]]; then
            echo "PR #$PR_ID does not have the '$CHERRY_PICK_LABEL' label, nothing to cherry-pick"
            exit 0
          fi

          # Carry over the CI:* label the original PR ran with, so the
          # cherry-pick PR's CI runs automatically at the same scope instead
          # of requiring someone to relabel + manually rerun.
          CI_LABEL=$(echo "$LABELS" | tr ',' '\n' | grep -E '^CI:' | head -n1)

          (
            git fetch origin main:main
            git switch --force-create cherry-pick-$PR_ID-main main
            git cherry-pick -s $SHA
            git push -u origin --force cherry-pick-$PR_ID-main
            git checkout $RELEASE_BRANCH
          )

          CHERRYPICK_SUCCESSFUL=$?

          if [[ $CHERRYPICK_SUCCESSFUL -eq 0 ]]; then
            PR_URL="https://github.com/$REPOSITORY/pull/$PR_ID"

            MESSAGE="Hi @$AUTHOR 👋,

            we've cherry picked #$PR_ID from \`$RELEASE_BRANCH\` into \`main\` for you! 🚀

            Please review and approve this cherry pick by your convenience!"

            PAYLOAD=$(jq \
              -n \
              -c \
              --arg TITLE "cp: \`$PR_TITLE (#$PR_ID)\` from \`$RELEASE_BRANCH\` into \`main\`" \
              --arg HEAD "cherry-pick-$PR_ID-main" \
              --arg BODY "beep boop [🤖]: $MESSAGE" \
              '{
                "title": $TITLE,
                "head": $HEAD,
                "base": "main",
                "body": $BODY
              }'
            )

            NEW_PR=$(curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/$REPOSITORY/pulls \
              -d "$PAYLOAD")

            NEW_PR_ID=$(echo -E $NEW_PR | jq '.number')
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/$REPOSITORY/pulls/$NEW_PR_ID/requested_reviewers \
              -d "{\"reviewers\":[\"$AUTHOR\"]}"

            LABELS_JSON=$(jq -cn --arg ci "$CI_LABEL" '["cherry-pick"] + (if $ci != "" then [$ci] else [] end)')
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/$REPOSITORY/issues/$NEW_PR_ID/labels \
              -d "{\"labels\":$LABELS_JSON}"

            if [ -f ".github/copy-pr-bot.yaml" ]; then
              LATEST_SHA=$(git rev-parse origin/cherry-pick-$PR_ID-main)
              curl -L \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/$REPOSITORY/issues/$NEW_PR_ID/comments \
                -d "{\"body\":\"/ok to test $LATEST_SHA\"}"
            fi

          else
            URL="https://github.com/$REPOSITORY/pull/$PR_ID"

            SLACK_TEXT="beep boop 🤖: Hey <@$USERNAME> ($AUTHOR_EMAIL): Cherry-pick of <$URL|#$PR_ID> from \`$RELEASE_BRANCH\` into \`main\` failed (3-way merge impossible).\n\nPlease resolve manually and create a PR.\n\ncc: $SLACK_WEBHOOK_ADMIN @nemo_rl_oncall"

            SLACK_MESSAGE=$(jq -cn \
              --arg message "$SLACK_TEXT" \
              '{
                "blocks": [
                  {
                    "type": "section",
                    "text": { "type": "mrkdwn", "text": $message }
                  }
                ]
              }')

            curl -X POST -H "Content-type: application/json" --data "$SLACK_MESSAGE" "$SLACK_WEBHOOK"

            if [[ -n "$SLACK_WEBHOOK_RL_ALERTS" ]]; then
              curl -X POST -H "Content-type: application/json" --data "$SLACK_MESSAGE" "$SLACK_WEBHOOK_RL_ALERTS"
            fi
          fi

          exit $CHERRYPICK_SUCCESSFUL

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
