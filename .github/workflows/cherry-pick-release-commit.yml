name: Create PR to main with cherry-pick from release

on:
  push:
    branches:
      - "r*"

jobs:
  cherry-pick:
    # TODO(kajalj): repin to a released tag once NVIDIA-NeMo/FW-CI-templates#584 merges.
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cherry_pick.yml@26c1d79267d94e7fef5e9697431aaef51dd80127
    with:
      target-branch: main
      trigger-label: cherry-pick-to-main
      notify-mention: "<!subteam^S0C1W14AHS7>"
      default-cicd-label: ""
      app-id: ${{ vars.BOT_ID }}
    secrets:
      BOT_KEY: ${{ secrets.BOT_KEY }}
      SLACK_WEBHOOK_ADMIN: ${{ secrets.SLACK_WEBHOOK_ADMIN }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SLACK_WEBHOOK_SECONDARY: ${{ secrets.SLACK_WEBHOOK_RL_ALERTS }}
