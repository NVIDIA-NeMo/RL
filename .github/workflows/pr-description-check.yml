# Warning only for now: this check is not a required status check and blocks no other CI.
name: Check PR description

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  pr-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description against the template
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          REPO: ${{ github.repository }}
        run: |
          # svc* service accounts are GitHub type "User", so list them by name.
          if [[ "$PR_AUTHOR_TYPE" == "Bot" || "$PR_AUTHOR" == *"[bot]" || "$PR_AUTHOR" =~ ^(svcnvidia-nemo-ci|svcnemo-autobot)$ ]]; then
            echo "Bot-authored PR ($PR_AUTHOR), skipped."
            exit 0
          fi

          # Read the live description, so re-running an old job sees the current text.
          # Drop HTML comments and fenced code, so neither can tick the box or add a heading.
          body=$(gh pr view "$PR_NUMBER" -R "$REPO" --json body --jq '.body // ""' \
            | perl -0pe 's/<!--.*?-->//gs; s/^\s*(```|~~~).*?^\s*\1[^\n]*$//gms')

          # Keep the box text and headings in sync with PULL_REQUEST_TEMPLATE.md and skills/pr-description.
          box='I, the PR author, have personally reviewed every line of this PR'
          problems=()
          if grep -qiE "^\s*[-*]\s+\[x\]\s+$box\.?\s*$" <<<"$body"; then
            :
          elif grep -qE "^\s*[-*]\s+\[ \]\s+$box\.?\s*$" <<<"$body"; then
            problems+=("Review box not ticked: \"$box.\"")
          else
            problems+=("Review box missing: add \"- [ ] $box.\" at the top.")
          fi
          for heading in "What and why" "Convergence / perf / functionality proof" "Needs upstream changes"; do
            grep -qiE "^#{1,6}\s+$heading\s*$" <<<"$body" || problems+=("Missing heading: \"## $heading\"")
          done
          what_and_why=$(perl -0ne 'print $1 if /^#{1,6}\s+What and why\s*\n(.*?)(?=^#{1,6}\s|\z)/msi' <<<"$body")
          if grep -qiE "^#{1,6}\s+What and why\s*$" <<<"$body" && [[ -z "${what_and_why//[[:space:]]/}" ]]; then
            problems+=('Empty section: "## What and why"')
          fi

          if (( ${#problems[@]} == 0 )); then
            echo "PR description follows the template."
            exit 0
          fi
          {
            echo "PR description does not follow the template:"
            printf '  - %s\n' "${problems[@]}"
            echo "Template: https://github.com/NVIDIA-NeMo/RL/blob/main/.github/PULL_REQUEST_TEMPLATE.md"
            echo "Agents: see skills/pr-description. Only a human may tick the review box."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          printf '::error title=PR description::%s\n' "${problems[@]}"
          exit 1
