# Warning only for now: this check is not a required status check and blocks no other CI.
name: Check PR description

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the check script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: .github/scripts

      # Reads the live description, so re-running an old job sees the current text.
      - name: Check PR description against the template
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          gh pr view "$PR_NUMBER" -R "$REPO" --json body --jq '.body // ""' \
            | python3 .github/scripts/check_pr_description.py
