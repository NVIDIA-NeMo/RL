defaults: ../../examples/configs/recipes/llm/grpo-qwen2.5-1.5b-1n2g-automodel-single-controller-full-batch.yaml
grpo:
  seed: 42
  max_num_steps: 6
  num_prompts_per_step: 8
  num_generations_per_prompt: 4
  val_at_start: false
  val_at_end: false
loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  force_on_policy_ratio: false
policy:
  model_name: /lustre/fs1/portfolios/coreai/projects/coreai_dlalgo_nemorl/users/shuangy/models/Qwen/Qwen2.5-1.5B
  tokenizer:
    name: ${policy.model_name}
  logprob_batch_size: 1
  generation:
    vllm_cfg:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.6
    colocated:
      resources:
        gpus_per_node: 2
data:
  train:
    dataset_name: DAPOMath17K
  default:
    prompt_file: null
async_rl:
  min_groups_for_streaming_train: 2
  max_inflight_prompts: 8
  max_buffered_rollouts: 8
checkpointing:
  enabled: true
  checkpoint_dir: validation/pr3/results/streaming-smoke/checkpoints
  save_period: 2
  keep_top_k: 1
  save_optimizer: true
  save_data_plane: true
  checkpoint_must_save_by: null
logger:
  log_dir: validation/pr3/results/streaming-smoke/logs
  wandb_enabled: false
  tensorboard_enabled: true
env:
  math:
    num_workers: 4
    math_verify_impl: dapo_math_verify
cluster:
  num_nodes: 1
  gpus_per_node: 4
