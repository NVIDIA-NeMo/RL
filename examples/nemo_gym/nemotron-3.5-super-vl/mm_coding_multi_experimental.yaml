# Explicit opt-in: Codex/Hermes require the companion experimental Gym adapter extensions.
defaults: mm_coding_multi.yaml
env:
  nemo_gym:
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/mm_coding_training/configs/mm_coding_multi_experimental.yaml
    - nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml
checkpointing:
  checkpoint_dir: results/grpo-super35-mm-coding-multi-experimental
logger:
  log_dir: logs/grpo-super35-mm-coding-multi-experimental
