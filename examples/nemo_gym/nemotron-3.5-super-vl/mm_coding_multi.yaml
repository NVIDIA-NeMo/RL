# Multi coding harness routes share the single recipe's Super VL learner and reward.
defaults: mm_coding_single.yaml

checkpointing:
  checkpoint_dir: results/grpo-super35-mm-coding-multi

# A multi-turn history can retain the reference and several preview images.
policy:
  generation:
    vllm_kwargs:
      limit_mm_per_prompt:
        image: 32

env:
  nemo_gym:
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/mm_coding_training/configs/mm_coding_multi.yaml
    - nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml
    mm_coding_opencode_agent:
      responses_api_agents:
        opencode_agent:
          model: ${policy.model_name}
          context_window: ${add:${policy.max_total_sequence_length},${mul:-1,${policy.generation.max_new_tokens}}}
          max_output_tokens: ${policy.generation.max_new_tokens}

logger:
  log_dir: logs/grpo-super35-mm-coding-multi
  wandb:
    name: super35-mm-coding-multi-acceptance
