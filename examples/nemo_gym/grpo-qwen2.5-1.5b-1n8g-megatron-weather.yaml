# GRPO with Qwen2.5-1.5B, Megatron training, and Environment Server orchestration.
# Prepare the taskset data as described in docs/design-docs/nemo-gym-integration.md.
# The parent supplies Megatron TP=2, its optimizer, and the one-node/eight-GPU setup.
defaults: grpo_workplace_assistant_nemotron_nano_v2_9b.yaml

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 8

policy:
  model_name: Qwen/Qwen2.5-1.5B-Instruct
  max_total_sequence_length: 2048
  generation:
    vllm_cfg:
      http_server_serving_chat_kwargs:
        tool_parser: hermes

data:
  train:
    data_path: 3rdparty/Gym-workspace/Gym/data/example_tool_call_multireward_single_agent_turn/example.jsonl
    # Repeat the five shipped tool-call prompts to fill training batches.
    repeat: 60
  validation:
    data_path: ${data.train.data_path}

env:
  nemo_gym:
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/example_tool_call_multireward/configs/example_tool_call_multireward.yaml
    workplace_assistant_environment_server: null
    environment_server_routes:
      example_tool_call_multireward: example_tool_call_multireward_environment_server
    example_tool_call_multireward_environment_server:
      environment_servers:
        # Gym merges this with its loaded YAML; replace the inherited wrapper.
        _delete_key: legacy_agent
        single_agent_turn:
          entrypoint: app.py
          cleanup_timeout_seconds: 180
          resources_server:
            type: resources_servers
            name: example_tool_call_multireward
          agent_server:
            type: responses_api_agents
            name: example_tool_call_multireward_simple_agent
          resources_tool_transports: [direct_http]

checkpointing:
  checkpoint_dir: results/grpo-qwen2.5-1.5b-megatron-weather
logger:
  log_dir: logs/grpo-qwen2.5-1.5b-megatron-weather
  wandb:
    project: nemo-rl
    name: grpo-qwen2.5-1.5b-megatron-weather
