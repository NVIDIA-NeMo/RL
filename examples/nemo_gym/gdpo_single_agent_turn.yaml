# Reuse the Qwen2.5-1.5B GDPO recipe, with episodes coordinated by an Environment Server.
# Prepare the taskset data as described in docs/design-docs/nemo-gym-integration.md.
defaults: ../configs/recipes/llm/gdpo-qwen2.5-1.5b-1n8g-gym-multireward.yaml

data:
  train:
    data_path: 3rdparty/Gym-workspace/Gym/data/example_tool_call_multireward_single_agent_turn/example.jsonl
    # Match the existing recipe's launcher: repeat the five shipped tool-call prompts.
    repeat: 60
  validation:
    data_path: ${data.train.data_path}

env:
  nemo_gym:
    environment_server_routes:
      example_tool_call_multireward: example_tool_call_multireward_environment_server
    example_tool_call_multireward_environment_server:
      environment_servers:
        # Gym merges this with its loaded YAML; replace the inherited wrapper.
        _delete_key: legacy_agent
        single_agent_turn:
          entrypoint: app.py
          cleanup_timeout_seconds: 180
          resources_server:
            type: resources_servers
            name: example_tool_call_multireward
          agent_server:
            type: responses_api_agents
            name: example_tool_call_multireward_simple_agent
          resources_tool_transports: [direct_http]

checkpointing:
  checkpoint_dir: results/gdpo-single-agent-turn
logger:
  log_dir: logs/gdpo-single-agent-turn
  wandb:
    name: gdpo-single-agent-turn
