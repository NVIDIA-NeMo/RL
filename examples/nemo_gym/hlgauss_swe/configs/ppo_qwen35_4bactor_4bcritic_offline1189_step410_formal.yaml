# Fresh PPO on the same 1189 pass-2..6/8 tasks used for offline critic pretraining.
# Keep the established Qwen3.5-4B actor/PPO recipe and load only critic weights.
defaults: ppo_qwen3.5_4b_swe_single_turn_from_recalibrated_critic_step156_formal.yaml

ppo:
  initial_value_weights_path: /lustre/fsw/portfolios/coreai/users/bihu/rl-results/qwen35-4b-critic-offline-1189/eval_milestones/step_410/value/weights

data:
  train:
    data_path: /lustre/fsw/portfolios/coreai/users/bihu/rl-results/qwen35-4b-jiaqiz3145-openhands-gpp8-rollouts/profile/ppo_pass_2_to_6_of_8.jsonl
  validation:
    data_path: ${data.train.data_path}

# Use the exact SIF search paths from the rollout collection that produced
# this 1189-task bank; the older PPO recipe searched different directories.
env:
  nemo_gym:
    swe_agents_train:
      responses_api_agents:
        swe_agents:
          container_formatter:
            - /lustre/fsw/portfolios/llmservice/users/sdevare/images/swerebench/{instance_id}.sif
            - /lustre/fsw/portfolios/llmservice/users/igitman/images/swe-bench/namanjain12_{instance_id}.sif
            - /lustre/fsw/portfolios/llmservice/users/jiaqiz/swe/singularity_images/swe-gym/xingyaoww_sweb.eval.x86_64.{instance_id}.sif

# Match the reward-zeroing rules used to train both offline critics.
# No PPO advantage overrides are enabled.
reward_penalties:
  penalize_duplicated_reasoning: true
  penalize_empty_final_answer: true
  penalize_unwanted_tokens: true
  penalize_malformed_think_tag: true
  token_ids:
    unwanted: [248044]
    think_open: 248068
    think_close: 248069

checkpointing:
  checkpoint_dir: /lustre/fsw/portfolios/coreai/users/bihu/rl-results/ppo-qwen35-4bactor-4bcritic-offline1189-step410/checkpoints

logger:
  log_dir: /lustre/fsw/portfolios/coreai/users/bihu/rl-results/ppo-qwen35-4bactor-4bcritic-offline1189-step410/logs
  wandb:
    project: binhu-swe-rl-multiturn
    name: ppo-qwen35-4bactor-4bcritic-offline1189-step410
