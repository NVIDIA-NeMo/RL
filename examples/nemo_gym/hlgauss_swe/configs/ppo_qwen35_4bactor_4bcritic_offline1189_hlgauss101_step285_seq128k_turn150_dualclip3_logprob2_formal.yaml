# Fresh origin Qwen3.5-4B actor + held-out-selected HL-Gauss c285 critic.
# Keep the established 128K/150-turn topology and dual-clip/logprob stability switches.
defaults: ppo_qwen35_4bactor_4bcritic_offline1189_step225_seq128k_turn150_formal.yaml

ppo:
