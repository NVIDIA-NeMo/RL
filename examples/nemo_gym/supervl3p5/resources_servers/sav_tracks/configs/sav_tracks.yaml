sav_tracks:
  resources_servers:
    sav_tracks:
      entrypoint: app.py
      absence_score: 1.0
      iou_threshold: 0.5
      domain: other
      verified: false
      description: SA-V tracks-schema verifier for point / box / text-referred tracking
      value: Verify flat {"tracks":[...]} predictions inside <answer> tags — box tracking by IoU, point and text-referred tracking by segmentation-mask membership (binary point-in-mask), with absence credit for correct invisibility claims
sav_pt_tracks_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: sav_tracks
      model_server:
        type: responses_api_models
        name: policy_model
