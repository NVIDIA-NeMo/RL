# =============================================================================
# Nemotron 3 NANO v3 (30B-A3B) — SWE teacher smoke test — GB200
# =============================================================================
# Inherits, in order:
#   1. swe_teacher.yaml           — the Ultra stage
#   2. _nano_smoke_gb200.yaml.inc — Nano+GB200 mesh & smoke sizing (shared)
#
# SWE has NO GPU-served Gym judges (env.nemo_gym.num_gpu_nodes = 0). Rewards come
# from apptainer sandboxes, so there is no judge parallelism to shrink here. The
# launcher must still set SIF_DIR (sif_dir=${SIF_DIR}) — the SWE agents resolve
# `${sif_dir}/<subdir>/{instance_id}.sif`.
#
# Everything smoke-relevant (mesh, batch, context, MTP off) comes from
# _nano_smoke_gb200.yaml.inc, so this file only wires the inheritance.
# =============================================================================

defaults:
  - swe_teacher.yaml
  - _nano_smoke_gb200.yaml.inc

env:
  nemo_gym:
    # Reuse the container's baked gym venvs (swe_teacher.yaml sets this false,
    # which forces a concurrent nemo-gym rebuild -> uv cache lock timeout).
    skip_venv_if_present: true

policy:
  # For smoke, don't keep SWE's full 192k context unless you specifically want
  # to test long-context memory pressure. Keep generation max_model_len in sync
  # (the .inc pins it to 16384, which would reject longer SWE prompts).
  max_total_sequence_length: 49152
  generation:
    vllm_cfg:
      max_model_len: 49152
