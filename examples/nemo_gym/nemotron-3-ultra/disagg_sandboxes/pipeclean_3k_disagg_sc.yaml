# =============================================================================
# Nemotron 3 Ultra — 3K-GPU pipeclean, SingleController + DISAGGREGATED sandboxes
# =============================================================================
# pipeclean_3k_sc.yaml (streaming forward/backward, TransferQueue data plane,
# checkpointing off) with tool execution on an external sandbox service. The
# disagg fragment is merged AFTER the SC overlay so both sets of deltas apply;
# they touch disjoint keys, and disagg_overrides.yaml has no parent of its own
# to drag the non-SC defaults back in.
#
# Launch with disagg_sandboxes/launch_3k_disagg_sc.sh. See disagg_overrides.yaml
# for requirements, prewarming and sizing notes.
# =============================================================================
defaults:
  - ../pipeclean_3k_sc.yaml
  - disagg_overrides.yaml
