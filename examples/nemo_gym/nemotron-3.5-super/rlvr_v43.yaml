# Nemotron 3.5 Super text RLVR v43: the super-v3.5-posttraining checkpoint-journey recipe (run before step 120;
# router replay off), at its production shape: 32 training + 112 generation nodes, 512 prompts x 16, v1 async GRPO.
# GenRM, NL2Bash and safety judges are external vLLM pools; their base_url placeholders must be replaced, for example
# by tools/external_gym_vllm/run_in_allocation.sh. Replace the /path/to/ entries with the checkpoint, the training
# data and the Gym data files.
checkpointing:
  checkpoint_dir: results/super35-journey-rlvr-v43/checkpoints
  checkpoint_must_save_by: 00:11:30:00
  enabled: true
  ft_keep_latest_k: 3
  ft_save_period: 1
  higher_is_better: true
  keep_top_k: 1000000
  load_replay_buffer: false
  metric_name: val:total_reward/mean
  save_optimizer: true
  save_period: 5
  save_replay_buffer: true
cluster:
  gpus_per_node: 4
  num_nodes: 144
  segment_size: 16
data:
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  max_input_seq_length: null
  num_workers: 1
  shuffle: false
  train:
    data_path: /path/to/train.jsonl
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  use_multiple_dataloader: false
  validation:
    data_path: ${data.train.data_path}
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
data_plane: null
