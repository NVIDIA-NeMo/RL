    ether0_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    finance_sec_search_resources_server:
      resources_servers:
        finance_sec_search:
          cache_dir: /path/to/finance/sec-cache/finance_sec_search
          judge_call_timeout: 60
          judge_model_server:
            name: nl2bash_judge_model
            type: responses_api_models
          max_connections_per_host: 1
          max_rollout_time_seconds: 1800
          requests_per_second: 1
          retrieval_max_output_tokens: 8192
          retrieval_model_context_length: 81920
          retrieval_responses_create_params:
            input: []
            temperature: 1
            top_p: 1
          reward_mode: scaled
          sec_dump_path: /path/to/finance/sec-cache/data
          use_cache: true
    freeform_formatting_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    genrm_compare_resources_server:
      resources_servers:
        genrm_compare:
          aggregator_method: simple_tiebreaker
          answer_bonus: 0.5
          comparison_strategy: circular
          default_principle: 'You will be given one or more evaluation criteria (rubrics).

            Evaluate both responses on EACH criterion individually first, then synthesize
            an overall judgment.

            Criteria:


            1. Please act as an impartial judge and evaluate the quality of the responses
            provided by two AI assistants to the user prompt. Begin your evaluation
            by generating your own answer to the prompt. You must provide your answer
            before judging any answers. When evaluating the assistants'' answers,
            compare both assistants'' answers with your answer. You must identify
            and correct any mistakes or inaccurate information. Then consider if the
            assistant''s answers are helpful, relevant, and concise. Helpful means
            the answer correctly responds to the prompt or follows the instructions.
            Note when user prompt has any ambiguity or more than one interpretation,
            it is more helpful and appropriate to ask for clarifications or more information
            from the user than providing an answer based on assumptions. Relevant
            means all parts of the response closely connect or are appropriate to
            what is being asked. Concise means the response is clear and not verbose
            or excessive. Then consider the creativity and novelty of the assistant''s
            answers when needed. Finally, identify any missing important information
            in the assistants'' answers that would be beneficial to include when responding
            to the user prompt.'
          default_ranking: 3.5
          default_score: 3
          genrm_model_server:
            name: genrm_model
            type: responses_api_models
          genrm_parse_retries: 1
          genrm_responses_create_params:
            max_output_tokens: 24576
            temperature: 1
            top_p: 0.95
          group_answer_length_penalty_coeff: 0.12
          group_reasoning_length_penalty_coeff: 0.12
          group_style_penalty_coeff: 0
          num_judges_per_comparison: 1
          num_rollouts_per_prompt: 16
          reasoning_bonus: 0.5
          top_percentile: 0.2
          use_principle: true
          cohort_collection_timeout_s: 7200
          cohort_evaluation_timeout_s: 3600
          judge_request_timeout_s: 3600
    genrm_model:
      responses_api_models:
        genrm_model:
          api_key: dummy_key
          base_url: __GENRM_BASE_URL__
          entrypoint: app.py
          model: model
          return_token_id_information: false
          server_env:
            NCCL_MNNVL_ENABLE: '0'
          uses_reasoning_parser: true
          vllm_serve_env_vars:
            VLLM_RAY_DP_PACK_STRATEGY: strict
          vllm_serve_kwargs:
            attention_backend: FLASH_ATTN
            compilation_config:
              cudagraph_capture_sizes:
