# Nemotron 3.5 Super — mopd
# Standalone recipe. See docs/guides/models/nemotron/nemotron-3.5-super.md.
# Supply checkpoint/data paths through the documented environment variables.
checkpointing:
  checkpoint_dir: ${oc.env:RESULTS_DIR,results/super35-mopd}/checkpoints
  checkpoint_must_save_by: null
  enabled: true
  ft_keep_latest_k: 3
  ft_save_period: 1
  higher_is_better: true
  keep_top_k: 5
  load_replay_buffer: false
  metric_name: null
  save_optimizer: true
  save_period: 5
cluster:
  gpus_per_node: 4
  master_port_range_high: 1999
  master_port_range_low: 1400
  num_nodes: 112
  segment_size: null
on_policy_distillation:
  deduplicate_shared_teacher_checkpoints: true
  default_teacher_alias: general
  enabled: true
  log_sample_responses: false
  log_sample_stats: false
  log_token_stats: false
  log_topk_stats: false
  non_colocated_teachers:
    default_teacher_cfg:
      context_parallel_size: 1
      expert_tensor_parallel_size: 1
      empty_unused_memory_level: 1
      expert_model_parallel_size: 8
      gpus_per_node: 4
      micro_batch_size: 1
      moe_shared_expert_overlap: false
      num_nodes: 4
      pipeline_model_parallel_size: 1
      precision: bf16
      tensor_model_parallel_size: 8
    enabled: true
    teacher_overrides:
      RLHF:
        num_nodes: 4
        radio_force_cpe_eval_mode: true
      Reasoning:
        num_nodes: 8
        radio_force_cpe_eval_mode: true
      Vision:
        num_nodes: 4
        radio_force_cpe_eval_mode: true
      general:
        num_nodes: 2
        radio_force_cpe_eval_mode: true
  sample_response_max_tokens: null
  sample_stats_log_period: 1
  strict_agent_name_match: false
  teacher_model_by_agent_name:
    RLHF: ${oc.env:RLHF_TEACHER_PATH}
    Reasoning: ${oc.env:REASONING_TEACHER_PATH}
    Vision: ${oc.env:VISION_TEACHER_PATH}
    general: ${policy.model_name}
    abstention_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    calendar_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    citation_format_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    citation_if_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    code_gen_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    competitive_coding_challenges_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    conversational_tool_use_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    droid_pivot_single_step_tool_use_with_argument_comparison_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    equivalence_llm_judge_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Reasoning}
    finance_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    freeform_formatting_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    genrm_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.RLHF}
    genrm_simple_agent_reasoning_off: ${on_policy_distillation.teacher_model_by_agent_name.RLHF}
    image_tools_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Vision}
    instruction_following_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    inverse_if_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    jailbreak_engagement_with_disclaimer: ${on_policy_distillation.teacher_model_by_agent_name.general}
    jailbreak_hard_refusal_no_redirection: ${on_policy_distillation.teacher_model_by_agent_name.general}
    jailbreak_hard_refusal_with_helplines: ${on_policy_distillation.teacher_model_by_agent_name.general}
    jailbreak_refusal_with_explanation: ${on_policy_distillation.teacher_model_by_agent_name.general}
    lc_equivalence_rule_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    lc_judge_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    math_formal_lean_refinement_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    math_with_judge_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Reasoning}
    multichallenge_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    ns_tools_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    nvarc_inductive_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    nvarc_transductive_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    reasoning_gym_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    scicode_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    search_pivot_single_step_tool_use_with_argument_comparison_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Reasoning}
    single_step_tool_use_with_argument_comparison_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    structured_outputs_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    structured_outputs_v3_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    structured_outputs_v4_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    swe_pivot_single_step_tool_use_with_argument_comparison_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    terminal_multi_harness_opencode_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    terminus_judge_string_only_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    toolcall_schema_single_step_tool_use_with_argument_comparison_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    workplace_assistant_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
  token_stats_log_period: 1
  topk_stats_k: 32
  topk_stats_log_period: 1
  topk_stats_max_tokens: null
  topk_stats_mode: student_online_teacher_deferred
data:
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  max_input_seq_length: 131072
  num_workers: 1
  shuffle: false
  train:
    data_path: ${oc.env:TRAIN_PATH}
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  use_multiple_dataloader: false
  validation:
    data_path: ${oc.env:VAL_PATH,${data.train.data_path}}
data_plane: null
env:
  nemo_gym:
    abstention:
      resources_servers:
        abstention:
          judge_model_server:
            name: policy_model
            type: responses_api_models
    abstention_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    calendar_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    citation_format_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    code_gen:
      resources_servers:
        code_gen:
          debug: false
          num_processes: 1024
          unit_test_timeout_secs: 10
    code_gen_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    competitive_coding_challenges_resources_server:
      resources_servers:
        competitive_coding_challenges:
          test_file: ${oc.env:DATA_ROOT}/ccc/metadata.jsonl
          shared_dir: ${checkpointing.checkpoint_dir}/../ccc_shared_tmp
    competitive_coding_challenges_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/string_match/configs/string_match.yaml
    - resources_servers/sav_tracks/configs/sav_tracks.yaml
    - resources_servers/mcqa/configs/mcqa.yaml
    - resources_servers/jailbreak_detection/configs/jailbreak_detection_nemotron_combined_reward_tp8.yaml
    - resources_servers/math_formal_lean/configs/math_formal_lean_multi_turn.yaml
    - resources_servers/ns_tools/configs/ns_tools.yaml
    - resources_servers/nvarc/configs/inductive.yaml
    - resources_servers/nvarc/configs/transductive.yaml
    - resources_servers/genrm_compare/configs/genrm_compare.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/search_pivot_single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/swe_pivot_single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/toolcall_schema_single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/terminus_judge/configs/terminus_judge_string_only.yaml
    - resources_servers/code_gen/configs/code_gen.yaml
    - resources_servers/instruction_following/configs/instruction_following.yaml
    - resources_servers/equivalence_llm_judge/configs/lc_judge.yaml
    - resources_servers/equivalence_llm_judge/configs/equivalence_llm_judge.yaml
    - resources_servers/equivalence_rule/configs/lc.yaml
    - resources_servers/math_with_judge/configs/math_with_judge.yaml
    - resources_servers/mcqa/configs/mcqa.yaml
    - resources_servers/abstention/configs/abstention.yaml
    - resources_servers/multichallenge/configs/multichallenge.yaml
    - resources_servers/jailbreak_detection/configs/jailbreak_detection_nemotron_combined_reward_tp8.yaml
    - resources_servers/format_verification/configs/freeform_formatting.yaml
    - resources_servers/format_verification/configs/citation_format.yaml
    - resources_servers/structured_outputs/configs/structured_outputs_v3.yaml
    - resources_servers/calendar/configs/calendar.yaml
    - responses_api_agents/simple_agent/configs/simple_agent.yaml
    - responses_api_agents/image_tools_agent/configs/image_tools_agent.yaml
    - resources_servers/terminal_multi_harness/configs/terminal_multi_harness_opencode.yaml
    - resources_servers/conversational_tool_use_simulation/configs/conversational_tool_use_simulation.yaml
    - resources_servers/scicode/configs/scicode.yaml
    - resources_servers/finance_sec_search/configs/finance_sec_search.yaml
    - resources_servers/reasoning_gym/configs/reasoning_gym.yaml
    - resources_servers/inverse_if/configs/inverse_if.yaml
    - resources_servers/citation_if/configs/citation_if.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/droid_pivot_single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/structured_outputs/configs/structured_outputs_v4.yaml
    - resources_servers/structured_outputs/configs/structured_outputs_json_yaml_xml_v1.yaml
    - resources_servers/competitive_coding_challenges/configs/competitive_coding_challenges.yaml
    - resources_servers/workplace_assistant/configs/workplace_assistant.yaml
    equivalence_llm_judge_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    finance_sec_search_resources_server:
      resources_servers:
        finance_sec_search:
          cache_dir: ${checkpointing.checkpoint_dir}/../finance_cache
          judge_model_server: null
          max_connections_per_host: 1
          max_rollout_time_seconds: 1800
          requests_per_second: 1
          retrieval_max_output_tokens: 8192
          retrieval_model_context_length: 131072
          retrieval_responses_create_params:
            input: []
            temperature: 1
            top_p: 1
          reward_mode: scaled
          sec_dump_path: ${oc.env:DATA_ROOT}/finance/sec
          use_cache: true
    freeform_formatting_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    genrm_compare_resources_server:
      resources_servers:
        genrm_compare:
          aggregator_method: simple_tiebreaker
          answer_bonus: 0.5
          comparison_strategy: circular
          default_principle: Please act as an impartial judge and evaluate the quality of the responses
            provided by two AI assistants to the user prompt. Begin your evaluation by generating your
            own answer to the prompt. You must provide your answer before judging any answers. When evaluating
            the assistants' answers, compare both assistants' answers with your answer. You must identify
            and correct any mistakes or inaccurate information. Then consider if the assistant's answers
            are helpful, relevant, and concise. Helpful means the answer correctly responds to the prompt
            or follows the instructions. Note when user prompt has any ambiguity or more than one interpretation,
            it is more helpful and appropriate to ask for clarifications or more information from the
            user than providing an answer based on assumptions. Relevant means all parts of the response
            closely connect or are appropriate to what is being asked. Concise means the response is clear
            and not verbose or excessive. Then consider the creativity and novelty of the assistant's
            answers when needed. Finally, identify any missing important information in the assistants'
            answers that would be beneficial to include when responding to the user prompt.
          default_ranking: 3.5
          default_score: 3
          genrm_model_server:
            name: policy_model
            type: responses_api_models
          genrm_responses_create_params:
            max_output_tokens: 16384
            temperature: 0.6
            top_p: 0.95
          group_answer_length_penalty_coeff: 0.35
          group_reasoning_length_penalty_coeff: 0.3
          group_style_penalty_coeff: 0.05
          num_judges_per_comparison: 1
          num_rollouts_per_prompt: 1
          reasoning_bonus: 0.5
          top_percentile: 0.2
          use_principle: true
    genrm_model: null
    genrm_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    genrm_simple_agent_reasoning_off:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    global_aiohttp_client_total_timeout_seconds: 5400
    instruction_following_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    invalid_tool_call_patterns:
    - <tool_call>
    - </tool_call>
    - <function_call>
    - </function_call>
    inverse_if:
      resources_servers:
        inverse_if:
          judge_model_server:
            name: policy_model
            type: responses_api_models
    inverse_if_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    jailbreak_detection:
      resources_servers:
        jailbreak_detection:
          judge_model_server:
            name: policy_model
            type: responses_api_models
    lc_equivalence_rule_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    lc_judge_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    math_with_judge:
      resources_servers:
        math_with_judge:
          judge_model_server:
            name: policy_model
          should_use_judge: false
    math_with_judge_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    mcqa_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    model_endpoint_readiness_timeout_seconds: 0
    multichallenge_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    nemo_gym_log_dir: ${logger.log_dir}/nemo_gym
    num_gpu_nodes: 0
    nvarc_inductive_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    nvarc_transductive_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    pad_dynamic_image_shapes: true
    policy_max_input_tokens: 131072
    policy_model:
      responses_api_models:
        vllm_model:
          extra_body:
            bad_words:
            - <image>
            - <img>
            - </img>
            - <so_embedding>
            - <so_start>
            - <so_end>
            chat_template_kwargs:
              enable_thinking: true
          max_input_tokens: 131072
          num_workers: 16
          sampling_overrides:
            max_output_tokens: 49152
            temperature: 1
            top_p: 1
          uses_reasoning_parser: true
    policy_model_reasoning_off:
      _copy: policy_model
      responses_api_models:
        vllm_model:
          chat_template_kwargs:
            enable_thinking: false
            truncate_history_thinking: false
          num_workers: 4
          sequential_reasoning_allowed: false
    port_range_high: 5999
    port_range_low: 5000
    reasoning_gym_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    scicode:
      resources_servers:
        scicode:
          test_data_fpath: ${oc.env:DATA_ROOT}/scicode/test_data.h5
          timeout_secs: 60
    search_judge_model: null
    simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
          resources_server:
            name: competitive_coding_challenges_resources_server
            type: resources_servers
    skip_venv_if_present: true
    uv_venv_dir: ${oc.env:NEMO_GYM_VENV_DIR,/opt/gym_venvs}
    skip_verification: true
    skip_verification_reward: 0
    string_match_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    structured_outputs_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    structured_outputs_v3_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    terminus_judge_string_only_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    thinking_tags:
    - <think>
    - </think>
    tokenizer_config:
      chat_template: ${policy.model_name}/chat_template.jinja
      chat_template_kwargs:
        enable_thinking: true
        truncate_history_thinking: false
      name: ${policy.model_name}
    uv_pip_set_python: true
    global_aiohttp_client_request_debug: false
  should_log_nemo_gym_responses: true
  should_mask_flagged_samples: true
  should_use_nemo_gym: true
grpo:
  adv_estimator:
    minus_baseline: true
    name: opd
    normalize_rewards: true
    proximal_teacher_alpha: 1
    reward_weights: null
    subtract_global_baseline: false
    use_leave_one_out_baseline: true
  advantage_clip_high: 50
  advantage_clip_low: -50
  async_grpo:
    enabled: true
    in_flight_weight_updates: false
    max_generation_failures: 20
    max_trajectory_age_steps: 1
    recompute_kv_cache_after_weight_updates: false
  batch_multiplier: 1
  calculate_advantages_on_gpu: false
  debug_payload_metrics: false
  deduplicate_multimodal_data: true
  dynamic_sampling_max_gen_batches: 10
  invalid_tool_call_advantage: null
  malformed_thinking_advantage: null
  max_num_epochs: 5
  max_num_steps: 200
  max_rollout_turns: 1
  max_val_samples: null
  normalize_rewards: true
  num_generations_per_prompt: 1
  num_prompts_per_step: 512
  overlong_filtering: true
  reward_scaling:
    enabled: false
    source_max: 1
    source_min: 0
    target_max: 1
    target_min: 0
  reward_shaping:
    enabled: false
    max_response_length: null
    overlong_buffer_length: null
    overlong_buffer_penalty: null
    stop_properly_penalty_coef: null
  seed: 42
  seq_logprob_error_threshold: 2
  skip_reference_policy_logprobs_calculation: false
  stop_at_validation_metric: null
  stop_at_validation_threshold: null
  use_dynamic_sampling: false
  use_leave_one_out_baseline: true
  val_at_end: false
  val_at_start: false
  val_batch_size: 256
  val_num_generations_per_prompt: 4
  val_period: 0
  val_start_at: -1
  zero_variance_prompt_filtering: false
logger:
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10
  log_dir: ${oc.env:RESULTS_DIR,results/super35-mopd}/logs
  mlflow:
    experiment_name: nemotron-3.5-super
    run_name: mopd
  mlflow_enabled: false
  monitor_gpus: true
  num_val_samples_to_print: 0
  swanlab_enabled: false
  tensorboard_enabled: true
  tensorboard: {}
  wandb:
    project: nemotron-3.5-super
    name: ${oc.env:EXP_NAME,super35-mopd}
    log_nemo_gym_full_result_tables: false
  wandb_enabled: false
loss_fn:
  disable_ppo_ratio: true
  force_on_policy_ratio: false
  kl_input_clamp_value: null
  kl_output_clamp_value: null
  positive_example_nll_weight: 0
  ratio_clip_c: null
  ratio_clip_max: 0.28
  ratio_clip_min: 0.2
  reference_policy_kl_penalty: 0
  reference_policy_kl_type: k3
  sequence_level_importance_ratios: false
  token_level_loss: true
  truncated_importance_sampling_ratio: 5
