  truncated_importance_sampling_type: icepop
  use_cispo: false
  use_importance_sampling_correction: true
  use_kl_in_reward: false
  use_on_policy_kl_approximation: true
policy:
  draft:
    aux_layer_indices: null
    enabled: false
    loss_weight: 0.1
    model_name: null
    num_layers: null
  dtensor_cfg:
    _v2: true
    activation_checkpointing: false
    context_parallel_size: 1
    cpu_offload: false
    custom_parallel_plan: null
    enabled: false
    sequence_parallel: false
    tensor_parallel_size: 1
  dynamic_batching:
    enabled: false
    logprob_mb_tokens: 131072
    sequence_length_round: 64
    train_mb_tokens: 131072
  generation:
    backend: vllm
    bad_words:
    - <image>
    - <img>
    - </img>
    - <so_embedding>
    - <so_start>
    - <so_end>
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 30
    max_new_tokens: 49152
    port_range_high: 4999
    port_range_low: 3000
    stop_strings: null
    stop_token_ids: null
    temperature: 1
    top_k: null
    top_p: 1
    val_temperature: 1
    val_top_k: null
    val_top_p: 1
    vllm_cfg:
      async_engine: true
      enable_prefix_caching: false
      enable_vllm_metrics_logger: false
