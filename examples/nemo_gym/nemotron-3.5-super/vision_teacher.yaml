# Nemotron 3.5 Super — vision teacher
# Standalone recipe. See docs/guides/models/nemotron/nemotron-3.5-super.md.
# Supply checkpoint/data paths through the documented environment variables.
checkpointing:
  load_replay_buffer: false
  checkpoint_dir: ${oc.env:RESULTS_DIR,results/super35-vision_teacher}/checkpoints
  checkpoint_must_save_by: null
  enabled: true
  higher_is_better: true
  keep_top_k: 5
  metric_name: null
  save_optimizer: true
  save_period: 10
cluster:
  gpus_per_node: 4
  master_port_range_high: 1999
  master_port_range_low: 1400
  num_nodes: 16
  segment_size: null
data:
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  max_input_seq_length: 32768
  num_workers: 1
  shuffle: false
  train:
    data_path: ${oc.env:TRAIN_PATH}
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  use_multiple_dataloader: false
  validation:
    data_path: ${oc.env:VAL_PATH,${data.train.data_path}}
data_plane: null
env:
  nemo_gym:
    code_gen:
      resources_servers:
        code_gen:
          debug: false
          num_processes: 1024
          unit_test_timeout_secs: 10
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/math_with_judge/configs/math_with_judge.yaml
    - resources_servers/mcqa/configs/mcqa.yaml
    - resources_servers/gui_coordinate/configs/gui_coordinate.yaml
    - resources_servers/string_match/configs/string_match.yaml
    - responses_api_agents/image_tools_agent/configs/image_tools_agent.yaml
    math_with_judge:
      resources_servers:
        math_with_judge:
          judge_model_server:
            name: policy_model
          should_use_judge: false
    nemo_gym_log_dir: ${logger.log_dir}/nemo_gym
    pad_dynamic_image_shapes: true
    policy_max_input_tokens: 32768
    policy_model:
      responses_api_models:
        vllm_model:
          extra_body:
            bad_words:
            - <image>
            - <img>
            - </img>
            - <so_embedding>
            - <so_start>
            - <so_end>
            chat_template_kwargs:
              enable_thinking: true
          uses_reasoning_parser: true
    port_range_high: 5999
    port_range_low: 5000
    rollout_num_samples_in_parallel: 8
    skip_venv_if_present: true
    tokenizer_config:
      chat_template: ${policy.model_name}/chat_template.jinja
      name: ${policy.model_name}
    uv_venv_dir: ${oc.env:NEMO_GYM_VENV_DIR,/opt/gym_venvs}
    num_gpu_nodes: 0
    image_tools_simple_agent:
      responses_api_agents:
        image_tools_agent:
          entrypoint: app.py
          model_server:
            type: responses_api_models
            name: policy_model
          resource_servers_by_agent:
            string_match_simple_agent:
              type: resources_servers
              name: string_match
            math_with_judge_simple_agent:
              type: resources_servers
              name: math_with_judge
            mcqa_simple_agent:
              type: resources_servers
              name: mcqa
            gui_coordinate_simple_agent:
              type: resources_servers
              name: gui_coordinate
          max_steps: 8
          max_output_tokens: 4096
          stop_strings:
          - </tool_call>
          include_stop_str_in_output: true
          crop_dir: image_tool_outputs
          crop_format: jpeg
          crop_jpeg_quality: 95
          crop_min_pixels: 262144
          crop_max_pixels: 1048576
          max_tool_calls: 6
          max_tool_calls_per_turn: 1
          tool_success_reward: 0.02
          tool_success_reward_cap: 0.2
          invalid_tool_call_penalty: -0.05
          duplicate_tool_call_penalty: -0.02
          force_final_after_duplicate: true
          terminate_on_invalid_tool_call: true
          duplicate_iou_threshold: 0.5
    global_aiohttp_client_request_debug: false
  should_log_nemo_gym_responses: true
  should_mask_flagged_samples: true
  should_use_nemo_gym: true
grpo:
  adv_estimator:
    minus_baseline: true
    name: grpo
    normalize_rewards: true
    proximal_teacher_alpha: 1
    reward_weights: null
    subtract_global_baseline: false
    use_leave_one_out_baseline: true
  advantage_clip_high: 50
  advantage_clip_low: -50
  async_grpo:
    enabled: true
    in_flight_weight_updates: true
    max_generation_failures: 0
    max_trajectory_age_steps: 1
    recompute_kv_cache_after_weight_updates: false
  batch_multiplier: 1
  calculate_advantages_on_gpu: false
  debug_payload_metrics: false
  deduplicate_multimodal_data: false
  dynamic_sampling_max_gen_batches: 10
  invalid_tool_call_advantage: null
  malformed_thinking_advantage: null
  max_num_epochs: 11
  max_num_steps: 200
  max_rollout_turns: 1
  max_val_samples: null
  normalize_rewards: true
  num_generations_per_prompt: 8
  num_prompts_per_step: 16
  overlong_filtering: true
  reward_scaling:
    enabled: false
    source_max: 1
    source_min: 0
    target_max: 1
    target_min: 0
  reward_shaping:
    enabled: false
    max_response_length: null
    overlong_buffer_length: null
    overlong_buffer_penalty: null
    stop_properly_penalty_coef: null
  seed: 42
  seq_logprob_error_threshold: 2
  skip_reference_policy_logprobs_calculation: true
  stop_at_validation_metric: null
  stop_at_validation_threshold: null
  use_dynamic_sampling: false
  use_leave_one_out_baseline: true
  val_at_end: false
  val_at_start: false
  val_batch_size: null
  val_num_generations_per_prompt: 4
  val_period: 0
  val_start_at: -1
  zero_variance_prompt_filtering: false
logger:
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10
  log_dir: ${oc.env:RESULTS_DIR,results/super35-vision_teacher}/logs
  mlflow:
    experiment_name: nemotron-3.5-super
    run_name: vision_teacher
  mlflow_enabled: false
  monitor_gpus: true
  num_val_samples_to_print: 0
  swanlab_enabled: false
  tensorboard: {}
  tensorboard_enabled: true
  wandb:
    project: nemotron-3.5-super
    name: ${oc.env:EXP_NAME,super35-vision_teacher}
    log_nemo_gym_full_result_tables: false
  wandb_enabled: false
loss_fn:
  disable_ppo_ratio: false
  force_on_policy_ratio: false
  kl_input_clamp_value: null
  kl_output_clamp_value: null
  positive_example_nll_weight: 0
  ratio_clip_c: null
  ratio_clip_max: 0.28
  ratio_clip_min: 0.2
  reference_policy_kl_penalty: 0
  reference_policy_kl_type: k3
  sequence_level_importance_ratios: false
  token_level_loss: false
  truncated_importance_sampling_ratio: 2
  truncated_importance_sampling_ratio_min: 0.5
  truncated_importance_sampling_type: tis
  use_cispo: false
  use_importance_sampling_correction: true
  use_kl_in_reward: false
  use_on_policy_kl_approximation: true
on_policy_distillation: null
policy:
  draft:
    aux_layer_indices: null
    enabled: false
    loss_weight: 0.1
    model_name: null
    num_layers: null
  dtensor_cfg:
    _v2: true
    activation_checkpointing: false
    context_parallel_size: 1
    cpu_offload: false
    custom_parallel_plan: null
    enabled: false
    sequence_parallel: false
    tensor_parallel_size: 1
  dynamic_batching:
    enabled: false
    logprob_mb_tokens: 32768
    sequence_length_round: 64
    train_mb_tokens: 32768
  generation:
    backend: vllm
    bad_words:
    - <image>
    - <img>
    - </img>
    - <so_embedding>
    - <so_start>
    - <so_end>
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 8
    max_new_tokens: 32768
    model_name: ${policy.model_name}
    port_range_high: 4999
    port_range_low: 3000
    stop_strings: null
    stop_token_ids: null
    temperature: 1
    top_k: null
    top_p: 1
    val_temperature: 1
    val_top_k: null
    val_top_p: 1
    vllm_cfg:
      async_engine: true
      enable_prefix_caching: false
      enforce_eager: false
      env_vars:
        NCCL_ALGO: Ring
        NCCL_PROTO: Simple
        NRL_REFIT_BUFFER_MEMORY_RATIO: '0.006'
        NRL_REFIT_NUM_BUFFERS: '1'
      expert_parallel_size: 1
      expose_http_server: true
      gpu_memory_utilization: 0.8
      http_server_serving_chat_kwargs:
        chat_template: ${policy.model_name}/chat_template.jinja
        chat_template_content_format: openai
        enable_auto_tools: true
        reasoning_parser: deepseek_r1
        tool_parser: qwen3_coder
      kv_cache_dtype: auto
      load_format: dummy
      logprobs_mode: raw_logprobs
      max_model_len: 32768
      num_first_layers_in_bf16: 0
      num_last_layers_in_bf16: 0
      pipeline_parallel_size: 1
      precision: bfloat16
      reasoning_parser_plugin: nemo_rl/models/generation/vllm/reasoning_parsers/nano_v3_reasoning_parser.py
      skip_tokenizer_init: false
      tensor_parallel_size: 4
      use_deep_gemm: false
    vllm_kwargs:
      attention_backend: FLASH_ATTN
      attention_config:
        use_trtllm_attention: false
      compilation_config:
        backend: eager
        cudagraph_mode: PIECEWISE
      disable_custom_all_reduce: true
      hf_overrides: {}
      limit_mm_per_prompt:
        image: 10
      mamba_ssm_cache_dtype: float32
      max_num_batched_tokens: 32768
      max_num_seqs: 256
      mm_processor_cache_gb: 0
      moe_backend: flashinfer_cutlass
      skip_mm_profiling: true
  generation_batch_size: 64
  is_vlm: true
  logprob_batch_size: 1
  logprob_chunk_size: 2048
  make_sequence_length_divisible_by: 32
  max_grad_norm: 1
  max_total_sequence_length: 32768
  megatron_cfg:
    activation_checkpointing: true
    apply_rope_fusion: true
    bias_activation_fusion: false
    checkpoint:
      async_save: true
    context_parallel_size: 2
    defer_fp32_logits: true
    distributed_data_parallel_config:
      average_in_collective: false
      data_parallel_sharding_strategy: optim_grads_params
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: false
      use_custom_fsdp: false
    empty_unused_memory_level: 2
    enabled: true
    env_vars:
      NCCL_ALGO: Ring
      NCCL_PROTO: Simple
      NRL_REFIT_BUFFER_MEMORY_RATIO: '0.006'
      NRL_REFIT_NUM_BUFFERS: '1'
    expert_model_parallel_size: 16
    expert_tensor_parallel_size: 1
    freeze_moe_router: true
    freeze_sound_encoder: true
    freeze_sound_projection: true
    freeze_vision_model: false
    freeze_vision_projection: false
    gradient_accumulation_fusion: false
    moe_aux_loss_coeff: 0
    moe_enable_deepep: false
    moe_per_layer_logging: false
    moe_permute_fusion: true
    moe_router_bias_update_rate: 0.001
    moe_router_dtype: fp32
    moe_router_enable_expert_bias: true
    moe_router_load_balancing_type: none
    moe_shared_expert_overlap: false
    moe_token_dispatcher_type: alltoall
    mtp_detach_heads: true
    mtp_loss_scaling_factor: 0.3
    mtp_num_layers: 5
    mtp_use_repeated_layer: true
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    optimizer:
      adam_beta1: 0.9
      adam_beta2: 0.99
      adam_eps: 1.0e-08
      bf16: true
      clip_grad: 1
      fp16: false
      lr: 3.0e-06
      min_lr: 2.0e-09
      optimizer: adam
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0
      overlap_cpu_optimizer_d2h_h2d: false
      params_dtype: float32
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      weight_decay: 0
    pipeline_dtype: bfloat16
    pipeline_model_parallel_size: 1
    radio_force_cpe_eval_mode: true
    scheduler:
      end_weight_decay: 0
      lr_decay_iters: null
      lr_decay_style: constant
      lr_warmup_init: 3.0e-08
      lr_warmup_iters: 10
      override_opt_param_scheduler: true
      start_weight_decay: 0
      weight_decay_incr_style: constant
    sequence_parallel: true
    tensor_model_parallel_size: 8
    track_moe_metrics: true
    train_iters: 200
    use_fused_weighted_squared_relu: false
  model_name: ${oc.env:RLVR_CHECKPOINT}
  offload_optimizer_for_logprob: false
  optimizer: null
  precision: bfloat16
  scheduler: null
  sequence_packing:
    algorithm: modified_first_fit_decreasing
    enabled: true
    logprob_mb_tokens: 32768
    microbatch_order: largest_first
    sequence_length_round: 64
    train_mb_tokens: 32768
  tokenizer:
    chat_template: ${policy.model_name}/chat_template.jinja
    name: ${policy.model_name}
  train_global_batch_size: 128
  train_micro_batch_size: 1
reward_penalties:
  penalize_duplicated_reasoning: false
  penalize_empty_final_answer: false
  penalize_malformed_think_tag: false
  penalize_unwanted_tokens: false
  token_ids: null
