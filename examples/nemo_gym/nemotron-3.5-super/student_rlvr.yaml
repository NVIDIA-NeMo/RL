# Nemotron 3.5 Super — student rlvr
# Standalone recipe. See docs/guides/models/nemotron/nemotron-3.5-super.md.
# Supply checkpoint/data paths through the documented environment variables.
checkpointing:
  checkpoint_dir: ${oc.env:RESULTS_DIR,results/super35-student_rlvr}/checkpoints
  checkpoint_must_save_by: null
  enabled: true
  ft_keep_latest_k: 3
  ft_save_period: 1
  higher_is_better: true
  keep_top_k: 5
  load_replay_buffer: false
  metric_name: null
  model_save_format: safetensors
  save_consolidated: false
  save_optimizer: true
  save_period: 5
  save_replay_buffer: true
cluster:
  gpus_per_node: 4
  num_nodes: 144
  segment_size: 16
data:
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  max_input_seq_length: null
  num_workers: 1
  shuffle: false
  train:
    data_path: ${oc.env:TRAIN_PATH}
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  use_multiple_dataloader: false
  validation:
    data_path: ${oc.env:VAL_PATH,${data.train.data_path}}
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
data_plane: null
env:
  genrm_agent_names:
  - genrm_simple_agent
  - genrm_simple_agent_reasoning_off
  nemo_gym:
    abstention:
      resources_servers:
        abstention:
          abstention_reward: 0.5
          judge_model_server:
            name: nl2bash_judge_model
            type: responses_api_models
          judge_responses_create_params:
            max_output_tokens: 8192
    abstention_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    calendar_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    citation_format_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    citation_if_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    code_gen:
      resources_servers:
        code_gen:
          debug: false
          num_processes: 2048
          unit_test_timeout_secs: 10
    code_gen_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    competitive_coding_challenges_resources_server:
      resources_servers:
        competitive_coding_challenges:
          test_batch_size: 4
          test_file: ${oc.env:DATA_ROOT}/ccc/metadata.jsonl
          shared_dir: ${checkpointing.checkpoint_dir}/../ccc_shared_tmp
    config_paths:
    - /opt/nemo-rl/examples/nemo_gym/nemotron-3.5-super/gym/genrm_auth.yaml
    - /opt/nemo-rl/examples/nemo_gym/nemotron-3.5-super/gym/aux_judge_auth.yaml
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/math_with_judge/configs/math_with_judge.yaml
    - resources_servers/code_gen/configs/code_gen.yaml
    - resources_servers/scicode/configs/scicode.yaml
    - resources_servers/competitive_coding_challenges/configs/competitive_coding_challenges.yaml
    - resources_servers/finance_sec_search/configs/finance_sec_search.yaml
    - resources_servers/workplace_assistant/configs/workplace_assistant.yaml
    - resources_servers/mcqa/configs/mcqa.yaml
    - resources_servers/instruction_following/configs/instruction_following.yaml
    - resources_servers/structured_outputs/configs/structured_outputs_json.yaml
    - resources_servers/equivalence_llm_judge/configs/lc_judge.yaml
    - resources_servers/calendar/configs/calendar.yaml
    - resources_servers/genrm_compare/configs/genrm_compare.yaml
    - resources_servers/equivalence_llm_judge/configs/nl2bash-equivalency.yaml
    - resources_servers/equivalence_llm_judge/configs/equivalence_llm_judge.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/reasoning_gym/configs/reasoning_gym.yaml
    - resources_servers/terminus_judge/configs/terminus_judge_string_only.yaml
    - resources_servers/ns_tools/configs/ns_tools.yaml
    - resources_servers/math_formal_lean/configs/math_formal_lean_multi_turn.yaml
    - resources_servers/jailbreak_detection/configs/jailbreak_detection_nemotron_combined_reward_tp8.yaml
    - resources_servers/over_refusal_detection/configs/over_refusal_detection_nemotron_tp8.yaml
    - resources_servers/multichallenge/configs/multichallenge.yaml
    - resources_servers/inverse_if/configs/inverse_if.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/search_pivot_single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/toolcall_schema_single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/swe_pivot_single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/droid_pivot_single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/abstention/configs/abstention.yaml
    - resources_servers/nvarc/configs/inductive.yaml
    - resources_servers/nvarc/configs/transductive.yaml
    - resources_servers/equivalence_rule/configs/lc.yaml
    - resources_servers/ether0/configs/ether0.yaml
    - resources_servers/structured_outputs/configs/structured_outputs_json_yaml_xml_v1.yaml
    - resources_servers/structured_outputs/configs/structured_outputs_v3.yaml
    - resources_servers/structured_outputs/configs/structured_outputs_v4.yaml
    - resources_servers/format_verification/configs/freeform_formatting.yaml
    - resources_servers/format_verification/configs/citation_format.yaml
    - resources_servers/citation_if/configs/citation_if.yaml
    - resources_servers/conversational_tool_use_simulation/configs/conversational_tool_use_simulation.yaml
    - resources_servers/litmus_agent/configs/litmus_agent.yaml
    - resources_servers/indirect_prompt_injection/configs/indirect_prompt_injection.yaml
    - resources_servers/swe_pivot/configs/swe_pivot.yaml
    - resources_servers/terminal_multi_harness/configs/terminal_multi_harness_stirrup.yaml
    - resources_servers/terminal_multi_harness/configs/terminal_multi_harness_agent006.yaml
    - resources_servers/terminal_multi_harness/configs/terminal_multi_harness_opencode.yaml
    - resources_servers/terminal_multi_harness/configs/terminal_multi_harness_codex.yaml
    effort_levels:
      low_penalty: 1
      low_string: '{reasoning effort: efficient}'
      low_ub: 15000
      low_weight: 0.1
    equivalence_llm_judge:
      resources_servers:
        equivalence_llm_judge:
          judge_model_server:
            name: nl2bash_judge_model
          judge_responses_create_params:
            max_output_tokens: 8192
    equivalence_llm_judge_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    ether0_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    finance_sec_search_resources_server:
      resources_servers:
        finance_sec_search:
          cache_dir: ${checkpointing.checkpoint_dir}/../finance_cache
          judge_call_timeout: 60
          judge_model_server:
            name: nl2bash_judge_model
            type: responses_api_models
          max_connections_per_host: 1
          max_rollout_time_seconds: 1800
          requests_per_second: 1
          retrieval_max_output_tokens: 8192
          retrieval_model_context_length: 81920
          retrieval_responses_create_params:
            input: []
            temperature: 1
            top_p: 1
          reward_mode: scaled
          sec_dump_path: ${oc.env:DATA_ROOT}/finance/sec
          use_cache: true
    freeform_formatting_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    genrm_compare_resources_server:
      resources_servers:
        genrm_compare:
          aggregator_method: simple_tiebreaker
          answer_bonus: 0.5
          comparison_strategy: circular
          default_principle: 'You will be given one or more evaluation criteria (rubrics).

            Evaluate both responses on EACH criterion individually first, then synthesize an overall judgment.

            Criteria:


            1. Please act as an impartial judge and evaluate the quality of the responses provided by
            two AI assistants to the user prompt. Begin your evaluation by generating your own answer
            to the prompt. You must provide your answer before judging any answers. When evaluating the
            assistants'' answers, compare both assistants'' answers with your answer. You must identify
            and correct any mistakes or inaccurate information. Then consider if the assistant''s answers
            are helpful, relevant, and concise. Helpful means the answer correctly responds to the prompt
            or follows the instructions. Note when user prompt has any ambiguity or more than one interpretation,
            it is more helpful and appropriate to ask for clarifications or more information from the
            user than providing an answer based on assumptions. Relevant means all parts of the response
            closely connect or are appropriate to what is being asked. Concise means the response is clear
            and not verbose or excessive. Then consider the creativity and novelty of the assistant''s
            answers when needed. Finally, identify any missing important information in the assistants''
            answers that would be beneficial to include when responding to the user prompt.'
          default_ranking: 3.5
          default_score: 3
          genrm_model_server:
            name: genrm_model
            type: responses_api_models
          genrm_parse_retries: 1
          genrm_responses_create_params:
            max_output_tokens: 24576
            temperature: 1
            top_p: 0.95
          group_answer_length_penalty_coeff: 0.12
          group_reasoning_length_penalty_coeff: 0.12
          group_style_penalty_coeff: 0
          num_judges_per_comparison: 1
          num_rollouts_per_prompt: 16
          reasoning_bonus: 0.5
          top_percentile: 0.2
          use_principle: true
    genrm_model:
      responses_api_models:
        genrm_model:
          base_url: ${oc.env:GENRM_BASE_URL}
          entrypoint: app.py
          model: ${oc.env:GENRM_MODEL}
          return_token_id_information: false
          uses_reasoning_parser: true
          debug: false
    genrm_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    genrm_simple_agent_reasoning_off:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    global_aiohttp_client_request_debug: false
    instruction_following_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    invalid_tool_call_patterns:
    - <tool_call>
    - </tool_call>
    - <function_call>
    - </function_call>
    inverse_if:
      resources_servers:
        inverse_if:
          judge_model_server:
            name: nl2bash_judge_model
            type: responses_api_models
    inverse_if_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    jailbreak_detection:
      resources_servers:
        jailbreak_detection:
          judge_model_server:
            name: safety_judge_model
            type: responses_api_models
    lc_equivalence_rule_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    lc_judge:
      resources_servers:
        equivalence_llm_judge:
          judge_model_server:
            name: nl2bash_judge_model
          judge_responses_create_params:
            max_output_tokens: 8192
    lc_judge_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    math_with_judge:
      resources_servers:
        math_with_judge:
          judge_model_server:
            name: nl2bash_judge_model
          judge_responses_create_params:
            max_output_tokens: 8192
          should_use_judge: true
    math_with_judge_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    mcqa_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    multichallenge:
      resources_servers:
        multichallenge:
          judge_model_server:
            name: nl2bash_judge_model
            type: responses_api_models
          judge_responses_create_params:
            max_output_tokens: 8192
    multichallenge_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    nemo_gym_log_dir: ${logger.log_dir}/nemo_gym
    nl2bash_judge_model:
      responses_api_models:
        local_vllm_model:
          # Required by the client schema; unused with external base_url.
          vllm_serve_kwargs: {}
          vllm_serve_env_vars: {}
          base_url: ${oc.env:NL2BASH_BASE_URL}
          entrypoint: app.py
          model: ${oc.env:NL2BASH_MODEL}
          return_token_id_information: false
          uses_reasoning_parser: false
          debug: false
    num_gpu_nodes: 0
    nvarc_inductive_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    nvarc_transductive_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    over_refusal_detection:
      resources_servers:
        over_refusal_detection:
          judge_model_server:
            name: safety_judge_model
            type: responses_api_models
    policy_model:
      responses_api_models:
        vllm_model:
          chat_template_kwargs:
            enable_thinking: true
            truncate_history_thinking: false
          num_groups_nemo_rl: 2
          num_workers: 16
          sequential_reasoning_allowed: false
    policy_model_reasoning_off:
      _copy: policy_model
      responses_api_models:
        vllm_model:
          chat_template_kwargs:
            enable_thinking: false
          num_groups_nemo_rl: 2
          num_workers: 4
    port_range_high: 5999
    port_range_low: 5000
    rdkit_chemistry_agent:
      _inherit_from: litmus_agent_agent
    reasoning_gym_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    safety_judge_model:
      responses_api_models:
        local_vllm_model:
          vllm_serve_kwargs: {}
          vllm_serve_env_vars: {}
          base_url: ${oc.env:SAFETY_BASE_URL}
          entrypoint: app.py
          model: ${oc.env:SAFETY_MODEL}
          return_token_id_information: false
          uses_reasoning_parser: false
          debug: false
    # Finance uses nl2bash_judge_model above; do not start its unused default client.
    search_judge_model: null
    scicode:
      resources_servers:
        scicode:
          test_data_fpath: ${oc.env:DATA_ROOT}/scicode/test_data.h5
          timeout_secs: 60
    scicode_agent:
      responses_api_agents:
        scicode_agent:
          datasets:
          - jsonl_fpath: ${oc.env:DATA_ROOT}/scicode/gold_transitions.jsonl
            license: Apache 2.0
            name: scicode_ds0_ds1_stock_gym_v1
            num_repeats: 1
            prompt_config: null
            type: train
    simple_agent:
      _copy: competitive_coding_challenges_simple_agent
      responses_api_agents:
        simple_agent:
          max_steps: 1
    skip_venv_if_present: true
    uv_venv_dir: ${oc.env:NEMO_GYM_VENV_DIR,/opt/gym_venvs}
    structured_outputs_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    structured_outputs_v3_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    terminus_judge_string_only_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    thinking_tags:
    - <think>
    - </think>
  should_log_nemo_gym_responses: true
  should_use_nemo_gym: true
  use_genrm_compare: true
grpo:
