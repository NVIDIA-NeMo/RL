# Production-scale asynchronous GRPO for Terminal-Bench with every source task
# evaluated by OpenCode, OpenClaw, Pi, and Hermes. The external launcher serves
# the policy through 16 independent TP1 vLLM endpoints on four GPU nodes and a
# consistent-hash router, while OpenSandbox provisions the task containers on
# Kubernetes.
defaults: ./rlvr_sc_smoke_small_external_vllm.yaml

cluster:
  gpus_per_node: 4
  num_nodes: 8
  segment_size: 2

checkpointing:
  enabled: true
  checkpoint_dir: results/anyterminal-multi-harness-external-vllm
  save_period: 10
  ft_save_period: 1

grpo:
  # NemoGymDataset fans each source row out four ways. One step therefore
  # consumes 32 source tasks x 4 harnesses x 16 generations = 2,048 rollouts.
  num_prompts_per_step: 128
  num_generations_per_prompt: 16
  max_num_epochs: 1000000
  max_num_steps: 1000000
  val_period: 0
  val_at_start: false
  val_at_end: false
  # SingleController owns ready-first asynchronous scheduling.
  async_grpo: null

policy:
  train_global_batch_size: 2048
  max_total_sequence_length: 196608
  generation:
    max_new_tokens: 32768
    remote_vllm_cfg:
      max_model_len: ${policy.max_total_sequence_length}

data:
  _override_: true
  max_input_seq_length: null
  shuffle: true
  num_workers: 0
  use_multiple_dataloader: false
  train:
    dataset_name: NemoGymDataset
    data_path: /path/to/terminal_bench_multi_harness.train.jsonl
  validation: null
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    prompt_file: null
    system_prompt_file: null
    processor: nemo_gym_data_processor

env:
  _override_: true
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  should_mask_flagged_samples: true
  nemo_gym:
    is_trajectory_collection: false
    skip_venv_if_present: true
    port_range_low: 5000
    port_range_high: 5999
    nemo_gym_log_dir: logs/anyterminal-multi-harness-external-vllm/nemo_gym
    gzip_responses_enabled: true
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
      - responses_api_agents/anyterminal_agent/configs/anyterminal_multi_harness_opensandbox.yaml
    fan_out:
      anyterminal_multi_harness:
        - anyterminal_opencode
        - anyterminal_openclaw
        - anyterminal_pi
        - anyterminal_hermes
    policy_model:
      responses_api_models:
        vllm_model:
          uses_reasoning_parser: true
          num_workers: 64
          sampling_overrides:
            temperature: ${policy.generation.temperature}
            top_p: ${policy.generation.top_p}
            top_k: -1
          extra_body:
            chat_template_kwargs:
              enable_thinking: true
    anyterminal_opencode:
      responses_api_agents:
        anyterminal_agent:
          global_agent_timeout: 9000
          agent_kwargs:
            context_window: ${add:${policy.max_total_sequence_length},-512}
            max_input_tokens: ${add:${policy.max_total_sequence_length},-33280}
            max_output_tokens: 32768
    anyterminal_openclaw:
      responses_api_agents:
        anyterminal_agent:
          global_agent_timeout: 9000
          agent_kwargs:
            context_window: ${add:${policy.max_total_sequence_length},-512}
            max_output_tokens: 32768
    anyterminal_pi:
      responses_api_agents:
        anyterminal_agent:
          global_agent_timeout: 9000
    anyterminal_hermes:
      responses_api_agents:
        anyterminal_agent:
          global_agent_timeout: 9000
          agent_kwargs:
            context_window: ${add:${policy.max_total_sequence_length},-512}

data_plane:
  enabled: true
  impl: transfer_queue
  backend: simple
  claim_meta_poll_interval_s: 0.5
  simple:
    storage_capacity: 1000000
    num_storage_units: 16

token_capture:
  enabled: true
  staging_partition: rollout_staging
  min_valid_fraction_per_group: 1.0

async_rl:
  sampler:
    name: ready_first
    max_staleness_versions: 1
  recompute_kv_cache_after_weight_updates: false
  min_groups_for_streaming_train: 128
  max_inflight_prompts: 256
  max_buffered_rollouts: 256
  rollout_failure:
    nemo_gym:
      rollout_timeout_s: 10800.0

logger:
  log_dir: logs/anyterminal-multi-harness-external-vllm
  wandb_enabled: true
  tensorboard_enabled: true
  monitor_gpus: true
  wandb:
    entity: adlr
    project: multi-harness-RL
    name: anyterminal-multi-harness-external-vllm
    log_nemo_gym_full_result_tables: true
