# AutomationBench Nemotron 3.5 *Super* — the recipe launch_super.sh runs.
#
# `workload` is flattened into Hydra overrides by launch.sh. Deployment paths,
# cluster profiles, Slurm allocation, datasets, and smoke-only overrides stay
# in the launcher so the behavior-defining GRPO recipe remains reviewable here.
#
# Forked from automationbench_lightning.yaml on 2026-09-10. The `recipe` block
# (base config, source pins, profiles, datasets, corpora) is a verbatim mirror
# of that file and must move with it: launch.sh reads corpus digests and panel
# registrations from whichever recipe file it is given, and there is no
# include. The `workload` block is where the two differ -- Super's optimizer
# peak, checkpoint retention, advantage normalisation, and a validation cadence
# sized for the 600-row AB600 panel rather than dev60. launch_super.sh still
# recomputes the training parallelism per shape and applies the async-only
# loss settings on top.

