# Nemotron-Omni CLEVR through NeMo-Gym (string_match verifier) with async vLLM
# generation, a Megatron learner, and vLLM media token capture enabled.
#
# Functional-test config (not a nightly recipe, so it lives beside the other
# Gym smoke configs rather than under examples/configs/recipes/). It pins the
# 1n2g split both Omni CLEVR vLLM tests use: one GPU trains the frozen-decoder
# policy, one hosts async vLLM. The tests
# (tests/functional/nemotron_omni_clevr_vllm_*_single_controller_1n2g.sh)
# supply the data paths, sequence lengths and step budget. Token capture
# requires the Gym rollout path, so the native CLEVR
# dataset/environment of the parent recipe are swapped for Gym rows here.
# Prefix caching stays off (hybrid-Mamba align cache mode asserts chunked
# prefill) and the parent's mm_processor_cache_gb=0 keeps concrete pixels
# available to the capture host.
defaults: ../configs/recipes/vlm/vlm_grpo-nemotron-omni-30ba3b-clevr-8n4g-megatron-single-controller-async.v1.yaml
cluster:
  num_nodes: 1
  gpus_per_node: 2
  segment_size: 1
grpo:
  val_period: 0
  val_at_start: false
  val_at_end: false
async_rl:
  generation_fleet_health:
    refit_timeout_s: null
data_plane:
  simple:
    num_storage_units: 2
logger:
  tensorboard_enabled: true
  wandb_enabled: false
  monitor_gpus: false
data:
  _override_: true
  max_input_seq_length: null
  shuffle: true
  num_workers: 0
  use_multiple_dataloader: false
  train:
    data_path: /path/to/clevr_gym/train.jsonl
  validation:
    data_path: /path/to/clevr_gym/val.jsonl
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    prompt_file: null
    system_prompt_file: null
    processor: nemo_gym_data_processor
env:
  _override_: true
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: false
  should_mask_flagged_samples: true
  nemo_gym:
    is_trajectory_collection: false
    skip_venv_if_present: true
    port_range_low: 5000
    port_range_high: 5999
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/string_match/configs/string_match.yaml
    string_match_environment_server:
      environment_servers:
        legacy_agent:
          entrypoint: app.py
          agent_server:
            type: responses_api_agents
            name: string_match_simple_agent
    string_match_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
policy:
  train_micro_batch_size: 1
  megatron_cfg:
    tensor_model_parallel_size: 1
    expert_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    activation_checkpointing: true
    bias_dropout_fusion: false
    freeze_config:
      freeze_language_model: true
    optimizer:
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0
      params_dtype: bfloat16
      main_grads_dtype: bfloat16
      main_params_dtype: float16
      exp_avg_dtype: bfloat16
      exp_avg_sq_dtype: bfloat16
      store_param_remainders: false
  generation:
    backend: vllm
    refit_transport: null
    colocated:
      enabled: false
      resources:
        num_nodes: 1
        gpus_per_node: 1
    vllm_cfg:
      tensor_parallel_size: 1
      expert_parallel_size: 1
      pipeline_parallel_size: 1
      gpu_memory_utilization: 0.6
      async_engine: true
      expose_http_server: true
      logprobs_mode: raw_logprobs
      enable_prefix_caching: false
      enforce_eager: true
    vllm_kwargs:
      limit_mm_per_prompt:
        image: 2
      skip_mm_profiling: true
      mamba_ssm_cache_dtype: float32
      kernel_config:
        enable_flashinfer_autotune: false
        moe_backend: triton
token_capture:
  enabled: true
  staging_partition: rollout_staging
