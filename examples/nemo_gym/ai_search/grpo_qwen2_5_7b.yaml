# GRPO recipe for the local cuVS-backed AI-search environment.
# Reuse the tested Qwen2.5 Gym/vLLM plumbing; `policy.model_name` below replaces
# that recipe's 1.5B policy with the 7B model.
defaults: ../../configs/recipes/llm/gdpo-qwen2.5-1.5b-1n8g-gym-multireward.yaml

grpo:
  max_num_epochs: 100
  max_num_steps: 50
  num_prompts_per_step: 2
  num_generations_per_prompt: 4
  val_at_end: true
  skip_reference_policy_logprobs_calculation: false
  invalid_tool_call_advantage: -2.0
  adv_estimator:
    name: grpo
    use_leave_one_out_baseline: true
    reward_weights: null

loss_fn:
  reference_policy_kl_penalty: 0.01

policy:
  model_name: Qwen/Qwen2.5-7B-Instruct
  tokenizer:
    name: Qwen/Qwen2.5-7B-Instruct
  dynamic_batching:
    enabled: true
  optimizer:
    kwargs:
      lr: 3.0e-07
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 0.1
      end_factor: 1
      total_iters: 13
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1
      total_iters: 10000000000
  - milestones:
    - 13
  generation:
    max_new_tokens: 1024
    vllm_cfg:
      gpu_memory_utilization: 0.45

data:
  train:
    data_path: examples/nemo_gym/ai_search/resources_servers/ai_search/data/train.jsonl
  validation:
    data_path: examples/nemo_gym/ai_search/resources_servers/ai_search/data/validation.jsonl

env:
  nemo_gym:
    skip_venv_if_present: true
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/ai_search/configs/ai_search.yaml

checkpointing:
  checkpoint_dir: results/grpo-ai-search-qwen2.5-7b
  keep_top_k: 2
  save_period: 10

logger:
  log_dir: logs/grpo-ai-search-qwen2.5-7b
  num_val_samples_to_print: 4
  wandb_enabled: false
  tensorboard_enabled: true
  wandb:
    project: nemo-rl-ai-search
    name: qwen2.5-7b-cuvs-grpo

cluster:
  gpus_per_node: 1
