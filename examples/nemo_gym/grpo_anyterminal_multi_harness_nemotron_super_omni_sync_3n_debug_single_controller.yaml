# Minimum non-colocated synchronous Super Omni debug topology: two nodes train
# (16 ranks for TP=8 and CP=2) and one node serves rollouts with two TP=4 vLLM
# replicas. This keeps the full four-task x four-harness epoch and has no
# debug max-step cap; the dataset naturally ends after four optimizer steps.
# Keep the parent recipe's 16K context and generation limits: terminal-agent
# tool histories can exceed the 4K limit used by short multimodal smoke tests.
defaults: ./grpo_anyterminal_multi_harness_nemotron_super_omni_sync_8n_single_controller.yaml

cluster:
  num_nodes: 3

policy:
  generation:
    colocated:
      resources:
        gpus_per_node: 8
        num_nodes: 1

logger:
  log_dir: logs/grpo-anyterminal-multi-harness-super-omni-sync-3n-debug
  wandb:
    name: anyterminal-multi-harness-super-omni-sync-3n-debug
