# Two-step, two-GPU tool-enabled smoke for NeMo-Gym with managed Dynamo vLLM.
defaults: grpo_qwen3_30ba3b_instruct.yaml

grpo:
  max_num_epochs: 1
  num_prompts_per_step: 2
  num_generations_per_prompt: 2
  max_num_steps: 2
  val_period: 0
  val_at_start: false
  val_at_end: false
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1
    in_flight_weight_updates: false
    recompute_kv_cache_after_weight_updates: true

loss_fn:
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2.0

checkpointing:
  enabled: false

policy:
  model_name: Qwen/Qwen3-0.6B
  tokenizer:
    name: Qwen/Qwen3-0.6B
  train_global_batch_size: 4
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 768
  sequence_packing:
    enabled: false
  dtensor_cfg:
    _v2: false
    enabled: true
    cpu_offload: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
  make_sequence_length_divisible_by: 1
  optimizer:
    name: torch.optim.AdamW
    kwargs:
      lr: 5.0e-6
      weight_decay: 0.01
      betas: [0.9, 0.999]
      eps: 1.0e-8
  scheduler:
    - name: torch.optim.lr_scheduler.ConstantLR
      kwargs:
        factor: 1.0
        total_iters: 2
    - milestones: []
  megatron_cfg:
    enabled: false
  generation:
    backend: dynamo
    max_new_tokens: 128
    dynamo_cfg:
      engine: vllm
      startup_timeout_s: 600
      request_timeout_s: 900
      control_timeout_s: 600
      metrics_include_prefixes: null
      metrics_exclude_prefixes: null
      worker_args:
        # Dynamo 1.3.0 routes qwen3_coder + tool_choice=auto through its v2
        # parser. This smoke targets that parser's nvext.engine_data transport.
        tool_call_parser: qwen3_coder
        reasoning_parser: null
        exclude_tools_when_tool_choice_none: true
        enable_structural_tag: false
        structural_tag_scope: auto
        structural_tag_schema: auto
        custom_jinja_template: null
        endpoint_types: [chat, completions]
        extra_cli_args: []
      frontend_args:
        tokenizer: default
        tokenizer_cache: false
        tokenizer_cache_bytes: 52428800
        router_mode: kv
        router_reset_states: true
        extra_cli_args: []
    vllm_cfg:
      async_engine: true
      expose_http_server: true
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      precision: bfloat16
      gpu_memory_utilization: 0.6
      max_model_len: ${policy.max_total_sequence_length}
      kv_cache_dtype: auto
      enforce_eager: true
      enable_vllm_metrics_logger: true
      vllm_metrics_logger_interval: 1.0
      http_server_serving_chat_kwargs: null
      env_vars:
        NCCL_MNNVL_ENABLE: "0"
    vllm_kwargs:
      max_num_seqs: 8
    colocated:
      enabled: false
      resources:
        gpus_per_node: 1
        num_nodes: 1

logger:
  log_dir: results/grpo-dynamo-gym-smoke
  wandb_enabled: false
  tensorboard_enabled: true
  monitor_gpus: false

cluster:
  gpus_per_node: 2
  num_nodes: 1
