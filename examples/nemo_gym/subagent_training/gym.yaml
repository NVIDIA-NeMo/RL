config_paths:
- nemo_gym/sandbox/providers/local/configs/local.yaml
sandbox:
  local:
    workspace_root: ${oc.env:SUBAGENT_RUN_DIR,logs/subagent-training}/sandboxes
    concurrency: 8
math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
      should_use_judge: false
      domain: math
policy_model:
  responses_api_models:
    vllm_model:
      port: 6990
      propagate_context_overflow_errors: true
      chat_template_kwargs:
        enable_thinking: false
        truncate_history_thinking: false
      sampling_overrides:
        max_tokens: 2048
        temperature: 1.0
        top_p: 1.0
math_subagent:
  responses_api_agents:
    harness_agent:
      entrypoint: app.py
      concurrency: 4
      resources_server:
        type: resources_servers
        name: math_with_judge
      model_server:
        type: responses_api_models
        name: policy_model
      agent: claude_code
      agent_kwargs:
        model: ${policy_model_name}
        anthropic_api_key: dummy
        claude_code_version: 2.1.303
        max_turns: 8
        timeout: 1800
        disallowed_tools: Bash,Read,Edit,Write,Glob,Grep,NotebookEdit,EnterWorktree,ExitWorktree,Skill,Workflow,WebSearch,WebFetch,SendMessage,CronCreate,CronDelete,CronList,ScheduleWakeup,ListAgents,ReportFindings,TaskStop
        bare: false
        settings: ${oc.env:SUBAGENT_EXAMPLE_DIR}/settings.json
        system_prompt: Delegate calculation A and calculation B to separate general-purpose
          agents using run_in_background=false. Wait for both results, then return
          only their sum in one boxed answer. Do not resample a completed solver.
      setup_commands:
      - mkdir -p work/.claude/agents
      - cp ${oc.env:SUBAGENT_EXAMPLE_DIR}/agents/coordinator.md work/.claude/agents/coordinator.md
      - cp ${oc.env:SUBAGENT_EXAMPLE_DIR}/agents/general-purpose.md work/.claude/agents/general-purpose.md
      - git -C work init -q
      - git -C work add .claude/agents
      - git -C work -c user.name=SubagentExample -c user.email=subagent@example.invalid commit -qm "Initialize sandbox"
      sandbox_provider: sandbox
      sandbox_model_base_url: http://${default_host}:${policy_model.responses_api_models.vllm_model.port}
      sandbox_image: ''
      sandbox_python: ${oc.env:SUBAGENT_SANDBOX_PYTHON}
      sandbox_spec:
        env:
          PATH: ${oc.env:PATH}
          TMPDIR: ${oc.env:SUBAGENT_RUN_DIR,logs/subagent-training}/tmp
          CLAUDE_AGENT_SDK_DISABLE_BUILTIN_AGENTS: '1'
          DISABLE_AUTOUPDATER: '1'
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: '2048'
          BUN_CONFIG_HTTP_IDLE_TIMEOUT: '1500'
          CLAUDE_STREAM_FIRST_BYTE_TIMEOUT_MS: '1500000'
          CLAUDE_STREAM_IDLE_TIMEOUT_MS: '1500000'
          CLAUDE_BYTE_STREAM_IDLE_TIMEOUT_MS: '1500000'
          API_TIMEOUT_MS: '1600000'
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: '0'
      rollout_timeout: 1900
math_subagent_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: math_subagent
