# GRPO on the NeMo-Gym workplace-assistant environment via the SingleController path,
# using non-colocated Megatron Inference.
# Gym rollouts go through the persistent Megatron engine's OpenAI-compatible server,
# Smoke-test scale; Qwen3-0.6B on one node with 2 GPUs (1 training + 1 generation);
# the CI-run variant of this setup is
# tests/functional/grpo_megatron_generation_gym_single_controller.sh.
defaults: "grpo_qwen3_30ba3b_instruct.yaml"

grpo:
  # SC requires one optimizer step per RL step:
  # num_prompts_per_step * num_generations_per_prompt == policy.train_global_batch_size
  num_prompts_per_step: 4
  num_generations_per_prompt: 2
  max_num_steps: 10  # short demo; raise for a real run
  # SC does not support validation yet (setup raises when it is enabled).
  val_period: 0
  val_at_start: false
  # SC replaces the legacy async-GRPO path.
  async_grpo: null

policy:
  model_name: Qwen/Qwen3-0.6B
  train_global_batch_size: 8
  # Full workplace-assistant prompts (all tools attached) run past 4k tokens.
  max_total_sequence_length: 8192

  megatron_cfg:
    tensor_model_parallel_size: 1
    expert_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false

  generation:
    backend: "megatron"
    mcore_generation_config:
      # NeMo-Gym drives rollouts through the engine's OpenAI server.
      expose_http_server: true
    colocated:
      enabled: false
      resources:
        num_nodes: 1
        gpus_per_node: 1

# The gym family sets no data_plane block, so the full one is spelled out here
# (values as documented in examples/configs/grpo_math_1B.yaml).
data_plane:
  enabled: true
  impl: transfer_queue
  backend: "simple"                  # TQ storage backend ('simple' or 'mooncake_cpu')
  storage_capacity: 1000000          # max samples retained per partition
  num_storage_units: 2               # storage shards
  claim_meta_poll_interval_s: 0.5    # blocking-claim poll cadence
  global_segment_size: 549755813888  # 512 GiB — used when backend == "mooncake_cpu"
  local_buffer_size:   68719476736   # 64 GiB  — used when backend == "mooncake_cpu"

async_rl:
  sampler:
    name: in_order
    # 0 = fully synchronous. No off-policy data is admitted, so the inherited
    # use_importance_sampling_correction=false stays valid.
    max_lookahead_versions: 0
  min_groups_for_streaming_train: ${grpo.num_prompts_per_step}
  max_inflight_prompts: ${grpo.num_prompts_per_step}

checkpointing:
  # SC does not support checkpointing yet (setup raises when it is enabled).
  enabled: false

cluster:
  gpus_per_node: 2
