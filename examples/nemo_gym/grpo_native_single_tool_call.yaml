# Native Environment Server smoke: Qwen3-0.6B, one Megatron training GPU,
# one vLLM generation GPU, and two training steps. Requires Gym PR #3784.
defaults: grpo_workplace_assistant_nemotron_nano_v2_9b.yaml

grpo:
  num_prompts_per_step: 4
  num_generations_per_prompt: 2
  max_num_epochs: 2
  max_num_steps: 2
  val_at_start: false
  val_at_end: false
  val_period: -1

policy:
  model_name: Qwen/Qwen3-0.6B
  max_total_sequence_length: 2048
  megatron_cfg:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
  generation:
    max_new_tokens: 512
    vllm_cfg:
      tensor_parallel_size: 1
      http_server_serving_chat_kwargs:
        enable_auto_tools: true
        tool_parser: hermes
    colocated:
      enabled: false
      resources:
        num_nodes: 1
        gpus_per_node: 1

data:
  # A tiny routing/rollout fixture, not a benchmark or held-out evaluation set.
  train:
    data_path: examples/nemo_gym/data/native_single_tool_call.jsonl
  validation:
    data_path: examples/nemo_gym/data/native_single_tool_call.jsonl

env:
  nemo_gym:
    # Define all three native components below instead of loading the existing
    # weather config, which declares a legacy_agent Environment Server.
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    code_gen: null
    environment_server_routes:
      "weather:example": weather_environment
    weather_resources:
      resources_servers:
        example_single_tool_call:
          entrypoint: app.py
          domain: agent
    weather_agent:
      responses_api_agents:
        simple_agent:
          entrypoint: app.py
          num_workers: 1
          max_steps: 3
          model_server:
            type: responses_api_models
            name: policy_model
    weather_environment:
      environment_servers:
        single_agent_turn:
          entrypoint: app.py
          agent_server:
            type: responses_api_agents
            name: weather_agent
          resources_server:
            type: resources_servers
            name: weather_resources
          resources_tool_transports: [direct_http]

checkpointing:
  enabled: false

logger:
  log_dir: logs/grpo-native-single-tool-call
  wandb_enabled: false
  tensorboard_enabled: true
  monitor_gpus: false

cluster:
  num_nodes: 1
  gpus_per_node: 2
