# MXFP8 on the QKV and output-projection linears (linear_qkv, linear_proj) and the routed
# experts (GroupedLinear linear_fc1 / linear_fc2) of Nemotron Nano v3, a hybrid Mamba + MoE
# model. The attention core itself runs in BF16. Everything else stays BF16: the shared
# experts, the Mamba mixer linears (in_proj, out_proj), embeddings and the output layer. A BF16 block disables the outer MXFP8 autocast for the
# module and keeps its weights in BF16 storage, so refit leaves them unquantized as well.
#
# Use the same file on train and generation (generation inherits megatron_cfg).
configs:
  bf16:
    transformer_engine_config_type: "TEQuantizationParams"
    training_recipe: {}
  mxfp8:
    transformer_engine_config_type: "TEQuantizationParams"
    training_recipe:
      fp8_quantization_recipe: "mxfp8"
      fp8_format: "hybrid"
      fp8_param: true
      # Both flags are required under zero_train_gen_mismatch, and they apply to
      # different surrounding forwards.
      # - override_quantized_autocast: the training step is already inside an FP8
      #   autocast; this replaces that outer recipe with this block's MXFP8.
      # - override_nonquantized_autocast: logprob and other grad-disabled forwards
      #   are not. Without it the module dequantizes these weights and runs BF16
      #   while generation stays MXFP8.
      override_quantized_autocast: true
      override_nonquantized_autocast: true
    # Grad-disabled model construction (the generation model) reads evaluation_recipe, so it
    # repeats the training precision; an empty block would mean BF16.
    evaluation_recipe:
      fp8_quantization_recipe: "mxfp8"
      fp8_format: "hybrid"
      fp8_param: true
      override_quantized_autocast: true
      override_nonquantized_autocast: true

matchers:
  # First match wins.
  qkv_mxfp8:
    config: "mxfp8"
    type: "glob"
    pattern: "*linear_qkv*"
    enabled: true
  proj_mxfp8:
    config: "mxfp8"
    type: "glob"
    pattern: "*linear_proj*"
    enabled: true
  # Before the routed experts so that no broader experts pattern can pull them into MXFP8.
  shared_experts_bf16:
    config: "bf16"
    type: "glob"
    pattern: "*.mlp.shared_experts.*"
    enabled: true
  experts_fc1_mxfp8:
    config: "mxfp8"
    type: "glob"
    pattern: "*.mlp.experts.linear_fc1"
    enabled: true
  experts_fc2_mxfp8:
    config: "mxfp8"
    type: "glob"
    pattern: "*.mlp.experts.linear_fc2"
    enabled: true
  # The Mamba mixer in_proj / out_proj and anything else.
  fallthrough_bf16:
    config: "bf16"
    type: "glob"
    pattern: "*"
    enabled: true
