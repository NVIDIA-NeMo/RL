defaults: grpo_math_1B.yaml

grpo:
  val_batch_size: 128

policy:
  generation:
    backend: "sglang"
    use_async_rollouts: false
    sglang_cfg:
      quantization:
        scheme: bf16
      model_path: ${policy.model_name}
      dtype: ${policy.precision}
      context_length: 512
      allow_auto_truncate: true
      tp_size: 1
      dp_size: 1
      pp_size: 1
      ep_size: 1
      random_seed: 42
      max_running_requests: null
      mem_fraction_static: 0.6
      skip_server_warmup: true
      # Set false to opt into the legacy disk cache with trusted cache files.
      disable_outlines_disk_cache: true
      # Prefill graphs off: "tc_piecewise" crashes with "illegal memory access" on
      # torch 2.10, and "breakable" (upstream's CUDA default) is rejected under the
      # memory saver that needs_offload: true enables below.
      cuda_graph_backend_prefill: disabled
      disable_cuda_graph: false
      sglang_server_config:
        needs_offload: true
        cpu_weight_backup: true
        sglang_server_concurrency: 1024
        # Weight refit supports abort or retract; in_place preserves stale KV.
        pause_generation_mode: retract
        num_gpus: 2
        num_gpus_per_engine: ${policy.generation.sglang_cfg.tp_size}
      sglang_router_config:
        use_external_router: false
        # Managed-router total attempts per request and worker circuit threshold.
        # These retain the sglang-router 0.3.2 defaults; external routers own theirs.
        retry_max_retries: 5
        cb_failure_threshold: 10
      sglang_http_client_config:
        # Total client POST attempts, including the first; also applies with an
        # external router. Distributed dispatch and local fallback each use it.
        max_retries: 3
      # Prefill/decode disaggregation (policy.generation.disaggregation.enabled);
      # read only then, inert otherwise. Per-role engine overrides: a role block
      # names only what differs from the shared values above for that role's
      # engines (SGLangRoleEngineArgs: tp_size, ep_size, memory and scheduling
      # budgets, CUDA-graph capture). PD requires pause_generation_mode: abort,
      # colocated.enabled: false and no external router.
      prefill_engine: {}
      decode_engine: {}
      # How SGLang implements the layout. The sglang router's PD mode is the
      # disagg server; defaults live on SGLangDisaggConfig.
      disagg:
        # replica: one router per replica, KV never leaves the replica;
        # global: one router pools every engine of the fleet.
        router_scope: replica
        # mooncake (SGLang default, no UCX) | nixl | mooncake_tcp | fake (test only).
        # Engines get WITH_NVIDIA_PEERMEM=0 (DMA-BUF registration) under mooncake
        # when nvidia-peermem is not loaded, and NCCL_NET_PLUGIN=none under nixl;
        # values already set in the environment win.
        transfer_backend: mooncake
        # Comma-separated IB devices for the transport; null lets it pick.
        ib_device: null
        # Router policy per role; power_of_two cannot start with zero workers.
        prefill_policy: cache_aware
        decode_policy: round_robin
        # Decode engines use the chunk cache; SGLang marks radix there experimental.
        decode_enable_radix_cache: false
      # Fault tolerance: probe serving health during generation and check engine
      # liveness before refit, restarting hung/dead engines at that refit.
      sglang_fault_tolerance_config:
        use_fault_tolerance: false
        rollout_health_check_interval: 60
        rollout_health_check_timeout: 60
        rollout_health_check_first_wait: 60
        # Nonnegative restart limit per logical engine over the run's lifetime.
        # Abort when exhausted; 0 disables restarts.
        rollout_max_restart_attempts: 3
    colocated:
      enabled: true

logger:
  wandb_enabled: true

cluster:
  gpus_per_node: 2
  num_nodes: 1
