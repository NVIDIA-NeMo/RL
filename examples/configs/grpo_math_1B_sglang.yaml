defaults: grpo_math_1B.yaml

grpo:
  val_batch_size: 128

policy:
  generation:
    backend: "sglang"
    use_async_rollouts: false
    sglang_cfg:
      quantization:
        scheme: bf16
      model_path: ${policy.model_name}
      dtype: ${policy.precision}
      context_length: 512
      allow_auto_truncate: true
      tp_size: 1
      dp_size: 1
      pp_size: 1
      ep_size: 1
      random_seed: 42
      max_running_requests: null
      mem_fraction_static: 0.6
      skip_server_warmup: true
      # Prefill graphs off: "tc_piecewise" crashes with "illegal memory access" on
      # torch 2.10, and "breakable" (upstream's CUDA default) is rejected under the
      # memory saver that needs_offload: true enables below.
      cuda_graph_backend_prefill: disabled
      disable_cuda_graph: false
      sglang_server_config:
        needs_offload: true
        cpu_weight_backup: true
        sglang_server_concurrency: 1024
        # Weight refit supports abort or retract; in_place preserves stale KV.
        pause_generation_mode: retract
        num_gpus: 2
        num_gpus_per_engine: ${policy.generation.sglang_cfg.tp_size}
      sglang_router_config:
        use_external_router: false
    colocated:
      enabled: true

logger:
  wandb_enabled: true

cluster:
  gpus_per_node: 2
  num_nodes: 1
