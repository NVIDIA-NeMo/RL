defaults: grpo_math_1B.yaml

policy:
  generation:
    backend: "trtllm"
    trtllm_cfg:
      tensor_parallel_size: 1
      moe_tensor_parallel_size: null
      moe_expert_parallel_size: null
      max_model_len: ${policy.max_total_sequence_length}
      precision: ${policy.precision}
      async_engine: true
      gpu_memory_utilization: 0.6
      max_batch_size: 256
      max_num_tokens: 8192
      # Track the async-GRPO settings so the backend refit behavior can't
      # diverge from grpo.async_grpo (single source of truth).
      in_flight_weight_updates: ${grpo.async_grpo.in_flight_weight_updates}
      recompute_kv_cache_after_weight_updates: ${grpo.async_grpo.recompute_kv_cache_after_weight_updates}
      # Per-role engine overrides: these win over the shared values above for
      # that role's engines. Read only when disaggregation.enabled, hence
      # inert here. Overridable set is TrtllmEngineArgs.
      prefill_engine:
        tensor_parallel_size: 1
      decode_engine:
        tensor_parallel_size: 1
      disagg_server:
        # Stateful, so a trajectory's turns keep reaching the prefill engine
        # holding its prefix: conversation | kv_cache_aware
        ctx_router: conversation
        # Stateless: a decode engine receives KV freshly on every turn, so
        # it has nothing worth returning to: round_robin | load_balancing
        gen_router: load_balancing
        # Thin the prefill->decode relay: token ids as one base64 int32 string
        # instead of a 30k-int JSON array, and drop the redundant message
        # history.
        gen_tokids_ctxbytes: false
        gen_strip_message_history: false
    trtllm_kwargs:
      # Under disaggregation each engine also needs a cache transceiver. It is
      # an ordinary AsyncLLM argument, so it goes here, per recipe:
      #   cache_transceiver_config:
      #     backend: NIXL            # DEFAULT | UCX | NIXL | MOONCAKE | MPI
      #     transceiver_runtime: PYTHON   # a hybrid Mamba model's recurrent-
      #                                   # state handoff needs the v2 one;
      #                                   # TRT-LLM's "auto" may pick C++
      #     kv_transfer_timeout_ms: 600000  # the 60 s default is tuned for
      #                                     # short prompts at low concurrency
      # Omitted means backend=DEFAULT, which is what makes the engine report
      # itself as disaggregated at all.
      batch_wait_timeout_iters: 32
      batch_wait_max_tokens_ratio: 0.5
    colocated:
      enabled: true
      resources:
        gpus_per_node: null
        num_nodes: null

logger:
  wandb_enabled: true

cluster:
  gpus_per_node: 1
  num_nodes: 1
