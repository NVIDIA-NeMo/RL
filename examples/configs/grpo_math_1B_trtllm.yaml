defaults: grpo_math_1B.yaml

policy:
  generation:
    backend: "trtllm"
    trtllm_cfg:
      tensor_parallel_size: 1
      moe_tensor_parallel_size: null
      moe_expert_parallel_size: null
      max_model_len: ${policy.max_total_sequence_length}
      precision: ${policy.precision}
      async_engine: true
      gpu_memory_utilization: 0.6
      max_batch_size: 256
      max_num_tokens: 8192
      # Track the async-GRPO settings so the backend refit behavior can't
      # diverge from grpo.async_grpo (single source of truth).
      in_flight_weight_updates: ${grpo.async_grpo.in_flight_weight_updates}
      recompute_kv_cache_after_weight_updates: ${grpo.async_grpo.recompute_kv_cache_after_weight_updates}
      # Prefill/decode disaggregation. A replica is num_context_engines context
      # engines plus num_generation_engines generation engines, fronted by one
      # disagg server that exposes the single URL NeMo-Gym talks to. The replica
      # count is derived from the inference cluster size, not configured.
      # Requires colocated.enabled=false and trtllm_cfg.expose_http_server=true.
      disaggregation:
        enabled: false
        # Engines per replica; the two are independent, so the P:D ratio is free.
        num_context_engines: 1
        num_generation_engines: 1
        # Stateful, so a trajectory's turns keep reaching the context engine
        # holding its prefix: conversation | kv_cache_aware
        ctx_router: conversation
        # Stateless: a generation engine receives KV freshly on every turn, so
        # it has nothing worth returning to: round_robin | load_balancing
        gen_router: load_balancing
        # TRT-LLM CacheTransceiverConfig backend for the KV handoff:
        # DEFAULT | UCX | NIXL | MOONCAKE | MPI
        cache_transceiver_backend: DEFAULT
        # Per-role overrides merged over trtllm_cfg (TP, the MoE split, and any
        # other trtllm_cfg key). Uncomment to give the roles different shapes.
        # ctx_trtllm_kwargs:
        #   tensor_parallel_size: 4
        # gen_trtllm_kwargs:
        #   tensor_parallel_size: 2
    trtllm_kwargs:
      batch_wait_timeout_iters: 32
      batch_wait_max_tokens_ratio: 0.5
    colocated:
      enabled: true
      resources:
        gpus_per_node: null
        num_nodes: null

logger:
  wandb_enabled: true

cluster:
  gpus_per_node: 1
  num_nodes: 1
