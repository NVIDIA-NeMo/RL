defaults: grpo_math_1B.yaml

policy:
  generation:
    backend: "trtllm"
    trtllm_cfg:
      tensor_parallel_size: 1
      moe_tensor_parallel_size: null
      moe_expert_parallel_size: null
      max_model_len: ${policy.max_total_sequence_length}
      precision: ${policy.precision}
      async_engine: true
      gpu_memory_utilization: 0.6
      max_batch_size: 256
      max_num_tokens: 8192
      # Track the async-GRPO settings so the backend refit behavior can't
      # diverge from grpo.async_grpo (single source of truth).
      in_flight_weight_updates: ${grpo.async_grpo.in_flight_weight_updates}
      recompute_kv_cache_after_weight_updates: ${grpo.async_grpo.recompute_kv_cache_after_weight_updates}
      # Prefill/decode disaggregation. A replica is num_context_engines context
      # engines plus num_generation_engines generation engines, fronted by one
      # disagg server that exposes the single URL NeMo-Gym talks to. The replica
      # count is derived from the inference cluster size, not configured.
      # Requires colocated.enabled=false and trtllm_cfg.expose_http_server=true.
      disaggregation:
        enabled: false
        # Engines per replica; the two are independent, so the P:D ratio is free.
        num_context_engines: 1
        num_generation_engines: 1
        # Stateful, so a trajectory's turns keep reaching the context engine
        # holding its prefix: conversation | kv_cache_aware
        ctx_router: conversation
        # Stateless: a generation engine receives KV freshly on every turn, so
        # it has nothing worth returning to: round_robin | load_balancing
        gen_router: load_balancing
        # TRT-LLM CacheTransceiverConfig backend for the KV handoff:
        # DEFAULT | UCX | NIXL | MOONCAKE | MPI
        cache_transceiver_backend: DEFAULT
        # Frontend (disagg server) workers per replica. Each is its own actor
        # with a distinct URL, so one frontend's CPU stops being the replica's
        # turn-throughput ceiling. replicas * workers must be <= 256.
        num_frontend_workers: 1
        # Base port for the frontends' deterministic ports
        # (base + replica_idx * num_frontend_workers + frontend_idx). Keep it
        # outside virtual_cluster's random master-port window (1400-1999).
        frontend_base_port: 17300
        # Thin the ctx->gen relay: token ids as one base64 int32 string instead
        # of a 30k-int JSON array, and drop the (redundant) message history.
        gen_tokids_ctxbytes: false
        gen_strip_message_history: false
        # Render the chat template and tokenize on the frontends instead of the
        # single ctx adapter process. Guarded by ctx-side shadow validation
        # (NRL_TRTLLM_TOKENIZE_SHADOW_RATE).
        frontend_tokenize: false
        # KV transceiver tuning. null means "don't forward", so TRT-LLM keeps
        # its own default for each.
        # CPP | PYTHON. TRT-LLM's own default is "auto", which only adopts the
        # model's preferred runtime when the effective backend supports it and
        # silently falls back to C++ otherwise -- not what a hybrid Mamba model
        # wants, since the recurrent-state handoff needs the Python (v2) one.
        cache_transceiver_runtime: null
        # MiB of bounce buffer, or 0 to keep the per-block path. Read only by
        # the Python (v2) transceiver.
        kv_cache_bounce_size_mb: null
        max_tokens_in_buffer: null
        # Milliseconds before an unfinished KV transfer is cancelled. TRT-LLM's
        # default (60 s) is tuned for short prompts at low concurrency; large
        # multi-turn workloads want a much larger value.
        kv_transfer_timeout_ms: null
        # Per-role overrides merged over trtllm_cfg (TP, the MoE split, and any
        # other trtllm_cfg key), so the roles can have different shapes. A key
        # set here WINS over trtllm_cfg -- pinning tensor_parallel_size below
        # would make trtllm_cfg.tensor_parallel_size a no-op for the disagg
        # layout, silently. Empty means both roles inherit trtllm_cfg unchanged.
        # Each role must satisfy moe_tp * moe_ep == its own TP. For example:
        #   ctx_trtllm_kwargs:
        #     tensor_parallel_size: 4
        #   gen_trtllm_kwargs:
        #     tensor_parallel_size: 2
        ctx_trtllm_kwargs: {}
        gen_trtllm_kwargs: {}
    trtllm_kwargs:
      batch_wait_timeout_iters: 32
      batch_wait_max_tokens_ratio: 0.5
    colocated:
      enabled: true
      resources:
        gpus_per_node: null
        num_nodes: null

logger:
  wandb_enabled: true

cluster:
  gpus_per_node: 1
  num_nodes: 1
