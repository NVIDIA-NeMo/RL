# 4-NODE COLOCATED variant of grpo_birdbench.yaml (scripts/local.env.example points CONFIG here).
# Same recipe as grpo_birdbench.yaml: 32768 total tokens (prompt + response), 32 prompts x 8 generations,
# colocated, Megatron TP4 x CP4 x PP1 = 16 GPUs per replica, EP16; vLLM TP8/EP8 shares the GPUs.
# The full v3 RL data has prompts up to ~23k tokens, so do not shrink max_total_sequence_length.
#   8-GPU nodes (DFW):  4 nodes = 32 GPUs -> DP=2 (the layout grpo_birdbench.yaml was run with).
#   4-GPU nodes (CMH):  4 nodes = 16 GPUs -> DP=1 (optimizer state not sharded over DP: memory is tighter, and
#                       untested at 32768 tokens; use 8 nodes for DP=2).
# cluster.num_nodes / gpus_per_node are overridden at launch by NUM_NODES / GPUS_PER_NODE.
#
# GRPO / CISPO Algorithm Configuration for BIRDBench (text-to-SQL)
#
# Online RL via NeMo-Gym: rollouts are generated live by vLLM, routed through
# the `bird_sql` NeMo-Gym resource server (3rdparty/Gym-workspace/Gym/resources_servers/bird_sql),
# which extracts the SQL from the model response, executes it (and the gold
# query) against the per-`db_id` SQLite database, and returns a binary
# execution-accuracy reward. No custom reward code needed -- it's already
# implemented there (eval_utils.py + app.py, both stdlib `sqlite3`, no tool calls).
#
# Data must be in NeMo-Gym task format: each JSONL line needs `question`,
# `gt_sql`, `db_id`, `sql_context`, `difficulty`, `id` (matches
# examples/data/birdbench_32k_verified.jsonl) PLUS a `responses_create_params.input`
# field with the pre-built system/user chat turn -- see
# resources_servers/bird_sql/data/example.jsonl for the exact shape, and
# resources_servers/bird_sql/README.md for the full schema. The raw
# birdbench_32k_verified.jsonl file does NOT have `responses_create_params`
# yet; wrap it before pointing TRAIN_DATA_PATH/VAL_DATA_PATH at it.
#
# To switch this from GRPO to CISPO, set loss_fn.use_cispo: true (see block below).
#
# policy/megatron_cfg below follows eiwor_birdbench.yaml for the model-size
# dependent settings (parallelism, sequence packing, optimizer CPU offload,
# micro-batch sizes, max_total_sequence_length). RL hyperparameters (learning
# rate, weight decay, betas) and policy.generation (vLLM) are GRPO-specific and
# were not taken from it -- re-tune them for your run.

grpo:
  loss_function: clipped_pg  # GRPO/CISPO (configured under loss_fn). omega_birdbench.yaml is the Omega twin of this file.
  max_num_epochs: 20
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_rollout_turns: 1  # bird_sql is single-turn (no tool calls)
  max_num_steps: 2000
  normalize_rewards: false
  use_leave_one_out_baseline: false  # plain group-mean baseline (code default is true); as in a working 4-node run
  val_period: 10
  val_start_at: -1
  val_at_start: false
  val_at_end: true
  overlong_filtering: false
  advantage_clip_low: null
  advantage_clip_high: null
  max_val_samples: null  # must be null for run_grpo_nemo_gym.py (it validates on the full val set)
  val_num_generations_per_prompt: 1
  stop_at_validation_metric: null
  stop_at_validation_threshold: null
  val_batch_size: null  # set by run_grpo_nemo_gym.py to the val set size
  seed: 42
  use_dynamic_sampling: false
  dynamic_sampling_max_gen_batches: 10
  batch_multiplier: 1
  reward_shaping:
    enabled: false
    overlong_buffer_length: 128
    overlong_buffer_penalty: 1
    max_response_length: ${policy.max_total_sequence_length}
  adv_estimator:
    name: "grpo"
    normalize_rewards: ${grpo.normalize_rewards}
    use_leave_one_out_baseline: ${grpo.use_leave_one_out_baseline}
    minus_baseline: true
  reward_scaling:
    enabled: false
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0
  skip_reference_policy_logprobs_calculation: true
  seq_logprob_error_threshold: 2  # drop sequences whose mean exp(|logp_vllm - logp_megatron|) exceeds 2 from the loss; as in the Lightning RLVR reference
  invalid_tool_call_advantage: null
  malformed_thinking_advantage: null

  async_grpo:
    enabled: false
    max_trajectory_age_steps: 1
    max_generation_failures: 0
    in_flight_weight_updates: false
    recompute_kv_cache_after_weight_updates: false

# Vanilla GRPO by default. Flip use_cispo: true (and keep ratio_clip_min/max)
# to switch to CISPO -- same run_grpo.py entrypoint, config-only change.
loss_fn:
  reference_policy_kl_penalty: 0
  reference_policy_kl_type: "k3"
  kl_input_clamp_value: 20.0
  kl_output_clamp_value: 10.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  ratio_clip_c: null
  use_on_policy_kl_approximation: false
  # Corrects the vLLM-vs-Megatron logprob mismatch (largest for MoE routing). TIS clamps the per-token weight
  # pi_train/pi_vllm to [0.2, 5]; same values as the Lightning RLVR reference (nemotron-3.5-lightning/rlvr.yaml).
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 5
  truncated_importance_sampling_ratio_min: 0.2
  token_level_loss: true
  use_cispo: false
  # ratio_clip_min: 1.0     # uncomment + set use_cispo: true for CISPO
  # ratio_clip_max: 5.0

checkpointing:
  enabled: true
  checkpoint_dir: "results/grpo_birdbench_4node_colocated"
  metric_name: "val:accuracy"
  higher_is_better: true
  keep_top_k: 3
  save_period: 10
  checkpoint_must_save_by: "00:03:50:00"
  save_optimizer: true

policy:
  model_name: "meta-llama/Llama-3.2-1B-Instruct"  # overridden by MODEL_NAME at launch
  tokenizer:
    name: ${policy.model_name}
    chat_template_kwargs: null

  # ONE optimizer update per rollout (same in grpo_birdbench.yaml and omega_birdbench.yaml for a side-by-side comparison):
  # gbs == num_prompts_per_step x num_generations_per_prompt = 32 x 16 = 512. Omega requires this (its group weights come from
  # the policy at the start of the step); for GRPO it makes the PPO ratio 1, so clipping is inactive and TIS still applies.
  # Don't set loss_fn.force_on_policy_ratio: Omega needs real prev_logprobs (keep it off in both for parity).
  train_global_batch_size: 512
  train_micro_batch_size: 1  # as in the Lightning RLVR reference (packing, not the micro-batch, sets token count)
  logprob_batch_size: ${policy.train_micro_batch_size}  # keep equal to train_micro_batch_size for TP >= 4 numerical consistency

  max_total_sequence_length: 32768  # prompt + response; longest RL prompt is ~23k tokens, so >= 9.7k remain for the response. max_new_tokens and vLLM max_model_len follow it.
  precision: "bfloat16"
  logprob_chunk_size: null

  offload_optimizer_for_logprob: false  # as in the Lightning reference and a working 4-node run (with optimizer_cpu_offload off, true would copy optimizer state to CPU every step)
  offload_policy_before_refit: false  # required by the current schema (non-colocated refit); the repo's configs use false
  offload_optimizer_for_refit: true  # required by the current schema; moves optimizer state to CPU around refit (repo default)

  automodel_cfg:  # renamed from dtensor_cfg in current NeMo-RL; this recipe uses Megatron
    enabled: false

  dynamic_batching:
    enabled: false

  sequence_packing:
    enabled: true  # required by Megatron whenever context_parallel_size > 1 (see megatron_cfg below); as in eiwor_birdbench.yaml
    train_mb_tokens: 32768  # max tokens per packed bin (must be >= max_total_sequence_length)
    logprob_mb_tokens: 32768
    algorithm: "modified_first_fit_decreasing"
    microbatch_order: "packer"
    fuse_loss: true  # fused loss path for packed sequences, as in a working 4-node run

  make_sequence_length_divisible_by: 32
  max_grad_norm: 0.1 # 1.0

  optimizer: null
  scheduler:
    - name: "torch.optim.lr_scheduler.ConstantLR"
      kwargs:
        factor: 1.0
        total_iters: 10000000000
    - milestones: []

  # Active backend, matching oapl_birdbench.yaml's tuned parallelism.
  megatron_cfg:
    enabled: true
    env_vars: {}  # no NVTE CPU offload (it was only needed with fine-grained activation offload)
    checkpoint:
      async_save: false
      ckpt_assume_constant_structure: false
    use_fused_linear_logprobs: false
    fused_linear_logprobs_chunk_size: 256
    force_reconvert_from_hf: False
    empty_unused_memory_level: 1
    activation_checkpointing: true  # full recompute (recompute_granularity omitted -> "full"), as in the Lightning reference and a working 4-node run
    cuda_graph_impl: "none"
    cuda_graph_modules: []
    cuda_graph_warmup_steps: 3
    fine_grained_activation_offloading: false  # was true with offload_modules ["moe_act"]; off in the working run
    offload_modules: []
    tensor_model_parallel_size: 4
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 16
    pipeline_model_parallel_size: 1
    context_parallel_size: 4
    pipeline_dtype: ${policy.precision}
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    sequence_parallel: true
    freeze_moe_router: true  # as in the Lightning reference and a working 4-node run
    moe_router_dtype: "fp64"
    moe_router_load_balancing_type: none
    moe_router_bias_update_rate: 1e-3
    moe_permute_fusion: true
    apply_rope_fusion: True
    bias_activation_fusion: false
    defer_fp32_logits: true  # as in the Lightning reference; the fp32 logits OOMed the 2-node run
    moe_per_layer_logging: False
    moe_enable_deepep: false
    moe_token_dispatcher_type: "alltoall"
    moe_shared_expert_overlap: false
    use_gloo_process_groups: false
    gradient_accumulation_fusion: false
    use_fused_weighted_squared_relu: true  # fused MoE-expert squared ReLU; as in the Lightning RLVR reference (falls back to unfused if not applicable)
    # 1, not 0: the checkpoint's hybrid_layer_pattern has one MTP block and r0.8.0 does not strip it for 0 ("defines 1 MTP
    # depths, but mtp_num_layers is 0"). The loss factor below is 0, so MTP still has no effect on training (was 5).
    mtp_num_layers: 1
    mtp_use_repeated_layer: true
    mtp_loss_scaling_factor: 0.0  # was 0.3
    mtp_detach_heads: true

    peft:
      enabled: false
      target_modules: []
      exclude_modules: []
      dim: 8
      alpha: 32
      dropout: 0.0
      dropout_position: "post"
      lora_A_init_method: "xavier"
      lora_B_init_method: "zero"
      a2a_experimental: false
      lora_dtype: null

    optimizer:
      optimizer: "adam"
      lr: 1.0e-6
      min_lr: 1.0e-7
      weight_decay: 0.0
      bf16: true
      fp16: false
      params_dtype: "float32"
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1e-8
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: false  # a working colocated run uses false; the non-colocated reference uses true
      optimizer_cpu_offload: false  # 32 training GPUs shard the optimizer state; as in the reference and a working 4-node run
      optimizer_offload_fraction: 0.0
      overlap_cpu_optimizer_d2h_h2d: false
      clip_grad: ${policy.max_grad_norm}

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: 100000
      lr_warmup_iters: 8  # counts optimizer updates, not rollouts: with 1 update per rollout this is 8 rollouts
      lr_warmup_init: 5.0e-7
      override_opt_param_scheduler: true

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      # As in the NeMo-RL Nemotron-3.5-Lightning RLVR reference
      # (NVIDIA-NeMo/RL examples/nemo_gym/nemotron-3.5-lightning/rlvr.yaml).
      overlap_grad_reduce: false
      overlap_param_gather: true
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

    fp8_cfg:
      enabled: false
      fp8: "e4m3"
      fp8_recipe: "blockwise"
      fp8_param: false

  draft:
    enabled: false
    model_name: null
    loss_weight: 0.1
    num_layers: null
    aux_layer_indices: null

  generation:
    backend: "vllm"
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0
    top_k: null
    val_temperature: ${.temperature}
    val_top_p: ${.top_p}
    val_top_k: ${.top_k}
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: true
      precision: ${policy.precision}
      tensor_parallel_size: 8  # vLLM settings from a working 4-node colocated run (TP8, EP8)
      pipeline_parallel_size: 1
      expert_parallel_size: 8
      gpu_memory_utilization: 0.45  # colocated: vLLM shares each GPU with the Megatron training state
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: false
      use_deep_gemm: False
      num_last_layers_in_bf16: 0
      num_first_layers_in_bf16: 0
      kv_cache_dtype: "auto"
      expose_http_server: true  # required: NeMo-Gym calls the policy over HTTP
      skip_tokenizer_init: false
      http_server_serving_chat_kwargs:
        enable_auto_tools: false  # bird_sql is single-turn, no tool calls
        # Same parser as evaluate_bird.sbatch (`--reasoning-parser nemotron_v3`), built into vLLM (r0.8.0 pins vllm==0.29.0),
        # so training and eval split <think>...</think> from the answer the same way.
        reasoning_parser: nemotron_v3
        # Previously (copied from the Lightning RLVR reference, examples/nemo_gym/nemotron-3.5-lightning/rlvr.yaml): NeMo-RL's own
        # plugin parser, a subclass of vLLM's DeepSeek-R1 parser. If the vLLM server fails at startup with an unknown
        # reasoning parser "nemotron_v3", revert to these two lines (the plugin line goes back under vllm_cfg, below):
        # reasoning_parser: nano_v3
      # reasoning_parser_plugin: nemo_rl/models/generation/vllm/reasoning_parsers/nano_v3_reasoning_parser.py
    vllm_kwargs:
      # Same backends as the Lightning RLVR reference and a working 4-node run.
      attention_backend: FLASH_ATTN
      moe_backend: flashinfer_cutlass
      mamba_ssm_cache_dtype: float32  # hybrid Mamba model: keep the SSM state in fp32
      max_num_seqs: 128  # a vllm_kwargs entry here (the reference puts it there too), not a vllm_cfg field
      compilation_config:
        backend: inductor
        cudagraph_mode: FULL_AND_PIECEWISE
        cudagraph_capture_sizes: [1, 2, 4, 8, 12, 16, 24, 32, 40, 48, 56, 64, 80, 96, 112, 128]
        pass_config:
          fuse_allreduce_rms: false
    # Colocated, as in a working 4-node run: all 32 GPUs train (TP4 x CP4 x PP1 = 16 per
    # replica, DP=2, EP16) and vLLM (TP8, EP8) shares them. offload_after_refit() runs in this
    # mode. On the 2026-09-01 NeMo-RL snapshot it crashed (illegal memory access: Mamba A_log read after the
    # params were offloaded); current NeMo-RL fixes that, so keep this checkout up to date.
    colocated:
      enabled: true
      resources:  # required by the config schema; only used when enabled is false
        gpus_per_node: null
        num_nodes: null

data:
  max_input_seq_length: null  # nemo-gym dataset doesn't use this parameter; prompt is built server-side
  shuffle: true
  num_workers: 0
  use_multiple_dataloader: false

  # Must be wrapped into NeMo-Gym task format first -- see the module docstring
  # above. TRAIN_DATA_PATH / VAL_DATA_PATH (set via launch script / local.env)
  # override these.
  train:
    data_path: /path/to/local/birdbench_train_gym.jsonl
  validation:
    data_path: /path/to/local/birdbench_val_gym.jsonl
  default:
    dataset_name: NemoGymDataset
    env_name: "nemo_gym"
    prompt_file: null
    system_prompt_file: null
    processor: "nemo_gym_data_processor"

env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  should_mask_flagged_samples: true
  nemo_gym:
    port_range_low: 5000
    port_range_high: 5999
    is_trajectory_collection: false
    # Gym refuses to start when the parent venv's openai doesn't satisfy the nemo-gym
    # distribution's *installed* metadata. The container's prebuilt NemoGym actor venv
    # has stale metadata (openai<=2.7.2, from nemo-rl's uv.lock) while the Gym on the
    # birdspark branch pins openai==2.44.0 (scripts/local.env.example upgrades the
    # packages via SETUP_COMMAND, but not that metadata). With this set, Gym skips
    # pinning the parent's openai into the server venvs; they resolve openai==2.44.0
    # from the mounted Gym's current pyproject, i.e. the same version.
    allow_openai_version_skew: true
    # Per-server logs (policy_model.log, bird_sql_resources_server.log, ...) so a server that
    # stalls during venv setup can be diagnosed; the driver log only shows a few lines of it.
    nemo_gym_log_dir: logs/nemo_gym
    # The 600s default expired while policy_model was still setting up its venv (3/4 servers
    # were ready). uv serializes concurrent installs on a shared cache, so allow cold installs.
    server_spinup_timeout_seconds: 1800
    uv_lock_timeout_seconds: 1800
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml  # Required, must be *for_training
    - resources_servers/bird_sql/configs/bird_sql.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          # Thinking ON, as in the Lightning RLVR reference (examples/nemo_gym/nemotron-3.5-lightning/rlvr.yaml): the model
          # generates <think>...</think> then the answer. Requires the vLLM reasoning_parser above; Gym re-wraps the
          # parsed reasoning in <think> tags (uses_reasoning_parser: true is also the vllm_model_for_training.yaml default).
          uses_reasoning_parser: true
          chat_template_kwargs:
            enable_thinking: true
    # BIRD SQLite databases: point at your shared-storage copy so the
    # resources_servers/bird_sql/setup_bird_sql.py idempotency check finds
    # them and skips downloading.
    # Layout must be <bird_sql_dir>/train/train_databases/<db_id>/<db_id>.sqlite
    # for split: train, or <bird_sql_dir>/dev_20240627/dev_databases/... for dev.
    # Set via BIRD_SQL_DB_DIR / BIRD_SQL_SPLIT / BIRD_SQL_DIALECT (see
    # local.env.example / launch_offline_rl_slurm.sh). The server has one split
    # and one dialect; both must match the data files.
    bird_sql_resources_server:
      resources_servers:
        bird_sql:
          bird_sql_dir: /path/to/local/bird_sql_databases
          split: train       # train db_ids (the RL data); "dev" for the 1534-task dev set
          dialect: sqlite    # SQL dialect executed; must match the prompts

logger:
  log_dir: "logs/grpo-birdbench-4node-colocated"
  num_val_samples_to_print: 10
  wandb_enabled: true
  tensorboard_enabled: false
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: "grpo-birdbench"
    name: "grpo-birdbench"
    log_nemo_gym_full_result_tables: true  # W&B Table of every rollout's full Gym result (JSON: response, reward, ...), train and val
  tensorboard: {}
  mlflow:
    experiment_name: "grpo-birdbench"
    run_name: "grpo-birdbench"
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 8
  num_nodes: 4
  segment_size: null
