# GRPO Algorithm Configuration for GenRM DWRL
grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  num_val_generations_per_prompt: 1   # must be 1 for DWRL to work correctly
  max_rollout_turns: 1
  max_num_epochs: 1
  max_num_steps: 1000000
  normalize_rewards: false    # not used by DWRL, value doesn't matter
  use_leave_one_out_baseline: true
  val_period: 5
  val_start_at: -1  # First step eligible for periodic validation; -1 disables the delay
  val_at_start: false
  val_at_end: false
  overlong_filtering: false
  advantage_clip_low: null
  advantage_clip_high: null
  max_val_samples: null
  # Validation rollouts per prompt; k > 1 also reports the pass_k metric.
  # max_val_samples counts PROMPTS: total validation rollouts = max_val_samples * k.
  val_num_generations_per_prompt: 1
  # Early stop once this metric (e.g. accuracy or pass_k) reaches the threshold; null disables.
  stop_at_validation_metric: null
  # Required when stop_at_validation_metric is set.
  stop_at_validation_threshold: null
  val_batch_size: 32
  seed: 42

  use_dynamic_sampling: false
  dynamic_sampling_max_gen_batches: 10
  batch_multiplier: 1

  reward_shaping:
    enabled: false
    overlong_buffer_length: 128
    overlong_buffer_penalty: 1
    max_response_length: ${policy.max_total_sequence_length}
    stop_properly_penalty_coef: null

  # Advantage Estimator Configuration
  # Options: "grpo" (default) or "reinforce_plus_plus"
  adv_estimator:
    name: "grpo"  # Use "reinforce_plus_plus" for Reinforce++ estimator
    normalize_rewards: ${grpo.normalize_rewards}
    use_leave_one_out_baseline: ${grpo.use_leave_one_out_baseline}
    minus_baseline: true  # Reinforce++-baseline specific: subtract per-prompt mean baseline
    proximal_teacher_alpha: 1.0  # OPD/TROPD teacher interpolation weight in (0, 1]
    subtract_global_baseline: false  # OPD/TROPD: center valid token advantages globally
  reward_scaling:
    enabled: false
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0
  seq_logprob_error_threshold: null
  # Advantage value assigned to invalid tool call tokens (e.g. -5.0 to penalize). null disables.
  invalid_tool_call_advantage: null
  # Advantage value assigned to tokens with malformed <think>/</think> tags (e.g. -5.0). null disables.
  malformed_thinking_advantage: null

  async_grpo:
    enabled: false # Set to true to enable async training mode
    # Max age (in training steps) for trajectories used in training
    max_trajectory_age_steps: 1
    # Number of generation-worker failures tolerated before aborting.
    # 0 (default) = fail on the first worker exception. Increase only
    # when transient generation errors are expected and acceptable to drop.
    max_generation_failures: 0
    in_flight_weight_updates: false # Set to true to enable in-flight weight updates
    recompute_kv_cache_after_weight_updates: false # Set to true to recompute kv cache after weight updates

  dwrl:
    bt_prompt: "Based on your evaluation, is the original response good? Answer with only a single word: yes or no"
    score_token: "yes"
    opposite_token: "no"
    use_env_rewards: false

# Reward-zeroing penalties applied to NeMo-Gym rollout results.
reward_penalties:
  penalize_duplicated_reasoning: false
  penalize_empty_final_answer: false
  penalize_unwanted_tokens: false
  penalize_malformed_think_tag: false
  # Optional model/tokenizer-specific token IDs. Add token IDs that should
  # be penalized when emitted by the model. Unwanted token IDs must be
  # specified explicitly; think-tag IDs are inferred when each tag encodes
  # to one token. Example: {unwanted: [2], think_open: 12, think_close: 13}
  token_ids: null

loss_fn:
  reference_policy_kl_penalty: 0.0  # for DWRL this should always be 0
  reference_policy_kl_type: "k3"
  kl_input_clamp_value: 20.0
  kl_output_clamp_value: 10.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  ratio_clip_c: null
  # (default off) loss formulation improvements (docs/guides/grpo.md#loss)
  use_on_policy_kl_approximation: false
  # Async GRPO requires importance sampling correction enabled
  # Set to true when async_grpo.enabled is true
  use_importance_sampling_correction: false
  # "tis"          – clamp IS weights to [min, max], where min defaults to 0
  # "icepop"       – zero out tokens with IS weight outside [min, max]
  # "seq-mask-tis" – zero out sequences by geometric-mean IS ratio, non-truncated token IS correction
  truncated_importance_sampling_type: null
  truncated_importance_sampling_ratio: null
  # TIS lower bound; null means 0 for TIS. Set explicitly for ICE-POP / seq-mask-tis.
  truncated_importance_sampling_ratio_min: null
  sequence_level_importance_ratios: false
  token_level_loss: true
  force_on_policy_ratio: false  # Set to true to force ratio=1.0 (requires train_global_batch_size == num_prompts_per_step * num_generations_per_prompt)
  use_kl_in_reward: false  # Reinforce++: add KL penalty to reward instead of loss
  use_cispo: false  # CISPO (https://arxiv.org/abs/2506.13585): clipped IS-weight policy optimization
  # Disable PPO ratio (curr_logprobs - prev_logprobs).exp(); falls back to REINFORCE-style
  # surrogate loss. Used by REINFORCE/RLOO. See https://arxiv.org/abs/2402.14740
  disable_ppo_ratio: false
  # VAPO positive-example NLL loss weight: L = L_PPO + mu * L_NLL(correct samples).
  # 0.0 disables it. VAPO paper recommends 0.1.
  positive_example_nll_weight: 0.0
  ce_penalty: 0.001

checkpointing:
  enabled: true
  checkpoint_dir: "results/grpo_genrm_dwrl"
  metric_name: "val:accuracy"
  higher_is_better: true
  keep_top_k: 10000
  save_period: 10
  checkpoint_must_save_by: "00:03:30:00"
  # Async GRPO: restore replay-buffer state on resume. Set false to regenerate
  # the buffered window fresh instead of reusing completed groups (which skew
  # toward short rollouts at a save boundary).
  load_replay_buffer: false
  model_save_format: "safetensors"   # must be null if policy.dtensor_cfg._v2 == false
  save_consolidated: false
  save_optimizer: true

policy:
  model_name: "Qwen/Qwen3-1.7B"  # Use base model, not instruct version
  tokenizer:
    name: ${policy.model_name}
    chat_template_kwargs: null
    use_fastokens: false # opt-in Rust-backed BPE tokenizer (~10x faster encode); requires the fastokens-b10 wheel. NRL_USE_FASTOKENS overrides at runtime.
  hf_config_overrides: {}
  train_global_batch_size: 256
  train_micro_batch_size: 1
  generation_batch_size: 32
  logprob_batch_size: ${policy.train_micro_batch_size}
  max_total_sequence_length: 8192
  precision: "bfloat16"
  logprob_chunk_size: null
  offload_optimizer_for_logprob: false

  dtensor_cfg:
    _v2: true
    enabled: false
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null

    # Automodel kwargs passed to from_pretrained.
    # Uncomment force_hf if the custom model's adapter doesn't support per-tensor
    # weight conversion (e.g. Qwen2, Llama). Auto-detected if not set.
    # See https://github.com/NVIDIA-NeMo/RL/issues/2072
    automodel_kwargs: {}
      # force_hf: true

    # LoRA (Low-Rank Adaptation) Configuration
    lora_cfg:
      enabled: False  # Set to True to enable LoRA fine-tuning
      target_modules: []  # List of module names to apply LoRA (empty list with match_all_linear=true applies to all linear layers)
      exclude_modules: []  # List of module names to exclude from LoRA
      match_all_linear: true  # If True, applies LoRA to all linear layers (overrides target_modules)
      dim: 8  # LoRA rank (r): lower rank = fewer parameters but less capacity. Typical values: 4, 8, 16, 32, 64
      alpha: 32  # LoRA scaling factor: effective learning rate multiplier = alpha/dim. Typical values: 16, 32, 64
      dropout: 0.0  # Dropout probability applied to LoRA layers (0.0 = no dropout)
      dropout_position: "post"  # Where to apply dropout: "pre" (before LoRA) or "post" (after LoRA)
      lora_A_init: "xavier"  # Initialization method for LoRA A matrix: "xavier" or "uniform"
      use_triton: true  # Use Triton-optimized kernels for LoRA (faster but requires flash-attn). Disable when tensor_parallel_size > 1
  
  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 2
    activation_checkpointing: true

    tensor_model_parallel_size: 4
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 16
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 2
    pipeline_dtype: ${policy.precision}
    sequence_parallel: true

    # MoE
    freeze_moe_router: true
    moe_router_dtype: "fp32"
    moe_router_load_balancing_type: "none"
    moe_router_bias_update_rate: 1.0e-3
    moe_router_enable_expert_bias: true
    moe_permute_fusion: true
    moe_enable_deepep: false
    moe_token_dispatcher_type: "alltoall"
    moe_aux_loss_coeff: 0.0
    moe_shared_expert_overlap: false


    # Compute
    apply_rope_fusion: true
    use_fused_weighted_squared_relu: true
    bias_activation_fusion: false
    defer_fp32_logits: true

    # Logging
    track_moe_metrics: true
    moe_per_layer_logging: true

    # MTP training heads
    mtp_loss_scaling_factor: 0.3
    mtp_use_repeated_layer: true
    mtp_num_layers: 5
    mtp_detach_heads: true

    optimizer:
      optimizer: "adam"
      lr: 4.0e-6
      min_lr: 4.0e-6
      weight_decay: 0.0
      bf16: true
      fp16: false
      params_dtype: "float32"

      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1e-8

      sgd_momentum: 0.9

      use_distributed_optimizer: true
      use_precision_aware_optimizer: true

      clip_grad: ${policy.max_grad_norm}

      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: null
      lr_warmup_iters: 10
      lr_warmup_init: 4e-7
      override_opt_param_scheduler: true

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: true
      average_in_collective: false
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

    gradient_accumulation_fusion: false

    # FP8 — disabled for bf16 runs. Enable for mxfp8 validation.
    fp8_cfg:
      enabled: false
      fp8: "e4m3"
      fp8_recipe: "mxfp8"
      fp8_param: false

    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 1
    num_layers_at_end_in_bf16: 1

    use_gloo_process_groups: false

    checkpoint:
      async_save: true
      ckpt_assume_constant_structure: true
      fully_parallel_save_process_group: "ep_dp"
      fully_parallel_load_process_group: "ep_dp"
      fully_parallel_load_exchange_algo: "broadcast"

    env_vars: null


  draft:
    enabled: false
    model_name: null
    loss_weight: 0.1
    num_layers: null
    aux_layer_indices: null

  # See docs/design-docs/sequence-packing-and-dynamic-batching.md 
  # for more details on dynamic batching and sequence packing.
  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64

  sequence_packing:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    microbatch_order: "packer"
    sequence_length_round: 64
    fuse_loss: false

  # makes the training sequence length divisible by the tensor parallel size
  # this is useful for sequence parallel training
  make_sequence_length_divisible_by: ${mul:${mul:${policy.megatron_cfg.tensor_model_parallel_size}, ${policy.megatron_cfg.context_parallel_size}}, 2}
  max_grad_norm: 1.0

  optimizer: null
  scheduler: null

  generation:
    port_range_low: 3000
    port_range_high: 4999
    backend: "vllm"
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0
    top_k: null
    val_temperature: ${.temperature}
    val_top_p: ${.top_p}
    val_top_k: ${.top_k}
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: true
      precision: ${policy.precision}
      kv_cache_dtype: "auto"
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
      expert_parallel_size: 4
      gpu_memory_utilization: 0.8
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: false
      use_deep_gemm: false
      num_last_layers_in_bf16: 0
      num_first_layers_in_bf16: 0
      enable_vllm_metrics_logger: true
      vllm_metrics_logger_interval: 0.5
      expose_http_server: true
      skip_tokenizer_init: false
      #http_server_serving_chat_kwargs:
      #  enable_auto_tools: true
      #  tool_parser: qwen3_coder
      #  reasoning_parser: nano_v3
      #reasoning_parser_plugin: nemo_rl/models/generation/vllm/reasoning_parsers/nano_v3_reasoning_parser.py

    vllm_kwargs:
      # Use the Super branch's pinned vLLM/FlashInfer serving backend. This
      # must remain compatible with repeated refits.
      moe_backend: flashinfer_cutlass
      attention_backend: FLASH_ATTN
      max_num_seqs: 256
      max_num_batched_tokens: 32768
      mamba_ssm_cache_dtype: "float32"
      compilation_config:
        cudagraph_capture_sizes: [1,2,4,8,16,32,64]
        pass_config:
          fuse_allreduce_rms: false

    colocated:
      # true: generation shares training GPUs
      # false: uses dedicated generation resources
      enabled: false
      # only relevant when enabled is false
      resources:
        gpus_per_node: null # Decides num gpus to be dedicated to generation when there is one node in the cluster i.e cluster.num_nodes == 1
        num_nodes: null # Decides number of nodes to be dedicated to generation

# Data configuration
data:
  max_input_seq_length: ${policy.max_total_sequence_length} # upper bound, real truncation occurs at vllm.max_model_len
  shuffle: true
  num_workers: 1

  # use multiple dataloader for train
  # see https://github.com/NVIDIA-NeMo/RL/blob/main/docs/guides/grpo.md#multiple-dataloaders for more details.
  use_multiple_dataloader: false

  # dataset
  train:
    data_path: "path/to/your/train.jsonl"  # Update with your data path
  validation:
    data_path: "path/to/your/val.jsonl"      # Optional validation data path
  # default settings for all datasets
  default:
    dataset_name: "genrm_dwrl"
    prompt_file: null
    system_prompt_file: null
    #processor: null
    env_name: "genrm_dwrl"

env:
  should_use_nemo_gym: false
  genrm_dwrl:
    reward_design: rb0
    num_workers: 8
    score_weight: 1.0
    ranking_weight: 1.0

# Logger configuration
logger:
  log_dir: "logs"  # Base directory for all logs
  num_val_samples_to_print: 0 # Number of validation samples to pretty print on terminal
  wandb_enabled: false
  tensorboard_enabled: false
  mlflow_enabled: false  # Disable MLflow logging
  swanlab_enabled: false # Disable SwanLab logging
  monitor_gpus: false  # If true, will monitor GPU usage and log to wandb and/or tensorboard
  wandb:
    project: "grpo-genrm-dwrl"
    name: "grpo-genrm-dwrl-logger"
    # Complete Gym payloads can create very large W&B artifacts. Enable only for debugging.
    log_nemo_gym_full_result_tables: false
  swanlab:
    project: "grpo-dev"
    name: "grpo-dev-logger"
  tensorboard: {}
  mlflow:
    experiment_name: "grpo-genrm-dwrl"
    run_name: "grpo-genrm-dwrl-logger"
    tracking_uri: "http://localhost:5000"
  gpu_monitoring:
    collection_interval: 10  # How often to collect GPU usage metrics (in seconds)
    flush_interval: 10  # How often to flush GPU usage metrics to the loggers (in seconds)

cluster:
  gpus_per_node: 1
  num_nodes: 1
  # Port range for the distributed master address (TCPStore / NCCL rendezvous)
  # and per-worker available ports.  Kept below the OS ephemeral range
  # (32768-60999 on stock Linux).  See ray.sub for the full port layout.
  master_port_range_low: 1400
  master_port_range_high: 1999
  segment_size: null  # Nodes per NVLink domain segment for topology-aware alignment; null to disable

# TransferQueue-mediated data plane for sync GRPO.
# Off by default — the legacy grpo_train trainer never engages this.
# Flip enabled=true and run grpo_train_sync to use TQ-mediated bulk
# transfer between rollout and train. See nemo_rl/data_plane/README.md.
data_plane:
  enabled: false
  impl: transfer_queue
  backend: "simple"                  # TQ storage backend ('simple' or 'mooncake_cpu')
  storage_capacity: 1000000          # max samples retained per partition
  num_storage_units: 2               # storage shards
  claim_meta_poll_interval_s: 0.5    # blocking-claim poll cadence
  global_segment_size: 549755813888  # 512 GiB — used when backend == "mooncake_cpu"
  local_buffer_size:   68719476736   # 64 GiB  — used when backend == "mooncake_cpu"
  # observability:                    # NotRequired
  #   enabled: false

# Multi-Teacher On-Policy Distillation (MOPD): distills from one or more teacher
# models into the policy via token-level teacher-minus-student logprob advantages,
# served by non-colocated teacher worker groups (OPD advantage estimator +
# nemo_gym). null = disabled (default). See
# examples/configs/recipes/llm/mopd-qwen3-1.7b-3n8g-megatron-pack.yaml for a full
# enabled example.
on_policy_distillation: null
