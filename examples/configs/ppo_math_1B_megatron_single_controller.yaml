# SingleController variant of ppo_math_1B_megatron.yaml.
#
# The `ppo:` block is what selects the PPO path; everything PPO shares with
# GRPO (batch sizing, staleness, sequence-error masking) is configured under
# `grpo:` / `async_rl:` exactly as on the SC GRPO path, so this inherits the
# SC GRPO exemplar and adds only what a critic needs.
defaults: grpo_math_1B_megatron_single_controller.yaml

ppo:
  # Only "gae" is supported here -- the value-free estimators live under
  # grpo.adv_estimator.
  adv_estimator:
    name: gae
    gae_lambda: 0.95
    gae_gamma: 1.0
    normalize_advantages: true
    # VAPO decoupled GAE. null for both = standard GAE.
    gae_lambda_value: null
    gae_lambda_policy: null
    # Length-adaptive lambda_policy = 1 - 1/(alpha * l). 0 disables it.
    length_adaptive_alpha: 0.0
  # Steps of critic-only warmup before the policy starts training. The policy is
  # neither updated nor transferred to generation while below this.
  policy_training_start_step: 0

grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 8

async_rl:
  # The critic has no split train API, so one train_from_meta call is one
  # optimizer step; setup requires this to equal num_prompts_per_step so a step
  # is assembled from a single chunk.
  min_groups_for_streaming_train: ${grpo.num_prompts_per_step}
  max_inflight_prompts: ${grpo.num_prompts_per_step}

loss_fn:
  reference_policy_kl_penalty: 0.0
  ratio_clip_max: 0.28
  ratio_clip_c: 10
  use_kl_in_reward: false

value_loss_fn:
  scale: 0.4
  cliprange: 0.2

policy:
  train_global_batch_size: ${mul:${grpo.num_prompts_per_step}, ${grpo.num_generations_per_prompt}}

# Megatron-Core critic. Same schema as the legacy PPO `value:` block; only the
# backend selection and optimizer ownership differ from ppo_math_1B.yaml.
value:
  model_name: ${policy.model_name}
  tokenizer:
    name: ${value.model_name}
    chat_template_kwargs: null
  hf_config_overrides: {}

  train_global_batch_size: ${policy.train_global_batch_size}
  train_micro_batch_size: ${policy.train_micro_batch_size}
  max_total_sequence_length: ${policy.max_total_sequence_length}
  make_sequence_length_divisible_by: ${value.megatron_cfg.tensor_model_parallel_size}
  precision: "bfloat16"

  reward_model_cfg:
    enabled: false  # only used for the DTensor V2 value worker
    reward_model_type: "regression"

  dtensor_cfg:
    _v2: true
    enabled: false
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null
    lora_cfg:
      enabled: false
      target_modules: []
      exclude_modules: []
      match_all_linear: true
      dim: 8
      alpha: 32
      dropout: 0.0
      dropout_position: "post"
      lora_A_init: "xavier"
      use_triton: true

  megatron_cfg:
    enabled: true
    checkpoint:
      async_save: false
      ckpt_assume_constant_structure: false
    empty_unused_memory_level: 1
    activation_checkpointing: false
    # Module-level activation CPU offload; see docs/design-docs/training-backends.md.
    # On TE >= 2.10 also set megatron_cfg.env_vars.NVTE_CPU_OFFLOAD_V1: "1".
    fine_grained_activation_offloading: false
    # Modules to offload when enabled; null disables module selection. Common
    # examples: ["core_attn", "attn_proj", "expert_fc1", "moe_act"]. Supported
    # names depend on the pinned Megatron-LM version and are validated by MCore.
    # "attn_proj" requires "core_attn". See the latest upstream module reference:
    # https://github.com/NVIDIA/Megatron-LM/blob/main/docs/user-guide/features/fine_grained_activation_offloading.md#offloadable-modules
    offload_modules: null
    tensor_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 1
    pipeline_dtype: ${value.precision}
    sequence_parallel: false
    freeze_moe_router: true
    moe_router_dtype: "fp64"
    moe_router_load_balancing_type: "none"
    moe_router_bias_update_rate: 0.0
    moe_permute_fusion: false
    moe_enable_deepep: false
    moe_token_dispatcher_type: "allgather"
    moe_shared_expert_overlap: false
    use_gloo_process_groups: false
    apply_rope_fusion: True
    bias_activation_fusion: True
    gradient_accumulation_fusion: false
    use_fused_weighted_squared_relu: false
    defer_fp32_logits: False
    moe_per_layer_logging: False

    optimizer:
      optimizer: "adam"
      lr: 2.0e-6
      min_lr: 1.0e-7
      weight_decay: 0.1
      bf16: true
      fp16: false
      params_dtype: "float32"
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1e-8
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: 1.0
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0
      overlap_cpu_optimizer_d2h_h2d: false

    scheduler:
      start_weight_decay: 0.1
      end_weight_decay: 0.1
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: 1000
      lr_warmup_iters: 10
      lr_warmup_init: 1.0e-7

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: true
      overlap_param_gather: true
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

    fp8_cfg:
      enabled: false
      fp8: "e4m3"
      fp8_recipe: "blockwise"
      fp8_param: false
    env_vars: null

  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${value.max_total_sequence_length}, ${value.train_micro_batch_size}}
    # Value has no separate logprob-batch config (get_values is a forward pass
    # analogous to policy logprob); reuse the train microbatch budget.
    logprob_mb_tokens: ${mul:${value.max_total_sequence_length}, ${value.train_micro_batch_size}}
    sequence_length_round: 64

  sequence_packing:
    enabled: false
    train_mb_tokens: ${mul:${value.max_total_sequence_length}, ${value.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${value.max_total_sequence_length}, ${value.train_micro_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    microbatch_order: "packer"

  max_grad_norm: 1.0

  optimizer: null
  scheduler: null

logger:
  wandb:
    name: ppo-single-controller-dev
  swanlab:
    name: ppo-single-controller-dev
  mlflow:
    run_name: ppo-single-controller-dev

checkpointing:
  checkpoint_dir: results/ppo-single-controller
