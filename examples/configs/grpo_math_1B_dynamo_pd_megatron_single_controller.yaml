# SingleController variant with Megatron prefill/decode engines behind Dynamo.
#
# Generation is disaggregated: the Dynamo frontend sends each request's prefill
# to a prefill engine, hands the KV cache to a decode engine over NIXL, and
# streams the completion back. The engines are NeMo RL's dedicated Megatron
# inference policies (one worker group per engine); each engine's rank zero
# also hosts Megatron-LM's Dynamo adapter, which registers the engine with the
# frontend.
#
# Weight updates use the collective transport, as for backend: megatron with
# colocated.enabled: false. Before each refit the prefill engines stop
# scheduling first, decode keeps running until every handed-off prefill block
# is pulled, then every engine is suspended; after the refit decode resumes,
# then prefill. dynamo_cfg.control_timeout_s bounds that wait.
defaults: grpo_math_1B_megatron_single_controller.yaml

async_rl:
  # Must be false: engines keep their caches across the refit
  # (kv_cache_management_mode: persist); the suspend does not clear KV.
  recompute_kv_cache_after_weight_updates: false
  generation_fleet_health:
    # The Dynamo frontend owns routing; the Megatron backend has no fleet health.
    enabled: false
    refit_timeout_s: null

policy:
  # Training uses the Megatron backend inherited from
  # grpo_math_1B_megatron_single_controller.yaml; the engines receive its
  # logical weights through the collective refit.
  generation:
    backend: megatron
    # Serve the engines through a managed Dynamo frontend (prefill/decode only).
    dynamo: true
    # Collective refit only.
    refit_transport: null
    dynamo_cfg:
      # Bounds etcd/NATS/frontend start-up and the engines' registration,
      # which happens right after the first weight update builds them.
      startup_timeout_s: 600
      # null waits as long as generation takes, as the direct path does.
      request_timeout_s: null
      # Bounds every control call to an engine: the pre-refit pin wait, the
      # refit phases, and the shutdown handshake that releases handoff pins.
      control_timeout_s: 900
      frontend_args:
        router_mode: kv
        extra_cli_args: []
      # Per-role layouts. null = use mcore_generation_config; set to give
      # prefill and decode different layouts; Megatron reshards the KV handoff
      # between them.
      prefill_engine:
        tensor_model_parallel_size: null
        pipeline_model_parallel_size: null
      decode_engine:
        tensor_model_parallel_size: null
        pipeline_model_parallel_size: null
    # One prefill and one decode engine per replica; every engine has the
    # layout of policy.megatron_cfg with mcore_generation_config applied, plus
    # its role's dynamo_cfg overrides above.
    disaggregation:
      enabled: true
      num_prefill_engines: 1
      num_decode_engines: 1
    mcore_generation_config:
      # KV handoff reads the registered cache buffers in place; prefix caching
      # is the allocator decode admission reuses. Both are required.
      enable_prefix_caching: true
      kv_cache_management_mode: persist
      # The Dynamo frontend is the HTTP surface.
      expose_http_server: false
      # Only read by refit_transport: mcore.
      refit_backend: null
    colocated:
      enabled: false
      resources:
        gpus_per_node: 2
        num_nodes: 1

cluster:
  gpus_per_node: 3
  num_nodes: 1

logger:
  log_dir: results/grpo-math-1b-dynamo-pd-megatron-single-controller
  wandb:
    name: grpo-dynamo-pd-megatron-single-controller-dev
  swanlab:
    name: grpo-dynamo-pd-megatron-single-controller-dev
  mlflow:
    run_name: grpo-dynamo-pd-megatron-single-controller-dev
