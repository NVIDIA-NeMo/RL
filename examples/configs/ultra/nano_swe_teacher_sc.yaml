# =============================================================================
# Nano v3 30B-A3B SWE — SingleController async GRPO + HONOURED TransferQueue
# =============================================================================
# THE path that gives all three: SWE (NeMo-Gym) + async + real TQ mediation.
# Runs via examples/run_grpo_single_controller.py (NOT run_grpo_nemo_gym.py) →
# SingleControllerActor, which drives async rollout↔train through TQReplayBuffer
# (dp_client.put_samples → TransferQueue). `run_grpo_nemo_gym.py`'s async path
# (async_grpo_train) uses an in-memory ReplayBuffer and does NOT honour TQ.
#
#   uv run ./examples/run_grpo_single_controller.py --config <this file> <overrides>
#
# data_plane.enabled=true is MANDATORY for this launcher (it raises otherwise);
# inherited from nano_swe_teacher_qwen3mesh.yaml (impl: transfer_queue).
#
# VERIFIED on 6 GB200 nodes (train 4 / gen 2), Nemotron-3-Nano-30B-A3B-BF16:
# ran train steps 1-5 with live TransferQueueController + 2 SimpleStorageUnit
# actors serving PUT_DATA / KV_RETRIEVE_META / SET_CUSTOM_META. Launch with
# swe_nano_sc_interactive.sh; see docs/guides/nano-swe-transferqueue.md.
# =============================================================================

defaults:
  - nano_swe_teacher_qwen3mesh.yaml   # SWE env + Nano mesh (TP2·PP2·CP4, alltoall, EP1) + data_plane:transfer_queue

# SingleController's own async config (SC uses this, not grpo.async_grpo). Mirrors
# examples/configs/grpo_math_1B_megatron_single_controller.yaml.
async_rl:
  sampler:
    name: in_order
    max_lookahead_versions: 1        # how far generation may run ahead of the trainer
  recompute_kv_cache_after_weight_updates: false
  min_groups_for_streaming_train: ${grpo.num_prompts_per_step}
  max_inflight_prompts: ${grpo.num_prompts_per_step}
  max_buffered_rollouts: 64          # DataPlane backpressure cap
  diagnostics: false

grpo:
  val_period: 0                      # SC does not support validation yet

checkpointing:
  enabled: false                     # SC does not support checkpointing yet

policy:
  # run_grpo_single_controller.py:111 reads policy.draft.enabled (speculative
  # draft weights). The Ultra/SWE chain has no draft block; add it, disabled.
  draft:
    enabled: false
    model_name: null
    loss_weight: 0.1
    num_layers: null
    aux_layer_indices: null

loss_fn:
  # SC initializes the reference model only when kl_penalty>0 (single_controller_utils/
  # setup.py:208: init_reference_model = reference_policy_kl_penalty > 0), and its refit
  # unconditionally swaps in reference_state_dict (megatron_policy_worker.py:1611). The SWE
  # base sets kl_penalty=0 → no reference model → AttributeError 'reference_state_dict'.
  # Enable a small KL (matches grpo_math_1B_megatron_single_controller.yaml).
  reference_policy_kl_penalty: 0.01

# Gate-authoritative token capture (token-in/token-out via NeMo-Gym; see
# docs/guides/nano-swe-token-capture.md). Dormant by default: with
# enabled=false every legacy codepath behaves exactly as before — flip to
# true (or override token_capture.enabled=true) for the capture arm.
# Requires this SingleController path with data_plane.enabled=true and the
# async vLLM backend; defaults live on TokenCaptureConfig
# (nemo_rl/algorithms/single_controller_utils/config.py).
token_capture:
  enabled: false
  # TQ partition holding per-call staged token deltas (finalizer-cleared).
  staging_partition: "rollout_staging"
  # continue: a failed worker-side stage poisons the rollout (placeholder row);
  # abort: fails the whole rollout at the gate.
  on_capture_failure: "continue"
  # allow: train groups whose calls span a refit (staleness = group's oldest
  # call version); reject: placeholder such rollouts.
  mixed_weight_version_policy: "allow"
  # Drop the whole group when fewer than this fraction of its rollouts
  # produced valid rows (null keeps every group).
  min_valid_fraction_per_group: null
  # Gate-side cleanup backstops (seconds).
  registration_ttl_s: 3600.0
  staging_ttl_s: 3600.0
  # Gym LineageIndex capacity (each in-flight rollout's cumulative tokens
  # live in the gate process). null = derived from the training config:
  # rollouts = 2 x max in-flight, tokens = rollouts x max sequence length.
  # Size explicitly for agentic workloads with deep per-rollout call trees.
  lineage_max_rollouts: null
  lineage_max_tokens: null
  # Bearer token for the gate's /ng-control/* routes. null = minted per run.
  control_auth_token: null
  # Hard deadline per control-plane call (gate death must surface as failed
  # dispatches + placeholders, not a silent retry stall).
  control_timeout_s: 60.0
  # Directory for the Gym base capture layer the gate rides on (stays
  # essentially empty on the gate path). null = <logger.log_dir>/gym_token_capture.
  capture_dir: null
