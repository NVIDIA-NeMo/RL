checkpointing:
  enabled: true
  checkpoint_dir: "results/grpo"
  metric_name: "val:total_reward/mean"
  higher_is_better: true
  keep_top_k: 1000000
  save_period: 10
  checkpoint_must_save_by: "00:03:30:00"
  model_save_format: "safetensors"
  load_replay_buffer: false
  save_consolidated: false
  save_optimizer: true

grpo:
  num_prompts_per_step: 512
  num_generations_per_prompt: 16
  val_num_generations_per_prompt: ${grpo.num_generations_per_prompt}
  max_rollout_turns: 1
  max_num_epochs: 1
  max_num_steps: 100000
  normalize_rewards: true
  use_leave_one_out_baseline: true
  advantage_clip_low: -20
  advantage_clip_high: 20
  val_period: 10000000
  val_start_at: -1
  val_at_start: false
  val_at_end: false
  overlong_filtering: false
  max_val_samples: null
  stop_at_validation_metric: null
  stop_at_validation_threshold: null
  val_batch_size: 256
  seed: 42

  use_dynamic_sampling: false
  dynamic_sampling_max_gen_batches: 10
  batch_multiplier: 1

  invalid_tool_call_advantage: -5.0
  malformed_thinking_advantage: -5.0

  adv_estimator:
    name: "grpo"  # Use "reinforce_plus_plus" for Reinforce++ estimator
    normalize_rewards: ${grpo.normalize_rewards}
    use_leave_one_out_baseline: ${grpo.use_leave_one_out_baseline}
    minus_baseline: true  # Reinforce++-baseline specific: subtract per-prompt mean baseline
    proximal_teacher_alpha: 1.0  # OPD/TROPD teacher interpolation weight in (0, 1]
    subtract_global_baseline: false  # OPD/TROPD: center valid token advantages globally
  reward_shaping:
    enabled: false
    overlong_buffer_length: 128
    overlong_buffer_penalty: 1
    max_response_length: ${policy.max_total_sequence_length}
    stop_properly_penalty_coef: null
  reward_scaling:
    enabled: false
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0

  async_grpo:
    enabled: false
    max_trajectory_age_steps: 1
    max_generation_failures: 0
    in_flight_weight_updates: true
    recompute_kv_cache_after_weight_updates: false

  seq_logprob_error_threshold: 2

loss_fn:
  reference_policy_kl_penalty: 0.0
  reference_policy_kl_type: "k3"
  kl_input_clamp_value: null
  kl_output_clamp_value: null

  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  ratio_clip_c: null
  use_on_policy_kl_approximation: true
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 5
  truncated_importance_sampling_ratio_min: 0.2
  truncated_importance_sampling_type: tis
  sequence_level_importance_ratios: false
  token_level_loss: true
  force_on_policy_ratio: true
  use_kl_in_reward: false
  use_cispo: false
  disable_ppo_ratio: false
  positive_example_nll_weight: 0.0
  ce_penalty: null

policy:
  model_name: ???
  tokenizer:
    name: ${policy.model_name}
    use_fastokens: false
    chat_template_kwargs: null
  hf_config_overrides: {}

  train_global_batch_size: 8192
  train_micro_batch_size: 1
  generation_batch_size: 64
  logprob_batch_size: 1
  max_total_sequence_length: 73728
  precision: "bfloat16"
  logprob_chunk_size: 2048
  offload_optimizer_for_logprob: false

  dtensor_cfg:
    _v2: true
    enabled: false
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null

    automodel_kwargs: {}
      # force_hf: true

    lora_cfg:
      enabled: False  # Set to True to enable LoRA fine-tuning
      target_modules: []  # List of module names to apply LoRA (empty list with match_all_linear=true applies to all linear layers)
      exclude_modules: []  # List of module names to exclude from LoRA
      match_all_linear: true  # If True, applies LoRA to all linear layers (overrides target_modules)
      dim: 8  # LoRA rank (r): lower rank = fewer parameters but less capacity. Typical values: 4, 8, 16, 32, 64
      alpha: 32  # LoRA scaling factor: effective learning rate multiplier = alpha/dim. Typical values: 16, 32, 64
      dropout: 0.0  # Dropout probability applied to LoRA layers (0.0 = no dropout)
      dropout_position: "post"  # Where to apply dropout: "pre" (before LoRA) or "post" (after LoRA)
      lora_A_init: "xavier"  # Initialization method for LoRA A matrix: "xavier" or "uniform"
      use_triton: true  # Use Triton-optimized kernels for LoRA (faster but requires flash-attn). Disable when tensor_parallel_size > 1

  draft:
    enabled: false
    model_name: null
    loss_weight: 0.1
    num_layers: null
    aux_layer_indices: null

  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 2
    activation_checkpointing: true

    tensor_model_parallel_size: 4
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 16
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 4
    pipeline_dtype: ${policy.precision}
    sequence_parallel: true

    # MoE
    freeze_moe_router: true
    moe_router_dtype: "fp32"
    moe_router_load_balancing_type: "none"
    moe_router_bias_update_rate: 1.0e-3
    moe_router_enable_expert_bias: true
    moe_permute_fusion: true
    moe_enable_deepep: false
    moe_token_dispatcher_type: "alltoall"
    moe_aux_loss_coeff: 0.0
    moe_shared_expert_overlap: false

    # Compute
    apply_rope_fusion: true
    use_fused_weighted_squared_relu: true
    bias_activation_fusion: false
    defer_fp32_logits: true

    # Logging
    track_moe_metrics: true
    moe_per_layer_logging: true

    # MTP training heads
    mtp_loss_scaling_factor: 0.3
    mtp_use_repeated_layer: true
    mtp_num_layers: 5
    mtp_detach_heads: true

    optimizer:
      optimizer: "adam"
      lr: 4.0e-6
      min_lr: 4.0e-6
      weight_decay: 0.0
      bf16: true
      fp16: false
      params_dtype: "float32"

      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1e-8

      sgd_momentum: 0.9

      use_distributed_optimizer: true
      use_precision_aware_optimizer: true

      clip_grad: ${policy.max_grad_norm}

      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: null
      lr_warmup_iters: 10
      lr_warmup_init: 4e-7
      override_opt_param_scheduler: true

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: true
      average_in_collective: false
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

    gradient_accumulation_fusion: false

    # FP8 — disabled for bf16 runs. Enable for mxfp8 validation.
    fp8_cfg:
      enabled: false
      fp8: "e4m3"
      fp8_recipe: "mxfp8"
      fp8_param: false

    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 1
    num_layers_at_end_in_bf16: 1

    use_gloo_process_groups: false

    checkpoint:
      async_save: true
      ckpt_assume_constant_structure: true
      fully_parallel_save_process_group: "ep_dp"
      fully_parallel_load_process_group: "ep_dp"
      fully_parallel_load_exchange_algo: "broadcast"

    env_vars: null

  # ---------------------------------------------------------------------------
  # Sequence Packing
  # ---------------------------------------------------------------------------
  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64

  sequence_packing:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    microbatch_order: "packer"
    sequence_length_round: 64
    fuse_loss: true

  make_sequence_length_divisible_by: ${mul:${mul:${policy.megatron_cfg.tensor_model_parallel_size}, ${policy.megatron_cfg.context_parallel_size}}, 2}
  max_grad_norm: 1.0
  optimizer: null
  scheduler: null

  generation:
    port_range_low: 3000
    port_range_high: 4999
    backend: "vllm"
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0
    top_k: null
    val_temperature: ${.temperature}
    val_top_p: ${.top_p}
    val_top_k: ${.top_k}
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: true
      precision: ${policy.precision}
      kv_cache_dtype: "auto"
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.85
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: false
      use_deep_gemm: false
      num_last_layers_in_bf16: 0
      num_first_layers_in_bf16: 0
      enable_vllm_metrics_logger: true
      vllm_metrics_logger_interval: 0.5
      expose_http_server: true
      skip_tokenizer_init: false
      http_server_serving_chat_kwargs:
        enable_auto_tools: true
        tool_parser: qwen3_coder
        reasoning_parser: nano_v3
      reasoning_parser_plugin: /lustre/fsw/portfolios/nemotron/users/degert/code/NeMo-RL-super-v3.5-dwrl/nemo_rl/models/generation/vllm/reasoning_parsers/nano_v3_reasoning_parser.py

    vllm_kwargs:
      # Match the higher-throughput backend used by the earlier successful
      # policy-serving runs. This must remain compatible with repeated refits.
      moe_backend: flashinfer_cutlass
      attention_backend: FLASH_ATTN
      max_num_seqs: 256
      max_num_batched_tokens: 32768
      mamba_ssm_cache_dtype: "float32"
      compilation_config:
        cudagraph_capture_sizes: [1,2,4,8,16,32,64]
        cudagraph_mode: PIECEWISE
        pass_config:
          fuse_allreduce_rms: false

    colocated:
      enabled: false
      resources:
        gpus_per_node: null
        num_nodes: null

data:
  max_input_seq_length: null
  shuffle: true
  num_workers: 1

  # use multiple dataloader for train
  # see https://github.com/NVIDIA-NeMo/RL/blob/main/docs/guides/grpo.md#multiple-dataloaders for more details.
  use_multiple_dataloader: false

  train:
    data_path: ???
  validation:
    data_path: ???
  default:
    dataset_name: NemoGymDataset
    env_name: "nemo_gym"
    prompt_file: null
    system_prompt_file: null
    processor: "nemo_gym_data_processor"

env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  nemo_gym:
    nemo_gym_log_dir: "logs/nemo_gym"
    num_gpu_nodes: 1
    skip_venv_if_present: true
    port_range_low: 15001
    port_range_high: 20000
    global_aiohttp_client_request_debug: true
    global_aiohttp_connector_limit: 102400
    global_aiohttp_connector_limit_per_host: 102400
    invalid_tool_call_patterns:
      - "<tool_call>"
      - "</tool_call>"
      - "<function_call>"
      - "</function_call>"
    thinking_tags:
      - "<think>"
      - "</think>"
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/dwrl_genrm_compare_pairwise/configs/dwrl_genrm_compare_pairwise.yaml

    # The internal Gym revision used by the baseline supplied these variants
    # from vllm_model_for_training.yaml. Define them here because the public Gym
    # revision used by this branch only defines the base policy model. Do not
    # add num_groups_nemo_rl: public Gym neither defines nor consumes it.
    policy_model:
      responses_api_models:
        vllm_model:
          # Parallelize the HTTP/JSON proxy path for the large rollout fanout.
          num_workers: 16
          chat_template_kwargs:
            enable_thinking: true
            truncate_history_thinking: false
          sequential_reasoning_allowed: false
    policy_model_reasoning_off:
      _copy: policy_model
      responses_api_models:
        vllm_model:
          num_workers: 4
          chat_template_kwargs:
            enable_thinking: false

    dwrl_pairwise_compare_resources_server:
      resources_servers:
        dwrl_genrm_compare_pairwise:
          # Points to the GenRM model server defined above
          genrm_model_server:
            type: responses_api_models
            name: dwrl_model
          # GenRM request parameters
          genrm_responses_create_params:
            max_tokens: 16384
            temperature: 1.0
            top_p: 0.95
          # Comparison settings
          num_rollouts_per_prompt: ${grpo.num_generations_per_prompt}
          comparison_strategy: "circular"
          num_judges_per_comparison: 1
          # The default_principle is specified in resources_servers\dwrl_genrm_compare_pairwise\configs in Gym itself, but you can override it here if you want
          #default_principle: "Please act as an impartial judge and evaluate the quality of the responses provided by two AI assistants to the user prompt. Begin your evaluation by generating your own answer to the prompt. You must provide your answer before judging any answers. When evaluating the assistants' answers, compare both assistants' answers with your answer. You must identify and correct any mistakes or inaccurate information. Then consider if the assistant's answers are helpful, relevant, and concise. Helpful means the answer correctly responds to the prompt or follows the instructions. Note when the user prompt has any ambiguity or more than one interpretation, it is more helpful and appropriate to ask for clarifications or more information from the user rather than providing an answer based on assumptions. Relevant means all parts of the response closely connect or are appropriate to what is being asked. Concise means the response is clear and not verbose or excessive. Then consider the creativity and novelty of the assistant's answers when needed. Finally, identify any missing important information in the assistants' answers which would be beneficial to include when responding to the user prompt."
          reasoning_bonus: 0.0
          answer_bonus: 0.0
          top_percentile: 0.2
          group_reasoning_length_penalty_coeff: 0.0
          group_answer_length_penalty_coeff: 0.0
          default_score: 3.0
          default_ranking: 0.5
          genrm_parse_retries: 0

    dwrl_model:
      responses_api_models:
        local_vllm_model:
          ray_worker_py_executable: /opt/ray_venvs/nemo_rl.models.generation.vllm.vllm_worker_async.VllmAsyncGenerationWorker/bin/python
          hf_home: /lustre/fsw/portfolios/nemotron/users/degert/hf_home
          vllm_serve_env_vars:
            VLLM_RAY_DP_PACK_STRATEGY: strict
            NCCL_MNNVL_ENABLE: "1"
            VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
            VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
          vllm_serve_kwargs:
            tensor_parallel_size: 4
            data_parallel_size: ???
            data_parallel_size_local: 1
            pipeline_parallel_size: 1
            distributed_executor_backend: ray
            data_parallel_backend: ray
            api_server_count: 1
            enable_expert_parallel: false
            dtype: bfloat16
            kv_cache_dtype: fp8
            gpu_memory_utilization: 0.95
            max_model_len: 262144
            max_num_seqs: 256
            max_num_batched_tokens: 8192
            enable_prefix_caching: true
            enable_chunked_prefill: true
            trust_remote_code: true
            enable_auto_tool_choice: true
            tool_call_parser: qwen3_coder
            model_loader_extra_config:
              enable_multithread_load: true
              num_threads: 96
            load_format: auto
            compilation_config:
              pass_config:
                fuse_allreduce_rms: false


logger:
  log_dir: "logs"
  num_val_samples_to_print: 0
  wandb_enabled: false
  tensorboard_enabled: false
  mlflow_enabled: false
  monitor_gpus: true
  swanlab_enabled: false
  wandb:
    project: "nemotron-3.5-lightning"
    name: "lightning-v3.5-rlvr"
    log_nemo_gym_full_result_tables: false
  swanlab:
    project: "grpo-dev"
    name: "grpo-dev-logger"
  tensorboard: {}
  mlflow:
    experiment_name: "grpo-dev"
    run_name: "grpo-dev-logger"
    tracking_uri: "http://localhost:5000"
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 4
  num_nodes: 1
  segment_size: 2
  master_port_range_low: 1400
  master_port_range_high: 1999

data_plane:
  enabled: false
  impl: transfer_queue
  backend: "simple"                  # TQ storage backend ('simple' or 'mooncake_cpu')
  storage_capacity: 1000000          # max samples retained per partition
  num_storage_units: 2               # storage shards
  claim_meta_poll_interval_s: 0.5    # blocking-claim poll cadence
  global_segment_size: 549755813888  # 512 GiB — used when backend == "mooncake_cpu"
  local_buffer_size:   68719476736   # 64 GiB  — used when backend == "mooncake_cpu"
  # observability:                    # NotRequired
  #   enabled: false

on_policy_distillation: null

reward_penalties:
  penalty_reward: -10.0
  penalize_duplicated_reasoning: true   # reasoning content == final answer
  penalize_empty_final_answer: true     # last message output has empty content
  penalize_unwanted_tokens: true        # eos token appears in generation
  penalize_malformed_think_tag: false   # <think>/<\/think> count != 1 per turn
  token_ids:
    unwanted: [2]      # </s>
    think_open: 12     # <think>
    think_close: 13    # </think>
