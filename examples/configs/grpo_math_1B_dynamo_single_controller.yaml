# grpo_math_1B_megatron_single_controller.yaml served through Dynamo.
# `policy.generation.dynamo: true` is the whole switch: the same vLLM workers
# register with a managed dynamo.frontend, and rollouts go through its KV-aware
# router. Every other vLLM setting keeps its meaning; Dynamo implies
# vllm_cfg.async_engine and needs non-colocated generation.
#
# dynamo_cfg is optional. The values below are its defaults
# (nemo_rl/models/generation/dynamo/config.py).
defaults: grpo_math_1B_megatron_single_controller.yaml

policy:
  generation:
    dynamo: true
    dynamo_cfg:
      # Bounds etcd/NATS/frontend start-up and every engine's registration.
      startup_timeout_s: 600
      # Timeout for one NeMo RL rollout routed through the frontend (in place
      # of NRL_VLLM_ASYNC_TIMEOUT_SECONDS). A timeout fails the attempt as a
      # native timeout does, and the rollout retry policy applies. NeMo-Gym's
      # own calls keep Gym's timeouts.
      request_timeout_s: 900
      worker_args:
        # Dynamo's built-in parser names. null follows the native server's
        # vllm_cfg.http_server_serving_chat_kwargs (tool_parser, reasoning_parser).
        tool_call_parser: null
        reasoning_parser: null
        exclude_tools_when_tool_choice_none: false
        enable_structural_tag: false
        structural_tag_scope: auto
        structural_tag_schema: auto
        # A chat template that replaces the model's own. null follows
        # vllm_cfg.http_server_serving_chat_kwargs.chat_template.
        custom_jinja_template: null
        endpoint_types: [chat, completions]
      frontend_args:
        tokenizer: default
        tokenizer_cache: false
        tokenizer_cache_bytes: 52428800
        # kv: route each request to the engine holding most of its prefix.
        router_mode: kv
        # Keep a NeMo-Gym token-capture rollout on one engine while it idles up
        # to this many seconds (null disables it).
        session_affinity_ttl_secs: 300
        extra_cli_args: []

logger:
  log_dir: results/grpo-math-1b-dynamo-single-controller
  wandb:
    name: grpo-dynamo-single-controller-dev
  swanlab:
    name: grpo-dynamo-single-controller-dev
  mlflow:
    run_name: grpo-dynamo-single-controller-dev
