# Unpacked 100-step control for comparing a Nemotron Omni MPO recipe with its
# pair-atomic packed sibling.
defaults: ../recipes/vlm/vlm_mpo-nemotron-omni-30ba3b-mmpr-1n8g-megatron-tp8.v1.yaml

mpo:
  max_num_steps: 100
  val_period: 100
  val_batches: 32
  val_global_batch_size: 32
  val_micro_batch_size: 1
  val_at_start: false
  val_at_end: true
  seed: 42
  reference_policy_kl_penalty: 0.05
  preference_average_log_probs: false
  sft_average_log_probs: true
  quality_average_log_probs: false
  preference_loss_weight: 0.8
  sft_loss_weight: 0.0
  bco_loss_weight: 0.2
  reward_shift_momentum: 0.99
  reward_shift: 0.0

policy:
  train_global_batch_size: 256
  train_micro_batch_size: 1
  max_total_sequence_length: 32768
  precision: bfloat16
  offload_optimizer_for_logprob: false
  logprob_chunk_size: 128
  dynamic_batching:
    enabled: false
  sequence_packing:
    enabled: false
    train_mb_tokens: 65536
    logprob_mb_tokens: 65536
    algorithm: modified_first_fit_decreasing
  make_sequence_length_divisible_by: 8
  max_grad_norm: 1.0
  megatron_cfg:
    empty_unused_memory_level: 2
    activation_checkpointing: true
    tensor_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 32
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    freeze_moe_router: true
    freeze_vision_encoder: false
    freeze_vision_projector: false
    freeze_audio_encoder: true
    freeze_audio_projector: true
    radio_force_cpe_eval_mode: true
    attention_backend: auto
    moe_router_dtype: fp64
    moe_router_load_balancing_type: none
    moe_router_bias_update_rate: 1.0e-3
    moe_permute_fusion: true
    moe_per_layer_logging: false
    moe_enable_deepep: false
    moe_token_dispatcher_type: alltoall
    moe_shared_expert_overlap: false
    apply_rope_fusion: true
    bias_activation_fusion: false
    gradient_accumulation_fusion: false
    defer_fp32_logits: true
    use_fused_linear_logprobs: false
    mtp_num_layers: 0
    mtp_loss_scaling_factor: 0.0
    optimizer:
      optimizer: adam
      lr: 8.0e-7
      min_lr: 2.0e-9
      weight_decay: 0.1
      bf16: true
      fp16: false
      params_dtype: float32
      adam_beta1: 0.9
      adam_beta2: 0.98
      adam_eps: 1.0e-8
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: 1.0
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0
    scheduler:
      start_weight_decay: 0.1
      end_weight_decay: 0.1
      weight_decay_incr_style: constant
      lr_decay_style: cosine
      lr_warmup_iters: 50
      lr_warmup_init: 2.0e-9
    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: false
      data_parallel_sharding_strategy: optim_grads_params
      use_custom_fsdp: false

data:
  max_input_seq_length: 32768
  shuffle: true
  num_workers: 0
  train:
    dataset_name: MMPRPreference
    data_path: REPLACE_WITH_MMPR_METADATA_PATH
    split_validation_size: 2000
    legacy_validation_split: true
    seed: 42
    max_samples: null
    cache_dir: null
  validation: null

checkpointing:
  enabled: true
  metric_name: val:validation-default_loss
  higher_is_better: false
  keep_top_k: 50
  save_period: 100
  checkpoint_must_save_by: 00:03:45:00
  save_optimizer: true

cluster:
  num_nodes: 4
  gpus_per_node: 8
