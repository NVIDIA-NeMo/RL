# Matched Super MPO control based on legacy W&B run fpieeug0:
#   nvidia/vlm-mpo-dev-mmpr/super-NOPACK-2k-100step
#
# The 2K context is intentional: it is the longest legacy Super no-packing
# control that completed on 4 nodes. Packing changes only in the sibling config.
defaults: vlm_mpo-nemotron-omni-nopack-legacy-parity.yaml

policy:
  model_name: /lustre/fsw/portfolios/llmservice/users/smohsenitahe/checkpoints/super_sft_16k
  tokenizer:
    name: ${policy.model_name}
  max_total_sequence_length: 2048
  megatron_cfg:
    tensor_model_parallel_size: 8
    expert_model_parallel_size: 32
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    # Initial Super parity excludes the checkpoint's auxiliary MTP head.
    mtp_num_layers: 0
    mtp_loss_scaling_factor: 0.0

data:
  max_input_seq_length: 2048

logger:
  wandb:
    name: super-main-nopack-2k-cp1-100step
