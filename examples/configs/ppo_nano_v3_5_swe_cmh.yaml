# =============================================================================
# PPO Ultra E2E — SWE Config for GB200 NVL72 (PPO/VAPO port of the GRPO config)
# =============================================================================
# Duplicated from grpo_nano_v3_5_swe_hsg.yaml and adapted for PPO with a GAE
# critic (run with examples/nemo_gym/run_ppo_nemo_gym.py). Differences vs the
# GRPO parent:
#   - `grpo:` section replaced by `ppo:` (GAE adv_estimator, ppo_epochs,
#     critic warmup via policy_training_start_step, async_ppo instead of
#     async_grpo). max_val_samples / val_batch_size MUST stay null — the
#     NeMo-Gym PPO runner rejects preset values and sets both to
#     len(val_dataset).
#   - new `value:` block — Megatron-backend value model initialized from the
#     same nano checkpoint (fresh scalar value head), mirroring the policy's
#     parallelism/MoE settings. NOTE: the megatron value worker has only been
#     validated on GPT-style dense models; the nano hybrid (mamba+MoE) critic
#     is experimental.
#   - new `value_loss_fn:` block (clipped MSE, VAPO-style scale=1.0/clip=0.5
#     from the validated 7B math PPO run).
#   - loss_fn.force_on_policy_ratio false: PPO trains on the real prev/current
#     logprob ratio (GRPO nano forced ratio=1 and leaned on TIS only).
#   - grpo's invalid_tool_call_advantage / malformed_thinking_advantage are
#     DROPPED: message-level advantage-overwrite penalties are rejected on the
#     PPO path (they would break GAE advantage/return consistency). The
#     reward-zeroing `reward_penalties` block is the PPO-compatible path; left
#     all-off (default) for parity with the GRPO baseline, which also ran with
#     them off (its top-level penalize_* keys are inert in this checkout).
#
# Static algorithm, loss, and environment settings live here. Per-run
# overrides (model path, data paths, parallelism, batch sizes) are applied by
# the launch script (scripts/swe/ppo/nano_on_main.sh) or Hydra CLI.
# =============================================================================

# =============================================================================
# Cluster — overridden by launch script for parallelism changes
# =============================================================================
cluster:
  gpus_per_node: 4
  num_nodes: 128
  segment_size: 16

# =============================================================================
# Checkpointing
# =============================================================================
checkpointing:
  enabled: true
  checkpoint_dir: "results/ppo_ultra_e2e"
  metric_name: "val:total_reward/mean"
  higher_is_better: true
  keep_top_k: 1000000
  save_period: 3
  ft_keep_latest_k: 1
  ft_save_period: 1
  save_optimizer: true
  checkpoint_must_save_by: "00:03:30:00"
  model_save_format: "safetensors"
  save_consolidated: false

# =============================================================================
# PPO Algorithm (replaces the parent's grpo: section)
# =============================================================================
ppo:
  num_prompts_per_step: 16
  num_generations_per_prompt: 32
  max_rollout_turns: 1
  max_num_epochs: 4
  max_num_steps: 1000000
  # One optimizer pass per rollout batch (PPO-epochs>1 reuses the batch).
  ppo_epochs: 1
  # Critic-only warmup: policy training is skipped for the first N steps while
  # the (fresh-head) value model trains on rollouts from the frozen policy.
  # Overridden by the launch script.
  policy_training_start_step: 50
  val_period: 10000
  val_at_start: false
  val_at_end: false
  overlong_filtering: false
  # NeMo-Gym principle: the validation set is used verbatim (no hidden pre/post
  # processing). run_ppo_nemo_gym.py rejects a preset max_val_samples and sets
  # both to len(val_dataset), so they must start null.
  max_val_samples: null
  val_batch_size: null
  seed: 42

  use_dynamic_sampling: false
  dynamic_sampling_max_gen_batches: 10
  batch_multiplier: 1

  # loss_fn.reference_policy_kl_penalty is 0 (SWE baseline), so skip the
  # reference-policy logprob forward. The launch script flips this to false
  # automatically when a nonzero KL penalty is requested.
  skip_reference_policy_logprobs_calculation: true
  seq_logprob_error_threshold: 2

  # GAE with VAPO decoupled lambdas (defaults match the validated 7B math PPO
  # run: lambda_value=1.0, length-adaptive lambda_policy with alpha=0.05).
  adv_estimator:
    name: "gae"
    gae_lambda: 1.0
    gae_gamma: 1
    normalize_advantages: true
    gae_lambda_value: 1.0
    gae_lambda_policy: 1
    # Length-adaptive lambda_policy = 1 - 1/(alpha*l). 0 = disabled.
    length_adaptive_alpha: null

  reward_shaping:
    enabled: false
    overlong_buffer_length: 128
    overlong_buffer_penalty: 1
    max_response_length: ${policy.max_total_sequence_length}
    stop_properly_penalty_coef: null
  reward_scaling:
    enabled: false
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0

  # NOTE: grpo's penalize_invalid_tool_call / invalid_tool_call_advantage /
  # penalize_malformed_thinking / malformed_thinking_advantage are intentionally
  # absent: setup() raises NotImplementedError if the *_advantage keys are set
  # on the PPO path (advantage overwrites break GAE consistency).

  async_ppo:
    enabled: true
    # lag-1: at most one policy version off-policy (recommended/validated).
    # During critic warmup the frozen actor makes any-age trajectories
    # on-policy for free (warmup_max_trajectory_age_steps; null => same value).
    max_trajectory_age_steps: 1
    warmup_max_trajectory_age_steps: 8
    in_flight_weight_updates: true
    recompute_kv_cache_after_weight_updates: false
    # Drop the incomplete (survivorship-biased) frontier target on resume and
    # regenerate it fresh — unbiased batches at the cost of a one-target
    # generation bubble per resume.
    drop_incomplete_targets_on_restore: false
    # Throttle collector/replay-buffer per-rollout heartbeat prints.
    log_every: 500

# =============================================================================
# Loss Function
# =============================================================================
loss_fn:
  reference_policy_kl_penalty: 0.0
  reference_policy_kl_type: "k3"
  kl_input_clamp_value: null
  kl_output_clamp_value: null

  # Defaults from the validated 7B math PPO run (symmetric 0.2 clip + dual-clip
  # c=3), not the GRPO-DAPO asymmetric 0.2/0.28. Overridable from the script.
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  ratio_clip_c: 3
  use_on_policy_kl_approximation: true
  # Async PPO requires the off-policy importance-sampling correction.
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 5
  truncated_importance_sampling_ratio_min: 0.2
  truncated_importance_sampling_type: tis
  sequence_level_importance_ratios: false
  token_level_loss: true
  # PPO trains on the real prev/current-logprob ratio; forcing ratio=1 (as the
  # GRPO nano config does) would disable PPO clipping entirely.
  force_on_policy_ratio: false
  use_kl_in_reward: false

# =============================================================================
# Value Loss (MSE with PPO-style clipping)
# =============================================================================
value_loss_fn:
  scale: 1.0
  cliprange: 0.5

# =============================================================================
# Policy
# =============================================================================
policy:
  model_name: "/lustre/fsw/portfolios/llmservice/users/wdai/megatron-lm-ultra/checkpoints/ultra-v3-sft-bf16-hybridep-ep64-cp32-bindpcie-recompute-offload-288k-nano-loss-032026/iter_0007000/hf"
  tokenizer:
    name: ${policy.model_name}
    chat_template_kwargs: null
  hf_config_overrides: {}

  train_global_batch_size: 512
  train_micro_batch_size: 1
  generation_batch_size: 64
  logprob_batch_size: 1
  max_total_sequence_length: 131072
  precision: "bfloat16"
  logprob_chunk_size: 2048
  offload_optimizer_for_logprob: false

  dtensor_cfg:
    _v2: true
    enabled: false
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null

  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 2
    activation_checkpointing: true

    # TP=8 spans 2 GB200 nodes (4 GPUs each) via intra-rack NVLink.
    tensor_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 32
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 8
    pipeline_dtype: ${policy.precision}
    sequence_parallel: true

    # MoE
    freeze_moe_router: true
    moe_router_dtype: "fp32"
    moe_router_load_balancing_type: "none"
    moe_router_bias_update_rate: 1.0e-3
    moe_router_enable_expert_bias: true
    moe_permute_fusion: true
    moe_enable_deepep: false
    moe_token_dispatcher_type: "alltoall"
    moe_flex_dispatcher_backend: "hybridep"
    moe_hybridep_num_sms: 32
    moe_aux_loss_coeff: 0.0
    moe_shared_expert_overlap: false
    use_gloo_process_groups: false

    # Compute
    apply_rope_fusion: true
    use_fused_weighted_squared_relu: true
    bias_activation_fusion: false
    # community_import.py reads megatron_cfg["gradient_accumulation_fusion"] directly
    # (no default) on the HF->megatron conversion path; absent here it raises KeyError.
    gradient_accumulation_fusion: false
    defer_fp32_logits: true

    # Logging
    track_moe_metrics: true
    moe_per_layer_logging: true
    do_not_average_loss: true
    cp_normalize: true
    calculate_per_token_loss: true
    scale_loss_by_dp_cp_size: false

    # MTP — disabled
    mtp_loss_scaling_factor: 0.3
    mtp_use_repeated_layer: true
    # null disables MTP entirely (matches the upstream mtp=0 run's behavior). This
    # checkout's hybrid model gates MTP on `mtp_num_layers is not None`
    # (hybrid_model.py:544): 0 still enters the MTP block and asserts > 0, and 1 runs
    # MTP forward on only the last-stage ranks (suspected cause of the EXPERT_MODEL_
    # PARALLEL NCCL collective timeout). null makes that check False -> MTP is skipped
    # on all ranks, no partial-rank EP collective. Requires the schema change making
    # MegatronConfig.mtp_num_layers accept None (nemo_rl/models/policy/__init__.py).
    mtp_num_layers: 5
    mtp_detach_heads: true

    optimizer:
      optimizer: "adam"
      lr: 3.0e-6
      min_lr: 3.0e-6
      weight_decay: 0.0
      bf16: true
      fp16: false
      params_dtype: "float32"

      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1e-8

      sgd_momentum: 0.9

      use_distributed_optimizer: true
      use_precision_aware_optimizer: true

      clip_grad: ${policy.max_grad_norm}

      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: null
      lr_warmup_iters: 10
      lr_warmup_init: 3e-7
      override_opt_param_scheduler: true

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: true
      average_in_collective: false
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

    # FP8 — overridden by precision recipe in launch script
    fp8_cfg:
      enabled: false
      fp8: "e4m3"
      fp8_recipe: "mxfp8"
      fp8_param: false

    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 1
    num_layers_at_end_in_bf16: 1

    checkpoint:
      async_save: true
      ckpt_assume_constant_structure: true
      # NOTE: fully_parallel_{save,load}_process_group / fully_parallel_load_exchange_algo
      # were dropped from this checkout's megatron-bridge CheckpointConfig (submodule
      # 554c7b9); leaving them in raises InstantiationException "Unexpected config keys".
      # Removed for the current-repo reproduction.

    env_vars: null

  # ---------------------------------------------------------------------------
  # Sequence Packing
  # ---------------------------------------------------------------------------
  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64

  sequence_packing:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64
    fuse_loss: true

  # Must be a multiple of minimum_pad_factor = cp_size*2*tp_size (see
  # nemo_rl/models/megatron/data.py). With CP=16 + TP=4 + sequence_parallel that is
  # 128; the old value (=TP=4) made get_logprobs assert and abort every training
  # step. Formula matches examples/nemo_gym/grpo_nanov3.yaml (TP*CP*2).
  make_sequence_length_divisible_by: ${mul:${mul:${policy.megatron_cfg.tensor_model_parallel_size}, ${policy.megatron_cfg.context_parallel_size}}, 2}
  max_grad_norm: 1.0
  optimizer: null
  scheduler: null

  # ---------------------------------------------------------------------------
  # Generation (vLLM) — Non-colocated, async
  # ---------------------------------------------------------------------------
  generation:
    port_range_low: 11001
    port_range_high: 15000
    backend: "vllm"
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: true
      precision: ${policy.precision}
      kv_cache_dtype: "auto"
      tensor_parallel_size: 8
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.8
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: false
      use_deep_gemm: false
      num_last_layers_in_bf16: 0
      num_first_layers_in_bf16: 0
      enable_vllm_metrics_logger: true
      vllm_metrics_logger_interval: 0.5
      expose_http_server: true
      skip_tokenizer_init: false
      # reasoning_parser_plugin lives at vllm_cfg top level in this checkout
      # (vllm_worker_async reads vllm_cfg["reasoning_parser_plugin"]); passing it
      # inside http_server_serving_chat_kwargs makes OpenAIServingChat raise
      # "unexpected keyword argument 'reasoning_parser_plugin'". Path updated to this
      # repo's location (the parser moved out of nemo_rl/utils/).
      reasoning_parser_plugin: nemo_rl/models/generation/vllm/reasoning_parsers/nano_v3_reasoning_parser.py
      http_server_serving_chat_kwargs:
        enable_auto_tools: true
        tool_parser: qwen3_coder
        reasoning_parser: nano_v3

    vllm_kwargs:
      attention_backend: FLASH_ATTN
      moe_backend: triton
      mamba_ssm_cache_dtype: "float32"
      # Route TP allreduces through NCCL instead of vLLM's custom CUDA-IPC
      # spin kernel. Jobs 37606/38016 each lost a generation engine ~15 min in:
      # the NCCL flight recorder showed all 4 TP ranks with their next
      # collective enqueued-but-never-started, i.e. all four streams parked in
      # the custom-allreduce kernel ahead of it (symmetric cross-GPU deadlock,
      # different node each time). Costs a few % decode latency on TP-4.
      disable_custom_all_reduce: true
      compilation_config:
        cudagraph_mode: PIECEWISE
        cudagraph_capture_sizes: [1,2,4,8,16,32,64]
        pass_config:
          fuse_allreduce_rms: false

    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 64

# =============================================================================
# Value Model (GAE critic) — Megatron backend, initialized from the policy
# checkpoint with a fresh scalar value head. Parallelism/MoE settings mirror
# the policy block; the launch script overrides them together.
# =============================================================================
value:
  model_name: ${policy.model_name}
  tokenizer:
    name: ${value.model_name}
    chat_template_kwargs: null
  hf_config_overrides: {}

  train_global_batch_size: ${policy.train_global_batch_size}
  train_micro_batch_size: ${policy.train_micro_batch_size}
  logprob_batch_size: ${policy.logprob_batch_size}
  max_total_sequence_length: ${policy.max_total_sequence_length}
  precision: "bfloat16"

  reward_model_cfg:
    enabled: false  # only used for the DTensor V2 value worker
    reward_model_type: "regression"

  dtensor_cfg:
    _v2: true
    enabled: false
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null

  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 2
    activation_checkpointing: true

    tensor_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 32
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 8
    pipeline_dtype: ${value.precision}
    sequence_parallel: true

    # MoE — mirror the policy
    freeze_moe_router: true
    moe_router_dtype: "fp32"
    moe_router_load_balancing_type: "none"
    moe_router_bias_update_rate: 1.0e-3
    moe_router_enable_expert_bias: true
    moe_permute_fusion: true
    moe_enable_deepep: false
    moe_token_dispatcher_type: "alltoall"
    moe_flex_dispatcher_backend: "hybridep"
    moe_hybridep_num_sms: 32
    moe_aux_loss_coeff: 0.0
    moe_shared_expert_overlap: false
    use_gloo_process_groups: false

    # Compute — mirror the policy
    apply_rope_fusion: true
    use_fused_weighted_squared_relu: true
    bias_activation_fusion: false
    gradient_accumulation_fusion: false
    defer_fp32_logits: true

    # Logging
    track_moe_metrics: true
    moe_per_layer_logging: true
    do_not_average_loss: true
    cp_normalize: true
    calculate_per_token_loss: true
    scale_loss_by_dp_cp_size: false

    # MTP — fully disabled for the critic. The value model replaces the LM
    # head with a scalar head, so MTP next-token heads are dead weight; null
    # skips the MTP block on all ranks (no partial-rank EP collective).
    mtp_loss_scaling_factor: 0.0
    mtp_use_repeated_layer: true
    mtp_num_layers: null
    mtp_detach_heads: true

    optimizer:
      optimizer: "adam"
      # Critic LR from the validated 7B math PPO run (fresh value head trains
      # faster than the pretrained actor). Overridden by the launch script.
      lr: 6.0e-6
      min_lr: 6.0e-6
      weight_decay: 0.0
      bf16: true
      fp16: false
      params_dtype: "float32"

      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1e-8

      sgd_momentum: 0.9

      use_distributed_optimizer: true
      use_precision_aware_optimizer: true

      clip_grad: ${value.max_grad_norm}

      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0

    scheduler:
      start_weight_decay: ${value.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${value.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: null
      lr_warmup_iters: 10
      lr_warmup_init: 6.0e-7
      override_opt_param_scheduler: true

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: true
      average_in_collective: false
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

    fp8_cfg:
      enabled: false
      fp8: "e4m3"
      fp8_recipe: "mxfp8"
      fp8_param: false

    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 1
    num_layers_at_end_in_bf16: 1

    checkpoint:
      async_save: true
      ckpt_assume_constant_structure: true

    env_vars: null

  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${value.max_total_sequence_length}, ${value.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${value.max_total_sequence_length}, ${value.train_micro_batch_size}}
    sequence_length_round: 64

  sequence_packing:
    enabled: true
    train_mb_tokens: ${mul:${value.max_total_sequence_length}, ${value.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${value.max_total_sequence_length}, ${value.train_micro_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${mul:${mul:${value.megatron_cfg.tensor_model_parallel_size}, ${value.megatron_cfg.context_parallel_size}}, 2}
  max_grad_norm: 1.0
  optimizer: null
  scheduler: null

# =============================================================================
# Data
# =============================================================================
data:
  max_input_seq_length: null
  shuffle: false
  num_workers: 1
  use_multiple_dataloader: false
  train:
    data_path: null   # Set by launch script
  validation:
    data_path: null   # Set by launch script
  default:
    dataset_name: NemoGymDataset
    env_name: "nemo_gym"
    prompt_file: null
    system_prompt_file: null
    processor: "nemo_gym_data_processor"

# =============================================================================
# Environment — NeMo Gym + SWE Agents
# =============================================================================
env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  nemo_gym:
    # Reuse pre-built gym venvs. With false, all 3 gym servers (policy_model,
    # swe_agents_{train,val}) rebuild the editable nemo-gym package in parallel and
    # contend on the same uv distribution-cache lock on Lustre; policy_model then
    # times out (default 300s) and NemoGym spinup fails. Mirrors the qwen-30b SWE run.
    skip_venv_if_present: true
    num_gpu_nodes: 0
    port_range_low: 15001
    port_range_high: 20000
    invalid_tool_call_patterns:
      - "<tool_call>"
      - "</tool_call>"
      - "<function_call>"
      - "</function_call>"
    thinking_tags:
      - "<think>"
      - "</think>"
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - responses_api_agents/swe_agents/configs/swebench_openhands_training.yaml
    swe_agents_train:
      responses_api_agents:
        swe_agents:
          agent_max_turns: 200
          concurrency: ${mul:2, ${mul:${ppo.num_prompts_per_step}, ${ppo.num_generations_per_prompt}}}
          swebench_agent_timeout: 3600
          run_with_mixed_prompts: true
          dataset_path: ${data.train.data_path}
          apptainer_memory_limit_mb: 65536
          container_formatter:
            - "/scratch/fsw/portfolios/nemotron/projects/nemotron_rl_algo/images/swerebench/{instance_id}.sif"
            - "/scratch/fsw/portfolios/nemotron/projects/nemotron_rl_algo/images/nv_internal/{instance_id}.sif"
            - "/scratch/fsw/portfolios/nemotron/projects/nemotron_rl_algo/images/r2e_gym/{instance_id}.sif"
            - "/scratch/fsw/portfolios/nemotron/projects/nemotron_rl_algo/images/sweb.eval.arm64.{instance_id}.sif"
            - "/scratch/fsw/portfolios/nemotron/projects/nemotron_rl_algo/images/swebench/swe-bench.eval.arm64.{instance_id}.sif"
            - "/scratch/fsw/portfolios/nemotron/projects/nemotron_rl_algo/images/mercor/swebenchpro_ots/{instance_id}.sif"
            - "/scratch/fsw/portfolios/nemotron/projects/nemotron_rl_algo/images/swegym/sweb.eval.arm64.{instance_id}.sif"
    swe_agents_val:
      responses_api_agents:
        swe_agents:
          agent_max_turns: 200
          concurrency: ${mul:2, ${mul:${ppo.num_prompts_per_step}, ${ppo.num_generations_per_prompt}}}
          swebench_agent_timeout: 3600
          dataset_path: ${data.validation.data_path}
          apptainer_memory_limit_mb: 65536
          container_formatter: ${env.nemo_gym.swe_agents_train.responses_api_agents.swe_agents.container_formatter}
    use_absolute_ip: true

# =============================================================================
# Logger
# =============================================================================
logger:
  log_dir: "logs"
  num_val_samples_to_print: 0
  wandb_enabled: true
  tensorboard_enabled: false
  mlflow_enabled: false
  monitor_gpus: true
  swanlab_enabled: false
  wandb:
    project: "ultra-v3-swe-e2e"
    name: "ppo-ultra-e2e"
  tensorboard: {}
  mlflow:
    experiment_name: "ppo-ultra-e2e"
    run_name: "ppo-ultra-e2e"
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

# =============================================================================
# Effort Levels / Token IDs / penalize_* — carried over from the GRPO config
# for parity. NOTE: these top-level keys are INERT in this checkout (nothing
# reads them; the GRPO baseline also ran with them having no effect). The
# PPO-compatible penalty mechanism is the structured `reward_penalties:` block
# (reward-zeroing, pre-GAE) — left at its all-off default to match the GRPO
# baseline's effective behavior.
# =============================================================================
effort_levels:
  low_string: "{reasoning effort: efficient}"
  low_weight: 0.1
  low_penalty: 1
  low_ub: 15000


# Reward-zeroing penalties applied to NeMo-Gym rollout results.
reward_penalties:
  penalize_duplicated_reasoning: true
  penalize_empty_final_answer: true
  penalize_unwanted_tokens: true
  penalize_malformed_think_tag: true
  # Optional model/tokenizer-specific token IDs. Add token IDs that should
  # be penalized when emitted by the model. Unwanted token IDs must be
  # specified explicitly; think-tag IDs are inferred when each tag encodes
  # to one token. Example: {unwanted: [2], think_open: 12, think_close: 13}
  token_ids: {unwanted: [2], think_open: 12, think_close: 13}