defaults: ../../flow_grpo_qwen_image_ocr.yaml
flow_grpo:
  max_num_steps: 60
  max_val_samples: 64  # the full 1018-prompt val set is too slow for nightly; pin to the first 64
env:
  # Nightly uses the CPU PaddleOCR reward so CI needs no served judge endpoint.
  # (The exemplar's genrm_ocr Qwen3-VL-8B judge is the verl-omni-parity reward.)
  image_reward:
    plugins:
      - name: "ocr"
        weight: 1.0
checkpointing:
  checkpoint_dir: results/flow_grpo-qwen-image-ocr-1n8g-dp8-lora
logger:
  log_dir: logs/flow_grpo-qwen-image-ocr-1n8g-dp8-lora
  wandb:
    name: flow_grpo-qwen-image-ocr-1n8g-dp8-lora
