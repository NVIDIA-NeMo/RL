defaults: ./vlm_grpo-nemotron-super-omni-120ba12b-16n8g-megatron-tp8ep16cp2-async-gym.v1.yaml

cluster:
  num_nodes: 32
  gpus_per_node: 4

grpo:
  num_prompts_per_step: 128
  num_generations_per_prompt: 16
  max_num_steps: 50
  max_num_epochs: 1000
  val_period: 0
  val_at_start: false
  val_at_end: false
  advantage_clip_low: -50
  advantage_clip_high: 50
  seq_logprob_error_threshold: 2
  zero_variance_prompt_filtering: false
  use_dynamic_sampling: false
  deduplicate_multimodal_data: true
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1
    in_flight_weight_updates: true
    recompute_kv_cache_after_weight_updates: false
  reward_shaping:
    enabled: false
  reward_scaling:
    enabled: false
  length_penalty:
    default:
      enabled: true
      length_type: tokens
      profile_band_total: false
      profile_band_reasoning: true
      profile_band_answer: false
    profile_band:
      defaults:
        reasoning:
          a: 1024
          b: 4096
          f: 0.95

loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  sequence_level_importance_ratios: true
  token_level_loss: false
  use_sequence_length_scaling: false
  logprob_chunk_size: 2048

checkpointing:
  enabled: true
  # Validation is disabled, so retain checkpoints by step rather than by a
  # nonexistent validation metric.
  metric_name: null
  higher_is_better: true
  save_period: 1
  keep_top_k: 5
  save_optimizer: true
  save_replay_buffer: false

policy:
  is_vlm: true
  router_replay:
    enabled: false
  model_name: /path/to/nemotron-super-omni-hf-checkpoint
  # The source checkpoint already uses temporal patch size 2. Reassert it as
  # an HF override so NeMo-RL builds a fresh Megatron conversion instead of
  # reusing the cached temporal_patch_dim=1 checkpoint created before the
  # Bridge learned to infer an omitted separate_video_embedder flag.
  hf_config_overrides:
    video_temporal_patch_size: 2
    # Match the preprocessing contract stored in the stage-2 checkpoint.
    # The vLLM compatibility patch reads these top-level overrides.
    video_target_num_patches: 1024
    video_maintain_aspect_ratio: true
  tokenizer:
    name: ${policy.model_name}
    # Use the tokenizer and template bundled with the stage-2 iter3159 checkpoint.
    chat_template: default
    chat_template_kwargs:
      enable_thinking: true
      truncate_history_thinking: false
  train_global_batch_size: 2048
  max_total_sequence_length: 65536
  sequence_packing:
    enabled: true
    # Override the 32K hardcoded limit inherited from the 32-node parent.
    logprob_mb_tokens: 65536
  megatron_cfg:
    empty_unused_memory_level: 2
    activation_checkpointing: true
    checkpoint:
      # Avoid CUDA IPC OOMs in the asynchronous checkpoint subprocess.
      async_save: false
    tensor_model_parallel_size: 2
    expert_model_parallel_size: 16
    expert_tensor_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    distributed_timeout_minutes: 45
    # This controlled RL run does not train/use the checkpoint's MTP head.
    mtp_num_layers: 0
    # Latest Super #3936: compute the trainer and generation LM heads on the
    # same fp32/TF32 path. BF16 logit rounding is the dominant source of
    # generation-vs-training multiplicative probability error.
    fp32_lm_head: tf32
    fp32_residual_connection: true
    radio_force_cpe_eval_mode: true
    freeze_vision_model: true
    freeze_vision_projection: true
    freeze_sound_encoder: true
    freeze_sound_projection: true
    moe_shared_expert_overlap: false
    moe_per_layer_logging: false
    optimizer:
      lr: 3.0e-6
      min_lr: 2.0e-9
      adam_beta2: 0.99
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0
    scheduler:
      lr_warmup_iters: 10
      lr_warmup_init: 3.0e-8
      lr_decay_iters: 100000
    # mtp_loss_scaling_factor: 0.1
    # mtp_detach_heads: true
  generation:
    # vLLM's Nemotron video processor reads these fields exclusively from
    # the nested vision_config. The checkpoint carries them only in
    # preprocessor_config.json, while the policy processor already honors
    # that file. Apply a rollout-only nested override so both engines use
    # the same aspect-preserving 252-feature tubelets instead of repairing
    # vLLM's square 256-feature placeholder runs after generation.
    hf_subconfig_overrides:
      vision_config:
        video_temporal_patch_size: 2
        video_target_num_patches: 1024
        video_maintain_aspect_ratio: true
    max_new_tokens: 16384
    temperature: 1.0
    top_p: 1.0
    bad_words:
      - <image>
      - <img>
      - </img>
      - <so_embedding>
      - <so_start>
      - <so_end>
    vllm_cfg:
      tensor_parallel_size: 4
      # Refit does not cover every frozen VLM module (notably the vision
      # tower), so generation must initialize from the full checkpoint.
      load_format: auto
      logprobs_mode: raw_logprobs
      env_vars:
        # Must be enabled together with megatron_cfg.fp32_lm_head. Latest
        # Super validates this pairing and refreshes the fp32 cache on refit.
        NRL_VLLM_FP32_LM_HEAD: "1"
      gpu_memory_utilization: 0.7
      max_model_len: 65536
      reasoning_parser_plugin: /opt/nemo-rl/nemo_rl/models/generation/vllm/reasoning_parsers/nano_v3_reasoning_parser.py
      enforce_eager: false
      enable_prefix_caching: false
      # Use one video contract for vLLM generation and Megatron logprob
      # recomputation. Non-video SA-V rows fall back to image processing.
      video:
        sampling_style: nemotron_vl
        num_frames: 64
        temporal_patch_size: 2
      reset_mm_cache_after_refit: false
      http_server_serving_chat_kwargs:
        # null delegates prompt rendering to the checkpoint tokenizer/template.
        chat_template: null
        chat_template_content_format: openai
        reasoning_parser: deepseek_r1
    vllm_kwargs:
      # The mixed manifest contains SA-V frames under /scratch and CapRL
      # frames under /lustre.
      reasoning_parser: deepseek_r1
      allowed_local_media_path: /
      mm_processor_cache_gb: 0
      max_num_seqs: 8
      max_num_batched_tokens: 65536
      limit_mm_per_prompt:
        image: 64
        video:
          count: 1
          num_frames: 64
      media_io_kwargs:
        video:
          num_frames: 64
      skip_mm_profiling: true
      disable_custom_all_reduce: true
      attention_backend: FLASH_ATTN
      attention_config:
        use_trtllm_attention: false
      compilation_config:
        cudagraph_mode: FULL_AND_PIECEWISE
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 16

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  shuffle: true
  num_workers: 0
  train:
    data_path: /path/to/combined-video-and-tracking-data.jsonl
  validation:
    data_path: ${data.train.data_path}
  default:
    num_frames: 64
    video_temporal_patch_size: 2
    video_target_num_patches: 1024
    video_maintain_aspect_ratio: true
    # Keep still-image tiling at the checkpoint processor's default. This
    # preserves SA-V spatial detail; CAPRL rows use the native-video path above.

env:
  should_log_nemo_gym_responses: false
  reject_generated_media_tokens: true
  nemo_gym:
    policy_max_input_tokens: ${policy.max_total_sequence_length}
    skip_venv_if_present: true
    pad_dynamic_image_shapes: true
    debug_gen_timing: true
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
      - resources_servers/mcqa/configs/mcqa.yaml
      - resources_servers/string_match/configs/string_match.yaml
      - resources_servers/sav_tracks/configs/sav_tracks.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          uses_reasoning_parser: true
          extra_body:
            bad_words:
              - <image>
              - <img>
              - </img>
              - <so_embedding>
              - <so_start>
              - <so_end>
            chat_template_kwargs:
              enable_thinking: true

logger:
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: Nemotron-omni-RL-debug
    name: async_grpo_super35_latest_combined_minimal_profile_band_r3_stage2_iter3159
