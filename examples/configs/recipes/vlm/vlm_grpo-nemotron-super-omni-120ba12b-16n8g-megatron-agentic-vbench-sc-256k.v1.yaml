# Agentic-VBench SingleController GRPO with the policy's full 256k context window
# (Nemotron Super Omni: max_position_embeddings 262144). Long agent episodes
# (32 turns with inline image reads) exceeded the 49k limit of the base SC recipe
# at only 8 turns, so rollouts without compaction need the native window.
#   CONFIG_IN_CONTAINER=examples/configs/recipes/vlm/vlm_grpo-nemotron-super-omni-120ba12b-16n8g-megatron-agentic-vbench-sc-256k.v1.yaml \
#   AGENTIC_VBENCH_CONTEXT_TOKENS=262144 AGENTIC_VBENCH_MAX_TURNS=32 AGENTIC_VBENCH_OUTPUT_TOKENS=8192 ...
defaults: ./vlm_grpo-nemotron-super-omni-120ba12b-16n8g-megatron-agentic-vbench-sc.v1.yaml

policy:
  # Training rows, vLLM max_model_len and data.max_input_seq_length all follow this.
  # Rows are fixed-batch (no packing) at micro batch 1 with TP8 sequence
  # parallelism, full activation recomputation and chunked fp32 logprobs
  # (logprob_chunk_size); raise pipeline_model_parallel_size to 2 if the learner
  # runs out of memory on the longest rows.
  max_total_sequence_length: 262144
  generation:
    vllm_kwargs:
      # Do not size the prefill chunk to the whole window: vLLM profiles and
      # warms up at max_num_batched_tokens, and 256k-token chunks would also
      # starve concurrent decodes. Chunked prefill covers long inputs.
      max_num_batched_tokens: 32768
