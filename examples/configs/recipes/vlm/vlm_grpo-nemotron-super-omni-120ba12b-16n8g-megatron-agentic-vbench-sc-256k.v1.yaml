# Agentic-VBench SingleController GRPO with the policy's full 256k context window
# (Nemotron Super Omni: max_position_embeddings 262144). Long agent episodes
# (32 turns with inline image reads) exceeded the 49k limit of the base SC recipe
# at only 8 turns, so rollouts without compaction need the native window.
#   CONFIG_IN_CONTAINER=examples/configs/recipes/vlm/vlm_grpo-nemotron-super-omni-120ba12b-16n8g-megatron-agentic-vbench-sc-256k.v1.yaml \
#   AGENTIC_VBENCH_CONTEXT_TOKENS=262144 AGENTIC_VBENCH_MAX_TURNS=32 AGENTIC_VBENCH_OUTPUT_TOKENS=8192 ...
defaults: ./vlm_grpo-nemotron-super-omni-120ba12b-16n8g-megatron-agentic-vbench-sc.v1.yaml

grpo:
  # Production horizon. Qualification at 20 healthy steps is observational;
  # it must not terminate the sync run or clamp a later async continuation.
  max_num_epochs: null
  max_num_steps: 1000000
  # Emit per-sequence generation/trainer parity diagnostics. This is
  # observational only: it neither filters samples nor changes the loss.
  debug_payload_metrics: true

policy:
  # Training rows, vLLM max_model_len and data.max_input_seq_length all follow this.
  # Rows are fixed-batch (no packing) at micro batch 1 with TP8 sequence
  # parallelism, full activation recomputation and chunked fp32 logprobs
  # (logprob_chunk_size); raise pipeline_model_parallel_size to 2 if the learner
  # runs out of memory on the longest rows.
  max_total_sequence_length: 262144
  megatron_cfg:
    # Match Rohit's NeMo-RL v2 production recipe: bf16 rounding in the final
    # logits GEMM is a leading source of generation/trainer log-prob mismatch.
    # The vLLM flag below must stay identical to this trainer-side setting.
    fp32_lm_head: true
    # The identity fast run (2026-10-07) trained step 1 and then ran out of learner
    # memory in the step-2 backward pass with 70-80k-token rows (175 GiB on one
    # GPU). Two pipeline stages are not an option: NeMo-RL's refit broadcast
    # requires every object on exactly one PP rank and this model has one on both
    # ("Object present on multiple PP ranks: [0, 1]"). Release cached memory more
    # aggressively between phases instead; rows are already micro batch 1 with
    # full recomputation and chunked fp32 logprobs.
    pipeline_model_parallel_size: 1
    empty_unused_memory_level: 2
    # Keep the learner aligned with the validated SuperVL3.5/video recipes.
    # The V1 base leaves these trainable, which can make multimodal learner
    # logprobs diverge from the generation engine even when text rows agree.
    freeze_vision_model: true
    freeze_vision_projection: true
  generation:
    vllm_cfg:
      # Keep generation logits on the same fp32 LM-head path as Megatron so
      # token_mult_prob_error measures model parity rather than output rounding.
      fp32_lm_head: true
    vllm_kwargs:
      # Preserve the validated Super execution paths. Forcing both towers onto
      # the Nano-oriented torch/TORCH_SDPA diagnostic path regressed Super's
      # raw step-0 sequence TMPE from 1.011-1.015 to 1.0443. Keep the RADIO
      # weight/layout fixes below the recipe layer, but do not override the
      # model-native vision kernels for this Super gate.
      # Do not size the prefill chunk to the whole window: vLLM profiles and
      # warms up at max_num_batched_tokens, and 256k-token chunks would also
      # starve concurrent decodes. Chunked prefill covers long inputs.
      max_num_batched_tokens: 32768
