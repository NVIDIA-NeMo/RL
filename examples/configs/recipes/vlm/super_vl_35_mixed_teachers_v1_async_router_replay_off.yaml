# Same resolved production recipe, using the V1 async_grpo loop.
# Run paths and the longer deadline are supplied by its experiment launcher.
defaults: ./super_vl_35_mixed_teachers_production.yaml
grpo:
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1
    max_generation_failures: 0
    in_flight_weight_updates: true
    recompute_kv_cache_after_weight_updates: false
policy:
  router_replay:
    enabled: false
  generation:
    vllm_kwargs:
      enable_return_routed_experts: false
# V1 NeMo-Gym multimodal deduplication uses the legacy policy transfer path.
data_plane:
  enabled: false
