  num_generations_per_prompt: 64
  batch_multiplier: 2
  dynamic_sampling_max_gen_batches: 2
  use_dynamic_sampling: true
  max_num_steps: 400
  max_num_epochs: 2
  skip_reference_policy_logprobs_calculation: true
