# Two-node sibling of vlm_grpo-nemotron-omni-30ba3b-clevr-1n8g-megatron-tp8ep8.v1.
#
# tp8 on one node leaves dp=1, so Megatron's distributed optimizer has nothing to
# shard and the run runs out of GPU memory; dp=2 fits. This is not a data-plane
# property -- the 1n8g recipe OOMs the same way with data_plane.enabled=false --
# so the TQ wrapper delegates here rather than overriding the node count.
defaults: vlm_grpo-nemotron-omni-30ba3b-clevr-1n8g-megatron-tp8ep8.v1.yaml
cluster:
  num_nodes: 2
