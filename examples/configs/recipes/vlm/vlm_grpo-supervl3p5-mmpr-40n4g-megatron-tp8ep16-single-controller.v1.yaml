# Single-controller ablation of the validated SuperVL3p5 MMPR-Tiny production recipe.
# 32 policy nodes + 8 generation nodes, each with 4 GPUs; launch run_grpo_single_controller.py.
defaults: ./vlm_grpo-supervl3p5-mmpr-32n4g-megatron-tp8ep16.v1.yaml
grpo:
  async_grpo: null
  # SingleController has no validation loop.
  val_period: 0
  val_at_start: false
  val_at_end: false
policy:
  # SC requires one optimizer step per complete rollout batch: 512 x 16 = 8192.
  train_global_batch_size: ${mul:${grpo.num_prompts_per_step}, ${grpo.num_generations_per_prompt}}
  generation:
    vllm_cfg:
      async_engine: true
    colocated:
      enabled: false
      resources:
        num_nodes: 8
        gpus_per_node: 4
checkpointing:
  metric_name: null
  save_data_plane: true
data_plane:
  enabled: true
  simple:
    num_storage_units: 64
async_rl:
  sampler:
    name: in_order
    # Keep rollout generation on the current policy version for this ablation.
    max_lookahead_versions: 0
  max_inflight_prompts: ${grpo.num_prompts_per_step}
  max_buffered_rollouts: ${grpo.num_prompts_per_step}
  min_groups_for_streaming_train: ${grpo.num_prompts_per_step}
  recompute_kv_cache_after_weight_updates: false
token_capture:
  # MMPR-Tiny uses the native environment path, not NeMo-Gym token capture.
  enabled: false
cluster:
  num_nodes: 40
