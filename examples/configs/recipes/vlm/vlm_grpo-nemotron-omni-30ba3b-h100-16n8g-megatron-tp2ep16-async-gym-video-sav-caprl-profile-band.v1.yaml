# Async Nano TMPE-debug recipe for the same CAPRL video + SAV tracking
# mixture used by the H100 Super run. The two manifests are concatenated and
# globally shuffled because async GRPO does not support multiple dataloaders.
defaults: ./vlm_grpo-nemotron-omni-30ba3b-h100-16n8g-megatron-tp2ep16-async-gym-video-adi-profile-band.v1.yaml

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  shuffle: true
  num_workers: 0
  use_multiple_dataloader: false
  train:
  - data_path: ${oc.env:CAPRL_VIDEO_DATA_PATH}
  - data_path: ${oc.env:SAV_TRACKING_DATA_PATH}
  validation:
  - data_path: ${oc.env:CAPRL_VIDEO_DATA_PATH}
  - data_path: ${oc.env:SAV_TRACKING_DATA_PATH}
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    prompt_file: null
    system_prompt_file: null
    processor: nemo_gym_data_processor
    num_frames: 64
    video_sampling_style: nemotron_vl
    video_target_num_patches: 1024
    video_temporal_patch_size: 2
    video_maintain_aspect_ratio: true
    # SAV uses interleaved still images rather than video-frame placeholders.
    # One tile per image keeps its largest tracking prompts within 16K tokens.
    image_max_num_tiles: 1

env:
  nemo_gym:
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/mcqa/configs/mcqa.yaml
    - resources_servers/string_match/configs/string_match.yaml
    - resources_servers/sav_tracks/configs/sav_tracks.yaml

logger:
  wandb:
    project: Nemotron-omni-RL-debug
    name: dfw-h100-nano-sav-caprl-rpb-tmpe

policy:
  generation:
    vllm_kwargs:
      # Match vLLM prompt expansion to Megatron preprocessing for SAV images.
      mm_processor_kwargs:
        max_num_tiles: 1
