defaults: vlm_grpo-nemotron-omni-30ba3b-16n8g-megatron-tp4ep4-async-gym-video.v1.yaml
grpo:
  num_prompts_per_step: 128
  num_generations_per_prompt: 16
  max_num_epochs: 1000000
  val_period: 0
  length_bonus:
    default:
      enabled: true
      length_type: tokens
      reasoning_end_token_id: 13
    profile_band:
      enabled: true
      defaults:
        reasoning:
          a: 1024
          b: 4096
          f: 0.95
checkpointing:
  save_period: 2
  keep_top_k: 5
policy:
  train_global_batch_size: 2048
  max_total_sequence_length: 16384
  sequence_packing:
    enabled: true
  megatron_cfg:
    tensor_model_parallel_size: 2
    expert_model_parallel_size: 16
    activation_checkpointing: false
    optimizer:
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0
    scheduler:
      lr_warmup_iters: 10
      lr_warmup_init: 3.0e-08
  generation:
    max_new_tokens: 8192
    vllm_cfg:
      tensor_parallel_size: 2
      gpu_memory_utilization: 0.7
      enforce_eager: false
      video:
        num_frames: 64
    vllm_kwargs:
      mm_processor_cache_gb: 4
      max_num_seqs: 8
      max_num_batched_tokens: 32768
      limit_mm_per_prompt:
        image: 64
        video:
          count: 1
          num_frames: 64
      media_io_kwargs:
        video:
          num_frames: 64
    colocated:
      resources:
        num_nodes: 8
data:
  shuffle: true
  default:
    num_frames: 64
