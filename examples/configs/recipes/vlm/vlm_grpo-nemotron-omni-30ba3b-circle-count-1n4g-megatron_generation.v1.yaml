defaults: ../../vlm_grpo_3B_megatron.yaml

# 1-node × 4-GPU GB200 recipe: Nemotron Omni on NeMo-Gym's circle_count image
# environment. Each row is a synthetic PNG scene carried inline as a base64
# data URL plus a "how many <color> circles" question; the Gym resources server
# rewards an exact match on \boxed{count}. Default layout is non-colocated
# 2 train / 2 gen with Megatron generation, async GRPO, age>1, and in-flight
# weight updates.
#
# `data` and `env` use _override_ because the parent config wires the CLEVR
# HF dataset and its reward functions at the split level, and split keys win
# over `data.default` (nemo_rl/data/datasets/utils.py:263).
grpo:
  num_prompts_per_step: 2
  num_generations_per_prompt: 8
  max_num_steps: 4
  val_period: 0
  val_at_start: false
  val_at_end: false
  use_dynamic_sampling: false
  # The Gym entrypoint refuses a preset max_val_samples and derives both of
  # these from the validation dataset length instead.
  max_val_samples: null
  val_batch_size: null
  reward_shaping:
    enabled: false
  reward_scaling:
    enabled: false
  async_grpo:
    enabled: true
    max_trajectory_age_steps: 2
    in_flight_weight_updates: true

loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true

checkpointing:
  enabled: false
  checkpoint_dir: results/nemo-rl-omni/nemotron-omni-circle-count-1n4g

policy:
  model_name: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16
  is_vlm: true
  train_global_batch_size: 16
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 8192
  offload_optimizer_for_logprob: false
  sequence_packing:
    enabled: true
  megatron_cfg:
    env_vars:
      TORCH_CUDA_ARCH_LIST: "10.0"
    tensor_model_parallel_size: 2
    expert_model_parallel_size: 2
    expert_tensor_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    bias_activation_fusion: false
    activation_checkpointing: true
  generation:
    backend: megatron
    max_new_tokens: 1024
    # Gym clears stop_strings/stop_token_ids in setup_nemo_gym_config, and the
    # Megatron engine takes null here (the vLLM path bans the media tokens
    # explicitly instead).
    bad_words: null
    mcore_generation_config:
      # Required for Gym: the environment drives generation over the engine's
      # OpenAI-compatible HTTP server.
      expose_http_server: true
      parsers: []
      max_model_len: ${policy.max_total_sequence_length}
      cuda_graph_impl: local
      inference_cuda_graph_scope: block
      buffer_size_gb: 8
      num_cuda_graphs: -1
      block_size_tokens: 256
      use_cuda_graphs_for_non_decode_steps: true
      enable_chunked_prefill: true
      enable_prefix_caching: false
      max_tokens: ${policy.max_total_sequence_length}
      kv_cache_management_mode: persist
      materialize_only_last_token_logits: true
      num_speculative_tokens: 0
      refit_backend: nccl
      transformer_impl: transformer_engine
      activation_checkpointing: false
      tensor_model_parallel_size: 2
      expert_model_parallel_size: 2
      expert_tensor_parallel_size: 1
      sequence_parallel: true
      moe_pad_experts_for_cuda_graph_inference: true
    vllm_cfg:
      async_engine: true
      expose_http_server: true
      skip_tokenizer_init: false
    colocated:
      enabled: false
      resources:
        gpus_per_node: 2
        num_nodes: 1

data:
  _override_: true
  max_input_seq_length: null
  shuffle: false
  num_workers: 1
  use_multiple_dataloader: false
  # The launcher overrides these with absolute paths; the shipped example file
  # holds 5 rows, so regenerate a larger set with
  # resources_servers/circle_count/generate_data.py for anything but a smoke.
  train:
    data_path: 3rdparty/Gym-workspace/Gym/resources_servers/circle_count/data/example.jsonl
  validation:
    data_path: 3rdparty/Gym-workspace/Gym/resources_servers/circle_count/data/example.jsonl
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    prompt_file: null
    system_prompt_file: null
    processor: nemo_gym_data_processor

env:
  _override_: true
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  nemo_gym:
    is_trajectory_collection: false
    port_range_low: 5000
    port_range_high: 5999
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/circle_count/configs/circle_count.yaml
    circle_count_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1

logger:
  wandb_enabled: false
  tensorboard_enabled: false
  wandb:
    project: "nemo-rl-omni"
    name: "nemotron-omni-circle-count-1n4g"

cluster:
  gpus_per_node: 4
  num_nodes: 1
