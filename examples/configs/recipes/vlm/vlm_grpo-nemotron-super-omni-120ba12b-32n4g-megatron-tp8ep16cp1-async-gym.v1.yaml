defaults: ./vlm_grpo-nemotron-super-omni-120ba12b-16n8g-megatron-tp8ep16cp2-async-gym.v1.yaml

# Config-only performance variant. Preserve the parent's 64-GPU learner and
# 64-GPU rollout pools while mapping them to 32 four-GPU nodes.
policy:
  sequence_packing:
    logprob_mb_tokens: 32768
  megatron_cfg:
    activation_checkpointing: false
    context_parallel_size: 1
  generation:
    vllm_kwargs:
      max_num_seqs: 64
      compilation_config:
        cudagraph_mode: FULL_AND_PIECEWISE
    colocated:
      resources:
        gpus_per_node: 4
        num_nodes: 16

cluster:
  gpus_per_node: 4
  num_nodes: 32
  segment_size: 8
