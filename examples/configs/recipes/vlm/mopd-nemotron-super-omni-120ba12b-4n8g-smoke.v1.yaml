# Three-step exact-stack smoke for the public Super Omni image-MOPD recipe.
# Step three is required: with one-step async staleness, step two may still
# consume trajectories generated before the first weight update.

defaults: mopd-nemotron-super-omni-120ba12b-10n8g-megatron-tp8ep16cp2-async-gym.v1.yaml

checkpointing:
  enabled: false

cluster:
  num_nodes: 4

grpo:
  num_prompts_per_step: 2
  num_generations_per_prompt: 2
  max_num_epochs: 1
  max_num_steps: 3

policy:
  train_global_batch_size: 4
  max_total_sequence_length: 4096
  generation:
    max_new_tokens: 256
    vllm_cfg:
      max_model_len: ${policy.max_total_sequence_length}
    vllm_kwargs:
      max_num_batched_tokens: ${policy.max_total_sequence_length}

logger:
  log_dir: logs/mopd-nemotron-super-omni-circle-count-smoke
  wandb:
    name: mopd-nemotron-super-omni-circle-count-smoke
