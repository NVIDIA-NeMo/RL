# DIAG 1/3: tiny joint (8 prompts x 2 gens, 8k ctx), BOTH teachers 2n each.
# v2-downscale: 131k envelope never trained — teacher get_logprobs of a
# 131k-padded sequence NEVER completes on this stack (see v1 header + jobs
# 6444954..6453731: GPUs 0%, Python-bound MoE dispatch, zero groups scored in
# 45min; the text stack scores the same teacher @131k fine, cause still open).
# Per user 2026-08-23: downscale context AND batch until it trains.
#   * seqlen 131072 -> 32768 (teacher pad-multiple shrinks 4x; 2x the PROVEN
#     16k omni envelope)
#   * GBS 512 -> 256 (128 prompts x 2 gens)
#   * student CP 8 -> 2 (omni base shape, proven at 16k)
#   * gen fleet 16n -> 8n (002-refmatch shape); cluster 38 -> 30 nodes
# Teachers unchanged: agent-name routing, __unset__ leak guards, level 1.
defaults: vlm_grpo-nemotron-super-omni-120ba12b-16n8g-megatron-tp8ep16cp2-async-gym.v1.yaml
checkpointing:
  checkpoint_dir: results/mopd-super-omni-joint-opd-hsg
  keep_top_k: 1000
cluster:
  num_nodes: 10
  gpus_per_node: 4
grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 2
  max_num_epochs: 5
  max_num_steps: 200
  async_grpo:
    in_flight_weight_updates: false
  adv_estimator:
    name: opd
loss_fn:
  disable_ppo_ratio: true
  token_level_loss: true
  truncated_importance_sampling_type: icepop
  truncated_importance_sampling_ratio: 5.0
  truncated_importance_sampling_ratio_min: 0.2
  force_on_policy_ratio: false
  use_kl_in_reward: false
policy:
  train_global_batch_size: 512
  # envelope: text OPD's sequence length (long text prompts/gens untruncated);
  # vision rows are far shorter and simply pack tighter.
  max_total_sequence_length: 8192
  logprob_chunk_size: 2048
  tokenizer:
    chat_template_kwargs:
      enable_thinking: true
      truncate_history_thinking: false
  megatron_cfg:
    # text run's CP for 131k activations (omni base is CP2 at 16k).
    context_parallel_size: 2
    optimizer:
      lr: 2.0e-06
      min_lr: 2.0e-06
  generation:
    max_new_tokens: ${policy.max_total_sequence_length}
    colocated:
      resources:
        num_nodes: 2
        gpus_per_node: 4
    vllm_cfg:
      gpu_memory_utilization: 0.5
      enforce_eager: true
      reset_encoder_cache_after_weight_update: true
    vllm_kwargs:
      limit_mm_per_prompt:
        image: 10
data:
  train:
    data_path: /lustre/fs1/portfolios/llmservice/projects/llmservice_modelalignment_ppo/users/adithyare/code/main_branch_unified_opd/vlm_run_resources/vlm_training_data/joint_opd_dolphin_v41_curriculum_plus_babyvision_interleaved.jsonl
  validation:
    data_path: /lustre/fs1/portfolios/llmservice/projects/llmservice_modelalignment_ppo/users/adithyare/code/main_branch_unified_opd/vlm_run_resources/vlm_training_data/joint_opd_dolphin_v41_curriculum_plus_babyvision_interleaved.jsonl
env:
  nemo_gym:
    uv_pip_set_python: true
    # MOPD trains from teacher logprobs; OPDAdvantageEstimator ignores rewards.
    # Skipping verification keeps every row trainable without standing up the
    # judges the text agents would otherwise call (genrm/safety/terminus/...).
    # Requires the Gym skip-verification change (NVIDIA-NeMo/Gym#2279),
    # cherry-picked into our submodule at bc655567.
    skip_verification: true
    skip_verification_reward: 0.0
    num_gpu_nodes: 0
    invalid_tool_call_patterns:
      - "<tool_call>"
      - "</tool_call>"
      - "<function_call>"
      - "</function_call>"
    thinking_tags:
      - "<think>"
      - "</think>"
    # Union of the omni base's servers (string_match for the vision rows) and
    # the text mix's ~24 agents (one entry per resource server).
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/string_match/configs/string_match.yaml
    - resources_servers/genrm_compare/configs/genrm_compare.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/search_pivot_single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/swe_pivot_single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/toolcall_schema_single_step_tool_use_with_argument_comparison.yaml
    - resources_servers/terminus_judge/configs/terminus_judge_string_only.yaml
    - resources_servers/code_gen/configs/code_gen.yaml
    - resources_servers/instruction_following/configs/instruction_following.yaml
    - resources_servers/equivalence_llm_judge/configs/lc_judge.yaml
    - resources_servers/equivalence_llm_judge/configs/equivalence_llm_judge.yaml
    - resources_servers/equivalence_rule/configs/lc.yaml
    - resources_servers/math_with_judge/configs/math_with_judge.yaml
    - resources_servers/mcqa/configs/mcqa.yaml
    - resources_servers/abstention/configs/abstention.yaml
    - resources_servers/multichallenge/configs/multichallenge.yaml
    - resources_servers/jailbreak_detection/configs/jailbreak_detection_nemotron_combined_reward_tp8.yaml
    - resources_servers/format_verification/configs/freeform_formatting.yaml
    - resources_servers/format_verification/configs/citation_format.yaml
    - resources_servers/structured_outputs/configs/structured_outputs_v3.yaml
    - resources_servers/calendar/configs/calendar.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          max_input_tokens: ${policy.max_total_sequence_length}
    policy_model_reasoning_off:
      _copy: policy_model
      responses_api_models:
        vllm_model:
          chat_template_kwargs:
            enable_thinking: false
            truncate_history_thinking: false
          sequential_reasoning_allowed: false
    genrm_compare_resources_server:
      resources_servers:
        genrm_compare:
          genrm_model_server:
            type: responses_api_models
            name: genrm_model
          genrm_responses_create_params:
            max_output_tokens: 16384
            temperature: 0.6
            top_p: 0.95
          comparison_strategy: "circular"
          num_judges_per_comparison: 1
          # Must equal grpo.num_generations_per_prompt (=2 here); with
          # skip_verification true the judge is never actually called.
          num_rollouts_per_prompt: 2
          use_principle: true
          default_principle: "Please act as an impartial judge and evaluate the quality of the responses provided by two AI assistants to the user prompt. Begin your evaluation by generating your own answer to the prompt. You must provide your answer before judging any answers. When evaluating the assistants' answers, compare both assistants' answers with your answer. You must identify and correct any mistakes or inaccurate information. Then consider if the assistant's answers are helpful, relevant, and concise. Helpful means the answer correctly responds to the prompt or follows the instructions. Note when user prompt has any ambiguity or more than one interpretation, it is more helpful and appropriate to ask for clarifications or more information from the user than providing an answer based on assumptions. Relevant means all parts of the response closely connect or are appropriate to what is being asked. Concise means the response is clear and not verbose or excessive. Then consider the creativity and novelty of the assistant's answers when needed. Finally, identify any missing important information in the assistants' answers that would be beneficial to include when responding to the user prompt."
          aggregator_method: "simple_tiebreaker"
          reasoning_bonus: 0.5
          answer_bonus: 0.5
          top_percentile: 0.2
          group_reasoning_length_penalty_coeff: 0.3
          group_answer_length_penalty_coeff: 0.35
          group_style_penalty_coeff: 0.05
          default_score: 3.0
          default_ranking: 3.5
    # Judge servers, stubbed: config validation resolves every server ref
    # (genrm_compare/abstention -> genrm_model, jailbreak_detection ->
    # safety_judge_model). base_url makes each a thin client so no local vLLM
    # actor launches; the endpoint is never contacted (skip_verification).
    genrm_model:
      responses_api_models:
        genrm_model:
          entrypoint: app.py
          base_url: http://127.0.0.1:9/v1
          api_key: dummy_key
          model: unused
          uses_reasoning_parser: true
          return_token_id_information: false
          debug: true
          vllm_serve_env_vars: {}
          vllm_serve_kwargs: {}
    safety_judge_model:
      responses_api_models:
        local_vllm_model:
          entrypoint: app.py
          base_url: http://127.0.0.1:9/v1
          api_key: dummy_key
          model: unused
          return_token_id_information: false
          uses_reasoning_parser: false
          debug: true
          vllm_serve_env_vars: {}
          vllm_serve_kwargs: {}
on_policy_distillation:
  enabled: true
  # Per-sample routing: vision agent -> vlm_teacher; every other (text) agent
  # falls through default_teacher_alias -> text teacher. Paths are placeholders
  # overridden by the submit script.
  teacher_model_by_agent_name:
    string_match_simple_agent: /lustre/fsw/portfolios/llmservice/users/adithyare/code/main_branch_unified_opd/vlm_run_resources/vlm_teacher
    general: /lustre/fsw/portfolios/llmservice/users/yianz/projects/nemotron3/3.5_nano/copied_scripts/geshen/results/super_exp_rlvr_v41/step_70/policy/conversion/hf
  default_teacher_alias: general
  strict_agent_name_match: false
  deduplicate_shared_teacher_checkpoints: true
  non_colocated_teachers:
    enabled: true
    # default covers the vlm teacher (proven omni refmatch shape: TP8/EP8, 2n4g)
    default_teacher_cfg:
      tensor_model_parallel_size: 8
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 8
      context_parallel_size: 1
      num_nodes: 2
      gpus_per_node: 4
      precision: bf16
      micro_batch_size: 1
      moe_shared_expert_overlap: false
      # The omni policy's empty_unused_memory_level: 2 leaks to teachers and
      # empties the CUDA cache after EVERY logprob micro-batch — at 131k
      # chunked scoring this collapses teacher throughput (job 6451777
      # py-spy: GPUs 0%, workers thrashing; zero groups scored in >20min).
      # The text runs score this same teacher at 131k fast with level 1.
      empty_unused_memory_level: 1
    teacher_overrides:
      # text teacher: TP8/EP16/CP1 over 4n4g (DP=2). CP was 2 (the text-run
      # shape), but on this stack the teacher's FIRST CP2 forward hung
      # silently in lazy 2-rank P2P NCCL init (job 6448223: first-forward
      # markers then 55min of nothing, zero enqueues, zero errors). CP1 is
      # the shape every proven teacher here runs (002-refmatch, vlm teacher).
      general:
        tensor_model_parallel_size: 8
        pipeline_model_parallel_size: 1
        expert_model_parallel_size: 8
        context_parallel_size: 1
        num_nodes: 2
        gpus_per_node: 4
        precision: bf16
        micro_batch_size: 1
        moe_shared_expert_overlap: false
        # text-only teacher under a VLM student: strip the omni base's VLM
        # tower keys or import_model_from_hf_name raises "HybridModelProvider
        # has no such field" (job 6442219). __unset__ removes the key.
        radio_force_cpe_eval_mode: __unset__
        freeze_vision_model: __unset__
        freeze_vision_projection: __unset__
        freeze_sound_encoder: __unset__
        freeze_sound_projection: __unset__
        # The VLM student's mtp_num_layers: 0 must not leak either: this
        # teacher checkpoint HAS MTP layers (HF mtp_layers_block_type), and a
        # 0-layer config over an MTP model hits `assert mtp_num_layers > 0` in
        # hybrid_model.forward on every get_logprobs (job 6444954, 2.5k-error
        # storm). Unset all four so the bridge derives them from the teacher's
        # own HF config (the text runs worked only because their student also
        # used mtp 5, so the leak happened to match).
        mtp_num_layers: __unset__
        mtp_use_repeated_layer: __unset__
        mtp_loss_scaling_factor: __unset__
        mtp_detach_heads: __unset__
        # duplicated from default_teacher_cfg in case per-alias overrides
        # don't inherit the default's extra keys
        empty_unused_memory_level: 1
logger:
  log_dir: logs/mopd-super-omni-joint-opd-hsg
  wandb:
    project: unified_opd_tests_main_hsg
    name: joint-diag1-tiny-2teachers
    log_nemo_gym_full_result_tables: false
