# HSG four-GPU-node topology for the same 64-GPU learner and 64-GPU generator.
# Qualify native kernels, Gym backend, and checkpoint recovery on HSG before use.
defaults: ./vlm_grpo-nemotron-3.5-super-vl-120ba12b-16n8g-megatron-claweval-agentic-vbench-async-sc-decomp.v1.yaml

cluster:
  num_nodes: 32
  gpus_per_node: 4
  segment_size: 16

policy:
  generation:
    colocated:
      resources:
        num_nodes: 16
        gpus_per_node: 4

checkpointing:
  checkpoint_dir: results/grpo-super-claweval-agentic-vbench-async-decomp-hsg-32n4g

logger:
  log_dir: logs/grpo-super-claweval-agentic-vbench-async-decomp-hsg-32n4g
  wandb:
    name: ${oc.env:WANDB_NAME,claweval_agentic_vbench_subagents_super_grpo_async32_decomp_cluster-hsg}
