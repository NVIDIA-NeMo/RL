# Dense arm of the shared-prefix test pair. The shared arm,
# grpo-nano-v2-12b-1n8g-megatron-single-controller-token_capture-shared-prefix.yaml,
# inherits this file and changes only policy.sequence_packing.share_prefixes.
# Nemotron-Nano-12B-v2 on 1n8g (4 Megatron training GPUs as TP 4, and 4 single-GPU
# vLLM replicas), math through NeMo-Gym math_with_judge because token capture is
# only wired up on the Gym rollout path. The test driver prepends a fixed
# few-shot block to every prompt, so the prompt is most of each row.
# Launch with:
#   uv run examples/run_grpo_single_controller.py \
#     --config examples/configs/recipes/llm/grpo-nano-v2-12b-1n8g-megatron-single-controller-token_capture.yaml
defaults: ../../grpo_math_1B_megatron_single_controller.yaml
grpo:
  num_prompts_per_step: 8
  max_num_steps: 30
policy:
  model_name: nvidia/NVIDIA-Nemotron-Nano-12B-v2
  tokenizer:
    name: nvidia/NVIDIA-Nemotron-Nano-12B-v2
  train_global_batch_size: 128
  # The token budget of a forward is two rows of max_total_sequence_length.
  train_micro_batch_size: 2
  # data.max_input_seq_length for the few-shot block and the problem, plus
  # generation.max_new_tokens for the completion.
  max_total_sequence_length: 3584
  make_sequence_length_divisible_by: 8
  optimizer: null
  megatron_cfg:
    bias_activation_fusion: false
    tensor_model_parallel_size: 4
    sequence_parallel: true
  generation:
    max_new_tokens: 512
    vllm_cfg:
      expose_http_server: true
    vllm_kwargs:
      mamba_ssm_cache_dtype: float32  # needed to avoid SSM state overflows in vllm 5.2.0
      # vLLM 0.20 allocates one Mamba cache block per decode seq; the default
      # max_num_seqs=1024 exceeds available blocks. Cap to the rollout batch
      # (num_prompts_per_step * num_generations_per_prompt = 8 * 16 = 128).
      max_num_seqs: 128
    colocated:
      resources:
        gpus_per_node: 4
# Every Gym completion is captured and the finalizer publishes the training rows.
token_capture:
  enabled: true
async_rl:
  sampler:
    # Generation never runs ahead of the trainer, so both arms of the pair train
    # every step on rollouts of the same weight version.
    max_lookahead_versions: 0
checkpointing:
  checkpoint_dir: results/grpo-nano-v2-12b-1n8g-megatron-single-controller-token_capture
env:
  should_use_nemo_gym: true
  nemo_gym:
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/math_with_judge/configs/math_with_judge.yaml
    # Judge off: math-verify alone scores the rows, keeping the reward binary.
    math_with_judge:
      resources_servers:
        math_with_judge:
          judge_model_server:
            name: policy_model
          should_use_judge: false
    policy_model:
      responses_api_models:
        vllm_model:
          uses_reasoning_parser: false
data:
  max_input_seq_length: 3072
  num_workers: 0
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
  # Written by ng_prepare_data in the test driver, which then overrides
  # data_path with a copy whose prompts start with the few-shot block.
  train:
    env_name: nemo_gym
    data_path: 3rdparty/Gym-workspace/Gym/data/math_with_judge/train.jsonl
    processor: nemo_gym_data_processor
    dataset_name: NemoGymDataset
    prompt_file: null
    system_prompt_file: null
    split_validation_size: 0
cluster:
  gpus_per_node: 8
logger:
  log_dir: logs/grpo-nano-v2-12b-1n8g-megatron-single-controller-token_capture
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl
    name: grpo-nano-v2-12b-1n8g-megatron-single-controller-token_capture
