defaults: ../../grpo_math_1B.yaml
grpo:
  max_num_steps: 5
  num_prompts_per_step: 8
  num_generations_per_prompt: 4
checkpointing:
  enabled: false
  checkpoint_dir: results/grpo-nanov3-30BA3B-2n4g-megatron_generation-noncolocated-zero-kl-mxfp8
policy:
  model_name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
  tokenizer:
    name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  hf_config_overrides:
    router_aux_loss_coef: 0
  train_global_batch_size: 32
  train_micro_batch_size: 1
  logprob_batch_size: 4
  max_total_sequence_length: 2048
  make_sequence_length_divisible_by: 64
  automodel_cfg:
    enabled: false
  megatron_cfg:
    enabled: true
    zero_train_gen_mismatch: true
    batch_invariant_mode: true
    batch_invariant_backend: te_native
    batch_invariant_collective: ordered
    attention_backend: flash
    flash_attention_version: 4
    moe_permute_fusion: false
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
      CUBLASLT_WORKSPACE_SIZE: '0'
      CUBLAS_WORKSPACE_CONFIG: :0:0
      MAMBA_DETERMINISTIC: '1'
      TRITON_CACHE_AUTOTUNING: '1'
    bias_activation_fusion: false
    tensor_model_parallel_size: 2
    expert_model_parallel_size: 4
    sequence_parallel: true
    moe_router_dtype: fp32
    defer_fp32_logits: true
    activation_checkpointing: true
    use_fused_weighted_squared_relu: true
    te_precision_config_file: examples/te_precision/nanov3_linear_mxfp8.yaml
    fp8_cfg:
      enabled: true
      fp8: hybrid
      fp8_recipe: mxfp8
      fp8_param: true
  sequence_packing:
    enabled: false
  generation:
    backend: megatron
    refit_transport: mcore
    mcore_generation_config:
      refit_backend: nccl
      transformer_impl: inference_optimized
      inference_grouped_gemm_backend: torch
      inference_moe_token_dispatcher_type: nvls
      tensor_model_parallel_size: 2
      expert_model_parallel_size: 4
      sequence_parallel: true
      moe_router_dtype: fp32
      logprobs_mode: raw_logprobs
      mamba_inference_ssm_states_dtype: float32
      max_tokens: 256
      max_requests: 32
      enable_prefix_caching: false
      moe_pad_experts_for_cuda_graph_inference: false
      fp8_cfg:
        enabled: true
        fp8: hybrid
        fp8_recipe: mxfp8
        fp8_param: true
    colocated:
      enabled: false
      resources:
        gpus_per_node: ${cluster.gpus_per_node}
        num_nodes: 1
logger:
  log_dir: logs/grpo-nanov3-30BA3B-2n4g-megatron_generation-noncolocated-zero-kl-mxfp8
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl
    name: grpo-nanov3-30BA3B-2n4g-megatron_generation-noncolocated-zero-kl-mxfp8
cluster:
  gpus_per_node: 4
  num_nodes: 2
