defaults: grpo-qwen3.5-35ba3b-2n8g-megatron-ep16tp2cp2.yaml
loss_fn:
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2
grpo:
  async_grpo:
    enabled: true
    in_flight_weight_updates: true
checkpointing:
  checkpoint_dir: results/grpo-qwen3.5-35ba3b-6n4g-async-1off-bf16-trtllm
policy:
  generation:
    refit_transport: nccl_reshard
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 2
    vllm_cfg:
      async_engine: true
      precision: bfloat16
      expert_parallel_size: 4
      gpu_memory_utilization: 0.8
      enforce_eager: false
    vllm_kwargs:
      moe_backend: flashinfer_trtllm
      expert_placement_strategy: linear
logger:
  wandb:
    name: grpo-qwen3.5-35ba3b-6n4g-async-1off-bf16-trtllm
cluster:
  gpus_per_node: 4
  num_nodes: 6
  segment_size: 2
