defaults: ../../../nemo_gym/grpo_qwen3_30ba3b_instruct.yaml
grpo:
  num_prompts_per_step: 256
  num_generations_per_prompt: 4
  max_num_steps: 5
  val_period: 0
  val_at_start: false
  async_grpo: null
  skip_reference_policy_logprobs_calculation: false
loss_fn:
  reference_policy_kl_penalty: 0.01
  use_importance_sampling_correction: true
policy:
  model_name: Qwen/Qwen3-0.6B
  train_global_batch_size: ${mul:${grpo.num_prompts_per_step}, ${grpo.num_generations_per_prompt}}
  max_total_sequence_length: 2048
  megatron_cfg:
    tensor_model_parallel_size: 1
    expert_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
  generation:
    vllm_cfg:
      http_api_server_count: 8
      tensor_parallel_size: 2
    vllm_kwargs:
      max_num_seqs: 512
      max_num_batched_tokens: 8192
    colocated:
      enabled: false
      resources:
        num_nodes: 1
        gpus_per_node: 4
data_plane:
  enabled: true
  impl: transfer_queue
  backend: simple
  claim_meta_poll_interval_s: 0.5
  simple:
    num_storage_units: 2
token_capture:
  enabled: true
async_rl:
  sampler:
    name: in_order
    max_lookahead_versions: 0
  min_groups_for_streaming_train: ${grpo.num_prompts_per_step}
  max_inflight_prompts: ${grpo.num_prompts_per_step}
  max_buffered_rollouts: ${grpo.num_prompts_per_step}
  generation_fleet_health:
    enabled: false
  generation_router:
    enabled: false
env:
  nemo_gym:
    policy_model:
      responses_api_models:
        vllm_model:
          sampling_overrides:
            max_tokens: 256
checkpointing:
  enabled: false
logger:
  log_dir: logs/grpo-qwen3-0.6b-1n8g-megatron-vllm-tp2-single-controller-gym-api8
  wandb:
    name: grpo-qwen3-0.6b-1n8g-megatron-vllm-tp2-single-controller-gym-api8
