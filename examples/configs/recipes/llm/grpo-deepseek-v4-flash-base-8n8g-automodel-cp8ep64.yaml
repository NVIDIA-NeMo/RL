defaults: ../../grpo_math_1B.yaml

# Native DeepSeek V4 feature baseline on Automodel r0.6.0. This intentionally
# excludes the legacy Automodel fork's training-side fake-quant patches.
grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_num_epochs: 100
  max_num_steps: 1000
  use_leave_one_out_baseline: false
  val_period: 10
  max_val_samples: 960
  val_batch_size: 960
  batch_multiplier: 3
  use_dynamic_sampling: true
  reward_scaling:
    enabled: true
    target_min: -1.0
  reward_shaping:
    enabled: true
    overlong_buffer_length: 1024
    max_response_length: 8192

loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2
  ratio_clip_max: 0.28
  ratio_clip_c: 10

checkpointing:
  checkpoint_dir: results/grpo-deepseek-v4-flash-base-8n8g-automodel-cp8ep64
  keep_top_k: 1
  save_period: 5
  checkpoint_must_save_by: 00:03:45:00
  model_save_format: null

policy:
  model_name: deepseek-ai/DeepSeek-V4-Flash-Base
  tokenizer:
    name: ${policy.model_name}
    # The official checkpoint currently has no HF chat template. NeMo-RL and
    # vLLM both use vLLM 0.25.1's native DeepSeek V4 renderer for this selector.
    chat_template: deepseek_v4
    chat_template_kwargs:
      enable_thinking: false
  dequantize_base_checkpoint: true
  hf_config_overrides:
    num_nextn_predict_layers: 0
  train_global_batch_size: 512
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 10240
  logprob_chunk_size: 1024
  offload_optimizer_for_logprob: true
  make_sequence_length_divisible_by: 64
  optimizer:
    name: torch.optim.AdamW
    kwargs:
      lr: 1.0e-06
      weight_decay: 0.1
      betas: [0.9, 0.95]
      eps: 1.0e-08
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 1.0e-02
      end_factor: 1.0
      total_iters: 5
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1.0
      total_iters: 10000000000
  - milestones: [5]
  dtensor_cfg:
    _v2: true
    enabled: true
    cpu_offload: false
    sequence_parallel: false
    tensor_parallel_size: 1
    context_parallel_size: 8
    expert_parallel_size: 64
    activation_checkpointing: true
    moe_parallelizer:
      ignore_router_for_ac: true
      reshard_after_forward: false
    automodel_kwargs:
      backend:
        _target_: nemo_automodel.components.models.common.BackendConfig
        # DeepSeek V4 CP is model-owned and requires TileLang attention.
        attn: tilelang
        linear: torch
        rms_norm: torch_fp32
        experts: torch_mm
        dispatcher: hybridep
        fake_balanced_gate: false
        rope_fusion: false
        enable_hf_state_dict_adapter: true
        enable_fsdp_optimizations: true
  megatron_cfg:
    enabled: false
  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: true
  generation:
    max_new_tokens: 8192
    temperature: 1.0
    vllm_cfg:
      precision: fp8
      kv_cache_dtype: fp8_ds_mla
      # Work around https://github.com/NVIDIA-NeMo/RL/issues/3412: vLLM 0.25
      # defaults to RayExecutorV2, while FP8 worker patching currently uses V1.
      env_vars:
        VLLM_USE_RAY_V2_EXECUTOR_BACKEND: "0"
      use_deep_gemm: true
      pow2_weight_scaling_factors: true
      tensor_parallel_size: 8
      expert_parallel_size: 1
      enable_expert_parallel: true
      gpu_memory_utilization: 0.6
      enforce_eager: true
      max_model_len: ${policy.max_total_sequence_length}
    vllm_kwargs:
      tokenizer_mode: deepseek_v4

data:
  max_input_seq_length: 1024
  filter_overlong_prompts: true
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null

env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify

logger:
  wandb_enabled: true
  tensorboard_enabled: true
  monitor_gpus: true
  num_val_samples_to_print: 2
  num_train_samples_to_print: 2
  wandb:
    project: nemo-rl
    name: grpo-deepseek-v4-flash-base-8n8g-automodel-cp8ep64

cluster:
  gpus_per_node: 8
  num_nodes: 8
