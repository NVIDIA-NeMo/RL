# Nemotron Nano MPS: shared-weight Megatron training and inference on eight GPUs.
# Run with: bash examples/run_nemotron_nano_mps.sh
defaults: ../../grpo_math_1B_megatron_single_controller.yaml
grpo:
  num_generations_per_prompt: 8
  val_num_generations_per_prompt: 4
  max_num_steps: 25
  max_val_samples: null
  num_prompts_per_step: 32
  async_grpo: null
  val_period: 0
loss_fn:
  reference_policy_kl_penalty: 0
  kl_input_clamp_value: null
  kl_output_clamp_value: null
  ratio_clip_max: 0.28
  use_on_policy_kl_approximation: true
  use_importance_sampling_correction: true
  force_on_policy_ratio: true
checkpointing:
  enabled: false
  checkpoint_dir: results/nemotron-nano-mps/checkpoints
policy:
  model_name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  tokenizer:
    name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
    chat_template_kwargs:
      enable_thinking: true
      truncate_history_thinking: false
  train_global_batch_size: 256
  train_micro_batch_size: 1
  generation_batch_size: 64
  logprob_batch_size: 1
  max_total_sequence_length: 10240
  logprob_chunk_size: 2048
  megatron_cfg:
    empty_unused_memory_level: 0
    activation_checkpointing: true
    bias_activation_fusion: false
    expert_model_parallel_size: 4
    moe_router_dtype: fp32
    moe_aux_loss_coeff: 0.0
    moe_router_enable_expert_bias: true
    defer_fp32_logits: true
    track_moe_metrics: false
    optimizer:
      lr: 1.0e-06
      min_lr: 1.0e-06
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0
    scheduler:
      lr_decay_iters: null
    distributed_data_parallel_config:
      overlap_grad_reduce: false
      average_in_collective: false
      grad_reduce_in_fp32: false
      overlap_param_gather: true
    env_vars:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_MPS_CLIENT_PRIORITY: '0'
    recompute_granularity: selective
    recompute_modules:
    - moe_act
    enabled: true
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    expert_tensor_parallel_size: 1
    freeze_moe_router: true
  dynamic_batching:
    train_mb_tokens: 10240
    logprob_mb_tokens: 10240
  sequence_packing:
    enabled: false
    train_mb_tokens: 10240
    logprob_mb_tokens: 10240
    microbatch_order: largest_first
  make_sequence_length_divisible_by: 128
  optimizer: null
  scheduler: null
  offload_optimizer_for_refit: false
  generation:
    backend: megatron
    max_new_tokens: 8192
    mcore_generation_config:
      max_model_len: 10240
      transformer_impl: inference_optimized
      activation_checkpointing: false
      mamba_inference_ssm_states_dtype: float32
      inference_grouped_gemm_backend: vllm
      moe_router_num_groups: null
      moe_router_group_topk: null
      pipeline_model_parallel_size: 1
      expert_tensor_parallel_size: 1
      expert_model_parallel_size: 4
      sequence_parallel: false
      context_parallel_size: 1
      tensor_model_parallel_size: 1
      buffer_size_gb: 17
      max_tokens: 10240
      kv_cache_management_mode: persist
      expose_http_server: true
      parsers:
      - deepseek-r1-reasoning
      - qwen3-coder-tool
      max_requests: 160
      logging_step_interval: 50
      env_vars:
        OMP_NUM_THREADS: '2'
        MKL_NUM_THREADS: '2'
        CUDA_MPS_CLIENT_PRIORITY: '0'
      cuda_graph_impl: local
      cuda_graph_sizing_distribution: hybrid
      cuda_graph_max_tokens: 512
      inference_cuda_graph_scope: block
      use_cuda_graphs_for_non_decode_steps: true
      enable_chunked_prefill: true
      num_speculative_tokens: 0
    colocated:
      resources:
        gpus_per_node: null
        num_nodes: null
      # Caps the learner at 58%; the engine remains uncapped under mps_percentage.
      engine_sm_fraction: 0.42
      engine_weights: shared
      sm_partition_backend: mps_percentage
      # Separate engine processes, placed on the training GPUs by the MPS path.
      enabled: false
    refit_transport: ipc
  precision: bfloat16
  offload_optimizer_for_logprob: false
logger:
  log_dir: results/nemotron-nano-mps
  wandb_enabled: false
  tensorboard_enabled: false
  mlflow_enabled: false
  monitor_gpus: false
cluster:
  num_nodes: 1
  gpus_per_node: 8
data_plane:
  simple:
    num_storage_units: 4
  enabled: true
  impl: transfer_queue
  backend: simple
async_rl:
  generation_fleet_health:
    refit_timeout_s: null
  sampler:
    max_lookahead_versions: 4
  max_inflight_prompts: 160
  max_buffered_rollouts: 160
  recompute_kv_cache_after_weight_updates: false
  stall_watchdog:
    stall_action: abort
  min_groups_for_streaming_train: 32
data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  default:
    prompt_file: null
env:
  should_use_nemo_gym: false
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
  math_parity:
    num_workers: 16
    math_verify_impl: dapo_math_verify
token_capture:
  enabled: false
