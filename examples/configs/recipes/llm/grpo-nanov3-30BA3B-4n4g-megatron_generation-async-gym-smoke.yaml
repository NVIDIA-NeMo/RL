defaults: ./grpo-nanov3-30BA3B-2n8g-megatron_generation-async-gym.yaml
# Reduced mcore-lane smoke leg: 3 steps, no checkpointing, gen_kl_error-only
# gate (see the suite). Exists so Megatron-Core/Bridge bumps exercise the 30B
# megatron-inference stack without paying for the full nightly leg.
cluster:
  gpus_per_node: 4
  num_nodes: 4
policy:
  generation:
    colocated:
      resources:
        gpus_per_node: 4
        num_nodes: 2
checkpointing:
  checkpoint_dir: results/grpo-nanov3-30BA3B-4n4g-megatron_generation-async-gym-smoke
logger:
  wandb:
    name: grpo-nanov3-30BA3B-4n4g-megatron_generation-async-gym-smoke
