defaults: ./grpo-nanov3-30ba3b-1n4g-megatron-mxfp8-both-sides.yaml
grpo:
  num_prompts_per_step: 2
  num_generations_per_prompt: 4
  max_num_epochs: 1
  max_num_steps: 3
  val_period: 0
  val_at_start: false
  val_at_end: false
  seq_logprob_error_threshold: null
loss_fn:
  reference_policy_kl_penalty: 0.0
checkpointing:
  enabled: false
  checkpoint_dir: results/grpo-nanov3-megatron-mxfp8-convergence
policy:
  train_global_batch_size: 8
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 512
  megatron_cfg:
    train_iters: 3
    activation_checkpointing: true
    optimizer:
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0
  generation:
    # The base model frequently spends more than 64 tokens reasoning before
    # emitting a boxed answer. Use a length that can produce nonzero GRPO
    # reward/advantages while remaining within max_model_len=512.
    max_new_tokens: 256
logger:
  log_dir: results/grpo-nanov3-megatron-mxfp8-convergence
  monitor_gpus: false
  wandb_enabled: false
  tensorboard_enabled: false
env:
  math:
    num_workers: 2
