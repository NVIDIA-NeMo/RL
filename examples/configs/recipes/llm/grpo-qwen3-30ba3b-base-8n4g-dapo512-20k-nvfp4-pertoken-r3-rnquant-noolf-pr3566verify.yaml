defaults: ../../grpo_math_1B.yaml
# NVFP4 per-token W4A4 long run on PR #3566's clean, merged code (TE v2.16.1,
# vLLM 0.26.0) -- flattened/ported from the shuangy/nvfp4-pertoken-probe
# repo's defaults chain (base bf16-dapo512-20k -> nvfp4-pertoken -> r3-1500 ->
# te3049 -> rnquant -> noolf), to verify PR #3566 reproduces that arm's
# behavior on its own code, not the probe's hand-patched tree.
#
# Two deliberate deviations from the source arm:
#   - "te3049" DROPPED. NRL_TE3049_WGRAD_VIEWS backported upstream TE PR #3049's
#     wgrad-race fix onto TE pin 937c4de via an uncommitted monkeypatch that
#     was never merged anywhere. PR #3566 pins TE v2.16.1, which postdates the
#     real upstream #3049 merge (2026-05-28) by ~2.5 months and very likely
#     already contains the fix natively -- setting the env var here would be
#     silently inert (no code in this tree reads it), so it's omitted rather
#     than keep a misleading label on a no-op.
#   - Router-replay monolithic-capture fix ADDED (not a config change: see
#     nemo_rl/models/generation/vllm/patches.py::_patch_vllm_moe_routed_experts_capture,
#     ported from probe commit 1d3f0eea8). PR #3566 had router_replay
#     infrastructure but was missing this fix for NVFP4's monolithic
#     FlashInfer-TRT-LLM fused-MoE kernel, which bypasses the routed-experts
#     capture hook (all-zero routes without it) -- without this patch, r3
#     doesn't mean anything on this code path.
#
# Everything else (DAPO-512 dataset/algorithm settings, tp2/ep8 topology,
# fp4_cfg, f2l4 BF16 carve-out, rnquant fast-math-off flags, noolf) is
# unchanged from the source arm. Expect the same known NVFP4 accuracy
# collapse seen around step ~550 on every prior arm of this campaign -- that
# is a documented characteristic of this algorithm/precision combination, not
# a PR-code bug. Designed to run as one resumable leg at a time
# (checkpoint_must_save_by forces a clean save+exit before the Slurm wall);
# the original arm took ~11 legs to reach 550 steps.
grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_num_steps: 1500
  val_at_start: true
  use_dynamic_sampling: true
  batch_multiplier: 3
  dynamic_sampling_max_gen_batches: 20
  overlong_filtering: false
  use_leave_one_out_baseline: false
  reward_scaling:
    enabled: true
    target_min: -1.0
  reward_shaping:
    enabled: true
    overlong_buffer_length: 512
    max_response_length: 20480
loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: "tis"
  truncated_importance_sampling_ratio: 2
  ratio_clip_max: 0.28
  ratio_clip_c: 10
checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-r3-rnquant-noolf-pr3566verify
  enabled: true
  save_period: 10
  keep_top_k: 3
  save_optimizer: true
  checkpoint_must_save_by: "00:04:15:00"  # force save + clean exit before the 5h wall
policy:
  model_name: /lustre/fsw/general_sa/shuangy/models/Qwen/Qwen3-30B-A3B-Base
  tokenizer:
    name: /lustre/fsw/general_sa/shuangy/models/Qwen/Qwen3-30B-A3B-Base
  train_global_batch_size: 512
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 22528  # 2048 prompt + 20480 response
  logprob_chunk_size: 2048
  offload_optimizer_for_logprob: true
  make_sequence_length_divisible_by: 8
  dtensor_cfg:
    enabled: false
  router_replay:
    enabled: true
  megatron_cfg:
    enabled: true
    bias_activation_fusion: false
    tensor_model_parallel_size: 2
    expert_model_parallel_size: 8
    sequence_parallel: true
    activation_checkpointing: true
    defer_fp32_logits: true
    batch_invariant_mode: false
    moe_router_dtype: fp32
    fp4_cfg:
      enabled: true
      fp4: "e2m1"
      fp4_recipe: "nvfp4"
      fp4_param: false
    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 2
    num_layers_at_end_in_bf16: 4
    te_precision_config_file: examples/configs/te_precision/attn_bf16_mlp_nvfp4.yaml
    optimizer:
      use_precision_aware_optimizer: false
      lr: 1.0e-6
      min_lr: 1.0e-7
      weight_decay: 0.1
    scheduler:
      lr_warmup_iters: 10
      lr_warmup_init: 1.0e-8
    checkpoint:
      # async_save MUST stay off for colocated GRPO -- see the bf16 source
      # recipe / research/vllm-nvfp4-pertoken/debug_resume/ROOT_CAUSE.md for
      # the NVRx stale-IPC-handle failure mode this avoids.
      async_save: false
    env_vars:
      # Fresh conversion directory (NOT the probe's shared megatron_ckpt/):
      # that cache holds a torch_dist conversion from Jul 20, predating this
      # branch's megatron.core 0.20.0+6513e3e23 -- reusing a cross-version
      # conversion risks a stale/incompatible checkpoint.
      NRL_MEGATRON_CHECKPOINT_DIR: /lustre/fsw/general_sa/shuangy/hf/megatron_ckpt_pr3566
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False,garbage_collection_threshold:0.8
      NVTE_NVFP4_ROW_SCALED_ACTIVATION: "1"
      NVTE_NVFP4_DISABLE_RHT: "1"
      NVTE_NVFP4_DISABLE_2D_QUANTIZATION: "1"
      NVTE_NVFP4_DISABLE_STOCHASTIC_ROUNDING: "1"
      NVTE_BACKWARD_OVERRIDE: "dequantized"
      # No-op (fast math is only ever turned ON by setting this var; unset
      # already means false). Kept only for explicitness, matching the source
      # arm -- do not remove under the impression it does something.
      NVTE_USE_FAST_MATH: "0"
  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: true
    train_mb_tokens: 22528
    logprob_mb_tokens: 22528
  generation:
    backend: vllm
    max_new_tokens: 20480
    nvfp4_pertoken_rollout:
      enabled: true
      additional_ignore:
        - "*.layers.0.mlp.experts*"
        - "*.layers.1.mlp.experts*"
        - "*.layers.44.mlp.experts*"
        - "*.layers.45.mlp.experts*"
        - "*.layers.46.mlp.experts*"
        - "*.layers.47.mlp.experts*"
    vllm_kwargs:
      moe_backend: auto
    vllm_cfg:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.5
      enforce_eager: false
      max_model_len: ${policy.max_total_sequence_length}
      precision: bfloat16
      kv_cache_dtype: auto
      env_vars:
        # Real effect (closes ~5 orders of magnitude of TE-vs-FlashInfer
        # rounding disagreement offline); see nvfp4-fastmath-closes-traingen.
        FLASHINFER_DISABLE_FP4_QUANT_FAST_MATH: "1"
        TRTLLM_DISABLE_FP4_QUANT_FAST_MATH: "1"
    colocated:
      enabled: true
data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
logger:
  num_val_samples_to_print: 8
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    entity: nv-welcome
    project: qwen3-30b-nvfp4
    name: grpo-qwen3-30ba3b-base-8n4g-dapo512-20k-nvfp4-pertoken-r3-rnquant-noolf-pr3566verify
cluster:
  gpus_per_node: 4
  num_nodes: 8
