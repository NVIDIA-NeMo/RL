defaults: ../../grpo_math_1B.yaml
grpo:
  max_num_epochs: 10
  max_num_steps: 10000
  use_leave_one_out_baseline: false
  max_val_samples: 240
  val_batch_size: 240
  reward_scaling:
    target_min: -1.0
  reward_shaping:
    overlong_buffer_length: 512
    max_response_length: 6144
loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 2
  truncated_importance_sampling_type: tis
  ratio_clip_max: 0.28
  ratio_clip_c: 10
checkpointing:
  checkpoint_dir: results/grpo-minimax-m3-32n8g-automodel-cp8ep128-noncolocated
  keep_top_k: 1
  save_period: 100
  checkpoint_must_save_by: 00:03:45:00
policy:
  model_name: MiniMaxAI/MiniMax-M3
  hf_config_overrides:
    text_config:
      num_mtp_modules: 0
  train_micro_batch_size: 1
  logprob_batch_size: 1
  make_sequence_length_divisible_by: 1024
  max_total_sequence_length: 8192
  logprob_chunk_size: 1024
  offload_optimizer_for_logprob: true
  optimizer:
    name: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
    kwargs:
      lr: 1.0e-06
      weight_decay: 0.1
      master_weights: true
      store_param_remainders: true
      exp_avg_dtype: torch.bfloat16
      exp_avg_sq_dtype: torch.bfloat16
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 1.0e-08
      end_factor: 1.0
      total_iters: 10
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1.0
      total_iters: 10000000000
  - milestones:
    - 10
  dtensor_cfg:
    context_parallel_size: 8
    expert_parallel_size: 128
    activation_checkpointing: true
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      NRL_REFIT_NUM_BUFFERS: '1'
    automodel_kwargs:
      backend:
        _target_: nemo_automodel.components.models.common.utils.BackendConfig
        attn: sdpa
        linear: te
        rms_norm: torch_fp32
        fake_balanced_gate: false
        rope_fusion: false
        enable_hf_state_dict_adapter: true
        experts: torch_mm
        dispatcher: hybridep
        enable_fsdp_optimizations: true
      freeze_config:
        freeze_vision_tower: true
        freeze_audio_tower: true
        freeze_language_model: false
  sequence_packing:
    enabled: false
  generation:
    max_new_tokens: 6144
    vllm_kwargs:
      language_model_only: true
      block_size: 128
    vllm_cfg:
      tensor_parallel_size: 16
      expert_parallel_size: 16
      gpu_memory_utilization: 0.8
      enforce_eager: true
      max_model_len: 8192
    colocated:
      enabled: false
      resources:
        gpus_per_node: 8
        num_nodes: 16
data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
logger:
  wandb_enabled: true
  wandb:
    project: nemorl-m3
    name: grpo-minimax-m3-32n8g-automodel-cp8ep128-noncolocated
cluster:
  gpus_per_node: 8
  num_nodes: 32
