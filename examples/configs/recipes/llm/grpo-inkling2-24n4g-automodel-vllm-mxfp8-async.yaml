# Async GRPO variant of grpo-inkling2-16n4g-automodel-vllm-mxfp8: training keeps
# its 16 nodes (EP 64) and generation moves to 8 dedicated nodes (four TP 8 vLLM
# engines), so cluster.num_nodes = 16 + 8 = 24 (16 + 4 would also work; 20
# training nodes would not, since 80 GPUs cannot split 384 experts for EP 64). Async settings follow
# examples/nemo_gym/grpo_nanov3_async.yaml (NVIDIA-NeMo/RL#2973).
defaults: grpo-inkling2-16n4g-automodel-vllm-mxfp8.yaml

grpo:
  async_grpo:
    enabled: true
    # Limits stale trajectories. Higher values can improve speed, but may be
    # more aggressive in terms of model accuracy.
    max_trajectory_age_steps: 1
    # Lets generation workers receive weight updates while new rollouts are in flight.
    in_flight_weight_updates: true
    # Configurable knob on reusing the existing KV cache across weight updates.
    recompute_kv_cache_after_weight_updates: false

loss_fn:
  # Required for async mode because trajectories may be generated by a slightly
  # older policy than the one used for training.
  use_importance_sampling_correction: true
  # Truncates importance weights to reduce sensitivity to train/generation
  # logprob mismatch from the MoE + vLLM backend.
  truncated_importance_sampling_type: tis
  # If truncated_importance_sampling_type is tis, this cannot be null.
  truncated_importance_sampling_ratio: 5.0
  # Optional: set to true to force the PPO ratio to 1.0
  force_on_policy_ratio: false

checkpointing:
  # A checkpoint (DCP shards: BF16 weights + FP32-master remainders + BF16
  # moments) is ~5-6 TB and a synchronous save takes 1-1.5 min. Save once, when
  # checkpoint_must_save_by (DD:HH:MM:SS from job start; launch_slurm.sh sets it
  # from the time limit) is reached, then exit. save_period is set past any run
  # length so no periodic saves happen; none is save_period-aligned, so
  # keep_top_k keeps only the newest (always protected) checkpoint.
  enabled: true
  save_period: 1000000
  checkpoint_must_save_by: "00:01:50:00"
  metric_name: null
  keep_top_k: 1

policy:
  automodel_cfg:
    checkpoint:
      # Resume through host memory (~450 GB of 920 GB per node): loading the
      # optimizer otherwise builds a full FP32 copy of its state on each GPU and
      # runs out of memory.
      resume_on_cpu: true
  generation:
    vllm_cfg:
      # Async GRPO requires vLLM's async engine.
      async_engine: true
      # Dedicated generation GPUs: no colocated policy, so give vLLM more KV cache.
      gpu_memory_utilization: 0.85
    colocated:
      # Uses dedicated generation resources instead of sharing training GPUs.
      enabled: false
      resources:
        gpus_per_node: 4
        # Reserve generation nodes here. Training nodes = total num_nodes - generation nodes.
        num_nodes: 8

logger:
  log_dir: logs/grpo-inkling2-24n4g-automodel-vllm-mxfp8-async
  wandb:
    name: grpo-inkling2-24n4g-automodel-vllm-mxfp8-async

cluster:
  num_nodes: 24
