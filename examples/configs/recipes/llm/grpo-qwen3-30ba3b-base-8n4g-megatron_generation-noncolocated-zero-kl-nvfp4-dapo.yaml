# Qwen3-30B-A3B-Base per-token NVFP4 zero train/generation KL on the DAPO-Math setup of
# grpo-qwen3-30ba3b-base-8n4g-megatron-te-nvfp4-pertoken.yaml (same data, lengths, batch,
# dynamic sampling, loss and optimizer), for comparison with the vLLM NVFP4 runs.
# 8 nodes: 4 for training (EP4), 4 for Megatron generation.
defaults: grpo-qwen3-30ba3b-2n4g-megatron_generation-noncolocated-zero-kl-nvfp4-flashinfer.yaml
grpo:
  max_num_steps: 1000
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  val_at_start: true
  val_period: 20
  use_dynamic_sampling: true
  batch_multiplier: 3
  dynamic_sampling_max_gen_batches: 20
  use_leave_one_out_baseline: false
  reward_scaling:
    enabled: true
    target_min: -1.0
  reward_shaping:
    enabled: true
    overlong_buffer_length: 512
    max_response_length: 20480
loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2
  ratio_clip_max: 0.28
  ratio_clip_c: 10
checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-base-8n4g-megatron_generation-noncolocated-zero-kl-nvfp4-dapo
  save_period: 20
  keep_top_k: 2
  metric_name: null
policy:
  model_name: Qwen/Qwen3-30B-A3B-Base
  train_global_batch_size: 512
  train_micro_batch_size: 1
  max_total_sequence_length: 22528
  logprob_chunk_size: 2048
  # grpo_math_qwen30ba3b_megatron turns packing off; without it every microbatch is one
  # response padded to the batch's longest. logprob_mb_tokens is set explicitly because the
  # default scales with logprob_batch_size (4) to ~90K tokens.
  sequence_packing:
    enabled: true
    train_mb_tokens: ${policy.max_total_sequence_length}
    logprob_mb_tokens: ${policy.max_total_sequence_length}
  megatron_cfg:
    optimizer:
      lr: 1.0e-06
      min_lr: 1.0e-07
      weight_decay: 0.1
    scheduler:
      lr_warmup_iters: 10
      lr_warmup_init: 1.0e-08
  generation:
    max_new_tokens: 20480
    colocated:
      resources:
        num_nodes: 4
    mcore_generation_config:
      max_tokens: 8192
      max_requests: 512
      buffer_size_gb: 80
data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
cluster:
  num_nodes: 8
logger:
  log_dir: logs/grpo-qwen3-30ba3b-base-8n4g-megatron_generation-noncolocated-zero-kl-nvfp4-dapo
  wandb:
    name: grpo-qwen3-30ba3b-base-8n4g-megatron_generation-noncolocated-zero-kl-nvfp4-dapo
