defaults: ../../grpo_math_1B.yaml
# GRPO, not DAPO. The base config's defaults are already GRPO
# (use_dynamic_sampling false, batch_multiplier 1, reward_shaping off,
# ratio_clip_max 0.2), so this recipe simply does not override them.
# token_level_loss is the one exception -- the base sets it true and this recipe
# turns it off, matching the run this recipe reproduces.
grpo:
  # Reference logprobs are required by the KL penalty below (~+10% step time).
  skip_reference_policy_logprobs_calculation: false
  val_period: 5
  # Measure the untrained policy before step 1. Without it the first datapoint
  # is step 5 and there is no baseline to say whether training helped.
  val_at_start: true
  max_val_samples: 960
  val_batch_size: 960
  use_leave_one_out_baseline: false
  reward_scaling:
    enabled: true
    target_min: -1.0
  reward_shaping:
    # Off: no overlong penalty. This is what distinguishes the recipe from the
    # DAPO variant it replaces. With it disabled apply_reward_shaping returns
    # before reading overlong_buffer_length / max_response_length, so those are
    # deliberately not set here.
    enabled: false
loss_fn:
  # KL anchor to the initial (reference) policy; k3 estimator (base default).
  # Without it this model's validation accuracy rises for ~30 steps and then
  # decays (length inflation -> truncation collapse + behavior drift); 0.01
  # holds the curve flat. 0.001 was tested and is too weak.
  reference_policy_kl_penalty: 0.01
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2
  ratio_clip_c: 10
  # Base default is true; the reference run used sequence-level loss.
  token_level_loss: false
checkpointing:
  checkpoint_dir: results/grpo-muse-glimmer-30b-4n8g-fsdp2cp4-automodel-6k
  save_period: 10
  # 423 GB per checkpoint; keep fewer than the default 3.
  keep_top_k: 2
  # Asynchronous checkpointing. Stated explicitly rather than left to the worker
  # default, because the value is load-bearing and easy to get wrong in both
  # directions.
  #
  # It only became safe once the finalize_async_save wait was added. Without it,
  # tmp_step_N is renamed to step_N while dcp.async_save is still writing from a
  # separate process; that process addresses files by path, so it re-creates
  # tmp_step_N and step_N is left with weights but no optimizer state.
  #
  # Setting the key is required, not decorative. DTensorPolicyWorkerV2 hardcodes
  # is_async=True at worker init with no config path, so an unset key silently
  # gives async regardless of the documented default of False. Being explicit
  # means the intent survives if that worker default ever changes.
  is_async: true
policy:
  # Defaults to the released HF Hub checkpoint. Override with a local
  # checkpoint directory if needed -- see docs/guides/models/muse-glimmer.md.
  model_name: meta-models/Muse-Glimmer-30B
  tokenizer:
    name: meta-models/Muse-Glimmer-30B
  train_micro_batch_size: 1
  logprob_batch_size: 1
  # 6144 with context_parallel_size=4, i.e. 1536 tokens per rank.
  #
  # The head is unusually memory-hungry: vocab is 202048 and the final soft cap
  # in Automodel's Onyx model.py runs
  #     logits = soft_cap * tanh(logits.float() * multiplier / soft_cap)
  # which materializes roughly four full-vocab fp32 tensors, so per-rank token
  # count is the dominant memory term. Context parallelism is what keeps it low
  # enough here.
  #
  # This is the recommended recipe. It reaches markedly better validation
  # accuracy than the 4k variant and its gen_kl_error stays flat rather than
  # drifting upward.
  max_total_sequence_length: 6144
  logprob_chunk_size: 4096
  offload_optimizer_for_logprob: true
  optimizer:
    name: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
    kwargs:
      lr: 1.0e-06
      weight_decay: 0.1
      master_weights: true
      store_param_remainders: true
      exp_avg_dtype: torch.bfloat16
      exp_avg_sq_dtype: torch.bfloat16
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 1.0e-08
      end_factor: 1.0
      total_iters: 10
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1.0
      total_iters: 10000000000
  - milestones:
    - 10
  dtensor_cfg:
    activation_checkpointing: true
    # Splits a single sequence across ranks, which FSDP2 cannot do: 6144 / 4 =
    # 1536 tokens per rank. Rejected for VLMs and for sequence packing, and
    # forces attn_implementation=sdpa, which this recipe already sets.
    #
    # CP is not memory-neutral -- Transformer Engine's ring-attention backward
    # keeps roughly cp_size copies of dq/dk/dv -- but at 1536 tokens/rank there
    # is enough headroom to leave the microbatch budget at its derived value.
    context_parallel_size: 4
    automodel_kwargs:
      # Onyx's native Automodel implementation accepts backend.attn of te, sdpa
      # or eager only. Mirrors Automodel's own
      # examples/llm_finetune/onyx/onyx_29b_tulu3_te_tp2_cp32_packed_256k.yaml:
      # attn_implementation stays sdpa so HF config validation passes, while the
      # native language attention runs on Transformer Engine.
      attn_implementation: sdpa
      backend:
        _target_: nemo_automodel.components.models.common.utils.BackendConfig
        attn: te
      # Automodel's Onyx recipes set this false; only Gemma4 turns it on.
      use_liger_kernel: false
      freeze_config:
        freeze_vision_tower: true
        freeze_audio_tower: true
        freeze_language_model: false
  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: true
  # Deliberately 1, not the ${mul:...context_parallel_size} form other recipes
  # use. Safe here because sequence packing is off and dynamic batching is on.
  make_sequence_length_divisible_by: 1
  generation:
    # max_total_sequence_length minus data.max_input_seq_length, so every prompt
    # gets the same budget. If max_new_tokens exceeds what the context leaves,
    # vLLM silently caps generation per-sample at max_model_len - input_length.
    max_new_tokens: 4096
    vllm_cfg:
      # TP4 is validated for this checkpoint. Onyx has 2 KV heads, and vLLM's
      # OnyxAttention allows tp_size % num_kv_heads == 0 (replicating KV heads),
      # so TP4 is legal even though 4 does not divide 2.
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.5
    vllm_kwargs:
      # The Muse Glimmer vLLM build is text-only; it warns and skips the vision
      # tower.
      language_model_only: true
data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
logger:
  log_dir: logs/grpo-muse-glimmer-30b-4n8g-fsdp2cp4-automodel-6k
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl
    name: grpo-muse-glimmer-30b-4n8g-fsdp2cp4-automodel-6k
cluster:
  gpus_per_node: 8
  num_nodes: 4
