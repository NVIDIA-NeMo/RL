defaults: grpo-qwen3-8b-1n8g-automodel.yaml
# Qwen3-8B GRPO with EAGLE3 draft co-training (DTensor v2 backend).
# EAGLE3 sibling of grpo-qwen3-8b-1n8g-automodel-dspark.yaml: the
# RedHatAI/Qwen3-8B-speculator.eagle3 drafter trains alongside the policy
# with the speculators-style TTT unrolling (teacher-forced multi-step
# forward over the rollout, distilling the policy's own logits mapped into
# the reduced draft vocabulary) and is refit into vLLM (draft.* weight
# stream) for speculative-decoding generation. Draft architecture fields
# (aux layer ids, draft_vocab_size, d2t/t2d maps, norm_before_residual,
# layer family) come from the draft checkpoint's config.json; only training
# options are set here.
checkpointing:
  checkpoint_dir: results/grpo-qwen3-8b-1n8g-automodel-eagle3
policy:
  draft:
    enabled: true
    model_name: RedHatAI/Qwen3-8B-speculator.eagle3
    algo: "eagle3"
    loss_weight: 1.0
    eagle3:
      # Draft param-group lr; must far exceed the policy RL lr so the draft
      # tracks policy drift (same rationale as the dspark recipe).
      learning_rate: 1.0e-04
      ttt_steps: 3
      ttt_step_loss_decay: 1.0
      train_embed_and_head: true
  generation:
    vllm_kwargs:
      speculative_config:
        method: "eagle3"
        model: ${policy.draft.model_name}
        # One proposal per TTT step the drafter is trained to unroll.
        num_speculative_tokens: 3
logger:
  wandb:
    name: grpo-qwen3-8b-1n8g-automodel-eagle3
