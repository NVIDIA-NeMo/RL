defaults: ../../sft.yaml
sft:
  max_num_steps: 30
  val_period: 10
  val_batches: 2
  val_global_batch_size: 16
checkpointing:
  checkpoint_dir: results/sft-qwen2.5-7b-1n8g-automodel-pp2
  save_period: 10
policy:
  model_name: Qwen/Qwen2.5-7B-Instruct
  automodel_cfg:
    pipeline_parallel_size: 2
    defer_fsdp_grad_sync: false
    pipeline:
      microbatches_per_step: 4
logger:
  log_dir: logs/sft-qwen2.5-7b-1n8g-automodel-pp2
  wandb:
    project: nemo-rl
    name: sft-qwen2.5-7b-1n8g-automodel-pp2
  tensorboard:
    log_dir: tb_logs-sft-qwen2.5-7b-1n8g-automodel-pp2
cluster:
  gpus_per_node: 8
