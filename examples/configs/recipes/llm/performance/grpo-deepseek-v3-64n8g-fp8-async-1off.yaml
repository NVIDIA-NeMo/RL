defaults: ./grpo-deepseek-v3-64n8g-async-1off.yaml
checkpointing:
  checkpoint_dir: results/grpo-deepseek-v3-64n8g-fp8-async-1off
policy:
  megatron_cfg:
    # HybridEP settings
    moe_token_dispatcher_type: flex
    moe_flex_dispatcher_backend: hybridep
    moe_hybridep_num_sms: 32
    fp8_cfg:
      enabled: true
      fp8: "e4m3"
      fp8_recipe: "blockwise"
      fp8_param: false
    moe_router_dtype: fp32
    env_vars:
      NVTE_FP8_BLOCK_SCALING_FP32_SCALES: "1"
      NUM_OF_HYBRID_EP_RANKS_PER_NVLINK_DOMAIN: "8"
      NUM_OF_TOKENS_PER_CHUNK_COMBINE_API: "128"
      NVLINK_DOMAIN_SIZE: "8"
      USE_MNNVL: "0"
      # Limit collective-refit staging memory so Megatron-to-HF conversion has
      # enough H100 headroom for the largest DeepSeek tensors.
      NRL_REFIT_BUFFER_MEMORY_RATIO: "0.005"
      NRL_REFIT_NUM_BUFFERS: "1"
  generation:
    vllm_cfg:
      tensor_parallel_size: 16
      precision: "fp8"
      use_deep_gemm: true
      # Keep the generation side consistent with the policy refit buffers.
      env_vars:
        NRL_REFIT_BUFFER_MEMORY_RATIO: "0.005"
        NRL_REFIT_NUM_BUFFERS: "1"
      quantization_ignored_layer_kws: [
        a_proj,
        b_proj
      ]
    vllm_kwargs:
      max_num_seqs: 32
logger:
  log_dir: logs/grpo-deepseek-v3-64n8g-fp8-async-1off
  wandb:
    name: grpo-deepseek-v3-64n8g-fp8-async-1off
