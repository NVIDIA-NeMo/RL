defaults: ./grpo-qwen3-32b-4n4g.yaml
grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 8
  max_num_steps: 5
  val_period: 1000
  val_at_start: false
  val_at_end: false
loss_fn:
  force_on_policy_ratio: false
checkpointing:
  enabled: false
policy:
  train_global_batch_size: 64
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 4096
  megatron_cfg:
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    expert_model_parallel_size: 1
    dynamic_context_parallel:
      enabled: true
      min_size: 1
      max_size: 8
      # Match the normal packed-microbatch budget. Smaller values force long
      # sequences into CP even when they fit on one GB200 rank, fragmenting one
      # step into many poorly utilized model calls.
      tokens_per_rank: 4096
    fp8_cfg:
      enabled: false
  sequence_packing:
    enabled: true
  dynamic_batching:
    enabled: false
logger:
  log_dir: logs/grpo-qwen3-32b-4n4g-megatron-dynamiccp-quick
  wandb_enabled: false
  tensorboard_enabled: true
data_plane:
  enabled: false
