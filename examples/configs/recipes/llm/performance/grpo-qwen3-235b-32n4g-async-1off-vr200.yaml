defaults: ./grpo-qwen3-235b-32n4g-async-1off.yaml
checkpointing:
  checkpoint_dir: results/grpo-qwen3-235b-32n4g-async-1off-vr200-nccl-reshard
policy:
  megatron_cfg:
    tensor_model_parallel_size: 2
    # Recompute the attention core and retain other activations.
    recompute_granularity: selective
    recompute_modules: [core_attn]
    env_vars:
      NRL_REFIT_BUFFER_MEMORY_RATIO: "0.02"
  generation:
    refit_transport: nccl_reshard
    vllm_cfg:
      env_vars:
        NRL_REFIT_BUFFER_MEMORY_RATIO: "0.02"
logger:
  log_dir: logs/grpo-qwen3-235b-32n4g-async-1off-vr200-nccl-reshard
  wandb:
    name: grpo-qwen3-235b-32n4g-async-1off-vr200-nccl-reshard
