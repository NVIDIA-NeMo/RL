defaults: ./grpo-qwen3-235b-32n4g-async-1off-mxfp8-rollout.yaml
checkpointing:
  checkpoint_dir: results/grpo-qwen3-235b-16n8g-async-1off-mxfp8-rollout  # pragma: allowlist secret
policy:
  generation:
    colocated:
      resources:
        num_nodes: 8
        gpus_per_node: 8
    vllm_cfg:
      quantization_ignored_layer_kws:
