defaults: ./grpo-qwen3-235b-32n4g-async-1off.yaml
grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 8
  max_num_steps: 5
  val_period: 1000
  val_at_start: false
  val_at_end: false
checkpointing:
  enabled: false
  checkpoint_dir: results/grpo-qwen3-235b-32n4g-async-dynamiccp-quick
policy:
  hf_config_overrides:
    # Cover MCore's sequence-level router loss on a real MoE model.
    router_aux_loss_coef: 0.001
  train_global_batch_size: 64
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 8192
  megatron_cfg:
    # PP must be one because every dynamic lane executes its own task list.
    # TP8 keeps the dense portion sharded while CP*TP >= EP from CP2 onward.
    tensor_model_parallel_size: 8
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 16
    sequence_parallel: true
    freeze_moe_router: false
    moe_router_load_balancing_type: seq_aux_loss
    moe_per_layer_logging: true
    moe_hybridep_prepad_packed_inputs: false
    dynamic_context_parallel:
      enabled: true
      min_size: 1
      max_size: 8
      tokens_per_rank: 4096
    fp8_cfg:
      enabled: false
  sequence_packing:
    enabled: true
  dynamic_batching:
    enabled: false
logger:
  log_dir: logs/grpo-qwen3-235b-32n4g-async-dynamiccp-quick
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl
    name: grpo-qwen3-235b-32n4g-async-dynamiccp-quick
data_plane:
  enabled: false
