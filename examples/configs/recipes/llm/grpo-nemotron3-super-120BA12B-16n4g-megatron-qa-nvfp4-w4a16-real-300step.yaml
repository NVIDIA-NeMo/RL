defaults: grpo-nemotron3-super-120BA12B-16n4g-megatron-qa-bf16-300step.yaml

checkpointing:
  checkpoint_dir: results/super120b-w4a16-real-300step

policy:
  disable_modelopt_layer_spec: true
  quant_cfg: examples/modelopt/quant_configs/nvfp4_experts_weightonly.yaml
  generation:
    quant_cfg: null
    real_quant: true
    vllm_kwargs:
      moe_backend: auto
      attention_config:
        use_trtllm_attention: false

logger:
  log_dir: logs/super120b-w4a16-real-300step
  wandb:
    name: super120b-w4a16-real-300step
  tensorboard:
    log_dir: tb_logs/super120b-w4a16-real-300step
