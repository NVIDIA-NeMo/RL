# Non-colocated GLM-5.1 32K production recipe on 64 GB200 nodes (4 GPUs per
# node): 32 nodes train with TP1/PP4/CP32/EP32 and 32 nodes run vLLM with
# TP4/EP32. The inherited DAPOMath17K prompts use 2K tokens, leaving 30K for
# generation.
defaults: ./grpo-glm5.1-64n4g-megatron-131k-full-onpolicy-gb200-cudnn-colocated.yaml

grpo:
  reward_shaping:
    max_response_length: 30720

policy:
  max_total_sequence_length: 32768
  dynamic_batching:
    train_mb_tokens: 32768
    logprob_mb_tokens: 32768
  sequence_packing:
    train_mb_tokens: 32768
    logprob_mb_tokens: 32768
  megatron_cfg:
    # GLM-5.1 has 78 layers: 19 on each edge stage and 20 on each middle
    # stage. This topology spans the 128 training GPUs.
    pipeline_model_parallel_size: 4
    num_layers_in_first_pipeline_stage: 19
    num_layers_in_last_pipeline_stage: 19
    activation_checkpointing: false
    moe_permute_fusion: true
    moe_token_dispatcher_type: alltoall
  generation:
    max_new_tokens: 30720
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 32
    vllm_cfg:
      expert_parallel_size: 32

checkpointing:
  checkpoint_dir: results/grpo-glm51-full-64n4g-32k-gb200-cudnn-noncolocated

logger:
  log_dir: logs/grpo-glm51-full-64n4g-32k-gb200-cudnn-noncolocated
  wandb:
    name: grpo-glm51-full-64n4g-32k-gb200-cudnn-noncolocated
