# Qwen3-30B-A3B zero-KL with colocated Megatron
# inference. Training and generation share the same GPUs (1 node x 4 GPUs) and
# weights move by native MCore refit between phases. Parallelism is unchanged
# from the non-colocated recipe (TP1, EP4 on both sides), so the arithmetic
# being compared is the same; only placement and memory pressure differ.
#
# Memory: this runs the whole 30B training state on one 900 GB node, so host RAM
# is the constraint, not the ~277 GB GPUs. Colocated NeMo-RL stages params and
# grads in host RAM while generation runs; the optimizer (about 105 GB per rank
# in fp32) is kept on the GPU (offload_optimizer_for_refit: false, and no
# optimizer_cpu_offload) instead of also being pinned on the host. The 2-node
# colocated-reshard Nano recipes can afford optimizer_cpu_offload because the
# host state is spread over more nodes; here it OOMed the host (job 722268,
# about 205 GB per rank). Run length, batch sizes and sequence length are
# inherited from the non-colocated nightly recipe. If generation OOMs on the
# GPU, lower policy.generation.mcore_generation_config.buffer_size_gb first.
defaults: ./grpo-qwen3-30ba3b-2n4g-megatron_generation-noncolocated-zero-kl.yaml

policy:
  offload_optimizer_for_refit: false
  generation:
    refit_transport: mcore
    colocated:
      enabled: true
      # Only read when enabled is false.
      resources:
        gpus_per_node: null
        num_nodes: null
    mcore_generation_config:
      refit_backend: nccl

cluster:
  gpus_per_node: 4
  num_nodes: 1

checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-1n4g-megatron_generation-colocated-zero-kl

logger:
  log_dir: logs/grpo-qwen3-30ba3b-1n4g-megatron_generation-colocated-zero-kl
  wandb:
    name: grpo-qwen3-30ba3b-1n4g-megatron_generation-colocated-zero-kl
