# Qwen3-30B-A3B zero train/generation KL with MXFP8 on every TE linear: the BF16 zero-KL
# recipe with attention QKV/projection and the routed experts quantized to MXFP8 on both
# sides.
#
# Training runs TE's MXFP8 GEMMs; generation runs MCore's torch MXFP8 grouped GEMM for the
# experts (scaled_grouped_mm, no DeepGEMM) and Triton quantize plus scaled_mm for the dense
# attention linears. Bitwise train/generation equality rests on the Megatron-Core MXFP8
# batch-invariant support (Megatron-LM PR #7302), its fp64 batch-invariant expert combine
# (Megatron-LM PR #8195), and on both sides quantizing exactly the same modules, so one
# te_precision_config_file serves both.
#
# MXFP8 batch invariance in Megatron-Core requires fp8_param=true (MXFP8 parameter
# storage), SwiGLU or squared-ReLU experts, moe_grouped_gemm, and no MoE permute fusion.
# Blackwell (SM100+) only. Refit still sends logical BF16 weights; the generation worker
# quantizes them to MXFP8 on receive.
defaults: grpo-qwen3-30ba3b-2n4g-megatron_generation-noncolocated-zero-kl.yaml
checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-2n4g-megatron_generation-noncolocated-zero-kl-linear-mxfp8
  # A 30B checkpoint with optimizer state is hundreds of GB: keep only the best one
  # (the latest is always protected so a run can still resume).
  keep_top_k: 1
policy:
  megatron_cfg:
    # Generation inherits megatron_cfg, so this one file applies on both sides.
    te_precision_config_file: examples/te_precision/linear_mxfp8.yaml
    fp8_cfg:
      enabled: true
      fp8: hybrid
      fp8_recipe: mxfp8
      # Trainer-side MXFP8 primary weights; refit still sends BF16.
      fp8_param: true
  generation:
    mcore_generation_config:
      inference_grouped_gemm_backend: torch
logger:
  log_dir: logs/grpo-qwen3-30ba3b-2n4g-megatron_generation-noncolocated-zero-kl-linear-mxfp8
  wandb:
    name: grpo-qwen3-30ba3b-2n4g-megatron_generation-noncolocated-zero-kl-linear-mxfp8
