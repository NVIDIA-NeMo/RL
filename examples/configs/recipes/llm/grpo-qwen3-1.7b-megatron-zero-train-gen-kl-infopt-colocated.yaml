# Qwen3-1.7B — colocated Megatron inference with zero train/gen KL
defaults: ../../grpo_math_1B_megatron.yaml

grpo:
  val_at_start: false
  val_at_end: false
  val_period: 10

policy:
  model_name: "Qwen/Qwen3-1.7B"
  max_total_sequence_length: 1024
  megatron_cfg:
    zero_train_gen_mismatch: true
    moe_permute_fusion: false
    cuda_graph_impl: none
    mtp_num_layers: 0  # Qwen3-1.7B has no MTP layers
  generation:
    backend: megatron
    colocated:
      enabled: true
    mcore_generation_config:
      transformer_impl: "inference_optimized"
      enable_chunked_prefill: false
