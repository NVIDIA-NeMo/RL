defaults: ../../grpo_math_1B.yaml
grpo:
  max_num_steps: 450
  seq_logprob_error_threshold: 2.0
  skip_reference_policy_logprobs_calculation: true
loss_fn:
  seq_logprob_error_in_loss: true
  force_on_policy_ratio: true
  reference_policy_kl_penalty: 0.0
checkpointing:
  checkpoint_dir: results/grpo-qwen2.5-math-1.5b-instruct-1n8g-megatron-single-forward
policy:
  model_name: Qwen/Qwen2.5-Math-1.5B-Instruct
  tokenizer:
    name: Qwen/Qwen2.5-Math-1.5B-Instruct
  dtensor_cfg:
    enabled: false
  megatron_cfg:
    enabled: true
    scheduler:
      lr_warmup_iters: 50
  dynamic_batching:
    enabled: true
  sequence_packing:
    enabled: false
  make_sequence_length_divisible_by: 1
  generation:
    max_new_tokens: 512
    vllm_cfg:
      max_model_len: 512
data:
  max_input_seq_length: 512
logger:
  log_dir: logs/grpo-qwen2.5-math-1.5b-instruct-1n8g-megatron-single-forward
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl
    name: grpo-qwen2.5-math-1.5b-instruct-1n8g-megatron-single-forward
cluster:
  gpus_per_node: 8
