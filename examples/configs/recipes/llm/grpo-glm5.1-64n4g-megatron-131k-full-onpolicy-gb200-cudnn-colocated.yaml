# Colocated GLM-5.1 131K production recipe on 64 GB200 nodes (4 GPUs per
# node). Training and vLLM share all 256 GPUs. GBS64 populates four vLLM
# groups with the TP4/EP64 generation topology inherited below.
#
# GLM-5.1 uses the model's default indexer frequency and offset. The common
# cuDNN DSA settings are inherited from the GLM-5.2 parent.
defaults: ./grpo-glm5.2-72n8g-megatron-131K-full-onpolicy-h100-cudnn-noncolocated.yaml

grpo:
  # 8 prompts x 8 generations gives the GBS64 rollout/training batch.
  num_prompts_per_step: 8

policy:
  model_name: zai-org/GLM-5.1
  train_global_batch_size: 64
  megatron_cfg:
    # Set model_overrides.dsa_kernel_backend: tilelang to use TileLang kernels;
    # the inherited cuDNN kernels are faster.
    # GLM-5.1 has 78 layers: 9 on each edge stage and 10 on each middle
    # stage. TP1/PP8/CP32/EP32 spans all 256 colocated GB200 GPUs.
    tensor_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: 9
    num_layers_in_last_pipeline_stage: 9
    expert_model_parallel_size: 32
    moe_permute_fusion: false
  generation:
    colocated:
      enabled: true
      resources:
        gpus_per_node: null
        num_nodes: null
    vllm_cfg:
      tensor_parallel_size: 4
      # GB200 has enough memory to retain the 131K model length at 0.5.
      gpu_memory_utilization: 0.5
    vllm_kwargs:
      # Let vLLM admit the GBS64 requests according to available KV capacity.
      max_num_seqs: null

checkpointing:
  checkpoint_dir: results/grpo-glm51-full-64n4g-131k-gb200-cudnn-colocated
  save_period: 12
  keep_top_k: 1
  metric_name: null
  checkpoint_must_save_by: 00:03:30:00

logger:
  log_dir: logs/grpo-glm51-full-64n4g-131k-gb200-cudnn-colocated
  wandb:
    name: grpo-glm51-full-64n4g-131k-gb200-cudnn-colocated

cluster:
  gpus_per_node: 4
  num_nodes: 64
