defaults: ../../grpo_math_1B.yaml
# Qwen3-8B DAPO on the automodel (DTensor v2) backend, 1 node x 8 GPUs.
# Dense-model baseline (no speculative decoding); the DSpark co-training
# recipe dapo-qwen3-8b-1n8g-automodel-dspark.yaml inherits from this file.
# Activation checkpointing stays off: DSpark hidden capture requires it off,
# and the baseline keeps the identical training configuration for comparison.
grpo:
  max_num_epochs: 2
  val_at_start: true
  use_dynamic_sampling: true
  batch_multiplier: 3
  overlong_filtering: true
  use_leave_one_out_baseline: false
  reward_scaling:
    enabled: true
    target_min: -1.0
  reward_shaping:
    enabled: true
    overlong_buffer_length: 512
    max_response_length: ${policy.generation.max_new_tokens}
loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2
  ratio_clip_max: 0.28
  ratio_clip_c: 10
checkpointing:
  checkpoint_dir: results/dapo-qwen3-8b-1n8g-automodel
  checkpoint_must_save_by: 00:03:45:00
policy:
  model_name: Qwen/Qwen3-8B
  tokenizer:
    name: Qwen/Qwen3-8B
    # Qwen3's thinking mode exceeds the 2048-token generation budget on math
    # problems: at validation every response hit the cap mid-reasoning and
    # scored 0, and most training rollouts were truncated (then dropped by
    # overlong filtering). Non-thinking answers fit the budget. Revisit when
    # the dspark path supports activation checkpointing and an 8k budget.
    chat_template_kwargs:
      enable_thinking: false
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 4096
  make_sequence_length_divisible_by: 8
  optimizer:
    name: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
    kwargs:
      lr: 1.0e-06
      weight_decay: 0.1
      master_weights: true
      store_param_remainders: true
      exp_avg_dtype: torch.bfloat16
      exp_avg_sq_dtype: torch.bfloat16
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 1.0e-08
      end_factor: 1.0
      total_iters: 10
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1.0
      total_iters: 10000000000
  - milestones:
    - 10
  dtensor_cfg:
    activation_checkpointing: false
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    # No automodel_kwargs.backend here: Qwen3-8B loads as a plain HF
    # Qwen3ForCausalLM, which does not accept the BackendConfig kwarg used by
    # nemo_automodel's custom model classes (e.g. the nano-v3.5 MoE recipe).
  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: true
  generation:
    max_new_tokens: 2048
    vllm_cfg:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.5
      enforce_eager: true
data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
logger:
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl-dspark
    name: dapo-qwen3-8b-1n8g-automodel
cluster:
  gpus_per_node: 8
  num_nodes: 1
