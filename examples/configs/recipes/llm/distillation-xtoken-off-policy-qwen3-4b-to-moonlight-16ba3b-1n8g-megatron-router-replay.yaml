defaults: ../../xtoken_off_policy_distillation.yaml

# MoE-student xToken recipe for training on student-vLLM rollouts that already
# contain per-message token_ids and routed_experts. Supply the tokenizer-pair
# projection and routed-rollout JSONL at launch because those artifacts are
# deployment-specific:
#
#   export XTOKEN_PROJECTION_PATH=/path/to/moonlight_to_qwen3_projection.pt
#   export XTOKEN_ROUTED_ROLLOUTS=/path/to/moonlight_vllm_rollouts.jsonl
#   uv run examples/run_xtoken_off_policy_distillation.py \
#     --config examples/configs/recipes/llm/distillation-xtoken-off-policy-qwen3-4b-to-moonlight-16ba3b-1n8g-megatron-router-replay.yaml

distillation:
  num_prompts_per_step: 8
  offload_student_after_step: true
policy:
  model_name: moonshotai/Moonlight-16B-A3B-Instruct
  tokenizer:
    name: moonshotai/Moonlight-16B-A3B-Instruct
  train_global_batch_size: 8
  max_total_sequence_length: 4096
  router_replay:
    enabled: true
  dtensor_cfg:
    enabled: false
  optimizer: null
  scheduler: null
  megatron_cfg:
    enabled: true
    pipeline_model_parallel_size: 2
    expert_model_parallel_size: 4
    apply_rope_fusion: false
    bias_activation_fusion: false
    optimizer:
      lr: 1.0e-06
      min_lr: 1.0e-07
    scheduler:
      lr_warmup_iters: 50
      lr_warmup_init: 1.0e-07
  generation:
    vllm_kwargs:
      moe_backend: triton
teachers:
- model_name: Qwen/Qwen3-4B
  aligner:
    projection_matrix_path: ${oc.env:XTOKEN_PROJECTION_PATH}
    pseudo_target_path: null
    reverse_pseudo_target_path: null
  weight: 1.0
  tokenizer:
    name: Qwen/Qwen3-4B
  train_global_batch_size: 8
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 4096
  make_sequence_length_divisible_by: 1
  precision: bfloat16
  logprob_chunk_size: null
  offload_optimizer_for_logprob: false
  dtensor_cfg:
    enabled: true
    _v2: true
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null
    load_precision: bfloat16
    shard_before_load: false
  megatron_cfg:
    enabled: false
  max_grad_norm: 1.0
  dynamic_batching:
    enabled: false
    train_mb_tokens: 4096
    logprob_mb_tokens: 4096
    sequence_length_round: 1
  sequence_packing:
    enabled: false
    train_mb_tokens: 4096
    logprob_mb_tokens: 4096
    algorithm: modified_first_fit_decreasing
    sequence_length_round: 1
    fuse_loss: false
  optimizer:
    name: torch.optim.AdamW
    kwargs:
      lr: 5.0e-05
      weight_decay: 0.001
      betas:
      - 0.9
      - 0.95
      eps: 1.0e-08
      foreach: false
      fused: false
data:
  max_input_seq_length: 4096
  collator_mode: chat
  train:
    dataset_name: openai_format
    data_path: ${oc.env:XTOKEN_ROUTED_ROLLOUTS}
    chat_key: messages
    use_preserving_dataset: true
checkpointing:
  checkpoint_dir: results/distillation-xtoken-off-policy-qwen3-4b-to-moonlight-16ba3b-router-replay
logger:
  log_dir: logs/distillation-xtoken-off-policy-qwen3-4b-to-moonlight-16ba3b-router-replay
