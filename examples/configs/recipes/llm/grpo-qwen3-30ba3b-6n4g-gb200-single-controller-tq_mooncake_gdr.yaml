# SingleController + TransferQueue: the mooncake_cpu store with GDR.
#
# Overlay on the register-mode GDR recipe, which owns the mesh, the GRPO
# sizing and the cluster shape. This is the fourth cell of the backend
# comparison: store vs register mode, crossed with host staging vs GDR.
defaults: ./grpo-qwen3-30ba3b-6n4g-gb200-single-controller-tq_register.yaml

data_plane:
  enabled: true
  backend: mooncake_cpu
  mooncake_cpu:
    # Sized down from the 64GiB/4GiB defaults, which are per client *process*:
    # 4 GPUs x 68 GiB = 272 GiB pinned per node. On these 920 GiB nodes, next to
    # a 30B MoE's weight load, that is marginal rather than wrong -- measured 3
    # setup OOMs in 6 attempts, always at task 0 with zero steps, across three
    # different node sets. This run publishes ~500 MB per step, so 8 GiB per
    # process is ample and removes the coin flip.
    global_segment_size: 8589934592   # 8 GiB
    local_buffer_size: 2147483648     # 2 GiB
    # Staging buffers in GPU memory rather than host, so a read lands in HBM.
    # The store still copies at put -- that is the axis register mode changes,
    # and holding it fixed here is what isolates the two effects.
    use_gdr: true

checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-6n4g-gb200-single-controller-tq_mooncake_gdr

logger:
  log_dir: logs/grpo-qwen3-30ba3b-6n4g-gb200-single-controller-tq_mooncake_gdr
  wandb:
    name: grpo-qwen3-30ba3b-6n4g-gb200-single-controller-tq_mooncake_gdr
