# SingleController + TransferQueue: the mooncake_cpu store, as the register-mode baseline.
#
# Overlay on the register-mode GDR recipe, which owns the mesh, the GRPO
# sizing and the cluster shape. Only the data plane differs -- and the log
# and run names, which must not collide: four backends writing one log_dir
# and one wandb name is how an A/B silently becomes one run overwriting
# another.
defaults: ./grpo-qwen3-30ba3b-6n4g-gb200-single-controller-tq_register.yaml

data_plane:
  enabled: true
  # The store stages through its own buffers and copies at put -- the opposite
  # of register mode's publish-an-address. Baseline for the comparison.
  backend: mooncake_cpu
  mooncake_cpu:
    # 272 GiB of pinned host memory (4 processes x 64+4 GiB, the per-process
    # defaults) to move ~500 MB a step is indefensible on a 920 GiB node that
    # also loads a 30B MoE. Sized to the payload instead.
    #
    # It also sidesteps a known issue: this branch OOMs at setup on the stock
    # defaults where main does not (1 pass / 4 fails vs main 3/3). A 5-point
    # bisect and seven refuted hypotheses did not name the cause, and each
    # bisect point was a single run of a failure that is probabilistic, so the
    # ladder is not trustworthy. Tracked, not fixed.
    global_segment_size: 8589934592   # 8 GiB per client process
    local_buffer_size: 2147483648     # 2 GiB per client process

checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-6n4g-gb200-single-controller-tq_mooncake

logger:
  log_dir: logs/grpo-qwen3-30ba3b-6n4g-gb200-single-controller-tq_mooncake
  wandb:
    name: grpo-qwen3-30ba3b-6n4g-gb200-single-controller-tq_mooncake
