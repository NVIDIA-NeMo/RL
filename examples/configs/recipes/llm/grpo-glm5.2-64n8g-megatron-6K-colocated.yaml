# Colocated GLM-5.2 recipe on 64 H100 nodes with a 6,144-token total sequence
# length. Training and vLLM share all 512 GPUs. The optimization settings mirror
# the validated 64-node AutoModel experiment while the model topology and cuDNN
# DSA settings target Megatron.
defaults: ../../grpo_math_1B.yaml

grpo:
  num_prompts_per_step: 16
  num_generations_per_prompt: 8
  max_num_epochs: 10
  max_num_steps: 10000
  use_leave_one_out_baseline: false
  val_at_start: true
  max_val_samples: 128
  val_batch_size: 128
  skip_reference_policy_logprobs_calculation: true

loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 2.0
  truncated_importance_sampling_type: tis
  ratio_clip_max: 0.28
  ratio_clip_c: 10

checkpointing:
  checkpoint_dir: results/grpo-glm5.2-64n8g-megatron-6K-colocated
  keep_top_k: 1
  save_period: 3
  checkpoint_must_save_by: "00:03:45:00"

policy:
  model_name: zai-org/GLM-5.2
  # TODO: Remove this workaround after upgrading Transformers to a version that
  # preserves GLM-5.2's qk_rope_head_dim when loading its config.
  hf_config_overrides:
    qk_rope_head_dim: 64
  train_global_batch_size: 128
  train_micro_batch_size: 1
  max_total_sequence_length: 6144
  # Keep every packed microbatch at one fixed length. With the legacy data path,
  # unequal DP-rank lengths hang the MoE all-gather token dispatcher.
  make_sequence_length_divisible_by: 6144
  logprob_chunk_size: 1024
  dtensor_cfg:
    enabled: false
  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 2
    activation_checkpointing: true
    tensor_model_parallel_size: 2
    expert_model_parallel_size: 64
    pipeline_model_parallel_size: 8
    num_layers_in_first_pipeline_stage: 14
    num_layers_in_last_pipeline_stage: 16
    context_parallel_size: 8
    sequence_parallel: true
    moe_router_dtype: fp32
    apply_rope_fusion: false
    defer_fp32_logits: true
    moe_token_dispatcher_type: allgather
    optimizer:
      lr: 1.0e-06
      min_lr: 1.0e-06
      weight_decay: 0.1
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0
    scheduler:
      lr_decay_iters: 10000
      lr_warmup_iters: 10
      lr_warmup_init: 1.0e-14
    distributed_data_parallel_config:
      grad_reduce_in_fp32: true
      overlap_grad_reduce: false
      overlap_param_gather: false
    env_vars:
      CUDA_DEVICE_MAX_CONNECTIONS: '1'
    model_overrides:
      dsa_indexer_rope_interleaved: true
      dsa_indexer_rotate_activation: false
      dsa_indexer_k_norm_epsilon: 1.0e-06
      dsa_kernel_backend: cudnn
      dsa_indexer_loss_coeff: 0.0
      dsa_indexer_use_sparse_loss: false
      deallocate_pipeline_outputs: true
      persist_layer_norm: true
      bias_dropout_fusion: true
    clear_memory_caches_before_refit: true
  optimizer: null
  scheduler: null
  generation:
    max_new_tokens: 4096
    vllm_cfg:
      tensor_parallel_size: 32
      expert_parallel_size: 128
      gpu_memory_utilization: 0.5
      enforce_eager: true
    vllm_kwargs:
      max_num_batched_tokens: 4096
      max_num_seqs: null
      enable_chunked_prefill: true

      # On SM100, vLLM 0.25.1 auto-selects FlashInfer TRTLLM MoE. Its
      # block-major expert layout requires native layerwise reload, which this
      # branch's refit paths do not yet use. CUTLASS is refit-compatible on both.
      kernel_config:
        moe_backend: flashinfer_cutlass
      async_scheduling: false
      compilation_config:
        pass_config:
          fuse_allreduce_rms: false

data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null

env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify

logger:
  log_dir: logs/grpo-glm5.2-64n8g-megatron-6K-colocated
  wandb_enabled: true
  wandb:
    project: nemorl-glm52
    name: grpo-glm5.2-64n8g-megatron-6K-colocated

cluster:
  gpus_per_node: 8
  num_nodes: 64
