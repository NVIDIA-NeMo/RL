# Async GRPO candidate: 96 training GPUs and 32 inference GPUs.
# Requires BEAM-compatible Megatron Bridge and Inferact/lin PR #64.
# Reward scaling and overlong-response shaping are disabled for async GRPO.
defaults: ../../grpo_math_1B.yaml
grpo:
  max_num_steps: 200
  num_prompts_per_step: 32
  num_generations_per_prompt: 8
  use_leave_one_out_baseline: false
  use_dynamic_sampling: false
  dynamic_sampling_max_gen_batches: 10
  batch_multiplier: 1
  val_at_start: false
  val_period: 5
  max_val_samples: 30
  val_batch_size: 30
  reward_scaling:
    enabled: false
    target_min: -1.0
  reward_shaping:
    enabled: false
    overlong_buffer_length: 819
    max_response_length: 4096
  val_num_generations_per_prompt: 8
  async_grpo:
    enabled: true
    in_flight_weight_updates: false
loss_fn:
  reference_policy_kl_penalty: 0.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  ratio_clip_c: 10.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2
policy:
  model_name: ${oc.env:BEAM_CHECKPOINT}
  tokenizer:
    chat_template: default
  train_global_batch_size: 256
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 5120
  dtensor_cfg:
    enabled: false
  sequence_packing:
    enabled: false
  # Dynamic batching currently requires pipeline parallel size 1.
  dynamic_batching:
    enabled: false
  generation:
    backend: vllm
    max_new_tokens: 4096
    colocated:
      enabled: false
      resources:
        num_nodes: 4
        gpus_per_node: 8
    vllm_cfg:
      async_engine: true
      tensor_parallel_size: 16
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.85
      enforce_eager: true
  refit_buffer_size_gb: 1
  optimizer: null
  scheduler: null
  hf_config_overrides:
    dtype: bfloat16
  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}
  megatron_cfg:
    enabled: true
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 3
    # Split 104 hybrid sublayers into 36/34/34 across pipeline stages.
    num_layers_in_first_pipeline_stage: 36
    num_layers_in_last_pipeline_stage: 34
    expert_model_parallel_size: 32
    attention_backend: flash
    expert_tensor_parallel_size: 1
    sequence_parallel: true
    activation_checkpointing: true
    freeze_moe_router: false
    moe_router_dtype: fp32
    optimizer:
      lr: 1.0e-06
      min_lr: 1.0e-06
      weight_decay: 0.0
      use_precision_aware_optimizer: false
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 0.5
      overlap_cpu_optimizer_d2h_h2d: false
    scheduler:
      lr_warmup_iters: 0
      lr_warmup_init: 1.0e-06
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: backend:native
      CUDA_LOG_FILE: stderr
data:
  max_input_seq_length: 1024
  train:
    dataset_name: DAPOMath17K
    split_validation_size: 0
  validation:
    dataset_name: AIME2025
    split_validation_size: 0
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: hf_math_verify
checkpointing:
  enabled: false
logger:
  log_dir: ${oc.env:BEAM_LOG_DIR,/tmp/grpo-beam-501b-16n8g-tp2pp3ep32-megatron-vllm-async}
  wandb_enabled: true
  monitor_gpus: true
  wandb:
    project: beam-nemo-rl
    name: grpo-beam-501b-16n8g-tp2pp3ep32-megatron-vllm-async
cluster:
  num_nodes: 16
  gpus_per_node: 8
