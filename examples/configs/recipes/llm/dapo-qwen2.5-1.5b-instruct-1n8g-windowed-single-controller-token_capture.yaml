# SingleController dynamic sampling on the token-capture path, windowed sampler.
# Qwen2.5-1.5B-Instruct on 1n8g (4 Megatron training GPUs + 4 single-GPU vLLM
# replicas), math through NeMo-Gym math_with_judge (OpenMathReasoning, prepared from
# HF by the driver) because token capture is only wired up on the Gym rollout path.
# Hard math yields many all-wrong groups, so the zero-variance filter and its
# replacement path run every step.
# Launch with:
#   uv run examples/run_grpo_single_controller.py \
#     --config examples/configs/recipes/llm/dapo-qwen2.5-1.5b-instruct-1n8g-windowed-single-controller-token_capture.yaml
defaults: ../../grpo_math_1B_megatron_single_controller.yaml
grpo:
  val_period: 0
  num_prompts_per_step: 8
  num_generations_per_prompt: 8
  max_num_steps: 100
  max_num_epochs: 20
  use_dynamic_sampling: true
  # Enough groups are zero-variance that the default 10 trips the filtered-prompt
  # budget before a step fills.
  dynamic_sampling_max_gen_batches: 30
  calculate_advantages_on_gpu: false
  overlong_filtering: true
  reward_scaling:
    enabled: true
    target_min: -1.0
  reward_shaping:
    enabled: true
    overlong_buffer_length: 512
    # Longest response that fits: max_total_sequence_length minus max_input_seq_length.
    max_response_length: 6144
loss_fn:
  reference_policy_kl_penalty: 0.0
  ratio_clip_max: 0.28
  ratio_clip_c: 10
  use_importance_sampling_correction: true
policy:
  model_name: Qwen/Qwen2.5-1.5B-Instruct
  train_global_batch_size: 64
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 8192
  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}
  offload_policy_before_refit: true
  optimizer: null
  scheduler: null
  megatron_cfg:
    activation_checkpointing: true
    optimizer:
      lr: 1.0e-06
      min_lr: 1.0e-06
  generation:
    vllm_cfg:
      expose_http_server: true
      gpu_memory_utilization: 0.8
      enforce_eager: true
    colocated:
      resources:
        gpus_per_node: 4
data_plane:
  simple:
    num_storage_units: 2
# Every Gym completion is captured and the finalizer publishes the training rows.
token_capture:
  enabled: true
  min_valid_fraction_per_group: null
  num_reassembler_workers: 2
async_rl:
  sampler:
    name: windowed
    max_staleness_versions: 1
  max_buffered_rollouts: ${mul:${grpo.num_prompts_per_step}, 2}
checkpointing:
  checkpoint_dir: results/dapo-qwen2.5-1.5b-instruct-1n8g-windowed-single-controller-token_capture
env:
  should_use_nemo_gym: true
  nemo_gym:
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/math_with_judge/configs/math_with_judge.yaml
    # Judge off: math-verify alone scores the rows, keeping the reward binary.
    math_with_judge:
      resources_servers:
        math_with_judge:
          judge_model_server:
            name: policy_model
          should_use_judge: false
    policy_model:
      responses_api_models:
        vllm_model:
          uses_reasoning_parser: false
data:
  max_input_seq_length: 2048
  num_workers: 0
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
  # Written by ng_prepare_data in the nightly driver.
  train:
    env_name: nemo_gym
    data_path: 3rdparty/Gym-workspace/Gym/data/math_with_judge/train.jsonl
    processor: nemo_gym_data_processor
    dataset_name: NemoGymDataset
    prompt_file: null
    system_prompt_file: null
    split_validation_size: 0
cluster:
  gpus_per_node: 8
logger:
  log_dir: logs/dapo-qwen2.5-1.5b-instruct-1n8g-windowed-single-controller-token_capture
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl
    name: dapo-qwen2.5-1.5b-instruct-1n8g-windowed-single-controller-token_capture
