defaults: ../../grpo_math_1B.yaml
# Candidate Lightning recipe: 32 prompts x 16 responses, 20k response budget.
# Routed ReLU2 experts use TE NVFP4 and per-token vLLM NVFP4 refits; the BF16
# catch-all keeps Mamba, attention and shared experts unquantized.
# Requires the pinned vLLM/FlashInfer dependencies; use the quick sibling for
# bounded integration testing.
grpo:
  max_num_steps: 1500
  val_at_start: true
  use_dynamic_sampling: true
  batch_multiplier: 3
  dynamic_sampling_max_gen_batches: 20
  use_leave_one_out_baseline: false
  reward_scaling:
    enabled: true
    target_min: -1.0
  reward_shaping:
    enabled: true
    overlong_buffer_length: 512
    max_response_length: 20480
loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2
  ratio_clip_max: 0.28
  ratio_clip_c: 10
checkpointing:
  checkpoint_dir: results/grpo-nemotron35-lightning-30ba3b-8n4g-megatron-te-nvfp4-pertoken
  checkpoint_must_save_by: 00:04:15:00
policy:
  model_name: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  train_micro_batch_size: 1
  max_total_sequence_length: 22528
  logprob_chunk_size: 2048
  offload_optimizer_for_logprob: false
  make_sequence_length_divisible_by: 8
  dtensor_cfg:
    enabled: false
  router_replay:
    enabled: true
  megatron_cfg:
    enabled: true
    bias_activation_fusion: false
    tensor_model_parallel_size: 2
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    sequence_parallel: true
    activation_checkpointing: true
    defer_fp32_logits: true
    moe_router_dtype: fp32
    moe_shared_expert_overlap: false
    use_fused_weighted_squared_relu: true
    mtp_num_layers: 0
    mtp_loss_scaling_factor: 0.0
    fp4_cfg:
      enabled: true
    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 2
    num_layers_at_end_in_bf16: 4
    te_precision_config_file: examples/te_precision/attn_bf16_mlp_nvfp4.yaml
    optimizer:
      use_precision_aware_optimizer: false
      lr: 1.0e-06
      min_lr: 1.0e-07
      weight_decay: 0.1
    scheduler:
      lr_warmup_iters: 10
      lr_warmup_init: 1.0e-08
    checkpoint:
      async_save: false
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False,garbage_collection_threshold:0.8
      NVTE_NVFP4_ROW_SCALED_ACTIVATION: '1'
      NVTE_NVFP4_DISABLE_RHT: '1'
      NVTE_NVFP4_DISABLE_2D_QUANTIZATION: '1'
      # Backward-gradient setting; optional with dequantized backward.
      NVTE_NVFP4_DISABLE_STOCHASTIC_ROUNDING: '1'
      NVTE_BACKWARD_OVERRIDE: dequantized
  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: true
  generation:
    max_new_tokens: 20480
    nvfp4_pertoken_rollout:
      enabled: true
    vllm_kwargs:
      moe_backend: flashinfer_trtllm
      mamba_ssm_cache_dtype: float32
      speculative_config: null
      # The pinned vLLM nightly's routed-experts aux output asserts when the
      # post-refit prefix-cache reset meets an in-flight async-scheduled step.
      async_scheduling: false
    vllm_cfg:
      gpu_memory_utilization: 0.5
      env_vars:
        FLASHINFER_DISABLE_FP4_QUANT_FAST_MATH: '1'
        TRTLLM_DISABLE_FP4_QUANT_FAST_MATH: '1'
data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
logger:
  log_dir: logs/grpo-nemotron35-lightning-30ba3b-8n4g-megatron-te-nvfp4-pertoken
  num_val_samples_to_print: 8
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl
    name: grpo-nemotron35-lightning-30ba3b-8n4g-megatron-te-nvfp4-pertoken
cluster:
  gpus_per_node: 4
  num_nodes: 8
