# SingleController + AutoModel variant of grpo-qwen2.5-math-1.5b-instruct-1n8g-automodel.v3.yaml.
defaults: ./grpo-qwen2.5-math-1.5b-instruct-1n8g-automodel.v3.yaml

logger:
  log_dir: logs/grpo-qwen2.5-math-1.5b-instruct-1n8g-automodel-single-controller
  wandb:
    name: grpo-qwen2.5-math-1.5b-instruct-1n8g-automodel-single-controller

# SC does not support validation yet.
grpo:
  # Null out the legacy async_grpo block inherited from grpo_math_1B.yaml:
  # SC reads async_rl instead, and the entrypoint raises if this block is set.
  async_grpo: null
  val_period: 0

checkpointing:
  enabled: false
  checkpoint_dir: results/grpo-qwen2.5-math-1.5b-instruct-1n8g-automodel-single-controller

# TransferQueue data plane is mandatory for the SingleController path.
data_plane:
  enabled: true

async_rl:
  sampler:
    name: in_order
    max_lookahead_versions: 0
  recompute_kv_cache_after_weight_updates: true
  # AutoModel SC dispatches one full prompt batch per optimizer update.
  min_groups_for_streaming_train: ${grpo.num_prompts_per_step}
  max_inflight_prompts: ${grpo.num_prompts_per_step}
  max_buffered_rollouts: ${grpo.num_prompts_per_step}

policy:
  # AutoModel SC supports fixed microbatches only.
  dynamic_batching:
    enabled: false
  generation:
    vllm_cfg:
      async_engine: true
    colocated:
      enabled: false
      resources:
        # 4 GPUs for inference; remaining 4 GPUs on the node go to training.
        gpus_per_node: 4
        num_nodes: 1
