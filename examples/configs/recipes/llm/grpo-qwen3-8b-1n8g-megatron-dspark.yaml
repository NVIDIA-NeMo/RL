defaults: ../../grpo_math_1B.yaml
grpo:
  max_num_steps: 1
  num_prompts_per_step: 2
  num_generations_per_prompt: 4
checkpointing:
  checkpoint_dir: results/grpo-qwen3-8b-1n8g-megatron-dspark
  save_period: 1
  save_optimizer: false
policy:
  model_name: Qwen/Qwen3-8B
  tokenizer:
    name: Qwen/Qwen3-8B
  optimizer: null
  megatron_cfg:
    enabled: true
    tensor_model_parallel_size: 2
    scheduler:
      lr_warmup_iters: 1
  dtensor_cfg:
    enabled: false
  make_sequence_length_divisible_by: 1
  train_global_batch_size: 8
  train_micro_batch_size: 1
  logprob_batch_size: 1
  sequence_packing:
    enabled: false
  draft:
    speculator_type: dspark
    enabled: true
    model_name: deepseek-ai/dspark_qwen3_8b_block7
    model_revision: 03326e5043815da1f81b109078b2889737c26017  # pragma: allowlist secret
    loss_weight: 1.0
    block_size: 7
    anchors_per_sample: 2
    mask_token_id: 151669
    target_hidden_state_layer_ids:
    - 1
    - 9
    - 17
    - 25
    - 33
    num_layers: 5
    markov_rank: 256
    markov_head_type: vanilla
    confidence_enabled: true
    confidence_with_markov: true
    ce_loss_weight: 0.1
    tv_loss_weight: 0.9
    confidence_loss_weight: 1.0
    loss_decay_gamma: 4.0
    seed: 13
    vocab_tile_size: 256
    max_cp_boundary_exclusion_fraction: 0.25
  generation:
    vllm_kwargs:
      speculative_config:
        method: dspark
        model: ${policy.draft.model_name}
        revision: ${policy.draft.model_revision}
        num_speculative_tokens: ${policy.draft.block_size}
        draft_tensor_parallel_size: 1
logger:
  log_dir: logs/grpo-qwen3-8b-1n8g-megatron-dspark
  wandb:
    name: grpo-qwen3-8b-1n8g-megatron-dspark
cluster:
  gpus_per_node: 8
