defaults: grpo-qwen3-8b-math-baseline-4n8g-automodel.yaml
# Qwen3-30B-A3B-Instruct-2507 GRPO math baseline (NO speculative decoding),
# automodel (DTensor v2) backend, 4 nodes x 8 GPUs, 10240-token context
# (2048 prompt + 8192 response). MoE sibling of the Qwen3-8B baseline:
# identical data / GRPO knobs / optimizer; model, chat template, and
# parallelism differ, and context is trimmed from this repo's usual 20480
# to 10240 to stay comparable to the eagle3-10k sibling at the same
# sequence length (that recipe's drafter OOMs at 20480 on this layout).
#
# Parallelism:
# - Training: EP=32 shards the 128 experts across all GPUs via deepep
#   dispatch + grouped-GEMM experts; dtensor TP stays 1 (A3B active params
#   are small -- FSDP handles the non-expert weights).
# - Generation: vLLM TP=4, two engines per node (8 DP replicas).
#
# Also switches checkpointing to synchronous dcp.save: DTensorPolicyWorkerV2
# defaults to is_async=true (dcp.async_save), which spawns a fresh per-rank
# background process + Gloo process group on every checkpoint save; that
# rendezvous has failed repeatedly on this 4-node/32-rank layout
# (RuntimeError: Connection closed by peer / 30-min timeout), always at the
# first save_period boundary.
grpo:
  val_period: 10
checkpointing:
  checkpoint_dir: results/grpo-qwen3-30ba3b-2507-instruct-math-baseline-4n8g-automodel-10k
  save_period: 15
  keep_top_k: 5
  is_async: false
policy:
  model_name: Qwen/Qwen3-30B-A3B-Instruct-2507
  max_total_sequence_length: 10240
  tokenizer:
    # Instruct-2507 is a non-thinking checkpoint (no <think> toggle in its
    # chat template, unlike the base Qwen3-30B-A3B); drop the inherited
    # enable_thinking kwarg.
    chat_template_kwargs: null
  hf_config_overrides:
    # Disable the MoE load-balancing aux loss for RL: Automodel otherwise
    # injects router gradients that conflict with the policy objective and
    # degrade accuracy. Keep as 0.0, not 0: Hugging Face strict config
    # validation declares router_aux_loss_coef as float and rejects YAML's
    # integer 0.
    router_aux_loss_coef: 0.0
  dtensor_cfg:
    tensor_parallel_size: 1
    expert_parallel_size: 32
    automodel_kwargs:
      backend:
        _target_: nemo_automodel.components.models.common.utils.BackendConfig
        experts: gmm
        dispatcher: deepep
        rope_fusion: false
        enable_hf_state_dict_adapter: true
  generation:
    max_new_tokens: 8192
    vllm_cfg:
      tensor_parallel_size: 4
logger:
  wandb:
    name: grpo-qwen3-30ba3b-2507-instruct-math-baseline-4n8g-automodel-10k
