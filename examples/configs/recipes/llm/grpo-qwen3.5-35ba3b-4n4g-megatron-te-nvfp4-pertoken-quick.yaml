defaults: grpo-qwen3.5-35ba3b-2n8g-megatron-ep16tp2cp2.yaml
grpo:
  max_num_steps: 20
  num_prompts_per_step: 8
  num_generations_per_prompt: 2
checkpointing:
  checkpoint_dir: results/grpo-qwen3.5-35ba3b-4n4g-megatron-te-nvfp4-pertoken-quick
policy:
  train_global_batch_size: 16
  router_replay:
    enabled: true
  generation:
    nvfp4_pertoken_rollout:
      enabled: true
    vllm_kwargs:
      moe_backend: auto
  megatron_cfg:
    moe_router_dtype: fp32
    optimizer:
      use_precision_aware_optimizer: false
    fp4_cfg:
      enabled: true
      fp4: e2m1
    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 2
    num_layers_at_end_in_bf16: 4
    te_precision_config_file: examples/te_precision/attn_bf16_mlp_nvfp4.yaml
    env_vars:
      NVTE_NVFP4_ROW_SCALED_ACTIVATION: '1'
      NVTE_NVFP4_DISABLE_RHT: '1'
      NVTE_NVFP4_DISABLE_2D_QUANTIZATION: '1'
      NVTE_NVFP4_DISABLE_STOCHASTIC_ROUNDING: '1'
      NVTE_BACKWARD_OVERRIDE: dequantized
logger:
  log_dir: logs/grpo-qwen3.5-35ba3b-4n4g-megatron-te-nvfp4-pertoken-quick
  wandb:
    name: grpo-qwen3.5-35ba3b-4n4g-megatron-te-nvfp4-pertoken-quick
cluster:
  gpus_per_node: 4
  num_nodes: 4
