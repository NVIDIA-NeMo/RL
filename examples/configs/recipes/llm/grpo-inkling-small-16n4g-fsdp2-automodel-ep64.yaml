defaults: ../../grpo_math_1B.yaml
grpo:
  max_num_epochs: 10
  max_num_steps: 500
  val_period: 15
  max_val_samples: 64
  val_batch_size: 64
loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2
checkpointing:
  checkpoint_dir: results/grpo-inkling-small-16n4g-fsdp2-automodel-ep64
  keep_top_k: 1
  save_period: 100
  checkpoint_must_save_by: 00:03:45:00
policy:
  model_name: thinkingmachines/Inkling-Small
  tokenizer:
    chat_template_kwargs:
      reasoning_effort: medium
    tokenizer_kwargs:
      eos_token: <|content_model_end_sampling|>
      pad_token: <|content_model_end_sampling|>
  train_global_batch_size: 64
  train_micro_batch_size: 1
  logprob_batch_size: 1
  make_sequence_length_divisible_by: 1024
  max_total_sequence_length: 8192
  logprob_chunk_size: 1024
  offload_optimizer_for_logprob: true
  optimizer:
    name: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
    kwargs:
      lr: 1.0e-06
      weight_decay: 0.1
      master_weights: true
      store_param_remainders: true
      exp_avg_dtype: torch.bfloat16
      exp_avg_sq_dtype: torch.bfloat16
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 1.0e-08
      end_factor: 1.0
      total_iters: 10
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1.0
      total_iters: 10000000000
  - milestones:
    - 10
  dtensor_cfg:
    context_parallel_size: 1
    expert_parallel_size: 64
    activation_checkpointing: true
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      NRL_REFIT_NUM_BUFFERS: '1'
    automodel_kwargs:
      freeze_config:
        freeze_vision_tower: true
        freeze_audio_tower: true
        freeze_language_model: false
      backend:
        _target_: nemo_automodel.components.models.common.utils.BackendConfig
        attn: sdpa
        linear: torch
        rms_norm: torch_fp32
        experts: torch_mm
        dispatcher: hybridep
        gate_precision: float32
        enable_hf_state_dict_adapter: true
        enable_fsdp_optimizations: true
  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: true
  generation:
    max_new_tokens: 4096
    colocated:
      enabled: false
      resources:
        num_nodes: 2
        gpus_per_node: 4
    refit_transport: nixl
    refit_cfg:
      nixl:
        device: cpu
        update_weights_bucket_memory_ratio: 0.01
    vllm_cfg:
      tensor_parallel_size: 8
      skip_tokenizer_init: false
      gpu_memory_utilization: 0.8
      enforce_eager: true
      max_model_len: 8192
      # Inkling carries short-convolution state alongside the attention KV cache.
      # Disable cached-prefix execution so rollout logprobs stay comparable with
      # the policy's full-sequence recomputation.
      enable_prefix_caching: false
      env_vars:
        VLLM_USE_V2_MODEL_RUNNER: '1'
    vllm_kwargs:
      tokenizer_mode: inkling
      language_model_only: true
      block_size: 128
data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
logger:
  log_dir: logs/grpo-inkling-small-16n4g-fsdp2-automodel-ep64
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    entity: nv-welcome
    project: nemo-rl-Inkling
    name: grpo-inkling-small-16n4g-fsdp2-automodel-ep64
cluster:
  gpus_per_node: 4
  num_nodes: 18
