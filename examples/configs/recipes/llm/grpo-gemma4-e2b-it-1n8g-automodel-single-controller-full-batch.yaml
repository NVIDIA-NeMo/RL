defaults: ../../grpo_math_1B_automodel_single_controller.yaml
grpo:
  max_num_steps: 100
  num_prompts_per_step: 8
  num_generations_per_prompt: 4
  seq_logprob_error_threshold: 1000
  use_leave_one_out_baseline: false
loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2
  ratio_clip_max: 0.28
  ratio_clip_c: 10
policy:
  model_name: google/gemma-4-E2B-it
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 4096
  logprob_chunk_size: 4096
  optimizer:
    name: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
    kwargs:
      lr: 2.0e-06
      weight_decay: 0.1
      master_weights: true
      store_param_remainders: true
      exp_avg_dtype: torch.bfloat16
      exp_avg_sq_dtype: torch.bfloat16
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 1.0e-08
      end_factor: 1.0
      total_iters: 10
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1.0
      total_iters: 10000000000
  - milestones:
    - 10
  automodel_cfg:
    expert_parallel_size: 1
    automodel_kwargs:
      freeze_config:
        freeze_vision_tower: true
        freeze_audio_tower: true
        freeze_language_model: false
  make_sequence_length_divisible_by: 1
  generation:
    max_new_tokens: 2048
    vllm_cfg:
      gpu_memory_utilization: 0.5
    colocated:
      resources:
        gpus_per_node: 4
data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
checkpointing:
  enabled: true
  checkpoint_dir: results/grpo-gemma4-e2b-it-1n8g-automodel-single-controller-full-batch
  keep_top_k: 2
logger:
  log_dir: logs/grpo-gemma4-e2b-it-1n8g-automodel-single-controller-full-batch
  wandb_enabled: true
  wandb:
    name: grpo-gemma4-e2b-it-1n8g-automodel-single-controller-full-batch
cluster:
  gpus_per_node: 8
