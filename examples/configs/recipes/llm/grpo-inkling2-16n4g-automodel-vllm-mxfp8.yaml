# Inkling2 (released 48-layer, 384-expert MoE, ~594B params) GRPO on 16 GB200
# nodes x 4 GPUs (185 GB/GPU): Automodel (DTensor) policy + colocated
# vLLM rollouts with MXFP8 routed experts.
# Follows grpo-qwen3.8-flash-next-dapo-8n8g-automodel (branch
# qwen3-8-flash-next-support) and grpo-inkling2-tiny-1n4g-automodel-vllm-mxfp8.
#
# Rollouts: vLLM's Inkling2 (vllm-project/vllm#67325) serves routed experts only
# as NVFP4 or MXFP8. Every layer's experts are served as MXFP8; each refit
# quantizes the trained BF16 experts (nemo_rl/models/generation/vllm/
# inkling2_mxfp8_refit.py). Attention, embeddings and router stay BF16.
# Inkling2 attention caps TP at its 8 KV heads and shards experts over the TP
# group (EP == TP), so each engine is TP 8 over 2 nodes (FlashInfer MNNVL
# all-reduce within an NVL72 rack, NCCL otherwise): 8 engines, 48 experts per
# GPU, ~78 GB/GPU of MXFP8 weights.
#
# Training: TE FusedAdam keeps FP32 master weights (bf16 params + int16
# remainders) with BF16 moments, so params load in BF16: ~10 B/param, ~93 GB/GPU
# over 64 GPUs (EP 64: 6 experts per GPU). 8 nodes would need ~185 GB/GPU.
#
# Refit peak per GPU: vLLM weights (~78 GB) + policy shard (~19 GB) + one
# gathered expert tensor (~16 GB BF16) and its HF-layout copy + the MXFP8 output
# (~8 GB), ~140 GB.
#
# Two views of the release (tools/inkling2/make_vllm_mxfp8_views.py):
# policy.model_name is Automodel's text-only view (decodes the stored
# NVFP4/MXFP8 experts to BF16); generation.model_name is vLLM's view.
defaults: ../../grpo_math_1B.yaml
grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 8
  max_num_steps: 500
  use_leave_one_out_baseline: false
  val_period: 10
  val_at_start: false
  val_at_end: false
  max_val_samples: 256
  val_batch_size: 256
loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2
  ratio_clip_max: 0.28
checkpointing:
  # A full checkpoint (weights + optimizer) is ~5 TB; enable deliberately.
  enabled: false
  checkpoint_dir: results/grpo-inkling2-16n4g-automodel-vllm-mxfp8
  keep_top_k: 1
  save_period: 50
policy:
  model_name: /path/to/inkling2-small-vllm-mxfp8-automodel-text
  tokenizer:
    name: ${policy.model_name}
    # The release defines no eos/pad token; Automodel's Inkling2 processor uses
    # <|content_model_end_sampling|> (id 200006, the eos_token_id).
    tokenizer_kwargs:
      eos_token: "<|content_model_end_sampling|>"
      pad_token: "<|content_model_end_sampling|>"
    # The release ships no chat_template. Text-only form of Automodel's Inkling2
    # template (components/models/inkling2/processing.py), plus a generation prompt.
    chat_template: >-
      {%- for message in messages -%}
      {%- set role = 'model' if message['role'] == 'assistant' else message['role'] -%}
      {%- if message['content'] is string -%}
      {%- set items = [{'type': 'text', 'text': message['content']}] -%}
      {%- else -%}
      {%- set items = message['content'] -%}
      {%- endif -%}
      {%- for item in items -%}
      {{- '<|message_' + role + '|><|content_' + item['type'] + '|>' + item['text'] + '<|end_message|>' -}}
      {%- endfor -%}
      {%- if message['role'] == 'assistant' -%}
      {{- '<|content_model_end_sampling|>' -}}
      {%- endif -%}
      {%- endfor -%}
      {%- if add_generation_prompt -%}
      {{- '<|message_model|><|content_text|>' -}}
      {%- endif -%}
  refit_buffer_size_gb: 2
  train_global_batch_size: 256
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 4096
  make_sequence_length_divisible_by: 64
  offload_optimizer_for_logprob: true
  dynamic_batching:
    enabled: false
  sequence_packing:
    enabled: false
  optimizer:
    name: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
    kwargs:
      lr: 1.0e-06
      weight_decay: 0.1
      betas: [0.9, 0.95]
      adam_w_mode: true
      bias_correction: true
      master_weights: true
      master_weight_dtype: torch.float32
      store_param_remainders: true
      exp_avg_dtype: torch.bfloat16
      exp_avg_sq_dtype: torch.bfloat16
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 0.01
      end_factor: 1.0
      total_iters: 5
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1.0
      total_iters: 10000000000
  - milestones:
    - 5
  automodel_cfg:
    expert_parallel_size: 64
    activation_checkpointing: true
    env_vars:
      # Training peaks near 180 GB/GPU; routing skew on one EP rank can OOM with
      # much of the cache reserved but fragmented.
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:512
    automodel_kwargs:
      backend:
        _target_: nemo_automodel.components.models.common.BackendConfig
        attn: eager
        linear: torch
        rms_norm: torch
        experts: torch_mm
        dispatcher: torch
        enable_hf_state_dict_adapter: true
  generation:
    model_name: /path/to/inkling2-small-vllm-mxfp8
    max_new_tokens: 3072
    vllm_cfg:
      tensor_parallel_size: 8
      # Inkling2 shards experts over the TP group itself; vLLM's generic EP stays off.
      expert_parallel_size: 1
      # ~111 GB: ~78 GB MXFP8 weights + KV cache (40 of 48 layers are 1K sliding window).
      gpu_memory_utilization: 0.6
      max_model_len: 4096
      enforce_eager: true
      load_format: dummy
      # vLLM's Inkling2 multimodal processor needs the tokenizer at startup.
      skip_tokenizer_init: false
      env_vars:
        NRL_VLLM_INKLING2_MXFP8_REFIT: "1"
    vllm_kwargs:
      # Text-only rollouts: skip the vision tower and its encoder profiling.
      language_model_only: true
data:
  max_input_seq_length: 1024
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
logger:
  log_dir: logs/grpo-inkling2-16n4g-automodel-vllm-mxfp8
  wandb_enabled: false
  tensorboard_enabled: true
  monitor_gpus: true
  num_val_samples_to_print: 2
  wandb:
    project: nemo-rl
    name: grpo-inkling2-16n4g-automodel-vllm-mxfp8
cluster:
  gpus_per_node: 4
  num_nodes: 16
