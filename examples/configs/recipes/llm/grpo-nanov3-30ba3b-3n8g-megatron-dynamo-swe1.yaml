defaults: ../../../nemo_gym/grpo_nanov3.yaml
cluster:
  num_nodes: 3
  segment_size: 1
checkpointing:
  enabled: false
  checkpoint_dir: results/nemotron-3-nano-swe-dynamo
  save_period: 3
  keep_top_k: 1
  checkpoint_must_save_by: 00:03:30:00
  model_save_format: safetensors
  save_consolidated: false
grpo:
  num_prompts_per_step: 2
  num_generations_per_prompt: 2
  val_num_generations_per_prompt: 2
  max_num_epochs: 4
  max_num_steps: 4
  advantage_clip_low: -100
  advantage_clip_high: 100
  val_period: 10000
  overlong_filtering: false
  invalid_tool_call_advantage: -5.0
  malformed_thinking_advantage: -5.0
  reward_shaping:
    overlong_buffer_length: 128
    overlong_buffer_penalty: 1
    max_response_length: ${policy.max_total_sequence_length}
    stop_properly_penalty_coef: null
  reward_scaling:
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0
  async_grpo:
    enabled: true
    in_flight_weight_updates: false
    recompute_kv_cache_after_weight_updates: true
loss_fn:
  truncated_importance_sampling_ratio: 5
  truncated_importance_sampling_ratio_min: 0.2
  truncated_importance_sampling_type: tis
  force_on_policy_ratio: true
  use_kl_in_reward: false
policy:
  model_name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  tokenizer:
    name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
    chat_template_kwargs:
      enable_thinking: true
  hf_config_overrides: {}
  train_global_batch_size: 4
  generation_batch_size: 2
  max_total_sequence_length: 196608
  logprob_chunk_size: 1024
  megatron_cfg:
    empty_unused_memory_level: 2
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 1
    context_parallel_size: 2
    moe_flex_dispatcher_backend: hybridep
    moe_hybridep_num_sms: 32
    use_gloo_process_groups: false
    use_fused_weighted_squared_relu: true
    do_not_average_loss: true
    cp_normalize: true
    calculate_per_token_loss: true
    scale_loss_by_dp_cp_size: false
    mtp_loss_scaling_factor: 0.0
    mtp_use_repeated_layer: true
    mtp_num_layers: 0
    mtp_detach_heads: true
    scheduler:
      override_opt_param_scheduler: true
    distributed_data_parallel_config:
      overlap_grad_reduce: false
    fp8_cfg:
      enabled: false
      fp8: e4m3
      fp8_recipe: mxfp8
      fp8_param: false
    checkpoint:
      ckpt_assume_constant_structure: true
  sequence_packing:
    fuse_loss: true
  generation:
    backend: dynamo
    dynamo_cfg:
      engine: vllm
      startup_timeout_s: 1800
      request_timeout_s: 7200
      control_timeout_s: 600
      metrics_include_prefixes: null
      metrics_exclude_prefixes: null
      worker_args:
        tool_call_parser: qwen3_coder
        reasoning_parser: nemotron_nano
        exclude_tools_when_tool_choice_none: true
        enable_structural_tag: false
        structural_tag_scope: auto
        structural_tag_schema: auto
        custom_jinja_template: null
        endpoint_types:
        - chat
        - completions
        extra_cli_args: []
      frontend_args:
        tokenizer: fastokens
        tokenizer_cache: true
        tokenizer_cache_bytes: 4294967296
        router_mode: kv
        router_reset_states: true
        extra_cli_args: []
    vllm_cfg:
      expert_parallel_size: 4
      precision: bfloat16
      gpu_memory_utilization: 0.85
      enable_vllm_metrics_logger: true
      vllm_metrics_logger_interval: 0.5
      env_vars: null
      reasoning_parser_plugin: null
      http_server_serving_chat_kwargs: null
    vllm_kwargs:
      attention_backend: FLASH_ATTN
      moe_backend: triton
      compilation_config:
        cudagraph_capture_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        pass_config:
          fuse_allreduce_rms: false
    colocated:
      enabled: false
      resources:
        gpus_per_node: 8
        num_nodes: 1
data:
  train:
    data_path: ${oc.env:HF_HOME}/superv3_data/swe1/train-split.jsonl
  validation:
    data_path: ${oc.env:HF_HOME}/superv3_data/swe1/val-split.jsonl
env:
  nemo_gym:
    skip_venv_if_present: true
    num_gpu_nodes: 0
    invalid_tool_call_patterns:
    - <tool_call>
    - </tool_call>
    - <function_call>
    - </function_call>
    thinking_tags:
    - <think>
    - </think>
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/single_step_tool_use_with_argument_comparison/configs/swe_pivot_single_step_tool_use_with_argument_comparison.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          chat_template_kwargs:
            force_nonempty_content: true
    single_step_tool_use_with_argument_comparison_swe:
      responses_api_agents:
        tool_simulation_agent:
          entrypoint: app.py
          resources_server:
            type: resources_servers
            name: swe_pivot_single_step_tool_use_with_argument_comparison_resources_server
          model_server:
            type: responses_api_models
            name: policy_model
    use_absolute_ip: true
logger:
  log_dir: results/nemotron-3-nano-swe-dynamo
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl
    name: grpo-nanov3-30ba3b-3n8g-megatron-dynamo-swe1
