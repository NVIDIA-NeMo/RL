logger:
  log_dir: logs/grpo-nemotron3.5-super-vl-120BA12B-16n4g-automodel-noncolocated-async-gym
  wandb:
    name: grpo-nemotron3.5-super-vl-120BA12B-16n4g-automodel-noncolocated-async-gym
