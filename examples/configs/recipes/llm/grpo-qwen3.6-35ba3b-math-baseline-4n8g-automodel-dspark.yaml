defaults: grpo-qwen3.6-35ba3b-math-baseline-4n8g-automodel.yaml
# Qwen3.6-35B-A3B GRPO math baseline with DSpark draft co-training (DTensor v2
# backend), 4 nodes x 8 GPUs. Experimental arm for
# grpo-qwen3.6-35ba3b-math-baseline-4n8g-automodel.yaml: policy-side settings
# are inherited unchanged (EP=32, cp=2, TE attention, 20480 tokens); the
# RedHatAI/Qwen3.6-35B-A3B-speculator.dspark block drafter (speculators-format
# checkpoint: reduced 32000-token draft vocab with d2t/t2d maps, block_size=8,
# sliding-window draft attention) trains alongside the policy on rollout data
# and is refit into vLLM (draft.* weight stream) for speculative decoding.
# Draft architecture fields come from the checkpoint's config.json via the
# speculators-format adapter; only training options are set here.
checkpointing:
  checkpoint_dir: results/grpo-qwen3.6-35ba3b-math-baseline-4n8g-automodel-dspark
policy:
  draft:
    enabled: true
    model_name: RedHatAI/Qwen3.6-35B-A3B-speculator.dspark
    algo: "dspark"
    loss_weight: 1.0
    dspark:
      num_anchors: 32
      # Draft-group lr: the policy's 1e-6 RL lr is far below dspark's native
      # training lr, leaving the draft unable to track policy drift. 1e-4
      # sits between the two (same as the qwen3-8b co-training recipes).
      learning_rate: 1.0e-04
      ce_loss_alpha: 0.1
      l1_loss_alpha: 0.9
      confidence_loss_alpha: 1.0
      loss_decay_gamma: 4.0
      train_embed_and_head: true
  generation:
    vllm_kwargs:
      speculative_config:
        method: "dspark"
        model: ${policy.draft.model_name}
        # Matches the checkpoint's block_size=8 (the drafter proposes
        # block_size tokens per step).
        num_speculative_tokens: 8
        attention_backend: "FLASH_ATTN"
        draft_sample_method: "probabilistic"
logger:
  wandb:
    name: grpo-qwen3.6-35ba3b-math-baseline-4n8g-automodel-dspark
