# DAPO SingleController token-capture Gym nightly: the capture sibling of the
# #4588 dynamic-sampling nightly it inherits. Same Lightning-30B model, Megatron
# training, vLLM generation, DAPO reward shaping/scaling, dynamic sampling and 4n8g
# topology. The only difference: the math task runs through NeMo-Gym (math_with_judge
# / OpenMathReasoning) instead of #4588's built-in math env, because token capture is
# only wired up on the Gym rollout path. Math keeps the reward variance the
# zero-variance filter needs so it does not saturate.
# Launch with:
#   uv run examples/run_grpo_single_controller.py \
#     --config examples/configs/recipes/llm/dapo-nanov3.5-30BA3B-4n8g-megatron-vllm-noncolocated-async-gym-single-controller-token_capture.yaml
defaults: ./dapo-nanov3.5-30BA3B-4n8g-megatron-vllm-noncolocated-single-controller.yaml
token_capture:
  enabled: true
policy:
  generation:
    vllm_cfg:
      expose_http_server: true
# Route the DAPO math task through NeMo-Gym for capture (OpenMathReasoning via
# math_with_judge, HF-downloadable so CI can ng_prepare_data it). Judge off:
# math-verify alone scores the rows, keeping the reward binary.
env:
  _override_: true
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify
  should_use_nemo_gym: true
  nemo_gym:
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/math_with_judge/configs/math_with_judge.yaml
    math_with_judge:
      resources_servers:
        math_with_judge:
          judge_model_server:
            name: policy_model
          should_use_judge: false
    policy_model:
      responses_api_models:
        vllm_model:
          uses_reasoning_parser: false
data:
  _override_: true
  max_input_seq_length: 2048
  shuffle: true
  num_workers: 0
  use_multiple_dataloader: false
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  train:
    env_name: nemo_gym
    data_path: 3rdparty/Gym-workspace/Gym/data/math_with_judge/train.jsonl
    processor: nemo_gym_data_processor
    dataset_name: NemoGymDataset
    prompt_file: null
    system_prompt_file: null
    split_validation_size: 0
  # SC has no validation (val_period=0), so this is never read; point it at the
  # train rows to avoid depending on a second materialized file.
  validation:
    env_name: nemo_gym
    data_path: 3rdparty/Gym-workspace/Gym/data/math_with_judge/train.jsonl
    processor: nemo_gym_data_processor
    dataset_name: NemoGymDataset
    prompt_file: null
    system_prompt_file: null
    split_validation_size: 0
checkpointing:
  checkpoint_dir: results/dapo-nanov3.5-30BA3B-4n8g-megatron-vllm-noncolocated-async-gym-single-controller-token_capture
logger:
  log_dir: logs/dapo-nanov3.5-30BA3B-4n8g-megatron-vllm-noncolocated-async-gym-single-controller-token_capture
  wandb:
    name: dapo-nanov3.5-30BA3B-4n8g-megatron-vllm-noncolocated-async-gym-single-controller-token_capture
