defaults: grpo-llama3.1-8b-instruct-2n8g-megatron-fp8-e2e.yaml
data_plane:
  enabled: true
  backend: mooncake_cpu
data:
  # mooncake_cpu RDMA-pins a large segment on the driver, so forking DataLoader
  # workers from it copies the pinned pages (~20s per validation); load in-process.
  num_workers: 0
