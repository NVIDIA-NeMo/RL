defaults: ./grpo-nanov3-30BA3B-2n8g-megatron_generation.yaml
policy:
  train_global_batch_size: 2
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 512
  megatron_cfg:
    train_iters: 1
    tensor_model_parallel_size: 1
    expert_model_parallel_size: 2
    sequence_parallel: false
  generation:
    max_new_tokens: 8
    colocated:
      enabled: false
      resources:
        gpus_per_node: 2
        num_nodes: 1
    mcore_generation_config:
      transformer_impl: inference_optimized
      tensor_model_parallel_size: 1
      expert_model_parallel_size: 2
      sequence_parallel: false
      inference_grouped_gemm_backend: torch
      # Use fused Triton refit quantization for the PyTorch scaled GEMM paths.
      inference_mxfp8_backend: triton
      # NVLS supports CUDA graphs for both prefill and decode in the
      # inference-optimized expert-parallel path.
      inference_moe_token_dispatcher_type: nvls
      # Capture the inference-optimized block path for prefill and decode.
      cuda_graph_impl: local
      inference_cuda_graph_scope: block
      num_cuda_graphs: -1
      use_cuda_graphs_for_non_decode_steps: true
      # Required by the pipeclean harness to prove graph replay, not only capture.
      logging_step_interval: 1
      # Policy recomputation scores raw model logits. Keeping this explicit also
      # makes a deterministic greedy numerical check valid: top-k=1 processing
      # must not replace the selected-token raw log-prob with log(1)=0.
      logprobs_mode: raw_logprobs
      enable_chunked_prefill: false
      buffer_size_gb: 2
      max_model_len: 512
      max_tokens: 512
      fp8_cfg:
        enabled: true
        fp8: e4m3
        fp8_recipe: mxfp8
        fp8_param: true
logger:
  wandb_enabled: false
  tensorboard_enabled: false
cluster:
  gpus_per_node: 4
  num_nodes: 1
