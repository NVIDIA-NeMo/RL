defaults: grpo-qwen3-8b-1n8g-automodel.yaml
# Qwen3-8B GRPO with DFlash draft co-training (DTensor v2 backend).
# DFlash sibling of grpo-qwen3-8b-1n8g-automodel-dspark.yaml: the
# RedHatAI/Qwen3-8B-speculator.dflash block drafter (markov-free,
# confidence-free, bonus-anchor supervision layout) trains alongside the
# policy on rollout data and is refit into vLLM (draft.* weight stream) for
# speculative-decoding generation. Draft architecture fields (block_size,
# target_layer_ids, mask_token_id, sample_from_anchor, draft_vocab_size)
# come from the draft checkpoint's config.json; only training options are
# set here, aligned with the dspark recipe for comparison (confidence loss
# excepted: dflash has no confidence head, so its alpha must be 0).
checkpointing:
  checkpoint_dir: results/grpo-qwen3-8b-1n8g-automodel-dflash
policy:
  draft:
    enabled: true
    model_name: RedHatAI/Qwen3-8B-speculator.dflash
    algo: "dflash"
    loss_weight: 1.0
    dspark:
      # Same memory ceiling as the dspark recipe (draft-side transient memory
      # scales with num_anchors x block_size x vocab, co-training shares the
      # GPU with full 8B policy training).
      num_anchors: 64
      ce_loss_alpha: 0.1
      l1_loss_alpha: 0.9
      confidence_loss_alpha: 0.0
      loss_decay_gamma: 4.0
      train_embed_and_head: true
  generation:
    vllm_kwargs:
      speculative_config:
        method: "dflash"
        model: ${policy.draft.model_name}
        # The speculators dflash block is 8 slots: 1 unsupervised bonus anchor
        # + 7 mask-token proposals.
        num_speculative_tokens: 7
        attention_backend: "FLASH_ATTN"
        draft_sample_method: "probabilistic"
logger:
  wandb:
    name: grpo-qwen3-8b-1n8g-automodel-dflash
