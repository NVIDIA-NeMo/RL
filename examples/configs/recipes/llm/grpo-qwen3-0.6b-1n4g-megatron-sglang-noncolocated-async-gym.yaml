defaults: ../../grpo_math_1B_megatron.yaml
grpo:
  num_prompts_per_step: 4
  num_generations_per_prompt: 2
  max_num_steps: 10
  val_period: 5
  val_at_start: true
  val_at_end: true
  max_val_samples: null
  val_batch_size: null
  async_grpo:
    enabled: true
    recompute_kv_cache_after_weight_updates: false
  skip_reference_policy_logprobs_calculation: true
loss_fn:
  reference_policy_kl_penalty: 0
  use_importance_sampling_correction: true
checkpointing:
  checkpoint_dir: results/grpo-qwen3-0.6b-1n4g-megatron-sglang-noncolocated-async-gym
policy:
  model_name: Qwen/Qwen3-0.6B
  train_global_batch_size: 8
  train_micro_batch_size: 1
  max_total_sequence_length: 768
  generation:
    backend: sglang
    max_new_tokens: 768
    colocated:
      enabled: false
      resources:
        gpus_per_node: 2
        num_nodes: 1
    use_async_rollouts: true
    sglang_cfg:
      quantization:
        scheme: bf16
      model_path: ${policy.model_name}
      dtype: ${policy.precision}
      context_length: 768
      allow_auto_truncate: true
      tp_size: 1
      dp_size: 1
      pp_size: 1
      ep_size: 1
      random_seed: 42
      max_running_requests: 16
      mem_fraction_static: 0.3
      skip_server_warmup: true
      disable_outlines_disk_cache: true
      cuda_graph_backend_prefill: disabled
      disable_cuda_graph: true
      sglang_server_config:
        needs_offload: true
        cpu_weight_backup: false
        sglang_server_concurrency: 16
        pause_generation_mode: retract
        num_gpus: 2
        num_gpus_per_engine: 1
      sglang_router_config:
        use_external_router: false
        retry_max_retries: 5
        cb_failure_threshold: 10
      sglang_http_client_config:
        max_retries: 3
      sglang_fault_tolerance_config:
        use_fault_tolerance: false
        rollout_health_check_interval: 60
        rollout_health_check_timeout: 60
        rollout_health_check_first_wait: 60
        rollout_max_restart_attempts: 3
      tool_call_parser: qwen25
data:
  max_input_seq_length: null
  num_workers: 0
  train:
    data_path: 3rdparty/Gym-workspace/Gym/data/workplace_assistant/train.jsonl
  validation:
    data_path: 3rdparty/Gym-workspace/Gym/data/workplace_assistant/validation.jsonl
  default:
    prompt_file: null
    processor: nemo_gym_data_processor
    env_name: nemo_gym
    dataset_name: NemoGymDataset
env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  should_mask_flagged_samples: true
  nemo_gym:
    config_paths:
    - responses_api_models/sglang_model/configs/sglang_model_for_training.yaml
    - resources_servers/workplace_assistant/configs/workplace_assistant.yaml
    workplace_assistant_environment_server:
      environment_servers:
        legacy_agent:
          entrypoint: app.py
          agent_server:
            type: responses_api_agents
            name: workplace_assistant_simple_agent
    policy_model:
      responses_api_models:
        sglang_model:
          context_length: ${policy.generation.sglang_cfg.context_length}
          uses_reasoning_parser: false
          chat_template_kwargs:
            enable_thinking: false
logger:
  log_dir: logs/grpo-qwen3-0.6b-1n4g-megatron-sglang-noncolocated-async-gym
  wandb:
    name: grpo-qwen3-0.6b-1n4g-megatron-sglang-noncolocated-async-gym
cluster:
  gpus_per_node: 4
