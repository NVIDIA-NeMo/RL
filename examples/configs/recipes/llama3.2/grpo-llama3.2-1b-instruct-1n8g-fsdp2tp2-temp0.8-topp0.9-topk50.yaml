defaults: ../../grpo_math_1B.yaml
grpo:
  max_num_steps: 500
checkpointing:
  checkpoint_dir: results/grpo-llama3.2-1b-instruct-1n8g-fsdp2tp2-temp0.8-topp0.9-topk50
policy:
  model_name: meta-llama/Llama-3.2-1B-Instruct
  tokenizer:
    name: meta-llama/Llama-3.2-1B-Instruct
  dynamic_batching:
    enabled: true
  sequence_packing:
    enabled: false
  make_sequence_length_divisible_by: 1
  dtensor_cfg:
    tensor_parallel_size: 2
  generation:
    max_new_tokens: 512
    temperature: 0.8
    top_p: 0.9
    top_k: 50
    vllm_cfg:
      max_model_len: 512
data:
  max_input_seq_length: 512
logger:
  log_dir: logs/grpo-llama3.2-1b-instruct-1n8g-fsdp2tp2-temp0.8-topp0.9-topk50
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemo-rl
    name: grpo-llama3.2-1b-instruct-1n8g-fsdp2tp2-temp0.8-topp0.9-topk50
cluster:
  gpus_per_node: 8
