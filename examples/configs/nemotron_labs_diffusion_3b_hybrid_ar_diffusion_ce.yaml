    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  max_input_seq_length: null
  num_workers: 1
  shuffle: true
  train:
  - data_path: ${oc.env:DIFFUSION_DATA_ROOT}/Nemotron-Cascade-2-RL-data/IF-RL/train.jsonl
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    seed: 42
    split: train
    split_validation_size: 0.05
    system_prompt_file: null
  - data_path: ${oc.env:DIFFUSION_DATA_ROOT}/Nemotron-Cascade-2-RL-data-fixed/MOPD_fixed.jsonl
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    seed: 42
    split: train
    split_validation_size: 0.05
    system_prompt_file: null
  - data_path: ${oc.env:DIFFUSION_DATA_ROOT}/Nemotron-Cascade-2-RL-data-fixed/multi-domain-RL_fixed.jsonl
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    seed: 42
    split: train
    split_validation_size: 0.05
    system_prompt_file: null
  - data_path: ${oc.env:DIFFUSION_DATA_ROOT}/Nemotron-Cascade-2-RL-data-fixed/deepscaler_train_fixed.jsonl
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    seed: 42
    split: train
    split_validation_size: 0.05
    system_prompt_file: null
  use_multiple_dataloader: false
  validation:
  - data_path: ${oc.env:DIFFUSION_DATA_ROOT}/mcqa_val_gym/val_full_suite.jsonl
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    split: test
    system_prompt_file: null
  - data_path: ${oc.env:DIFFUSION_DATA_ROOT}/ifbench_gym/val_ifbench.jsonl
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    split: test
    system_prompt_file: null
