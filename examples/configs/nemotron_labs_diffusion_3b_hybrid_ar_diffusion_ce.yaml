    - ${oc.env:NEMO_GYM_ROOT}/resources_servers/mcqa/configs/mcqa.yaml
    - ${oc.env:NEMO_GYM_ROOT}/resources_servers/mcqa/configs/mcqa_eval_aliases.yaml
    - ${oc.env:NEMO_GYM_ROOT}/resources_servers/ifbench/configs/ifbench.yaml
  should_use_nemo_gym: true
grpo:
