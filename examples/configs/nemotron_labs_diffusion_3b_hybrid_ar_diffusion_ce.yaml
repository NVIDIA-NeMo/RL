# Hybrid AR + diffusion GRPO with the cross-entropy anchor term.
#
# Reference configuration for `policy.logprob_estimation.type: hybrid_ar_diffusion`
# (see nemo_rl/algorithms/hybrid_ar_diffusion.py). The clean half of each sequence
# carries the clipped policy gradient; the noisy half carries a masked
# cross-entropy (MDM) term weighted by `ce_loss_weight`. Both are scored in a
# single forward pass.
#
# This is the exact configuration behind the ablation reported in the PR:
# training on the Nemotron-Cascade-2 RL blend, validating on the full 15,594-row
# suite (AIME24/25/26 + HMMT + MMLU-Pro + MMLU-Redux via val_full_suite.jsonl,
# plus IFBench via val_ifbench.jsonl). Set `ce_loss_weight: 0.0` for the RL-only
# baseline arm; everything else is held fixed between the two.
#
# ---------------------------------------------------------------------------
# NOT RUNNABLE AS-IS. Three prerequisites are not publicly available:
#
#   1. DIFFUSION_MODEL_PATH -- the Nemotron-Labs-Diffusion-3B checkpoint.
#   2. DIFFUSION_DATA_ROOT  -- the Cascade-2 RL blend and the validation suite,
#      in NeMo-Gym jsonl form.
#   3. A diffusion-aware vLLM build that registers `NemotronLabsDiffusionModel`.
#      Stock vLLM cannot load this architecture.
#
# It is included so reviewers can see every knob the feature needs and how the
# reported numbers were produced, not as a turnkey recipe. Substitute the four
# env placeholders (DIFFUSION_MODEL_PATH, DIFFUSION_DATA_ROOT, NEMO_GYM_ROOT,
# NEMO_RL_ROOT) to adapt it to another masked-diffusion model.
#
# Two further notes:
#   * `train_micro_batch_size` / `logprob_batch_size` are halved relative to a
#     comparable AR run, because the [noisy | clean] layout is ~2x as wide.
#   * Megatron-Bridge must provide the asymmetric-AR attention hooks
#     (`set_asymmetric_ar_metadata` and friends) for this model; the worker
#     raises at the first microbatch otherwise.
# ---------------------------------------------------------------------------

checkpointing:
  checkpoint_dir: results/grpo-nd3b-vllm-ce0-cascade2-worker1-6k
  checkpoint_must_save_by: null
  enabled: true
  higher_is_better: true
  keep_top_k: null
  metric_name: val:total_reward/mean
  model_save_format: safetensors
  save_consolidated: false
  save_optimizer: true
  save_period: 20
cluster:
