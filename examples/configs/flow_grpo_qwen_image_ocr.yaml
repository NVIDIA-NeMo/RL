# Flow-GRPO exemplar: Qwen-Image LoRA on the Flow-GRPO OCR task.
# Hyperparameters mirror verl-omni examples/flowgrpo_trainer/qwen_image/run_qwen_image_ocr_lora.sh.
# Data: uv run python tools/export_ocr_prompts.py --out-dir examples/data/diffusion/ocr

flow_grpo:
  num_prompts_per_step: 32  # x16 generations = 512 samples/step (verl-omni baseline)
  num_generations_per_prompt: 16
  max_num_steps: 300
  ppo_epochs: 1
  ppo_mini_batch_size: 256  # 16 prompts x16 gen (verl-omni ppo_mini_batch_size=16xrollout.n=16); 512/256 = 2 optimizer updates/step. Unset would collapse to 1 update/step.
  val_period: 30
  val_at_start: true
  val_at_end: false
  max_val_samples: 0  # 0 validates on the full val set
  seed: 42
  use_leave_one_out_baseline: false  # verl-omni uses the plain in-group mean baseline (no leave-one-out)
  use_global_std: true  # whole-batch reward std (verl-omni `global_std`); per-group std explodes on near-constant OCR groups
  val_generation:
    num_inference_steps: 50  # deterministic ODE eval, matches verl-omni val_kwargs (training rollout uses 10)

loss_fn:
  ratio_clip_min: 1.0e-4  # window-mode clip (flow_grpo FAQ: large clip destabilizes Fast mode)
  ratio_clip_max: 1.0e-4
  adv_clip_max: 5.0
  beta: 0.0
  aggregate_logprobs_per_sample: false  # false = verl-omni/Flow-GRPO per-(sample, step) ratio; true = experimental T-sum (breaks 1e-4 clip scale)

checkpointing:
  enabled: true
  checkpoint_dir: "results/flow_grpo_qwen_image_ocr"
  save_period: 30
  metric_name: null  # null keeps the most recent keep_top_k checkpoints; validation runs after the save, so a val:reward_mean ranking would score each checkpoint with the previous validation
  higher_is_better: true
  keep_top_k: 3
  save_optimizer: true

policy:
  model_name: "Qwen/Qwen-Image"
  precision: "bfloat16"
  train_micro_batch_size: 2
  enable_gradient_checkpointing: true
  per_element_logprob: false  # true keeps per-latent-element logprobs; pairs with loss_fn.aggregate_logprobs_per_sample
  seed: 42

  optimizer:
    lr: 3.0e-4
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    max_grad_norm: 1.0

  pipeline:
    height: 512
    width: 512
    num_inference_steps: 10  # training rollout steps (val overrides to 50)
    true_cfg_scale: 4.0
    max_sequence_length: 256
    guidance_scale: null

  algo:
    noise_level: 1.2
    sde_type: "sde"
    sde_window_size: 2
    sde_window_range: [0, 5]

  lora_cfg:
    enabled: true
    rank: 64
    alpha: 128
    # Mirrors verl-omni run_qwen_image_ocr_lora.sh exactly. Do NOT add the
    # AdaLN modulation layers (img_mod/txt_mod): LoRA on them at this lr
    # destabilizes training (global grid-artifact collapse).
    # Full-path wildcard patterns (NeMo Automodel ModuleMatcher anchors the
    # whole module FQN; bare suffixes like 'to_q' match nothing). Same 12
    # modules as Automodel's qwen_image_t2i_flow_lora.yaml.
    target_modules: ["*.attn.to_q", "*.attn.to_k", "*.attn.to_v", "*.attn.to_out.0", "*.attn.add_q_proj", "*.attn.add_k_proj", "*.attn.add_v_proj", "*.attn.to_add_out", "*.img_mlp.net.0.proj", "*.img_mlp.net.2", "*.txt_mlp.net.0.proj", "*.txt_mlp.net.2"]
    dropout: 0.0
    exclude_modules: null

data:
  train:
    prompt_file: "examples/data/diffusion/ocr/train_prompts.jsonl"
  val:
    prompt_file: "examples/data/diffusion/ocr/val_prompts.jsonl"

env:
  image_reward:
    plugins:
      # GenRM OCR reward (verl-omni parity — this is the reward that produces
      # the convergence curve in docs/guides/flow-grpo.md). A Qwen3-VL-8B
      # judge behind an OpenAI-compatible endpoint (GENRM_BASE_URL env var)
      # transcribes each image; the transcription is scored by Levenshtein vs
      # the prompt's quoted target. See the guide for how to serve the judge.
      - name: "genrm_ocr"
        weight: 1.0
        model: "Qwen/Qwen3-VL-8B-Instruct"
        temperature: 0.7
        top_p: 0.8
        max_tokens: 4096
      # CPU alternative needing no served judge (used by the nightly recipe):
      # PaddleOCR edit-distance reward.
      # - name: "ocr"
      #   weight: 1.0
    num_cpus_per_worker: 4
    num_gpus_per_worker: 0.0
    num_workers_per_plugin: 16  # parallel replicas for 512 images/step (HTTP judge or CPU OCR)

cluster:
  gpus_per_node: 8
  num_nodes: 1

logger:
  log_dir: "logs/flow_grpo_qwen_image_ocr"
  wandb_enabled: false
  tensorboard_enabled: true
  tensorboard: {}
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: false
  num_val_samples_to_print: 8
  wandb:
    project: "flow-grpo"
    name: "flow-grpo-qwen-image-ocr"
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10
