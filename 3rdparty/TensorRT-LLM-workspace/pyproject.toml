# Runtime metadata for the pinned Nano SWE rc28 build.
# Build-only dependencies are installed by tools/build-custom-trtllm.sh.
# PyNvVideoCodec has no CPython 3.13 wheel; this text/SWE image omits video decoding.
# datasets/setuptools/llguidance/xgrammar follow NeMo-RL's existing integration overrides.

[project]
name = "tensorrt-llm"
version = "1.3.0rc28+nano35.1"
requires-python = ">=3.13"
dependencies = [
  "accelerate>=1.7.0",
  "colored",
