# Workspace wrapper for TensorRT-LLM.
#
# This package exposes tensorrt-llm as a path source so that:
#   - `uv lock` can resolve the dep graph without building the wheel
#     (prepare_metadata_for_build_wheel returns static metadata fast).
#   - `uv sync --extra trtllm` triggers the actual ~60-min wheel build
#     (build_wheel in _backend.py calls tools/build-custom-trtllm.sh).
#
# Declared as no-build-isolation-package in the root pyproject.toml so the
# build runs in the main venv context and has access to torch / CUDA headers.
#
# Sourced from requirements.txt of TensorRT-LLM.
# Intentional omissions from requirements.txt:
#   - datasets==3.1.0        → conflicts with nemorl base datasets>=4.0.0
#   - setuptools<80          → conflicts with nemorl override setuptools>=80.10.2
#   - llguidance==0.7.29     → conflicts with nemorl override llguidance>=1.3.0,<1.4.0
#   - triton==3.6.0          → nemorl base manages triton via pytorch-cu130 index
#   - evaluate               → pulls in conflicting datasets==3.1.0 transitively
#   - build / ninja / meson / patchelf / packaging  → build-time only, not runtime deps
#   - cuda-core              → included in cuda-python>=13
#   - graphviz / polygraphy / mcp  → optional dev/test tools
#   - PyNvVideoCodec~=2.1.0  → no aarch64/py3.13 wheel in that range (PyPI has
#                              2.0.5 then 2.2.0). Only tensorrt_llm/media/decoding.py
#                              imports it, function-locally, for Cosmos video
#                              decode; LLM inference never touches it. Also
#                              stripped from requirements.txt by
#                              tools/build-custom-trtllm.sh, or the wheel build
#                              dies in pip before cmake starts.

[project]
name = "tensorrt-llm"
# Must match tensorrt_llm/version.py at [tool.trtllm].ref, and the pin in the
# root pyproject.toml's `trtllm` extra. All three move together on a ref bump.
version = "1.3.0rc23"
requires-python = ">=3.13"
dependencies = [
  "mpi4py",
  "numpy>=2.0.0,<2.4",
  "torch",
  "torchvision",
  # Ceiling raised from upstream's <=2.29.7 (which tracks what NGC rel-26-04 ships,
  # not a tested incompatibility) so it matches the nvidia-nccl-cu13==2.30.7 override.
  "nvidia-nccl-cu13>=2.28.9,<=2.30.7",
  "nvidia-cuda-nvrtc",
  "nvidia-cutlass-dsl[cu13]==4.5.0",
  "nvidia-ml-py>=13",
  "cuda-python>=13",
  "flash-attn-4==4.0.0b11",
  "flashinfer-python==0.6.15",
  "torchao",
  "apache-tvm-ffi==0.1.6",
  "torch-c-dlpack-ext==0.1.3",
  "xdsl>=0.59.0",
  "cuda-tile>=1.0.1",
  "nvidia-cuda-tileiras>=13.1,<13.2",
  # Matches the ref's requirements.txt and the base image's TRT 10.16.1.11.
  # Resolvable only because the root pyproject supplies static
  # [[tool.uv.dependency-metadata]] for tensorrt / tensorrt-cu13{,-libs,-bindings};
  # without it `uv lock` builds the wheel_stub sdist and pulls multi-GB binaries.
  "tensorrt~=10.16.1",
  # NOTE: the ref's requirements.txt adds nvidia-modelopt[torch]~=0.39.0, but it
  # is intentionally not mirrored here: the root pyproject already pins modelopt
  # to a git rev via [tool.uv.sources] and forces >=0.44.0a0 via
  # override-dependencies, so a ~=0.39.0 declaration would be overridden anyway.
  "transformers==5.5.4",
  "accelerate>=1.7.0",
  "sentencepiece>=0.1.99",
  "mistral-common>=1.10.0",
  "tiktoken",
  "diffusers>=0.37.1",
  "peft>=0.18.1,<0.19.0",
  "optimum",
  "ftfy",
  "xgrammar==0.1.32",
  "lark",
  "partial_json_parser",
  "fastapi>=0.120.1,<=0.121.3",
  "starlette>=0.49.1",
  "uvicorn",
  "pydantic>=2.9.1",
  "pydantic-settings[yaml]",
  "python-multipart",
  "prometheus_client",
  "prometheus-fastapi-instrumentator",
  "openai-harmony==0.0.4",
  "etcd-sdk-python==0.0.7",
  "smg-grpc-proto>=0.4.2",
  "cache-dit>=1.3.5",
  "pillow",
  "soundfile",
  "librosa",
  "h5py==3.12.1",
  "pandas",
  "numexpr",
  "mpmath>=1.3.0",
  "colored",
  "psutil",
  "omegaconf",
  "pyzmq",
  "einops",
  "aenum",
  "strenum",
  # Deliberately ahead of the ref's requirements.txt (which pins 0.7.29): vLLM
  # needs >=1.3.0 and the root pyproject's [tool.uv] override-dependencies
  # enforces that project-wide, so declaring 0.7.29 here would be inert and
  # misleading. Do not "re-sync" this one to upstream.
  "llguidance>=1.3.0,<1.4.0",
  "backoff",
  "jsonschema",
  "click>=8.3.1,<8.4",
  "click_option_group",
  "ordered-set",
  "msgpack",
  "blake3",
  "llist",
  "pulp",
  "blobfile",
  "nvtx",
  "plotly",
  "matplotlib",
  "openai",
  "jinja2",
  "lazy_loader~=0.5",
  "msgspec",
  "nccl4py>=0.3.1,<0.4",
  "nvidia-matmul-heuristics==0.1.0.27",
  "quack-kernels>=0.2.10",
  "uvloop>=0.19.0",
]

[build-system]
# No extra build requirements here — build deps (torch, ninja, cmake, etc.)
# come from the main venv via no-build-isolation-package.
requires = []
build-backend = "_backend"
backend-path = ["."]

[tool.trtllm]
# Single source of truth for which TensorRT-LLM fork/commit the custom wheel
# builds. _backend.py reads these, folds them into the wheel cache key, and
# passes them to tools/build-custom-trtllm.sh as its required argv (the script
# itself takes no defaults). The wheel cache is ref-scoped, while the CI ccache
# image is scoped by base image and architecture so valid compiler objects can
# be reused across ref and uv-version changes. When bumping `ref`, also re-sync
# [project].dependencies against the new requirements.txt.
#
# tekit is a private GitLab repo, so the url carries a ${GITLAB_CLONE_ACCESS_TOKEN}
# placeholder that _backend.py expands from the build environment (the token is
# never committed, and the cache key uses this raw string, not the expanded one).
# The ref is user/zongfeij/rl @ 1.3.0rc23: 
url = "https://oauth2:${GITLAB_CLONE_ACCESS_TOKEN}@gitlab-master.nvidia.com/ftp/tekit.git"
ref = "780b94e6557ecbf7451fa47f85412c3de6d2dcd9"   # pragma: allowlist secret
