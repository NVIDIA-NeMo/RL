# DeepEP setup.py needs CUDA even to discover its version. uv cannot select
# two version-specific metadata overrides for two Git revisions of one package.
# Give the rollout/Megatron revision static metadata and build the unmodified pinned source.
[project]
name = "deep-ep"
version = "1.2.1+17cfb81"
requires-python = ">=3.13"
dependencies = ["pynvml"]

[build-system]
requires = ["setuptools", "wheel", "torch", "packaging", "ninja"]
build-backend = "_backend"
# Both revisions use the same backend; PEP 517 supplies the project cwd.
backend-path = ["actor"]

[tool.deepep]
url = "https://github.com/deepseek-ai/DeepEP.git"
ref = "17cfb817bccec3a9c247013360cc550c2bac441e"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "actor/_backend.py" }, { env = "TORCH_CUDA_ARCH_LIST" }, { env = "CUDA_HOME" }]
