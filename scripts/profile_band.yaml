# Config for build_profile_band_dataset.py
#
# a, b are derived from the per-prompt profiled length distribution:
#   reference set = passing rollouts (reward > 0); fall back to all
#                   profiled rollouts if fewer than ``min_passing`` pass.
#   a = mean(reference)
#   b = mean(reference) + n_std * std(reference)
#
# f is selected per-row by exact pass_rate match in f_table.
# Pass-rates not in the table → row gets no profile_band block (mechanism
# is a no-op for that prompt).
#
# Channels with std==0 (cap-clamped) or fewer than 2 samples are
# omitted from a row's profile_band block but other channels still apply.

n_std: 2.0
min_passing: 2

channels:
  - total
  - reasoning
  - answer

f_table:
  - {pass_rate: 1.000, f: 0.6}
  - {pass_rate: 0.875, f: 0.7}
  - {pass_rate: 0.750, f: 0.8}
  - {pass_rate: 0.625, f: 0.9}
