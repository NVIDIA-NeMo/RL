python-version = "3.13.13"
replace-imports-with-any = [
  "nemo_automodel.*",
  "pynvml.*",
  "hydra._internal.*",
  "hydra.core.override_parser.*",
  "datasets.*",
  "transformers.*",
  "tensorrt_llm.*",
  "vllm.*",
  "flashinfer.*",
  "dynamo.*",
  "math_verify.*",
  "nemo_gym.*",
  "sympy.*",
  "torchdata.*",
  "torchaudio.*",
  "torchcodec.*",
  "nemo.*",
  "megatron.*",
  "ray.*",
  "numpy.*",
  "sphinx.*",
  "docutils.*",
  "zstandard.*",
  # Optional dependencies that are not installed in the lint environment
  # (backend extras and the docs group).
  "modelopt.*",
  "sglang.*",
  "sglang_router.*",
  "transformer_engine.*",
  "nvidia_resiliency_ext.*",
  "fla.*",
  "sentence_transformers.*",
  "myst_parser.*",
]
project-includes = [
  "nemo_rl/**/*.py",
  "examples/**/*.py",
  "docs/*.py",
  "tools/**/*.py",
  "docker/*.py",
]

# Errors that existed when a file was last baselined. `pyrefly check` reports only
# errors not recorded here. Entries match on path, error kind and column, not on line
# number, and "column-ordered" also counts them: a key that shows up more often than
# recorded is reported. Without it, one entry would hide every new error of the same
# kind at the same column in that file.
#
# After fixing errors, drop their entries (never adds new ones):
#   uv run --group dev pyrefly check --prune-baseline
# To accept the current errors wholesale, for example after a Pyrefly upgrade:
#   uv run --group dev pyrefly check --update-baseline
# pyrefly-baseline.json must be written in this mode; rerun --update-baseline if it changes.
baseline = "pyrefly-baseline.json"
baseline-matching-mode = "column-ordered"

# Disable TypedDict mutation errors since TypedDict objects are regular dicts at runtime
[errors]
missing-attribute = false
