                rdma-1\"},\n {\"interfaceName\":\"rdma2\",\"network\":\"rdma-2\"},\n {\"interfaceName\":\"rdma3\",\"network\":\"rdma-3\"}]"
          spec:
            schedulerName: kai-scheduler
