# KL-FLOOR arm. Decomposes gen_kl_error into its two terms.
#
# gen_kl_error compares vLLM's generation logprobs with Megatron's training-time
# logprobs on the same tokens, so it mixes two things: (a) kernel/implementation
# divergence between the two runtimes on identical weights, and (b) any weight
# difference the refit introduces. Docs 21/22/26 argue the ~1.25e-3 seen on MoE is
# almost all (a), but that has been inferred, never measured.
#
# NeMo-RL forces vLLM's load_format to "dummy" whenever a refit transport is set
# (nemo_rl/models/generation/__init__.py), so vLLM normally starts from garbage.
# That is why the first refit always rewrites all 435 parameters, and why doc 23's
# stated test -- "a faithful first refit must change nothing" -- was unaskable.
#
# With NRL_FORCE_LOAD_FORMAT=auto, vLLM holds the real checkpoint and Megatron
# holds the same checkpoint converted, with no optimizer step taken. Then:
#   - MX_REFIT_VERIFY at step 1 measures (b) directly, bit-for-bit;
#   - if (b) is ~0, gen_kl_error at step 1 IS the floor (a), and the <1e-3
#     guideline should be judged against it rather than against zero.
#
# Requires the diagnostic patch in
# evidence/27_kl_floor/diagnostic_load_format_patch.diff, deliberately NOT part of
# either PR. Correctness arm: do not quote timings, and note that loading the real
# checkpoint makes startup slower than the dummy-load arms.
#
namespace: kavin
image: nvcr.io/nvidian/dynamo-dev/nemo-rl:mx-lifecycle-candidate-3ddb9b16-r9-moefix2@sha256:f136da96b638068ebc9dd916dbeaa001248b8f16fcc4bbb65f3e51a97412296d
imagePullSecrets:
- nvcr-imagepullsecret
serviceAccount: default
launch:
  mode: attach
  runMode: interactive
  codeSource: upload
  attach:
    training: kavin-rc-tp2ep4dp2-tp4dp4
  entrypoint: "set -eu\nexport PYTHONPATH=/opt/nemo-rl/3rdparty/Megatron-Bridge-workspace/Megatron-Bridge/3rdparty/Megatron-LM:/opt/nemo-rl/3rdparty/Megatron-Bridge-workspace/Megatron-Bridge/src:.\nexport\
    \ MODEL_EXPRESS_URL=modelexpress-server.kavin.svc.cluster.local:8001\nexport MX_SERVER_URL=modelexpress-server.kavin.svc.cluster.local:8001\nexport MX_REFIT_TIMING_STDOUT=1\nexport MX_REFIT_VERIFY=1\nexport NRL_FORCE_LOAD_FORMAT=auto\n# UD is excluded, not just\
    \ TCP. With a live NCCL process group in the same\n# process, destroying a NIXL agent aborts in ud_iface.c \"unable to remove\n# iface timer handler\". rdmacm handles wireup, so dropping UD costs nothing\n\
    # measurable: see dynamo_mx/bench/tools/nixl_teardown_repro.py.\nexport UCX_TLS='^tcp,ud,ud:aux,ud_verbs,ud_mlx5'\nexport NIXL_UCX_TLS='^tcp,ud,ud:aux,ud_verbs,ud_mlx5'\nexport UCX_NET_DEVICES='mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,eth0'\n\
    export UCX_IB_GID_INDEX=3\nexport UCX_CUDA_COPY_DMABUF=yes\nexport UCX_CUDA_COPY_REG_WHOLE_ALLOC=off\nexport MX_RDMA_NIC_PIN=off\nexport NCCL_P2P_DISABLE=1\nexport NCCL_NVLS_ENABLE=0\nexport NCCL_MNNVL_ENABLE=0\n\
    python -u examples/run_grpo.py \\\n  --config infra/nrl_k8s/dynamo_mx/bench/configs/grpo_moe_qwen3_30b_tp2ep4dp2_tp4dp4_mx_reshard.yaml \\\n  +policy.generation.refit_cfg.mx_reshard.server_url=modelexpress-server.kavin.svc.cluster.local:8001\
    \ \\\n  +policy.generation.refit_cfg.mx_reshard.publisher_listen_port_base=5555 \\\n  +policy.generation.refit_cfg.mx_reshard.receiver_listen_port_base=15555 \
  ++grpo.max_num_steps=2 \
  ++policy.generation.max_new_tokens=512 \
  ++grpo.num_prompts_per_step=4 \
  ++grpo.num_generations_per_prompt=4\n"
