# Parameter-equality run: MX_REFIT_VERIFY=1 fingerprints every vLLM param
# before and after each install. The first refit is the load-bearing one --
# vLLM is loaded from the HF checkpoint and the trainer's weights are
# converted from that same checkpoint with no optimizer step taken, so a
# faithful first refit must change nothing. Diagnostic-only run otherwise. Image is candidate
# #635 plus the local refit/reshard overlay that retains per-source capture
# causes, so the expected UnsupportedReshard names the op that defeats fused
# expert capture instead of only counting the sources. Not a perf arm: do not
# quote timings from this image against the frozen r6 rows.
namespace: kavin
image: nvcr.io/nvidian/dynamo-dev/nemo-rl:mx-lifecycle-candidate-3ddb9b16-r9-moefix2@sha256:f136da96b638068ebc9dd916dbeaa001248b8f16fcc4bbb65f3e51a97412296d
imagePullSecrets:
- nvcr-imagepullsecret
serviceAccount: default
launch:
  mode: attach
  runMode: interactive
  codeSource: upload
  attach:
    training: kavin-rc-tp2ep4dp2-tp4dp4
  entrypoint: "set -eu\nexport PYTHONPATH=/opt/nemo-rl/3rdparty/Megatron-Bridge-workspace/Megatron-Bridge/3rdparty/Megatron-LM:/opt/nemo-rl/3rdparty/Megatron-Bridge-workspace/Megatron-Bridge/src:.\nexport\
    \ MODEL_EXPRESS_URL=modelexpress-server.kavin.svc.cluster.local:8001\nexport MX_SERVER_URL=modelexpress-server.kavin.svc.cluster.local:8001\nexport MX_REFIT_TIMING_STDOUT=1\nexport MX_REFIT_VERIFY=1\n# UD is excluded, not just\
    \ TCP. With a live NCCL process group in the same\n# process, destroying a NIXL agent aborts in ud_iface.c \"unable to remove\n# iface timer handler\". rdmacm handles wireup, so dropping UD costs nothing\n\
    # measurable: see dynamo_mx/bench/tools/nixl_teardown_repro.py.\nexport UCX_TLS='^tcp,ud,ud:aux,ud_verbs,ud_mlx5'\nexport NIXL_UCX_TLS='^tcp,ud,ud:aux,ud_verbs,ud_mlx5'\nexport UCX_NET_DEVICES='mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,eth0'\n\
    export UCX_IB_GID_INDEX=3\nexport UCX_CUDA_COPY_DMABUF=yes\nexport UCX_CUDA_COPY_REG_WHOLE_ALLOC=off\nexport MX_RDMA_NIC_PIN=off\nexport NCCL_P2P_DISABLE=1\nexport NCCL_NVLS_ENABLE=0\nexport NCCL_MNNVL_ENABLE=0\n\
    python -u examples/run_grpo.py \\\n  --config infra/nrl_k8s/dynamo_mx/bench/configs/grpo_moe_qwen3_30b_tp2ep4dp2_tp4dp4_mx_reshard.yaml \\\n  +policy.generation.refit_cfg.mx_reshard.server_url=modelexpress-server.kavin.svc.cluster.local:8001\
    \ \\\n  +policy.generation.refit_cfg.mx_reshard.publisher_listen_port_base=5555 \\\n  +policy.generation.refit_cfg.mx_reshard.receiver_listen_port_base=15555 \
  ++grpo.max_num_steps=4\n"
