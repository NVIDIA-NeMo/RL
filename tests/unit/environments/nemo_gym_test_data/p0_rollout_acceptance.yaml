    example_index: 4
    example_sha256: 2e24731dfeda02e16351dd5abd5c1e3fd8307554f4824cf4fb3630672c63f5ca
    agent_ref:
      type: responses_api_agents
      name: single_step_tool_use_with_argument_comparison_agent
